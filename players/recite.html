<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recite | Cosmic Intentions</title>
  <style>
    html, body {
      height: 100%; margin: 0; background: #1a1a1a;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden; gap: 14px;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    /* barrel frame card — SVG draws the curved gray border + white fill + badge,
       the text overlay sits in the white interior */
    .card {
      position: relative;
      width: min(95vw, 92vh * 5 / 4, 600px);
      aspect-ratio: 5 / 4;
    }
    .card svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute; top: 12%; left: 9%; right: 9%; bottom: 20%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; text-align: center; overflow: hidden;
    }
    .tag {
      font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #e02020;
      flex: 0 0 auto;
    }
    .line {
      margin: 0; color: #151515; font-weight: 700; line-height: 1.3;
      font-size: 30px;                 /* auto-shrinks to fit via JS */
      transition: opacity .45s ease;
      max-height: 100%; overflow: hidden;
    }
    .line.fade { opacity: 0; }

    /* slide-progress scrubber under the card — tap/drag to jump */
    .scrubtrack { position: relative; width: min(95vw, 92vh * 5 / 4, 600px); height: 8px;
      background: rgba(255,255,255,0.20); border-radius: 5px; overflow: hidden; cursor: pointer; touch-action: none; }
    .scrubfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: #ffdd00;
      box-shadow: 0 0 8px rgba(255,221,0,0.85); transition: width .3s ease; pointer-events: none; }

    /* minimal controls below the frame */
    .controls { display: flex; align-items: center; gap: 28px; }
    .cbtn { background: none; border: none; color: #cfcfcf; font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 6px; }
    .cbtn:active { transform: scale(0.92); }
    .play { background: #fff; color: #111; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    .menu { position: absolute; left: 50%; transform: translateX(-50%); bottom: 70px; background: #111; border: 1px solid #333; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.45); z-index: 5; }
    .menu.hidden { display: none; }
    .menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: #fff; padding: 11px 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .menu button:hover { background: #222; }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 1000 800" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path d="M 40 70 Q 500 15 960 70 L 960 720 Q 500 775 40 720 Z"
            fill="#ffffff" stroke="#9a9a9a" stroke-width="18" stroke-linejoin="round"/>
      <circle cx="500" cy="747" r="52" fill="#111111" stroke="#9a9a9a" stroke-width="10"/>
      <text id="badge" x="500" y="752" text-anchor="middle"
            fill="#ffffff" font-size="46" font-weight="800"
            font-family="Arial, system-ui, sans-serif">A</text>
    </svg>
    <div class="overlay">
      <div class="tag" id="tag">AFFIRMATION</div>
      <p class="line" id="line">…</p>
    </div>
  </div>

  <div class="scrubtrack" id="track"><div class="scrubfill" id="fill"></div></div>

  <div class="menu hidden" id="menu">
    <button id="mHome">Home page</button>
    <button id="mPeg">My Pegboard</button>
  </div>

  <div class="controls">
    <button class="cbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
  </div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const type   = params.get('type') || 'recite';
    const PERIOD = (parseInt(params.get('s')) || 7) * 1000;   // ms per card

    /* Content payload written by the parent (app.js): ci_recite = {label, items:[{text,tag}]} */
    let payload;
    try { payload = JSON.parse(localStorage.getItem('ci_recite') || 'null'); } catch (e) { payload = null; }
    if (!payload || !Array.isArray(payload.items) || !payload.items.length) {
      payload = { label: type.toUpperCase(), items: [{ text: 'No items yet — generate your library first.', tag: type.toUpperCase() }] };
    }
    const items = payload.items;

    // badge = first letter of the library label (A=Affirmations, B=Beliefs, …)
    document.getElementById('badge').textContent = (payload.label || type || '?').trim().charAt(0).toUpperCase();

    const tagEl  = document.getElementById('tag');
    const lineEl = document.getElementById('line');
    const overlay = document.querySelector('.overlay');
    const playBtn = document.getElementById('play');

    /* shrink the statement until it fits the white interior (handles long lines) */
    function fitText() {
      let size = 30;
      lineEl.style.fontSize = size + 'px';
      while ((lineEl.scrollHeight > overlay.clientHeight - tagEl.offsetHeight - 14 || lineEl.scrollWidth > overlay.clientWidth) && size > 13) {
        size -= 1; lineEl.style.fontSize = size + 'px';
      }
    }

    const track = document.getElementById('track');
    const fill  = document.getElementById('fill');
    function renderScrub() {
      fill.style.width = (items.length ? ((idx + 1) / items.length) * 100 : 0) + '%';
    }

    let idx = 0;
    function paint() {
      const it = items[idx];
      renderScrub();
      lineEl.classList.add('fade');
      setTimeout(() => {
        tagEl.textContent  = it.tag || payload.label || type.toUpperCase();
        lineEl.textContent = it.text;
        fitText();
        lineEl.classList.remove('fade');
      }, 200);
    }

    /* tap / drag the bar to jump to a statement */
    let scrubbing = false;
    function seekTo(clientX) {
      const r = track.getBoundingClientRect();
      const pct = Math.max(0, Math.min(0.999, (clientX - r.left) / r.width));
      idx = Math.floor(pct * items.length);
      paint();
    }
    track.addEventListener('pointerdown', (e) => { e.stopPropagation(); onCard = false; scrubbing = true; track.setPointerCapture(e.pointerId); seekTo(e.clientX); });
    track.addEventListener('pointermove', (e) => { if (scrubbing) seekTo(e.clientX); });
    track.addEventListener('pointerup',   () => { scrubbing = false; });
    track.addEventListener('pointercancel', () => { scrubbing = false; });

    /* soft chime on advance */
    function chime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.16, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.1);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now); osc.stop(now + 1.2);
      } catch (e) {}
    }

    /* close / nav */
    function closePlayer() {
      try { if (window.parent && window.parent !== window && window.parent.closePlayerColumn) { window.parent.closePlayerColumn(); return; } } catch (e) {}
      if (history.length > 1) history.back(); else window.close();
    }
    function nav(target) {
      try {
        if (window.parent && window.parent !== window) {
          if (window.parent.closePlayerColumn) window.parent.closePlayerColumn();
          if (window.parent.navTo) { window.parent.navTo(target); return; }
        }
      } catch (e) {}
      window.location.href = '/';
    }
    const menu = document.getElementById('menu');
    const menuBtn = document.getElementById('menuBtn');
    menuBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); };
    document.addEventListener('click', (e) => {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== menuBtn) menu.classList.add('hidden');
    });
    document.getElementById('mHome').onclick = () => { menu.classList.add('hidden'); nav('home'); };
    document.getElementById('mPeg').onclick  = () => { menu.classList.add('hidden'); nav('setup'); };

    /* play / pause + loop */
    let timer = null, playing = false;
    /* Council-approved lines (CI-VO-Scripts-Approved §5): RC-IN at the start, RC-OUT after one full pass */
    const RC_IN  = 'Time to recite. As each line plays, say it out loud or quietly to yourself. Let each one land before the next.';
    const RC_OUT = 'That’s your recitation. Pick one line to carry into your day. Then take one step that matches it.';
    function say(text) {
      try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u); } catch (e) {}
    }
    let onCard = false;   // true while the RC-IN / RC-OUT card is showing
    function showCard(tag, text) {
      onCard = true;
      lineEl.classList.add('fade');
      setTimeout(() => { tagEl.textContent = tag; lineEl.textContent = text; fitText(); lineEl.classList.remove('fade'); }, 200);
    }
    function advance() {
      if (idx === items.length - 1) {   // one full pass done → RC-OUT and stop
        setPlaying(false); idx = 0; chime();
        showCard('RECITE', 'Pick one line for today.'); say(RC_OUT);
        return;
      }
      idx++; chime(); paint();
    }
    function setPlaying(p) {
      playing = p;
      playBtn.innerHTML = p ? '&#9208;' : '&#9654;';   // ⏸ / ▶
      if (p && !timer) timer = setInterval(advance, PERIOD);
      if (!p && timer) { clearInterval(timer); timer = null; }
    }
    function startItems() { if (onCard) { onCard = false; try { speechSynthesis.cancel(); } catch (e) {} paint(); } setPlaying(true); }
    playBtn.onclick = () => playing ? setPlaying(false) : startItems();
    window.addEventListener('resize', fitText);

    showCard('RECITE', RC_IN);
    setTimeout(() => say(RC_IN), 600);
    setTimeout(() => { if (onCard && !playing) startItems(); }, 10000);
  </script>
</body>
</html>
