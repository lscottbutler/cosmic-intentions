<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation | Cosmic Intentions</title>
  <style>
    :root {
      --frame-green:  #5f9e3e;             /* green border + badge ring      */
      --frame-width:  16px;
      --frame-ratio:  16 / 9;
      --badge-fill:   rgba(26,44,30,0.62); /* dark translucent badge centre  */
      --badge-text:   #ffffff;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Roboto Condensed', system-ui, sans-serif;
    }
    /* Letterbox frame — green border, daily image behind it (cover) */
    .lb-frame {
      position: relative;
      width: min(95vw, 1100px);
      aspect-ratio: var(--frame-ratio);
      border: var(--frame-width) solid var(--frame-green);
      box-sizing: border-box;
      background-size: cover;
      background-position: center;
      background-color: #000;
      outline: 2px solid #2c3b1c;
    }
    /* Countdown badge — green ring, dark translucent centre, near the bottom */
    .lb-badge {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--badge-fill);
      border: 6px solid var(--frame-green);
      color: var(--badge-text);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="lb-frame" id="lb-frame">
    <div class="lb-badge" id="cc-text">-- MIN</div>
  </div>

  <script type="module">
    // Daily-rotating background — landscape "trough" images, cropped to fill.
    // trough018.JPG (uppercase) and "trough031 (1).jpg" (space) are skipped so
    // the paths stay valid on case-sensitive hosting.
    const nums = [];
    for (let n = 1; n <= 34; n++) { if (n === 18 || n === 31) continue; nums.push(String(n).padStart(3, '0')); }
    const bgImages = nums.map(n => `../images/trough/trough${n}.jpg`);
    const todayIndex = new Date().getDate() % bgImages.length;
    document.getElementById('lb-frame').style.backgroundImage = `url('${bgImages[todayIndex]}')`;

    const urlParams = new URLSearchParams(window.location.search);
    const selectedMinutes = parseInt(urlParams.get('t')) || 5;
    let timeRemaining = selectedMinutes * 60;

    const ccText = document.getElementById('cc-text');
    ccText.innerText = `${selectedMinutes} MIN`;

    // Bell synthesized with the Web Audio API — no bell.mp3 exists in the repo,
    // so this guarantees an audible ding at 0:00 with zero asset dependency.
    function playBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [660, 990].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 2.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 2.3);
        });
      } catch (e) {
        console.log('Audio blocked:', e);
      }
    }

    setTimeout(() => {
      const timer = setInterval(() => {
        timeRemaining--;
        if (timeRemaining <= 0) {
          clearInterval(timer);
          ccText.innerText = "0:00";
          playBell();
        } else {
          const m = Math.floor(timeRemaining / 60);
          const s = timeRemaining % 60;
          ccText.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        }
      }, 1000);
    }, 2000);
  </script>
</body>
</html>
