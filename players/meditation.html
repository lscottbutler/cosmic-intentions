<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation | Cosmic Intentions</title>
  <style>
    :root {
      --frame-gray:   #8b8b8b;   /* the letterbox border */
      --frame-width:  14px;
      --frame-ratio:  16 / 9;
      --badge-ring:   #a0a0a0;
      --badge-fill:   #262626;
      --badge-text:   #ffffff;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    .lb-frame {
      position: relative;
      width: min(95vw, 1100px);
      aspect-ratio: var(--frame-ratio);
      border: var(--frame-width) solid var(--frame-gray);
      box-sizing: border-box;
      background: #1f1b26;            /* dark fallback until an image loads */
      overflow: hidden;
    }
    /* Rotating image — heavily blurred. Scaled up so the blur has no clear edge. */
    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(18px);
      transform: scale(1.12);
      z-index: 0;
    }
    /* Dark scrim so the white text stays readable on any photo. */
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.38);
      z-index: 1;
    }
    /* WELCOME TEXT — sharp white, fades out when the countdown starts. */
    .welcome {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 28px 12%;
      box-sizing: border-box;
      transition: opacity 1s ease;
      z-index: 2;
    }
    .welcome__text {
      margin: 0;
      color: #fff;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      line-height: 1.55;
      font-size: clamp(18px, 4vw, 42px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.55);
    }
    /* COUNTDOWN BADGE — gray ring, dark centre. */
    .badge {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--badge-fill);
      border: 5px solid var(--badge-ring);
      color: var(--badge-text);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="lb-frame" id="frame">
    <div class="bg" id="bg"></div>
    <div class="scrim"></div>
    <div class="welcome" id="welcome"><p class="welcome__text" id="welcomeText"></p></div>
    <div class="badge" id="badge">--</div>
  </div>

  <script type="module">
    /* ───────────────────────────────────────────────────────────────
       BACKGROUND IMAGES — drop your files in  images/meditation/  named
       01.jpg, 02.jpg, 03.jpg …  then set IMAGE_COUNT to how many there are.
       One is shown per day, rotating. Missing file → dark fallback.
       ─────────────────────────────────────────────────────────────── */
    const IMAGE_COUNT = 10;
    const EXT = 'jpg';

    const n = (new Date().getDate() % IMAGE_COUNT) + 1;          // 1..IMAGE_COUNT
    const bgUrl = `../images/meditation/${String(n).padStart(2, '0')}.${EXT}`;
    const probe = new Image();
    probe.onload = () => { document.getElementById('bg').style.backgroundImage = `url('${bgUrl}')`; };
    probe.src = bgUrl;   // onerror → leave the dark fallback in place

    const minutes = parseInt(new URLSearchParams(location.search).get('t')) || 5;
    let timeRemaining = minutes * 60;

    document.getElementById('welcomeText').innerHTML =
      `Welcome back to another<br>${minutes} minute unguided<br>meditation session`;

    const badge = document.getElementById('badge');
    const welcome = document.getElementById('welcome');
    badge.innerText = String(minutes);

    function playBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [660, 990].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 2.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 2.3);
        });
      } catch (e) { console.log('Audio blocked:', e); }
    }

    function tick() {
      timeRemaining--;
      if (timeRemaining <= 0) {
        clearInterval(timer);
        badge.innerText = '0:00';
        playBell();
        return;
      }
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      badge.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    let timer;
    // Show the welcome text for 5s, fade it out, then run the countdown.
    setTimeout(() => {
      welcome.style.opacity = '0';
      setTimeout(() => { welcome.style.display = 'none'; }, 1000);
      timer = setInterval(tick, 1000);
    }, 5000);
  </script>
</body>
</html>
