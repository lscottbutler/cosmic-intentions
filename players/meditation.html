<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation | Cosmic Intentions</title>
  <style>
    :root {
      --frame-gray:   #8b8b8b;   /* the letterbox border          */
      --frame-width:  14px;
      --frame-ratio:  16 / 9;
      --intro-purple: #3a2a63;   /* welcome card                  */
      --intro-gray:   #6e6e6e;   /* bottom bar                    */
      --badge-ring:   #a0a0a0;
      --badge-fill:   #262626;
      --badge-text:   #ffffff;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    .lb-frame {
      position: relative;
      width: min(95vw, 1100px);
      aspect-ratio: var(--frame-ratio);
      border: var(--frame-width) solid var(--frame-gray);
      box-sizing: border-box;
      background: #2a2233;            /* fallback until an image loads */
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    /* INTRO CARD — purple welcome panel + gray bottom bar. Fades out on start. */
    .intro {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 1s ease;
      z-index: 2;
    }
    .intro__purple {
      flex: 1 1 auto;
      background: var(--intro-purple);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .intro__gray {
      flex: 0 0 24%;
      background: var(--intro-gray);
    }
    .intro__text {
      margin: 0;
      color: #fff;
      text-align: center;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      line-height: 1.55;
      font-size: clamp(18px, 4vw, 42px);
    }
    /* COUNTDOWN BADGE — gray ring, dark centre, straddles the seam. */
    .badge {
      position: absolute;
      left: 50%;
      bottom: 18%;
      transform: translate(-50%, 50%);
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: var(--badge-fill);
      border: 5px solid var(--badge-ring);
      color: var(--badge-text);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      box-sizing: border-box;
      z-index: 3;
    }
  </style>
</head>
<body>
  <div class="lb-frame" id="frame">
    <div class="intro" id="intro">
      <div class="intro__purple">
        <p class="intro__text" id="introText"></p>
      </div>
      <div class="intro__gray"></div>
    </div>
    <div class="badge" id="badge">--</div>
  </div>

  <script type="module">
    /* ───────────────────────────────────────────────────────────────
       BACKGROUND IMAGES — drop your files in  images/meditation/  named
       01.jpg, 02.jpg, 03.jpg …  then set IMAGE_COUNT to how many there are.
       One is shown per day, rotating. Missing file → purple fallback.
       ─────────────────────────────────────────────────────────────── */
    const IMAGE_COUNT = 10;
    const EXT = 'jpg';

    const n = (new Date().getDate() % IMAGE_COUNT) + 1;          // 1..IMAGE_COUNT
    const bgUrl = `../images/meditation/${String(n).padStart(2, '0')}.${EXT}`;
    const probe = new Image();
    probe.onload = () => { document.getElementById('frame').style.backgroundImage = `url('${bgUrl}')`; };
    probe.src = bgUrl;   // onerror → leave the purple fallback in place

    const minutes = parseInt(new URLSearchParams(location.search).get('t')) || 5;
    let timeRemaining = minutes * 60;

    document.getElementById('introText').innerHTML =
      `Welcome back to another<br>${minutes} minute unguided<br>meditation session`;

    const badge = document.getElementById('badge');
    const intro = document.getElementById('intro');
    badge.innerText = String(minutes);

    function playBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [660, 990].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 2.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 2.3);
        });
      } catch (e) { console.log('Audio blocked:', e); }
    }

    function tick() {
      timeRemaining--;
      if (timeRemaining <= 0) {
        clearInterval(timer);
        badge.innerText = '0:00';
        playBell();
        return;
      }
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      badge.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    let timer;
    // Show the welcome card for 5s, fade it out, then run the countdown.
    setTimeout(() => {
      intro.style.opacity = '0';
      setTimeout(() => { intro.style.display = 'none'; }, 1000);
      timer = setInterval(tick, 1000);
    }, 5000);
  </script>
</body>
</html>
