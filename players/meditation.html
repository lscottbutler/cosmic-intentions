<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meditation | Cosmic Intentions</title>
  <style>
    :root {
      --frame-gray:  #8b8b8b;
      --frame-width: 12px;
      --frame-ratio: 5 / 6;      /* taller than the old 16:9 letterbox */
      --panel:       #2c2640;     /* dark indigo control panel          */
      --badge-ring:  #a0a0a0;
      --badge-fill:  #1c1830;
      --btn:         #111111;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    .frame {
      position: relative;
      width: min(95vw, 560px);
      aspect-ratio: var(--frame-ratio);
      border: var(--frame-width) solid var(--frame-gray);
      box-sizing: border-box;
      background: #1f1b26;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Sharp rotating image, top portion */
    .photo {
      flex: 0 0 56%;
      background-size: cover;
      background-position: center;
      background-color: #15121d;
    }
    /* Dark control panel */
    .panel {
      flex: 1 1 auto;
      background: var(--panel);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px 16px 18px;
      box-sizing: border-box;
    }
    .label {
      margin: 0;
      text-align: center;
      font-size: clamp(16px, 4.4vw, 24px);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .badge {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--badge-fill);
      border: 4px solid var(--badge-ring);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      line-height: 1;
      box-shadow: 0 3px 10px rgba(0,0,0,0.45);
    }
    .badge .big { font-size: 1.9rem; font-weight: 700; }
    .badge .sm  { font-size: 0.8rem; letter-spacing: 2px; opacity: 0.85; margin-top: 3px; }
    .nav, .home {
      background: var(--btn);
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    .nav  { width: 54px; height: 54px; font-size: 1.2rem; }
    .home { width: 40px; height: 40px; font-size: 0.95rem; font-weight: 700; }
    .nav:active, .home:active { transform: scale(0.94); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="photo" id="photo"></div>
    <div class="panel">
      <p class="label" id="label">meditation</p>
      <div class="controls">
        <button class="nav" id="prev" aria-label="Previous image">&#9664;</button>
        <div class="badge" id="badge"><span class="big" id="badgeBig">--</span><span class="sm" id="badgeSm">MIN</span></div>
        <button class="nav" id="next" aria-label="Next image">&#9654;</button>
      </div>
      <button class="home" id="home" title="Home" aria-label="Home">H</button>
    </div>
  </div>

  <script type="module">
    /* ───────────────────────────────────────────────────────────────
       BACKGROUND IMAGES — live in images/meditation/. One shown per day, rotating.
       Add a filename here whenever you add a file.
       ─────────────────────────────────────────────────────────────── */
    const IMAGES = [
      'meditation.jpg',
      'meditation-1.jpg',
      'meditation-2.jpg',
      'meditation-3.jpg',
    ];

    const photo = document.getElementById('photo');
    const imgIdx = new Date().getDate() % IMAGES.length;   // image rotates daily
    (function showDailyImage() {
      const url = `../images/meditation/${IMAGES[imgIdx]}`;
      const probe = new Image();
      probe.onload = () => { photo.style.backgroundImage = `url('${url}')`; };
      probe.src = url;
    })();

    /* HOME — close the player. Inside the dashboard column it calls the parent's
       closePlayerColumn(); standalone it goes back / closes the window. */
    document.getElementById('home').onclick = () => {
      try { if (window.parent && window.parent !== window && window.parent.closePlayerColumn) { window.parent.closePlayerColumn(); return; } } catch (e) {}
      if (history.length > 1) history.back(); else window.close();
    };

    /* TIMER */
    const minutes = parseInt(new URLSearchParams(location.search).get('t')) || 5;
    let timeRemaining = minutes * 60;
    document.getElementById('label').textContent = `${minutes} minute unguided meditation`;

    const big = document.getElementById('badgeBig');
    const sm  = document.getElementById('badgeSm');
    big.textContent = String(minutes);
    sm.textContent = 'MIN';

    function playBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [660, 990].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 2.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 2.3);
        });
      } catch (e) { console.log('Audio blocked:', e); }
    }

    function tick() {
      timeRemaining--;
      if (timeRemaining <= 0) {
        clearInterval(timer);
        big.textContent = '0:00';
        sm.textContent = 'DONE';
        playBell();
        return;
      }
      const m = Math.floor(timeRemaining / 60);
      const s = timeRemaining % 60;
      big.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      sm.textContent = 'LEFT';
    }

    // ◀ rewind = add time, ▶ forward = skip ahead (60s per press).
    let timer;
    const STEP = 60;
    function adjust(delta) {
      timeRemaining = Math.max(0, Math.min(minutes * 60, timeRemaining + delta));
      if (timeRemaining <= 0) { clearInterval(timer); big.textContent = '0:00'; sm.textContent = 'DONE'; playBell(); return; }
      const m = Math.floor(timeRemaining / 60), s = timeRemaining % 60;
      big.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      sm.textContent = 'LEFT';
    }
    document.getElementById('prev').onclick = () => adjust(+STEP);   // ◀ rewind
    document.getElementById('next').onclick = () => adjust(-STEP);   // ▶ forward

    // Hold "{t} MIN" for 2s, then run the countdown.
    setTimeout(() => { timer = setInterval(tick, 1000); }, 2000);
  </script>
</body>
</html>
