<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="../shared/type-scale.css?v=20260611a">
<meta name="theme-color" content="#000000">
<title>Meditation | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;   /* fallback */
  min-height: 100dvh;  /* fills the phone, adapts to the address bar */
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

.player-container {
  width: 92%;
  max-width: 480px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-bottom: 28px;
  position: relative;
}

.image-wrap {
  width: 100%;
  position: relative;
}
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: #333;
  z-index: 5;
}

.vibe-image {
  width: 100%;
  height: 280px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 0;
  display: block;
}

.countdown-circle {
  width: 91px;
  height: 91px;
  border-radius: 50%;
  background: #FFF;
  border: 12px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  bottom: -46px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.countdown-number {
  font-size: 19px;
  font-weight: 900;
  color: #000;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.5px;
}

.countdown-circle.ending {
  border-color: #C9A96E;
  animation: pulse 1s ease-in-out infinite;
}

.countdown-circle.ending .countdown-number {
  color: #C9A96E;
}

@keyframes pulse {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50%       { transform: translateX(-50%) scale(1.07); }
}

.iam-statement {
  font-size: 18px;
  line-height: 1.6;
  color: #FFF;
  text-align: center;
  max-width: 420px;
  font-weight: 400;
  letter-spacing: 0.02em;
  margin-top: 52px;
  padding: 0 16px;
}

.btn-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}

.home-icon {
  width: 32px;
  height: 32px;
  fill: #000;
}

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
}
.ctrl-button:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">
  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
    <div class="countdown-circle" id="countdownCircle">
      <div class="countdown-number" id="countdownNumber">—</div>
    </div>
  </div>

  <div class="iam-statement" id="sessionLabel">Meditation</div>

  <div class="btn-row">
    <button class="ctrl-button" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
    <button class="home-button" onclick="goHome()">
      <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <button class="ctrl-button" onclick="restartPlayer()" title="Restart">↺</button>
  </div>
</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
const MEDITATION_IMAGES = [
  '../images/meditations/bg-meditations-1.jpg',
  '../images/meditations/bg-meditations-2.jpg',
  '../images/meditations/bg-meditations-3.jpg',
  '../images/meditations/bg-meditations-4.jpg',
];

let totalDuration = 300;
let countdown     = 300;
let halfPoint     = 150;
let countdownInterval = null;
let autoCloseTimer    = null;
let pendingTimers     = [];
let isPaused          = false;

function addTimer(fn, delay) {
  const id = setTimeout(fn, delay);
  pendingTimers.push(id);
  return id;
}

function formatMedTime(s) {
  const m   = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${String(sec).padStart(2, '0')}`;
}

function init() {
  const params = new URLSearchParams(window.location.search);
  const d = parseInt(params.get('duration'));
  if (d && d > 0) totalDuration = d;

  countdown = totalDuration;
  halfPoint = Math.floor(totalDuration / 2);

  const medIdx = Math.floor(Date.now() / 86400000) % MEDITATION_IMAGES.length;
  document.getElementById('vibeImage').style.backgroundImage =
    `url("${MEDITATION_IMAGES[medIdx]}")`;

  const mins = totalDuration / 60;
  const label = Number.isInteger(mins) ? `${mins} Minute Meditation` : `${Math.round(mins)} Minute Meditation`;
  document.getElementById('sessionLabel').textContent = label;
  document.getElementById('countdownNumber').textContent = formatMedTime(countdown);

  addTimer(() => startTick(), 800);
}

function startTick() {
  clearInterval(countdownInterval);
  const display = document.getElementById('countdownNumber');
  const circle  = document.getElementById('countdownCircle');

  countdownInterval = setInterval(() => {
    countdown--;
    display.textContent = formatMedTime(countdown);

    if (countdown === halfPoint) playBell();

    if (countdown === 300 && totalDuration > 300) {
      playBell();
      const id = setTimeout(() => playBell(), 2500);
      pendingTimers.push(id);
    }

    if (countdown <= 60 && countdown > 0) circle.classList.add('ending');

    if (countdown <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      circle.classList.remove('ending');
      complete();
    }
  }, 1000);
}

function complete() {
  playBell();
  speakText('Your meditation is complete. Well done.');

  // TODO: log session to Supabase session_logs
  // supabase.from('session_logs').insert({ type: 'meditation', duration: totalDuration, completed_at: new Date().toISOString() })

  autoCloseTimer = setTimeout(() => goHome(), 10000);
}

function togglePause() {
  const btn = document.getElementById('pauseBtn');
  isPaused = !isPaused;
  if (isPaused) {
    clearInterval(countdownInterval);
    countdownInterval = null;
    pendingTimers.forEach(id => clearTimeout(id));
    pendingTimers = [];
    stopSpeech();
    btn.textContent = '▶';
    btn.title = 'Resume';
  } else {
    btn.textContent = '⏸';
    btn.title = 'Pause';
    startTick();
  }
}

function restartPlayer() {
  clearInterval(countdownInterval);
  clearTimeout(autoCloseTimer);
  pendingTimers.forEach(id => clearTimeout(id));
  stopSpeech();
  location.reload();
}

function goHome() {
  clearInterval(countdownInterval);
  clearTimeout(autoCloseTimer);
  pendingTimers.forEach(id => clearTimeout(id));
  stopSpeech();
  returnToApp();
}

window.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
});
</script>

</body>
</html>
