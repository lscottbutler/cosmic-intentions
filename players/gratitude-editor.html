<!DOCTYPE html>
<!-- GRATITUDE EDITOR — write your own "I am grateful for…" lines for each photo.
     Edits save to localStorage (ci_gratitude_custom) AND, when logged in, sync to
     the profiles.gratitude_custom column so your text follows you across devices.
     The guided player (gratitude-guided.html) reads ci_gratitude_custom if present. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Gratitude | Cosmic Intentions</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{ --accent:#E0608A; --bg:#141018; --card:#1d1822; --line:#3a2f3f; --muted:#b8a9bf; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:#fff; font-family:'Arial Narrow','Roboto Condensed',system-ui,sans-serif; }
  .wrap{ max-width:720px; margin:0 auto; padding:18px 16px 90px; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 16px; line-height:1.4; }
  .status{ font-size:13px; color:var(--muted); margin-bottom:14px; }
  .ep{ margin:0 0 22px; }
  .ep h2{ font-size:15px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  .row{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px; }
  .thumb{ flex:0 0 56px; width:56px; height:56px; border-radius:8px; background:#000 center/cover no-repeat; cursor:pointer; position:relative; border:1px solid var(--line); }
  .thumb::after{ content:'⟳'; position:absolute; right:2px; bottom:0; font-size:12px; color:#fff; background:rgba(0,0,0,.55); border-radius:6px; padding:0 3px; }
  .row textarea{ flex:1 1 auto; min-width:0; resize:vertical; min-height:44px; background:#0e0b12; color:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; font-size:15px; line-height:1.3; }
  .del{ flex:0 0 auto; background:none; border:none; color:#e0708a; font-size:22px; line-height:1; cursor:pointer; padding:2px 6px; }
  .add{ display:block; width:100%; padding:10px; background:transparent; border:1px dashed var(--line); color:var(--muted); font-weight:700; border-radius:8px; cursor:pointer; font-size:14px; }
  .bar{ position:fixed; left:0; right:0; bottom:0; background:#0e0b12; border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:center; }
  .bar .grow{ flex:1; }
  .btn{ border:none; border-radius:9px; padding:12px 18px; font-weight:800; letter-spacing:.5px; cursor:pointer; font-size:15px; }
  .btn.save{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .toast{ position:fixed; left:50%; top:16px; transform:translateX(-50%); background:#222; border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:20; }
  .toast.on{ opacity:1; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Write my own gratitude text</h1>
    <p class="sub">Edit any line, tap the photo to swap its image, delete what you don't want, or add your own. Then hit <strong>Save</strong>.</p>
    <div class="status" id="status">Loading…</div>
    <div id="episodes"></div>
  </div>

  <div class="bar">
    <button class="btn ghost" id="close">Close</button>
    <button class="btn ghost" id="reset">Reset to defaults</button>
    <span class="grow"></span>
    <button class="btn save" id="save">Save</button>
  </div>
  <div class="toast" id="toast"></div>

<script>
  const SUPA_URL = 'https://wbqzwbubbeorcknevips.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndicXp3YnViYmVvcmNrbmV2aXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTM3NzMsImV4cCI6MjA5MTAyOTc3M30.mF_YGj1E2ib0mEx07lkZyjgBzdGDT7saK8wofEjcqNc';
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);

  const EP_TITLES = { '1':'Love & Friendship', '2':'Home & Family', '3':'Food & Treats', '4':'Health & Nature', '5':'Everyday Joys' };
  const statusEl = document.getElementById('status');
  const epsEl = document.getElementById('episodes');
  const toastEl = document.getElementById('toast');
  let basePool = {};     // { ep: [file, …] } — every shipped image, for the image swapper
  let user = null;

  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); setTimeout(()=>toastEl.classList.remove('on'), 1900); }
  const imgUrl = (ep, file) => `../images/gratitude/episode-${ep}/${file}`;

  function makeRow(ep, item){
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.ep = ep;
    row.dataset.file = item.file;
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.backgroundImage = `url('${imgUrl(ep, item.file)}')`;
    thumb.title = 'Tap to use a different photo';
    thumb.onclick = () => {                                   // cycle to the next shipped image
      const pool = basePool[ep] || [];
      if (!pool.length) return;
      const i = pool.indexOf(row.dataset.file);
      const next = pool[(i + 1) % pool.length];
      row.dataset.file = next;
      thumb.style.backgroundImage = `url('${imgUrl(ep, next)}')`;
    };
    const ta = document.createElement('textarea');
    ta.value = item.line || '';
    ta.placeholder = 'I am grateful for…';
    const del = document.createElement('button');
    del.className = 'del'; del.innerHTML = '&times;'; del.title = 'Delete this gratitude';
    del.onclick = () => row.remove();
    row.append(thumb, ta, del);
    return row;
  }

  function render(manifest){
    epsEl.innerHTML = '';
    Object.keys(manifest).sort().forEach(ep => {
      const sec = document.createElement('div'); sec.className = 'ep'; sec.dataset.ep = ep;
      const h = document.createElement('h2'); h.textContent = EP_TITLES[ep] || ('Episode ' + ep);
      sec.appendChild(h);
      const rows = document.createElement('div'); rows.className = 'rows';
      (manifest[ep] || []).forEach(item => rows.appendChild(makeRow(ep, item)));
      sec.appendChild(rows);
      const add = document.createElement('button'); add.className = 'add'; add.textContent = '+ Add a gratitude';
      add.onclick = () => {
        const pool = basePool[ep] || [];
        const used = [...rows.querySelectorAll('.row')].map(r => r.dataset.file);
        const file = pool.find(f => !used.includes(f)) || pool[0] || '';
        const r = makeRow(ep, { file, line: '' });
        rows.appendChild(r);
        r.querySelector('textarea').focus();
      };
      sec.appendChild(add);
      epsEl.appendChild(sec);
    });
  }

  // Read the whole editor back into manifest shape { ep: [{file,line}] }, dropping blanks.
  function collect(){
    const out = {};
    epsEl.querySelectorAll('.ep').forEach(sec => {
      const ep = sec.dataset.ep;
      const arr = [];
      sec.querySelectorAll('.row').forEach(row => {
        const line = row.querySelector('textarea').value.trim();
        if (line && row.dataset.file) arr.push({ file: row.dataset.file, line });
      });
      out[ep] = arr;
    });
    return out;
  }

  async function save(){
    const manifest = collect();
    try { localStorage.setItem('ci_gratitude_custom', JSON.stringify(manifest)); } catch(e){}
    if (user){
      try {
        const { error } = await sb.from('profiles').upsert({
          id: user.id, gratitude_custom: manifest, updated_at: new Date().toISOString(),
        });
        if (error) { toast('Saved on this device (cloud sync needs the DB column)'); return; }
        toast('Saved & synced to your account ✓');
      } catch(e){ toast('Saved on this device'); }
    } else {
      toast('Saved on this device (log in to sync)');
    }
  }

  async function resetDefaults(){
    try { localStorage.removeItem('ci_gratitude_custom'); } catch(e){}
    if (user){ try { await sb.from('profiles').upsert({ id:user.id, gratitude_custom:null, updated_at:new Date().toISOString() }); } catch(e){} }
    const base = await fetch(`../images/gratitude/manifest.json?_=${Date.now()}`).then(r=>r.json());
    render(base);
    toast('Reset to the default gratitude lines');
  }

  function closeEditor(){
    try { if (window.parent && window.parent !== window && window.parent.closePlayerColumn){ window.parent.closePlayerColumn(); return; } } catch(e){}
    if (history.length > 1) history.back(); else window.close();
  }

  async function main(){
    // Always load the shipped defaults — they define the image pool for swapping.
    let base = {};
    try { base = await fetch(`../images/gratitude/manifest.json?_=${Date.now()}`).then(r=>r.json()); } catch(e){}
    basePool = {}; Object.keys(base).forEach(ep => basePool[ep] = (base[ep]||[]).map(x=>x.file));

    // Who's logged in? (session is shared same-origin with the dashboard)
    try { const { data } = await sb.auth.getUser(); user = data && data.user ? data.user : null; } catch(e){ user = null; }

    // Working copy: cloud > this device > shipped defaults.
    let working = null;
    if (user){
      try {
        const { data } = await sb.from('profiles').select('gratitude_custom').eq('id', user.id).single();
        if (data && data.gratitude_custom && typeof data.gratitude_custom === 'object' && Object.keys(data.gratitude_custom).length) working = data.gratitude_custom;
      } catch(e){}
    }
    if (!working){
      try { const local = JSON.parse(localStorage.getItem('ci_gratitude_custom')||'null'); if (local && Object.keys(local).length) working = local; } catch(e){}
    }
    if (!working) working = base;

    statusEl.textContent = user ? 'Signed in — changes sync to your account.' : 'Not signed in — changes save on this device only.';
    render(working);
  }

  document.getElementById('save').onclick = save;
  document.getElementById('reset').onclick = resetDefaults;
  document.getElementById('close').onclick = closeEditor;
  main();
</script>
</body>
</html>
