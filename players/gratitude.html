<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratitude | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #000;
  min-height: 100vh;
  overflow: hidden;
}

/* ── SLIDES ──────────────────────────────────────────────── */
.slide {
  position: fixed;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0;
  transition: opacity 1.2s ease;
  z-index: 1;
}
.slide.active {
  opacity: 1;
  z-index: 2;
}

/* ── PROGRESS BAR ────────────────────────────────────────── */
.progress-track {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.2);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #C9A96E, #E8D5A3);
  width: 0%;
  transition: width 0.5s ease;
}

/* ── COUNTER ─────────────────────────────────────────────── */
.counter {
  position: fixed;
  top: 20px;
  right: 20px;
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #FFF;
  background: rgba(0,0,0,0.55);
  padding: 6px 14px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  z-index: 100;
  letter-spacing: 0.04em;
}

/* ── CONTROLS ────────────────────────────────────────────── */
.btn-row {
  position: fixed;
  bottom: 36px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 100;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.4);
}
.home-icon { width: 30px; height: 30px; fill: #000; }

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  border: 2px solid rgba(255,255,255,0.35);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
  backdrop-filter: blur(6px);
}
.ctrl-button:hover {
  background: rgba(255,255,255,0.3);
  transform: scale(1.1);
}

/* ── CLOSE ───────────────────────────────────────────────── */
.close-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  color: #FFF;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.28);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="counter" id="counter">1 / 5</div>

<div id="slideWrap"></div>

<div class="btn-row">
  <button class="ctrl-button" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
  <button class="home-button" onclick="goHome()">
    <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </button>
  <button class="ctrl-button" onclick="restartPlayer()" title="Restart">↺</button>
</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   GRATITUDE SLIDESHOW
   5 sets, daily rotation. 8 seconds per image.
   ══════════════════════════════════════════════════════════ */

const DURATION = 8000;

const SETS = [
  [ // Set 1
    '../images/gratitude/GRATITUDE 1/A COMFY BED.jpg',
    '../images/gratitude/GRATITUDE 1/FRIENDS.jpg',
    '../images/gratitude/GRATITUDE 1/GOOD BOOK.jpg',
    '../images/gratitude/GRATITUDE 1/[000] CHOCOLATE.jpg',
    '../images/gratitude/GRATITUDE 1/[000] shutterstock_1174445812.jpg',
    '../images/gratitude/GRATITUDE 1/[000] shutterstock_1226912179.jpg',
    '../images/gratitude/GRATITUDE 1/[000] shutterstock_1831802821.jpg',
    '../images/gratitude/GRATITUDE 1/[000] shutterstock_1937340616.jpg',
    '../images/gratitude/GRATITUDE 1/[000] indian-food-curry-butter-chicken-600w-1304901667.webp',
  ],
  [ // Set 2
    '../images/gratitude/GRATITUDE 2/[000] A COMFY BED.jpg',
    '../images/gratitude/GRATITUDE 2/[000] FRIENDS.jpg',
    '../images/gratitude/GRATITUDE 2/[000] shutterstock_1625940874.jpg',
    '../images/gratitude/GRATITUDE 2/[000] shutterstock_302106245.jpg',
    '../images/gratitude/GRATITUDE 2/shutterstock_1174445812.jpg',
    '../images/gratitude/GRATITUDE 2/shutterstock_765765574.jpg',
  ],
  [ // Set 3
    '../images/gratitude/GRATITUDE 3/[000] shutterstock_1221827803.jpg',
    '../images/gratitude/GRATITUDE 3/[000] shutterstock_1231591507.jpg',
    '../images/gratitude/GRATITUDE 3/shutterstock_102543755.jpg',
    '../images/gratitude/GRATITUDE 3/shutterstock_315931391.jpg',
    '../images/gratitude/GRATITUDE 3/shutterstock_679440010.jpg',
  ],
  [ // Set 4
    '../images/gratitude/GRATITUDE 4/A WALK IN NATURE.jpg',
    '../images/gratitude/GRATITUDE 4/EXOTIC BEACH VACATION.jpg',
    '../images/gratitude/GRATITUDE 4/[000] shutterstock_295907705.jpg',
    '../images/gratitude/GRATITUDE 4/[000] shutterstock_404596120.jpg',
    '../images/gratitude/GRATITUDE 4/[000] stock-photo-happy-family-mother-and-daughter-playing-at-home-in-a-tent-562342009.jpg',
  ],
  [ // Set 5
    '../images/gratitude/GRATITUDE 5/CHOCOLATE.jpg',
    '../images/gratitude/GRATITUDE 5/[000] shutterstock_1284393808.jpg',
    '../images/gratitude/GRATITUDE 5/shutterstock_1205313667.jpg',
    '../images/gratitude/GRATITUDE 5/shutterstock_1226912179.jpg',
    '../images/gratitude/GRATITUDE 5/indian-food-curry-butter-chicken-600w-1304901667.webp',
  ],
];

const setIdx = Math.floor(Date.now() / 86400000) % SETS.length;
const IMAGES = SETS[setIdx];
const TOTAL  = IMAGES.length;

let current    = 0;
let isPaused   = false;
let slideTimer = null;
let autoClose  = null;

/* ── BUILD SLIDES ────────────────────────────────────────── */
function buildSlides() {
  const wrap = document.getElementById('slideWrap');
  IMAGES.forEach((src, i) => {
    const el = document.createElement('div');
    el.className = 'slide';
    el.id = `slide-${i}`;
    el.style.backgroundImage = `url("${src}")`;
    wrap.appendChild(el);
  });
}

/* ── SHOW SLIDE ──────────────────────────────────────────── */
function showSlide(n) {
  if (n >= TOTAL) { complete(); return; }
  current = n;

  document.querySelectorAll('.slide').forEach((el, i) =>
    el.classList.toggle('active', i === n)
  );

  document.getElementById('counter').textContent = `${n + 1} / ${TOTAL}`;
  document.getElementById('progressFill').style.width =
    `${((n + 1) / TOTAL) * 100}%`;

  clearTimeout(slideTimer);
  if (!isPaused) {
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── COMPLETE ────────────────────────────────────────────── */
function complete() {
  clearTimeout(slideTimer);
  playBell();
  speakText('Carry this gratitude with you.');
  autoClose = setTimeout(() => goHome(), 6000);
}

/* ── PAUSE / RESUME ──────────────────────────────────────── */
function togglePause() {
  const btn = document.getElementById('pauseBtn');
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(slideTimer);
    stopSpeech();
    btn.textContent = '▶';
    btn.title = 'Resume';
  } else {
    btn.textContent = '⏸';
    btn.title = 'Pause';
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── RESTART / HOME ──────────────────────────────────────── */
function restartPlayer() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  location.reload();
}

function goHome() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  returnToApp();
}

/* ── INIT ────────────────────────────────────────────────── */
function init() {
  buildSlides();
  playBell();
  setTimeout(() => showSlide(0), 600);
}

window.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'ArrowRight') { clearTimeout(slideTimer); showSlide(current + 1); }
  if (e.key === 'ArrowLeft')  { clearTimeout(slideTimer); showSlide(Math.max(0, current - 1)); }
});
</script>

</body>
</html>
