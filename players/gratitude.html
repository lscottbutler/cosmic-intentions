<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratitude | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CARD — same DNA as visual-countdown ─────────────────── */
.player-container {
  width: 92%;
  max-width: 520px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 28px;
  position: relative;
}

/* ── IMAGE ───────────────────────────────────────────────── */
.image-wrap {
  width: 100%;
  position: relative;
  overflow: hidden;
}

.vibe-image {
  width: 100%;
  height: 280px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: block;
  transition: opacity 0.8s ease;
}

/* ── ARCH CROSSBAR ───────────────────────────────────────── */
/* Sits at bottom of image-wrap; convex arch curves up into the image */
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: -5%;
  right: -5%;
  height: 36px;
  background: #333;
  border-radius: 50% 50% 0 0 / 36px 36px 0 0;
  z-index: 5;
}

/* ── TEXT BOX ────────────────────────────────────────────── */
.text-box {
  width: 100%;
  text-align: center;
  padding: 22px 24px 8px;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.gratitude-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #C9A96E;
}

.gratitude-subject {
  font-size: 28px;
  font-weight: 800;
  color: #FFF;
  line-height: 1.2;
  letter-spacing: -0.01em;
  min-height: 36px;
  transition: opacity 0.5s ease;
}

/* ── PROGRESS DOTS ───────────────────────────────────────── */
.dot-row {
  display: flex;
  gap: 8px;
  margin-top: 4px;
  margin-bottom: 4px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: background 0.3s ease;
}
.dot.active {
  background: #C9A96E;
}

/* ── BUTTONS — same as visual-countdown ──────────────────── */
.btn-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 8px;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}
.home-icon { width: 32px; height: 32px; fill: #000; }

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
}
.ctrl-button:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

/* ── CLOSE ───────────────────────────────────────────────── */
.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">

  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
  </div>

  <div class="text-box">
    <div class="gratitude-eyebrow">I am grateful for</div>
    <div class="gratitude-subject" id="gratitudeSubject">&nbsp;</div>
    <div class="dot-row" id="dotRow"></div>
  </div>

  <div class="btn-row">
    <button class="ctrl-button" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
    <button class="home-button" onclick="goHome()">
      <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <button class="ctrl-button" onclick="restartPlayer()" title="Restart">↺</button>
  </div>

</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   ASS GRATITUDE PLAYER — Card layout, 5 sets, daily rotation
   8 seconds per image. Label list updated by user request.
   ══════════════════════════════════════════════════════════ */

const DURATION = 8000;

/* Each entry: [imagePath, labelText]
   Empty string label = image only, no text, no TTS         */
const SETS = [
  [ // Set 1
    ['../images/GRATITUDE/GRATITUDE 1/A COMFY BED.jpg',                                                        'A Comfy Bed'],
    ['../images/GRATITUDE/GRATITUDE 1/FRIENDS.jpg',                                                            'Friends'],
    ['../images/GRATITUDE/GRATITUDE 1/GOOD BOOK.jpg',                                                          'A Good Book'],
    ['../images/GRATITUDE/GRATITUDE 1/[000] CHOCOLATE.jpg',                                                    'Chocolate'],
    ['../images/GRATITUDE/GRATITUDE 1/[000] shutterstock_1174445812.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 1/[000] shutterstock_1226912179.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 1/[000] shutterstock_1831802821.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 1/[000] shutterstock_1937340616.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 1/[000] indian-food-curry-butter-chicken-600w-1304901667.webp',            'Delicious Food'],
  ],
  [ // Set 2
    ['../images/GRATITUDE/GRATITUDE 2/[000] A COMFY BED.jpg',                                                  'A Comfy Bed'],
    ['../images/GRATITUDE/GRATITUDE 2/[000] FRIENDS.jpg',                                                      'Friends'],
    ['../images/GRATITUDE/GRATITUDE 2/[000] shutterstock_1625940874.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 2/[000] shutterstock_302106245.jpg',                                       ''],
    ['../images/GRATITUDE/GRATITUDE 2/shutterstock_1174445812.jpg',                                            ''],
    ['../images/GRATITUDE/GRATITUDE 2/shutterstock_765765574.jpg',                                             ''],
  ],
  [ // Set 3
    ['../images/GRATITUDE/GRATITUDE 3/[000] shutterstock_1221827803.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 3/[000] shutterstock_1231591507.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 3/shutterstock_102543755.jpg',                                             ''],
    ['../images/GRATITUDE/GRATITUDE 3/shutterstock_315931391.jpg',                                             ''],
    ['../images/GRATITUDE/GRATITUDE 3/shutterstock_679440010.jpg',                                             ''],
  ],
  [ // Set 4
    ['../images/GRATITUDE/GRATITUDE 4/A WALK IN NATURE.jpg',                                                   'A Walk in Nature'],
    ['../images/GRATITUDE/GRATITUDE 4/EXOTIC BEACH VACATION.jpg',                                              'An Exotic Beach Vacation'],
    ['../images/GRATITUDE/GRATITUDE 4/[000] shutterstock_295907705.jpg',                                       ''],
    ['../images/GRATITUDE/GRATITUDE 4/[000] shutterstock_404596120.jpg',                                       ''],
    ['../images/GRATITUDE/GRATITUDE 4/[000] stock-photo-happy-family-mother-and-daughter-playing-at-home-in-a-tent-562342009.jpg', 'Family Time'],
  ],
  [ // Set 5
    ['../images/GRATITUDE/GRATITUDE 5/CHOCOLATE.jpg',                                                          'Chocolate'],
    ['../images/GRATITUDE/GRATITUDE 5/[000] shutterstock_1284393808.jpg',                                      ''],
    ['../images/GRATITUDE/GRATITUDE 5/shutterstock_1205313667.jpg',                                            ''],
    ['../images/GRATITUDE/GRATITUDE 5/shutterstock_1226912179.jpg',                                            ''],
    ['../images/GRATITUDE/GRATITUDE 5/indian-food-curry-butter-chicken-600w-1304901667.webp',                  'Delicious Food'],
  ],
];

const setIdx = Math.floor(Date.now() / 86400000) % SETS.length;
const SLIDES = SETS[setIdx];
const TOTAL  = SLIDES.length;

let current    = 0;
let isPaused   = false;
let slideTimer = null;
let autoClose  = null;

/* ── BUILD PROGRESS DOTS ─────────────────────────────────── */
function buildDots() {
  const row = document.getElementById('dotRow');
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    row.appendChild(d);
  });
}

/* ── SHOW SLIDE ──────────────────────────────────────────── */
function showSlide(n) {
  if (n >= TOTAL) { complete(); return; }
  current = n;
  const [src, label] = SLIDES[n];
  const img     = document.getElementById('vibeImage');
  const subject = document.getElementById('gratitudeSubject');

  // Fade image out, swap, fade back in
  img.style.opacity = '0';
  setTimeout(() => {
    img.style.backgroundImage = `url("${src}")`;
    img.style.opacity = '1';
  }, 500);

  // Update text
  subject.style.opacity = '0';
  setTimeout(() => {
    subject.textContent = label || ' ';
    subject.style.opacity = '1';
    if (label) speakText(`I am grateful for ${label.toLowerCase()}`);
  }, 400);

  // Dots
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === n)
  );

  // Auto-advance
  clearTimeout(slideTimer);
  if (!isPaused) {
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── COMPLETE ────────────────────────────────────────────── */
function complete() {
  clearTimeout(slideTimer);
  playBell();
  speakText('Carry this gratitude with you today.');
  autoClose = setTimeout(() => goHome(), 7000);
}

/* ── PAUSE / RESUME ──────────────────────────────────────── */
function togglePause() {
  const btn = document.getElementById('pauseBtn');
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(slideTimer);
    stopSpeech();
    btn.textContent = '▶';
    btn.title = 'Resume';
  } else {
    btn.textContent = '⏸';
    btn.title = 'Pause';
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── RESTART / HOME ──────────────────────────────────────── */
function restartPlayer() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  location.reload();
}

function goHome() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  returnToApp();
}

/* ── INIT ────────────────────────────────────────────────── */
function init() {
  buildDots();
  playBell();
  // Pre-load first image immediately, then start
  const img = document.getElementById('vibeImage');
  img.style.backgroundImage = `url("${SLIDES[0][0]}")`;
  setTimeout(() => showSlide(0), 600);
}

window.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
  if (e.key === ' ') { e.preventDefault(); togglePause(); }
  if (e.key === 'ArrowRight') { clearTimeout(slideTimer); stopSpeech(); showSlide(current + 1); }
  if (e.key === 'ArrowLeft')  { clearTimeout(slideTimer); stopSpeech(); showSlide(Math.max(0, current - 1)); }
});
</script>

</body>
</html>
