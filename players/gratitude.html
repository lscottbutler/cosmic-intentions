<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratitude | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CARD — identical to visual-countdown ────────────────── */
.player-container {
  width: 92%;
  max-width: 520px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding-bottom: 28px;
  position: relative;
}

/* ── IMAGE ───────────────────────────────────────────────── */
.image-wrap {
  width: 100%;
  position: relative;
}

.vibe-image {
  width: 100%;
  height: 280px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: block;
  transition: opacity 0.8s ease;
}

/* ── ARCH CROSSBAR ───────────────────────────────────────── */
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: #333;
  z-index: 5;
}

/* ── IC CIRCLE — home button at bottom of card ───────────── */
.ic-circle {
  width: 91px;
  height: 91px;
  border-radius: 50%;
  background: #FFF;
  border: 12px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 16px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.ic-circle:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}
.ic-circle .home-icon { width: 32px; height: 32px; fill: #000; }

/* ── TEXT SECTION ────────────────────────────────────────── */
.gratitude-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #C9A96E;
  margin-top: 20px;
  text-align: center;
  padding: 0 16px;
}

.iam-statement {
  font-size: 26px;
  font-weight: 800;
  color: #FFF;
  text-align: center;
  max-width: 420px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  padding: 10px 20px 0;
  min-height: 64px;
  transition: opacity 0.5s ease;
}

/* ── PROGRESS DOTS ───────────────────────────────────────── */
.dot-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 4px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: background 0.3s ease;
}
.dot.active { background: #C9A96E; }

/* ── BUTTONS — identical to visual-countdown ─────────────── */
.btn-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}
.home-icon { width: 32px; height: 32px; fill: #000; }

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
}
.ctrl-button:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

/* ── CLOSE ───────────────────────────────────────────────── */
.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">

  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
  </div>

  <div class="gratitude-eyebrow">I am grateful for</div>
  <div class="iam-statement" id="iamStatement">&nbsp;</div>
  <div class="dot-row" id="dotRow"></div>

  <div class="ic-circle" onclick="goHome()">
    <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </div>

</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   GRATITUDE PLAYER
   Sequence per slide:
     fade in image → 3s → text + VO → VO ends → 3s → fade out → 2s black → next
   ══════════════════════════════════════════════════════════ */

const SETS = [
  [ // Set 1
    '../images/GRATITUDE/GRATITUDE 1/A COMFY BED.jpg',
    '../images/GRATITUDE/GRATITUDE 1/A GOOD BOOK.jpg',
    '../images/GRATITUDE/GRATITUDE 1/A RELAXING BATH.jpg',
    '../images/GRATITUDE/GRATITUDE 1/CHOCOLATE.jpg',
    '../images/GRATITUDE/GRATITUDE 1/FRIENDS.jpg',
  ],
  [ // Set 2
    '../images/GRATITUDE/GRATITUDE 2/A COMFY CHAIR.jpg',
    '../images/GRATITUDE/GRATITUDE 2/A HOT BATH.jpg',
    '../images/GRATITUDE/GRATITUDE 2/COMFORT FOOD.jpg',
    '../images/GRATITUDE/GRATITUDE 2/FAMILY TIME.jpg',
    '../images/GRATITUDE/GRATITUDE 2/PIZZA.jpg',
  ],
  [ // Set 3
    '../images/GRATITUDE/GRATITUDE 3/FRESH PRODUCE.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY ABILITY TO EXERCISE.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY CARDIOVASCULAR HEALTH.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY GRANDCHILDREN.jpg',
    '../images/GRATITUDE/GRATITUDE 3/SCENIC TRAIN RIDES.jpg',
  ],
  [ // Set 4
    '../images/GRATITUDE/GRATITUDE 4/A GREAT ROADTRIP.jpg',
    '../images/GRATITUDE/GRATITUDE 4/A WALK IN NATURE.jpg',
    '../images/GRATITUDE/GRATITUDE 4/A YUMMY BURGER.jpg',
    '../images/GRATITUDE/GRATITUDE 4/EXOTIC TRAVEL.jpg',
    '../images/GRATITUDE/GRATITUDE 4/TIME WITH MY KIDS.jpg',
  ],
  [ // Set 5
    '../images/GRATITUDE/GRATITUDE 5/COZY SOCKS.jpg',
  ],
];

const delay = ms => new Promise(r => setTimeout(r, ms));

function labelFromPath(src) {
  let name = src.split('/').pop();
  name = name.replace(/^\[000\]\s*/i, '');
  name = name.replace(/\.(jpg|jpeg|png|webp|gif)(\.\w+)*$/i, '');
  name = name.replace(/\.psd\.?/i, '');
  if (/^shutterstock_/i.test(name)) return '';
  if (/^stock-photo/i.test(name))   return '';
  name = name.replace(/-\d{3,4}w-\d+$/, '');
  name = name.replace(/[-_]/g, ' ');
  return name.trim().split(/\s+/)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
    .join(' ');
}

const setIdx = Math.floor(Date.now() / 86400000) % SETS.length;
const SLIDES = SETS[setIdx];
const TOTAL  = SLIDES.length;

let current = 0;
let running = false;

function buildDots() {
  const row = document.getElementById('dotRow');
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    row.appendChild(d);
  });
}

async function showSlide(n) {
  if (!running) return;
  if (n >= TOTAL) { complete(); return; }
  current = n;

  const src   = SLIDES[n];
  const label = labelFromPath(src);
  const img   = document.getElementById('vibeImage');
  const stmt  = document.getElementById('iamStatement');

  // Update dots
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === n)
  );

  // Fade in image
  img.style.opacity  = '0';
  stmt.style.opacity = '0';
  stmt.textContent   = ' ';
  await delay(50);
  img.style.backgroundImage = `url("${src}")`;
  img.style.opacity = '1';

  // 3s — image visible, no text yet
  await delay(3000);
  if (!running) return;

  // Show text + play VO (await until audio finishes)
  stmt.textContent   = label || ' ';
  stmt.style.opacity = '1';
  if (label) await speakText(`I am grateful for ${label.toLowerCase()}`);
  if (!running) return;

  // 3s hold after VO
  await delay(3000);
  if (!running) return;

  // Fade out slide
  img.style.opacity  = '0';
  stmt.style.opacity = '0';

  // 0.8s fade transition + 2s black hold
  await delay(2800);
  if (!running) return;

  showSlide(n + 1);
}

async function complete() {
  const stmt = document.getElementById('iamStatement');
  const img  = document.getElementById('vibeImage');
  img.style.opacity  = '1';
  stmt.textContent   = 'Carry this gratitude with you.';
  stmt.style.opacity = '1';
  await speakText('Carry this gratitude with you today.');
  await delay(3000);
  goHome();
}

function goHome() {
  running = false;
  stopSpeech();
  returnToApp();
}

function init() {
  running = true;
  buildDots();
  showSlide(0);
}

window.addEventListener('DOMContentLoaded', init);
document.addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });
</script>

</body>
</html>
