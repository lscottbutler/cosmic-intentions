<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gratitude | Cosmic Intentions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap');
:root{--night:#06141c;--blue:#0077a6;--teal:#55d6ca;--gold:#f5a623;--cream:#fbf7ef;--ink:#102b36}
*{box-sizing:border-box}html,body{height:100%;margin:0}button{font:inherit}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 75% 15%,#173c4b 0,#081d27 35%,#030a0e 78%);color:var(--cream);font-family:'Roboto Condensed',sans-serif}
.shell{width:min(96vw,calc(91vh * 16 / 9),1280px)}
.player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:clamp(5px,.75vw,10px) solid var(--blue);background:#07151d;box-shadow:0 28px 80px #000c,0 0 45px #0077a638}
.brand{position:absolute;z-index:30;top:4%;left:4%;display:flex;align-items:center;gap:.7rem;font-size:clamp(10px,.9vw,14px);font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 12px #000}.mark{width:10px;height:10px;border:2px solid var(--gold);transform:rotate(45deg);box-shadow:0 0 12px #f5a623aa}
.slides,.slide{position:absolute;inset:0}.slide{inset:-3%;opacity:0;background-position:center;background-size:cover;filter:blur(14px) brightness(.58) saturate(.85);transform:scale(1.06);transition:opacity 1.2s ease,filter 2.2s ease}.slide.on{opacity:1;filter:blur(0) brightness(.72) saturate(1.04);animation:drift 12s ease-in-out forwards}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#031219da 0,#061a2375 39%,transparent 68%),linear-gradient(0deg,#031118c9 0,transparent 45%)}
.copy{position:absolute;z-index:10;left:5%;bottom:11%;width:min(47%,580px)}.eyebrow{font-size:clamp(11px,1vw,15px);font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--teal);margin-bottom:1rem}.statement{font-family:'Fraunces',serif;font-size:clamp(28px,4vw,58px);font-weight:500;line-height:1.06;margin:0;text-wrap:balance;text-shadow:0 3px 24px #000;transition:opacity .45s,transform .45s}.statement.fade{opacity:0;transform:translateY(10px)}
.counter{margin-top:1.25rem;font-size:clamp(12px,1vw,15px);letter-spacing:.18em;text-transform:uppercase;color:#d4e1e2}.progress{position:absolute;z-index:20;left:0;right:0;bottom:0;height:4px;background:#ffffff20}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));box-shadow:0 0 12px var(--teal);transition:width .2s linear}
.card{position:absolute;z-index:40;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 42%,#123c4c,#06141c 65%);transition:opacity .8s,visibility .8s}.card.hidden{opacity:0;visibility:hidden}.sigil{width:clamp(52px,6vw,80px);aspect-ratio:1;border:1px solid #55d6ca88;border-radius:50%;position:relative;margin-bottom:2.2%}.sigil:before,.sigil:after{content:"";position:absolute;inset:22%;border:1px solid var(--gold);transform:rotate(45deg)}.sigil:after{inset:37%;background:var(--gold);box-shadow:0 0 22px var(--gold)}.card small{font-size:clamp(11px,1vw,14px);font-weight:600;letter-spacing:.34em;text-transform:uppercase;color:var(--teal)}.card h1{font-family:'Fraunces',serif;font-size:clamp(42px,6vw,82px);font-weight:500;line-height:1;margin:.65rem 0}.card p{font-size:clamp(15px,1.4vw,21px);color:#bdd0d4;margin:0}.begin{margin-top:2rem;border:1px solid #f5a623b5;border-radius:100px;padding:13px 28px;background:#f5a62318;color:#fff;font-weight:700;letter-spacing:.13em;text-transform:uppercase;cursor:pointer}.begin:hover,.begin:focus-visible{background:var(--gold);color:var(--ink);outline:none}
.reflection-card{background:radial-gradient(circle at 50% 40%,#174656,#06141c 67%)}.reflection-card h1{max-width:14ch;font-size:clamp(34px,5vw,68px);line-height:1.05}.reflection-card .countdown{font:300 clamp(62px,10vw,132px)/1 'Roboto Condensed',sans-serif;color:#fff;margin:3% 0 1%;font-variant-numeric:tabular-nums;text-shadow:0 0 28px #55d6ca55}.reflection-card p{max-width:34ch}
.controls{height:58px;display:flex;align-items:center;justify-content:center;gap:14px}.control{width:42px;height:42px;border:1px solid #ffffff2b;border-radius:50%;background:#0b1c24;color:#edf6f6;cursor:pointer;font-size:17px}.control.primary{width:50px;height:50px;border:0;background:var(--teal);color:#05212a;box-shadow:0 0 22px #55d6ca55}.control:hover,.control:focus-visible{border-color:var(--teal);outline:none}.sound-state{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#849ba2}
@keyframes drift{from{transform:scale(1.06) translate3d(0,0,0)}to{transform:scale(1.15) translate3d(-1.4%,.8%,0)}}
@media(max-width:700px){.shell{width:100vw}.player{border-width:4px}.copy{left:6%;bottom:12%;width:82%}.statement{font-size:clamp(24px,7vw,40px)}.shade{background:linear-gradient(0deg,#031118e8 0,#061a2350 62%,transparent 100%)}.controls{height:52px}.control{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition-duration:.01ms!important}.slide{transform:scale(1.02)!important}}
</style>
</head>
<body>
<main class="shell">
 <section class="player" aria-label="Cosmic Intentions Gratitude Player">
  <div class="brand"><span class="mark"></span>Cosmic Intentions</div>
  <div class="slides"><div class="slide" id="slideA"></div><div class="slide" id="slideB"></div></div>
  <div class="shade"></div>
  <div class="copy"><div class="eyebrow">Gratitude</div><h2 class="statement" id="statement">I am grateful for this moment.</h2><div class="counter" id="counter">1 of 1</div></div>
  <div class="progress"><i id="progress"></i></div>
  <div class="card" id="intro"><div class="sigil"></div><small>Cosmic Intentions</small><h1>Gratitude</h1><p>Notice what is already good.</p><button class="begin" id="begin">Begin</button></div>
  <div class="card reflection-card hidden" id="reflection"><small>One final moment</small><h1>Close your eyes and express your gratitude.</h1><div class="countdown" id="countdown">1:00</div><p>Let the feeling be enough.</p></div>
  <div class="card hidden" id="outro"><div class="sigil"></div><small>Cosmic Intentions</small><h1>Thank you.</h1><p>Carry your gratitude with you.</p></div>
 </section>
 <nav class="controls" aria-label="Player controls"><button class="control" id="previous" aria-label="Previous gratitude">‹</button><button class="control primary" id="play" aria-label="Play or pause">▶</button><button class="control" id="next" aria-label="Next gratitude">›</button><button class="control" id="favorite" aria-label="Favorite gratitude">♡</button><button class="control" id="sound" aria-label="Mute or unmute">♪</button><button class="control" id="close" aria-label="Close">×</button><span class="sound-state" id="soundState">sound on</span></nav>
</main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),episode=params.get('ep')||'5';
const fallback=[
 {file:'a-fresh-cup-of-coffee-to-start-my-day.jpg',line:'I am grateful for a fresh cup of coffee to start my day.'},
 {file:'waking-up-rested-to-a-bright-new-morning.jpg',line:'I am grateful for waking up rested to a bright new morning.'},
 {file:'meaningful-work-and-creative-freedom.jpg',line:'I am grateful for meaningful work and creative freedom.'},
 {file:'the-freedom-of-the-open-road.jpg',line:'I am grateful for the freedom of the open road.'}
];
let items=fallback,index=0,front=true,running=false,ended=false,reflecting=false,muted=false,timer=null,elapsed=0,reflectionRemaining=60,ctx=null;
const secondsPerCard=10,a=$('slideA'),b=$('slideB');
function imageUrl(item){return `../images/gratitude/episode-${episode}/${item.file}`}
function normalizeLine(item){const raw=(item.line||item.text||item.title||'I am grateful for this moment.').trim();return /[.!?]$/.test(raw)?raw:`${raw}.`}
function render(animate=true){const incoming=front?a:b,outgoing=front?b:a;incoming.style.backgroundImage=`url("${imageUrl(items[index])}")`;incoming.classList.add('on');outgoing.classList.remove('on');front=!front;const statement=$('statement');if(animate)statement.classList.add('fade');setTimeout(()=>{statement.textContent=normalizeLine(items[index]);statement.classList.remove('fade')},animate?240:0);$('counter').textContent=`${index+1} of ${items.length}`;$('favorite').textContent=isFavorite()?'♥':'♡';elapsed=0;updateProgress()}
function updateProgress(){$('progress').style.width=`${Math.min(100,elapsed/secondsPerCard*100)}%`}
function advance(direction=1){index=(index+direction+items.length)%items.length;render()}
function tick(){if(reflecting){reflectionRemaining--;$('countdown').textContent=`0:${String(Math.max(0,reflectionRemaining)).padStart(2,'0')}`;$('progress').style.width=`${(60-reflectionRemaining)/60*100}%`;if(reflectionRemaining<=0)finish();return}elapsed++;updateProgress();if(elapsed>=secondsPerCard){if(index===items.length-1){beginReflection()}else advance(1)}}
function setRunning(value){if(ended)return;running=value;$('play').textContent=value?'Ⅱ':'▶';clearInterval(timer);if(value)timer=setInterval(tick,1000)}
function chime(){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();[523.25,659.25].forEach((frequency,i)=>{const oscillator=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+i*.18;oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.13,start+.03);gain.gain.exponentialRampToValueAtTime(.0001,start+1.8);oscillator.connect(gain).connect(ctx.destination);oscillator.start(start);oscillator.stop(start+1.9)})}catch(error){}}
function start(){ended=false;reflecting=false;reflectionRemaining=60;index=0;$('reflection').classList.add('hidden');$('outro').classList.add('hidden');$('intro').classList.add('hidden');render(false);chime();setRunning(true)}
function beginReflection(){reflecting=true;reflectionRemaining=60;elapsed=0;$('countdown').textContent='1:00';$('progress').style.width='0';$('reflection').classList.remove('hidden');chime()}
function finish(){ended=true;reflecting=false;running=false;clearInterval(timer);$('play').textContent='▶';$('progress').style.width='100%';chime();$('reflection').classList.add('hidden');setTimeout(()=>$('outro').classList.remove('hidden'),450);try{window.parent?.playerFinished?.()}catch(error){}}
const favoritesKey='ci_gratitude_favorites';
function favoriteIds(){try{return JSON.parse(localStorage.getItem(favoritesKey)||'[]')}catch(error){return[]}}
function itemId(){return `${episode}:${items[index].file}`}
function isFavorite(){return favoriteIds().includes(itemId())}
function toggleFavorite(){let values=favoriteIds();values=isFavorite()?values.filter(id=>id!==itemId()):[...values,itemId()];localStorage.setItem(favoritesKey,JSON.stringify(values));$('favorite').textContent=isFavorite()?'♥':'♡'}
async function load(){try{const response=await fetch(`../images/gratitude/manifest.json?_=${Date.now()}`),manifest=await response.json();if(Array.isArray(manifest[episode])&&manifest[episode].length)items=manifest[episode]}catch(error){}items.forEach(item=>{const image=new Image();image.src=imageUrl(item)});render(false)}
$('begin').onclick=start;$('play').onclick=()=>ended?start():setRunning(!running);$('previous').onclick=()=>advance(-1);$('next').onclick=()=>advance(1);$('favorite').onclick=toggleFavorite;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♩':'♪';$('soundState').textContent=muted?'sound off':'sound on'};$('close').onclick=()=>{try{if(window.parent!==window&&window.parent.closePlayerColumn)return window.parent.closePlayerColumn()}catch(error){}history.length>1?history.back():window.close()};document.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();$('play').click()}if(event.key==='ArrowRight')advance(1);if(event.key==='ArrowLeft')advance(-1);if(event.key==='Escape')$('close').click()});load();
</script>
</body>
</html>
