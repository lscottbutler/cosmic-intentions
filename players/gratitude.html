<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gratitude | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── CARD — identical to visual-countdown ────────────────── */
.player-container {
  width: 92%;
  max-width: 520px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  padding-bottom: 28px;
  position: relative;
}

/* ── IMAGE ───────────────────────────────────────────────── */
.image-wrap {
  width: 100%;
  position: relative;
}

.vibe-image {
  width: 100%;
  height: 280px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: block;
  transition: opacity 0.8s ease;
}

/* ── ARCH CROSSBAR ───────────────────────────────────────── */
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: #333;
  z-index: 5;
}

/* ── IC CIRCLE — identical to visual-countdown ───────────── */
.ic-circle {
  width: 91px;
  height: 91px;
  border-radius: 50%;
  background: #FFF;
  border: 12px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  bottom: -46px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.ic-number {
  font-size: 35px;
  font-weight: 700;
  font-style: italic;
  color: #000;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

/* ── TEXT SECTION ────────────────────────────────────────── */
.gratitude-eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: #C9A96E;
  margin-top: 62px; /* clears the IC circle (46px overhang + 16px gap) */
  text-align: center;
  padding: 0 16px;
}

.iam-statement {
  font-size: 26px;
  font-weight: 800;
  color: #FFF;
  text-align: center;
  max-width: 420px;
  line-height: 1.25;
  letter-spacing: -0.01em;
  padding: 10px 20px 0;
  min-height: 64px;
  transition: opacity 0.5s ease;
}

/* ── PROGRESS DOTS ───────────────────────────────────────── */
.dot-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 4px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  transition: background 0.3s ease;
}
.dot.active { background: #C9A96E; }

/* ── BUTTONS — identical to visual-countdown ─────────────── */
.btn-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}
.home-icon { width: 32px; height: 32px; fill: #000; }

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
}
.ctrl-button:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

/* ── CLOSE ───────────────────────────────────────────────── */
.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">

  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
    <div class="ic-circle">
      <span class="ic-number" id="icNumber">1</span>
    </div>
  </div>

  <div class="gratitude-eyebrow">I am grateful for</div>
  <div class="iam-statement" id="iamStatement">&nbsp;</div>
  <div class="dot-row" id="dotRow"></div>

  <div class="btn-row">
    <button class="ctrl-button" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
    <button class="home-button" onclick="goHome()">
      <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <button class="ctrl-button" onclick="restartPlayer()" title="Restart">↺</button>
  </div>

</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   ASS GRATITUDE PLAYER
   Card layout, IC circle, TTS voice-over, 8s per slide.
   Filename = label text. "I am grateful for" auto-prepended.
   ══════════════════════════════════════════════════════════ */

const DURATION = 8000;

/* Image paths — rename files to the label text you want displayed.
   e.g. "A Good Book.jpg" → shows "I am grateful for A Good Book"
   Blank string = silent slide (image only, no text, no TTS)        */
const SETS = [
  [ // Set 1
    '../images/GRATITUDE/GRATITUDE 1/A COMFY BED.jpg',
    '../images/GRATITUDE/GRATITUDE 1/A GOOD BOOK.jpg',
    '../images/GRATITUDE/GRATITUDE 1/A RELAXING BATH.jpg',
    '../images/GRATITUDE/GRATITUDE 1/CHOCOLATE.jpg',
    '../images/GRATITUDE/GRATITUDE 1/FRIENDS.jpg',
  ],
  [ // Set 2
    '../images/GRATITUDE/GRATITUDE 2/A COMFY CHAIR.jpg',
    '../images/GRATITUDE/GRATITUDE 2/A HOT BATH.jpg',
    '../images/GRATITUDE/GRATITUDE 2/COMFORT FOOD.jpg',
    '../images/GRATITUDE/GRATITUDE 2/FAMILY TIME.jpg',
    '../images/GRATITUDE/GRATITUDE 2/PIZZA.jpg',
  ],
  [ // Set 3
    '../images/GRATITUDE/GRATITUDE 3/FRESH PRODUCE.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY ABILITY TO EXERCISE.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY CARDIOVASCULAR HEALTH.jpg',
    '../images/GRATITUDE/GRATITUDE 3/MY GRANDCHILDREN.jpg',
    '../images/GRATITUDE/GRATITUDE 3/SCENIC TRAIN RIDES.jpg',
  ],
  [ // Set 4
    '../images/GRATITUDE/GRATITUDE 4/A GREAT ROADTRIP.jpg',
    '../images/GRATITUDE/GRATITUDE 4/A WALK IN NATURE.jpg',
    '../images/GRATITUDE/GRATITUDE 4/A YUMMY BURGER.jpg',
    '../images/GRATITUDE/GRATITUDE 4/EXOTIC TRAVEL.jpg',
    '../images/GRATITUDE/GRATITUDE 4/TIME WITH MY KIDS.jpg',
  ],
  [ // Set 5
    '../images/GRATITUDE/GRATITUDE 5/COZY SOCKS.jpg',
  ],
];

/* ── LABEL FROM FILENAME ─────────────────────────────────── */
function labelFromPath(src) {
  let name = src.split('/').pop();
  name = name.replace(/^\[000\]\s*/i, '');
  name = name.replace(/\.(jpg|jpeg|png|webp|gif)(\.\w+)*$/i, '');
  name = name.replace(/\.psd\.?/i, '');
  if (/^shutterstock_/i.test(name)) return '';
  if (/^stock-photo/i.test(name))   return '';
  name = name.replace(/-\d{3,4}w-\d+$/, '');
  name = name.replace(/[-_]/g, ' ');
  return name.trim().split(/\s+/)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
    .join(' ');
}

/* ── SETUP ───────────────────────────────────────────────── */
const setIdx = Math.floor(Date.now() / 86400000) % SETS.length;
const SLIDES = SETS[setIdx];
const TOTAL  = SLIDES.length;

let current    = 0;
let isPaused   = false;
let slideTimer = null;
let autoClose  = null;

/* ── BUILD DOTS ──────────────────────────────────────────── */
function buildDots() {
  const row = document.getElementById('dotRow');
  SLIDES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = `dot-${i}`;
    row.appendChild(d);
  });
}

/* ── SHOW SLIDE ──────────────────────────────────────────── */
function showSlide(n) {
  if (n >= TOTAL) { complete(); return; }
  current = n;
  const src   = SLIDES[n];
  const label = labelFromPath(src);

  // Fade image
  const img = document.getElementById('vibeImage');
  img.style.opacity = '0';
  setTimeout(() => {
    img.style.backgroundImage = `url("${src}")`;
    img.style.opacity = '1';
  }, 400);

  // IC number
  document.getElementById('icNumber').textContent = n + 1;

  // Statement text
  const stmt = document.getElementById('iamStatement');
  stmt.style.opacity = '0';
  setTimeout(() => {
    stmt.textContent = label || ' ';
    stmt.style.opacity = '1';
    if (label) speakText(`I am grateful for ${label.toLowerCase()}`);
  }, 400);

  // Dots
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === n)
  );

  // Auto-advance
  clearTimeout(slideTimer);
  if (!isPaused) {
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── COMPLETE ────────────────────────────────────────────── */
function complete() {
  clearTimeout(slideTimer);
  playBell();
  const stmt = document.getElementById('iamStatement');
  stmt.textContent = 'Carry this gratitude with you.';
  speakText('Carry this gratitude with you today.');
  autoClose = setTimeout(() => goHome(), 7000);
}

/* ── PAUSE / RESUME ──────────────────────────────────────── */
function togglePause() {
  const btn = document.getElementById('pauseBtn');
  isPaused = !isPaused;
  if (isPaused) {
    clearTimeout(slideTimer);
    stopSpeech();
    btn.textContent = '▶';
    btn.title = 'Resume';
  } else {
    btn.textContent = '⏸';
    btn.title = 'Pause';
    slideTimer = setTimeout(() => showSlide(current + 1), DURATION);
  }
}

/* ── RESTART / HOME ──────────────────────────────────────── */
function restartPlayer() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  location.reload();
}

function goHome() {
  clearTimeout(slideTimer);
  clearTimeout(autoClose);
  stopSpeech();
  returnToApp();
}

/* ── INIT ────────────────────────────────────────────────── */
function init() {
  buildDots();
  playBell();
  const img = document.getElementById('vibeImage');
  img.style.backgroundImage = `url("${SLIDES[0]}")`;
  setTimeout(() => showSlide(0), 800);
}

window.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
  if (e.key === ' ')          { e.preventDefault(); togglePause(); }
  if (e.key === 'ArrowRight') { clearTimeout(slideTimer); stopSpeech(); showSlide(current + 1); }
  if (e.key === 'ArrowLeft')  { clearTimeout(slideTimer); stopSpeech(); showSlide(Math.max(0, current - 1)); }
});
</script>

</body>
</html>
