<!DOCTYPE html>
<!-- GUIDED GRATITUDE — an episode's images, each shown with its spoken line
     ("I am grateful for …"), then a 60-second silent reflection.
     Launch:  players/gratitude-guided.html?ep=1
     Reads    images/gratitude/manifest.json  +  images/gratitude/episode-<ep>/ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guided Gratitude | Cosmic Intentions</title>
<script>(function(){var t;try{t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('ci_theme')||'dark';}catch(e){t='dark';}document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root{ --accent:#E0608A; --bg:#1a1a1a; }
  [data-theme="light"]{ --bg:#EEF0F2; } [data-theme="kids"]{ --bg:#FFF6E0; }
  html,body{ height:100%; margin:0; background:var(--bg); display:flex; justify-content:center; align-items:center; overflow:hidden; font-family:'Arial Narrow','Roboto Condensed',system-ui,sans-serif; }
  .frame{ position:relative; width:min(95vw,95vh*5/6,560px); aspect-ratio:5/6; border:12px solid var(--accent); box-sizing:border-box; background:#fff; display:flex; flex-direction:column; overflow:hidden; }
  .photo{ position:relative; flex:0 0 58%; background:#111; overflow:hidden; }
  .slide{ position:absolute; inset:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1s ease; }
  .slide.on{ opacity:1; }
  /* silence overlay (phase 2) */
  .silence{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:linear-gradient(160deg,#2a1720,#1a1016); color:#fff; text-align:center; padding:20px; }
  .silence.on{ display:flex; }
  .silence .ring{ width:96px; height:96px; }
  .panel{ flex:1 1 auto; position:relative; background:#fff; display:flex; flex-direction:column; }
  .line{ flex:1 1 auto; margin:0; padding:18px 20px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:clamp(18px,5vw,26px); font-weight:800; line-height:1.25; color:#1c1c1c; letter-spacing:.3px; }
  .prog{ height:6px; background:rgba(0,0,0,.12); }
  .progfill{ height:100%; width:0%; background:#ffdd00; box-shadow:0 0 8px rgba(255,221,0,.8); transition:width .3s linear; }
  .bar{ background:var(--accent); padding:12px 16px; display:flex; align-items:center; gap:14px; }
  .cbtn{ background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer; line-height:1; padding:4px; }
  .play{ background:#fff; color:#111; width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .phase{ margin-left:auto; font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#fff; opacity:.9; }
  /* live countdown chip — visible the whole session */
  .timer{ position:absolute; top:10px; right:10px; z-index:5; background:rgba(0,0,0,.58); color:#fff; font-weight:800; font-size:19px; letter-spacing:1px; padding:6px 13px; border-radius:22px; font-variant-numeric:tabular-nums; box-shadow:0 2px 8px rgba(0,0,0,.4); }
</style>
</head>
<body>
  <div class="frame">
    <div class="photo">
      <div class="slide" id="slideA"></div>
      <div class="slide" id="slideB"></div>
      <div class="timer" id="timer">0:00</div>
    </div>
    <div class="panel">
      <p class="line" id="line">Gratitude</p>
      <div class="prog"><div class="progfill" id="progfill"></div></div>
      <div class="bar">
        <button class="cbtn" id="close" aria-label="Close">&#10006;</button>
        <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
        <span class="phase" id="phase">Gratitude</span>
      </div>
    </div>
  </div>

<script type="module">
  const params = new URLSearchParams(location.search);
  const ep = params.get('ep') || '1';
  const SLIDE_MS = 7000;     // per image
  const timerMin = Math.max(0, parseInt(params.get('timer') || '0', 10) || 0);  // silent-reflect timer minutes (separate mode)
  const imgUrl = it => `../images/gratitude/episode-${it.ep}/${it.file}`;

  const slideA = document.getElementById('slideA'), slideB = document.getElementById('slideB');
  const lineEl = document.getElementById('line'), phaseEl = document.getElementById('phase');
  const progfill = document.getElementById('progfill'), playBtn = document.getElementById('play');
  const timerEl = document.getElementById('timer');

  let items = [], frontA = true, paused = false, idx = -1;
  let stepResolve = null;   // resolves the current wait early (e.g., skip)

  /* Pause-aware wait: settles after `ms` of *unpaused* time. Uses setTimeout (not
     requestAnimationFrame) so it keeps running when the player iframe isn't
     visible and is reliable under headless capture. */
  function wait(ms){
    return new Promise(res => {
      let left = ms, id;
      stepResolve = () => { clearTimeout(id); stepResolve = null; res(); };
      (function loop(){
        if (paused){ id = setTimeout(loop, 120); return; }
        const chunk = Math.min(left, 120);
        left -= chunk;
        if (left <= 0){ stepResolve = null; return res(); }
        id = setTimeout(loop, chunk);
      })();
    });
  }

  /* ── Voice: browser speech-synthesis for now (calm). Swappable for ElevenLabs. ── */
  function speak(text){
    try { window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9; u.pitch = 1; u.volume = 1;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  function stopSpeak(){ try { window.speechSynthesis.cancel(); } catch(e){} }

  function showImage(url){
    const incoming = frontA ? slideB : slideA, outgoing = frontA ? slideA : slideB;
    incoming.style.backgroundImage = `url('${url}')`;
    incoming.classList.add('on'); outgoing.classList.remove('on');
    frontA = !frontA;
  }

  function playBell(){
    try { const ctx=new (window.AudioContext||window.webkitAudioContext)(), now=ctx.currentTime;
      [660,990].forEach((f,i)=>{ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.value=f;
        const s=now+i*0.18; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,s+2.2); o.connect(g).connect(ctx.destination); o.start(s); o.stop(s+2.3); });
    } catch(e){}
  }
  function finishPlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.playerFinished){window.parent.playerFinished();return;} }catch(e){} closePlayer(); }
  function closePlayer(){ stopSpeak(); try{ if(window.parent&&window.parent!==window&&window.parent.closePlayerColumn){window.parent.closePlayerColumn();return;} }catch(e){} if(history.length>1)history.back(); else window.close(); }
  document.getElementById('close').onclick = closePlayer;

  playBtn.onclick = () => {
    paused = !paused;
    playBtn.innerHTML = paused ? '&#9654;' : '&#9208;';
    if (paused) stopSpeak();
  };

  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;   // 305 → "5:05"

  /* EPISODE MODE — play the episode's photos + spoken lines once (slideshow). */
  async function runEpisode(){
    phaseEl.textContent = `Episode ${ep}`;
    timerEl.style.display = 'none';         // no countdown here — this is the slideshow
    for (let idx = 0; idx < items.length; idx++){
      const it = items[idx];
      showImage(imgUrl(it));
      lineEl.textContent = it.line;
      if (!paused) speak(it.line);
      progfill.style.width = Math.round(((idx + 1) / items.length) * 100) + '%';
      await wait(SLIDE_MS);
    }
    stopSpeak();
  }

  /* TIMER MODE — a spoken gratitude prompt, then a silent reflection countdown. */
  async function runTimer(totalS){
    phaseEl.textContent = 'Reflect';
    timerEl.style.display = 'none';
    lineEl.style.fontSize = '46px';
    lineEl.style.fontVariantNumeric = 'tabular-nums';
    // Spoken intro so it makes sense on its own (e.g. inside Play My Day), then silence.
    if (!paused) speak("Silently reflect on some of the things you're grateful for.");
    for (let s = totalS; s > 0; s--){
      lineEl.textContent = fmt(s);
      progfill.style.width = Math.round((1 - s / totalS) * 100) + '%';
      await wait(1000);
    }
    lineEl.textContent = '0:00';
    progfill.style.width = '100%';
  }

  async function main(){
    // Silent reflect timer — its own mode, no episode content.
    if (timerMin > 0){
      lineEl.textContent = fmt(timerMin * 60);
      await wait(400);
      await runTimer(timerMin * 60);
      playBell();
      setTimeout(finishPlayer, 3500);
      return;
    }
    // Episode slideshow (photos + voice-overs).
    try {
      const res = await fetch(`../images/gratitude/manifest.json?_=${Date.now()}`);
      const manifest = await res.json();
      items = (manifest[ep] || []).map(x => ({ ...x, ep }));
      items = items.filter(x => x && x.file);
    } catch(e){ items = []; }
    if (!items.length){ lineEl.textContent = 'No gratitude images yet.'; return; }
    items.forEach(it => { const im = new Image(); im.src = imgUrl(it); });   // preload
    await wait(600);            // brief beat before it begins
    await runEpisode();
    playBell();
    setTimeout(finishPlayer, 3500);
  }
  main();
</script>
</body>
</html>
