<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Breathing Countdown — CI Review</title>
<style>
  :root {
    --ci-teal:#107E8B;
    --ci-footer:#82AD77;
    --ci-frame:2.15cqw;
    --ci-radius:3cqw;
    --ci-footer-h:17.4%;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#fff;color:#050505;font-family:Arial,Helvetica,sans-serif}
  body{display:grid;place-items:center;padding:clamp(10px,2vw,28px)}
  .sheet{width:min(100%,1600px)}
  h1{margin:0 0 2.1cqw 4.2cqw;font-size:clamp(28px,5.2cqw,84px);line-height:.95;font-weight:800;letter-spacing:-.035em}
  .player{
    container-type:inline-size;
    position:relative;
    width:82.4%;
    aspect-ratio:16/9;
    margin-inline:auto;
    background:var(--ci-teal);
    padding:var(--ci-frame);
    overflow:hidden;
  }
  .inside{position:relative;width:100%;height:100%;display:grid;grid-template-columns:40% var(--ci-frame) 1fr;background:var(--ci-teal)}
  .divider{background:var(--ci-teal)}
  .panel{position:relative;overflow:hidden;background:#fff}
  .mosaic{border-radius:var(--ci-radius)}
  .breath{border-radius:var(--ci-radius)}
  .reference-crop{position:absolute;overflow:hidden;inset:0}
  .reference-crop img{position:absolute;display:block;max-width:none;height:auto;user-select:none;pointer-events:none}
  /* Exact crops from Scott's supplied Sheet 11 reference. The source is retained as an audit asset. */
  .mosaic .reference-crop img{width:329.63%;left:-146.5%;top:-75.1%}
  .lungs-window{position:absolute;left:0;right:0;top:0;height:82.6%;overflow:hidden;background:#fff}
  .lungs-window .reference-crop img{width:207%;left:-193.3%;top:-57.5%}
  .footer{position:absolute;left:0;right:0;bottom:0;height:var(--ci-footer-h);background:var(--ci-footer)}
  .crossbar{position:absolute;left:0;right:0;bottom:calc(var(--ci-footer-h) - .15% - 20px);height:7%;z-index:3;overflow:visible}
  .crossbar svg{width:100%;height:100%;display:block;overflow:visible}
  .crossbar path{fill:none;stroke:var(--ci-teal);stroke-width:var(--ci-frame);vector-effect:non-scaling-stroke;stroke-linecap:butt}
  .timer{
    position:absolute;z-index:5;left:50%;bottom:calc(var(--ci-footer-h) - 6cqw);
    transform:translateX(-50%);width:12cqw;height:12cqw;border-radius:50%;
    border:var(--ci-frame) solid var(--ci-teal);background:#fff;color:#111;
    display:grid;place-items:center;padding:0;cursor:pointer;
    font:700 5cqw/1 "Arial Narrow",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  .timer:focus-visible{outline:.55cqw solid #111;outline-offset:.45cqw}
  .review-note{margin:1rem auto 0;width:82.4%;font-size:12px;color:#666;text-align:right}
  @media (max-width:680px){body{padding:8px}.player,.review-note{width:100%}h1{margin-left:0;font-size:8vw}.review-note{font-size:10px}}
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="sheet">
  <h1>Breathing Countdown</h1>
  <section class="player" aria-label="Breathing Countdown review player">
    <div class="inside">
      <div class="panel mosaic" aria-hidden="true">
        <div class="reference-crop"><img src="/images/breathing/breathing-countdown-reference.png" alt="" draggable="false"></div>
      </div>
      <div class="divider" aria-hidden="true"></div>
      <div class="panel breath">
        <div class="lungs-window" aria-hidden="true">
          <div class="reference-crop"><img src="/images/breathing/breathing-countdown-reference.png" alt="" draggable="false"></div>
        </div>
        <div class="footer" aria-hidden="true"></div>
        <div class="crossbar" aria-hidden="true">
          <svg viewBox="0 0 1000 80" preserveAspectRatio="none"><path d="M0 52 Q500 -20 1000 52"/></svg>
        </div>
        <button class="timer" id="timer" type="button" aria-label="Advance breathing countdown from 3">3</button>
      </div>
    </div>
  </section>
  <div class="review-note">Review build: click the timer or press Space to advance the verified 3 → 2 → 1 sequence. Timing is intentionally not invented.</div>
</main>
<script>
(() => {
  const values=[3,2,1];
  let index=0;
  const timer=document.getElementById('timer');
  function render(){
    const v=values[index];
    timer.textContent=String(v);
    timer.setAttribute('aria-label',`Advance breathing countdown from ${v}`);
  }
  function advance(){ index=(index+1)%values.length; render(); }
  timer.addEventListener('click',advance);
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();advance();}});
  render();
})();
</script>
</body>
</html>
