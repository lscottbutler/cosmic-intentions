<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Countdown | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.player-container {
  width: 92%;
  max-width: 520px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-bottom: 28px;
  position: relative;
}

.image-wrap {
  width: 100%;
  position: relative;
}
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: #333;
  z-index: 5;
}

.vibe-image {
  width: 100%;
  height: 280px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: 0;
  display: block;
}

.countdown-circle {
  width: 91px;
  height: 91px;
  border-radius: 50%;
  background: #FFF;
  border: 12px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
  bottom: -46px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}

.countdown-number {
  font-size: 35px;
  font-weight: 700;
  font-style: italic;
  color: #000;
  font-variant-numeric: tabular-nums;
}

.countdown-circle.ending {
  border-color: #C9A96E;
  animation: pulse 1s ease-in-out infinite;
}

.countdown-circle.ending .countdown-number {
  color: #C9A96E;
}

@keyframes pulse {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50%       { transform: translateX(-50%) scale(1.07); }
}

.iam-statement {
  font-size: 18px;
  line-height: 1.6;
  color: #FFF;
  text-align: center;
  max-width: 420px;
  font-weight: 400;
  letter-spacing: 0.02em;
  margin-top: 52px;
  padding: 0 16px;
}

.btn-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
}

.home-button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}

.home-icon {
  width: 32px;
  height: 32px;
  fill: #000;
}

.ctrl-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 2px solid #333;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  color: #FFF;
  font-size: 22px;
}

.ctrl-button:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}

.instruction {
  font-size: 16px;
  color: rgba(255,255,255,0.7);
  text-align: center;
  font-style: italic;
  margin-top: -10px;
  opacity: 0;
  transition: opacity 1s ease;
}

.instruction.visible {
  opacity: 1;
}

.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}

.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">
  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
    <div class="countdown-circle" id="countdownCircle">
      <img id="eyeOpen"   src="../images/icons/eye-open.png"   style="width:45px;height:45px;object-fit:contain;position:absolute;transition:opacity 1.5s ease;filter:brightness(0);" />
      <img id="eyeClosed" src="../images/icons/eyes-closed.png" style="width:45px;height:45px;object-fit:contain;position:absolute;opacity:0;transition:opacity 1.5s ease;filter:brightness(0);" />
      <div class="countdown-number" id="countdownNumber" style="display:none;position:absolute;"></div>
    </div>
  </div>

  <div class="iam-statement" id="iamStatement">
    I AM becoming the person I have decided to be.
  </div>

  <div class="instruction" id="instruction">Close your eyes and visualize</div>
  
  <div class="btn-row">
    <button class="ctrl-button" id="pauseBtn" onclick="togglePause()" title="Pause">⏸</button>
    <button class="home-button" onclick="goHome()">
      <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <button class="ctrl-button" onclick="replayPlayer()" title="Replay">▶</button>
  </div>
</div>

<button class="close-btn" onclick="exitPlayer()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   VISUAL COUNTDOWN TIMER - REDESIGNED
   ══════════════════════════════════════════════════════════ */


let countdown = 60;
let countdownInterval = null;
let pendingTimers = [];
let isPaused = false;
let autoCloseTimer = null;

function addTimer(fn, delay) {
  const id = setTimeout(fn, delay);
  pendingTimers.push(id);
  return id;
}

/* ══════════════════════════════════════════════════════════
   INITIALIZATION
   ══════════════════════════════════════════════════════════ */

function init() {
  document.getElementById('vibeImage').style.backgroundImage = `url(${getDailyImage(PLAYER_OFFSETS['visual-countdown'])})`;

  const iamText = localStorage.getItem('visual_countdown_goal') || '';
  localStorage.removeItem('visual_countdown_goal');
  document.getElementById('iamStatement').textContent = iamText;

  const storedDuration = localStorage.getItem('visual_countdown_duration');
  if (storedDuration) {
    countdown = parseInt(storedDuration);
    localStorage.removeItem('visual_countdown_duration');
    addTimer(() => startCountdown(), 800);
  }
}

/* ══════════════════════════════════════════════════════════
   COUNTDOWN
   ══════════════════════════════════════════════════════════ */

function startCountdown() {
  const iamStatement = document.getElementById('iamStatement').textContent;

  if (iamStatement) addTimer(() => speakText(iamStatement), 1000);

  const wordCount = (iamStatement || '').split(/\s+/).length;
  const readingMs = Math.max(2000, wordCount * 420);
  const instrDelay = 1000 + readingMs + 4000;

  addTimer(() => {
    document.getElementById('instruction').classList.add('visible');
    speakText('Close your eyes. Visualize your intention.');
    document.getElementById('eyeOpen').style.opacity   = '0';
    document.getElementById('eyeClosed').style.opacity = '1';
  }, instrDelay);

  const countdownStartDelay = instrDelay + 5000;
  addTimer(() => {
    document.getElementById('eyeOpen').style.display   = 'none';
    document.getElementById('eyeClosed').style.display = 'none';
    const display = document.getElementById('countdownNumber');
    display.style.display = 'block';
    display.textContent = countdown;
    startTick();
  }, countdownStartDelay);
}

function startTick() {
  clearInterval(countdownInterval);
  const display  = document.getElementById('countdownNumber');
  const circle   = document.getElementById('countdownCircle');
  const iamText  = document.getElementById('iamStatement').textContent;

  countdownInterval = setInterval(() => {
    countdown--;
    display.textContent = countdown;

    if (countdown === 30 && iamText) speakText(iamText);
    if (countdown <= 5 && countdown > 0) circle.classList.add('ending');

    if (countdown <= 0) {
      clearInterval(countdownInterval);
      countdownInterval = null;
      circle.classList.remove('ending');
      display.style.display = 'none';
      document.getElementById('eyeClosed').style.opacity = '0';
      document.getElementById('eyeOpen').style.opacity   = '1';
      complete();
    }
  }, 1000);
}

/* ══════════════════════════════════════════════════════════
   COMPLETE
   ══════════════════════════════════════════════════════════ */

function complete() {
  clearInterval(countdownInterval);
  countdownInterval = null;
  playBell();

  autoCloseTimer = setTimeout(() => {
    const instruction = document.getElementById('instruction');
    instruction.textContent = 'Open your eyes. Your vision is planted.';
    instruction.classList.add('visible');
    speakText('Open your eyes. Your vision is planted.');
    autoCloseTimer = setTimeout(() => goHome(), 10000);
  }, 3000);
}

/* ══════════════════════════════════════════════════════════
   PAUSE / RESUME
   ══════════════════════════════════════════════════════════ */

function togglePause() {
  const btn = document.getElementById('pauseBtn');
  isPaused = !isPaused;
  if (isPaused) {
    clearInterval(countdownInterval);
    countdownInterval = null;
    pendingTimers.forEach(id => clearTimeout(id));
    pendingTimers = [];
    stopSpeech();
    btn.textContent = '▶';
    btn.title = 'Resume';
  } else {
    btn.textContent = '⏸';
    btn.title = 'Pause';
    startTick();
  }
}

function replayPlayer() {
  clearInterval(countdownInterval);
  clearTimeout(autoCloseTimer);
  stopSpeech();
  location.reload();
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════════════════════════ */

function goHome() {
  clearInterval(countdownInterval);
  clearTimeout(autoCloseTimer);
  stopSpeech();
  returnToApp();
}

function exitPlayer() {
  clearInterval(countdownInterval);
  clearTimeout(autoCloseTimer);
  stopSpeech();
  returnToApp();
}

window.addEventListener('DOMContentLoaded', init);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') exitPlayer();
  if (e.key === 'h' || e.key === 'H') goHome();
});
</script>

</body>
</html>
