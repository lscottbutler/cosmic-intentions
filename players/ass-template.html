<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Slide Show | Cosmic Intentions</title>
  <style>
    /* ── ASS (Audio Slide Show) foundation — Affirmations / Beliefs / Stoic ─────────
       Amber stage, dark slide panel (maroon edge), black play/pause circle on the
       bottom seam, mute + fullscreen. Slides cross-fade on a timer. ──────────────── */
    :root { --amber:#f5b820; --panel:#2e2e30; --edge:#6e1614; --slidefont:4vw; --fade:1s; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:var(--amber); overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-family:'Helvetica Neue',Arial,sans-serif; }

    .stagewrap { position:relative; width:min(94vw, 90vh * 16 / 9); aspect-ratio:16/9; }
    .panel { position:absolute; inset:0; background:var(--panel); border:2px solid var(--edge);
      border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:0 10px 40px rgba(0,0,0,.45); }

    .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      text-align:center; padding:7% 9%; opacity:0; transition:opacity var(--fade) ease;
      color:#fff; font-weight:700; line-height:1.4; letter-spacing:.04em; text-transform:uppercase;
      font-size:clamp(18px, var(--slidefont), 56px); text-wrap:balance; }
    .slide.show { opacity:1; }
    .slide.img { padding:0; }
    .slide.img img { width:100%; height:100%; object-fit:cover; }

    /* black play/pause circle straddling the bottom seam */
    .playbtn { position:absolute; left:50%; bottom:-4.5%; transform:translateX(-50%);
      width:9%; aspect-ratio:1; border-radius:50%; background:#0a0a0a; z-index:6; cursor:pointer;
      display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.55); }
    .playbtn svg { width:40%; height:40%; fill:#fff; }

    /* top-right controls: mute + fullscreen */
    #ctl { position:fixed; top:14px; right:14px; z-index:9999; display:flex; gap:8px; }
    #ctl button { padding:8px 12px; font:700 13px/1 'Helvetica Neue',Arial,sans-serif; color:#3a2a00;
      background:rgba(255,255,255,.7); border:1px solid rgba(0,0,0,.25); border-radius:8px; cursor:pointer; }
    #ctl button:hover { background:#fff; }
    :fullscreen #ctl button, :-webkit-full-screen #ctl button { opacity:.3; }
  </style>
</head>
<body>
  <div class="stagewrap">
    <div class="panel" id="panel"></div>
    <div class="playbtn" id="playbtn"><svg viewBox="0 0 24 24"></svg></div>
  </div>

  <div id="ctl">
    <button id="mute">🔊 Sound on</button>
    <button id="fs">⛶ Full screen</button>
  </div>

  <script>
  /* ── CONFIG ────────────────────────────────────────────────────────────────
     Live-test via URL: ?secs=5  (seconds per slide)
     SLIDES is placeholder content — wired to real data (affirmations/beliefs/stoic)
     in the next step. A slide is a string (text) or { img:'...url' }. */
  const CONFIG = { secsPerSlide: 6, fade: 1, amber: '#f5b820' };
  const P = new URLSearchParams(location.search);
  if (P.get('secs')) CONFIG.secsPerSlide = +P.get('secs');

  // slides come from the launcher (this goal's affirmations/beliefs/stoic) via localStorage
  let SLIDES;
  try { SLIDES = JSON.parse(localStorage.getItem('ci_ass_slides') || 'null'); } catch (e) {}
  if (!Array.isArray(SLIDES) || !SLIDES.length) SLIDES = [   // placeholder when opened standalone
    'I am calm, capable, and in control.',
    'Every day, in every way, I am getting better.',
    'I attract what I focus on — so I focus on what I want.',
    'I have everything within me to succeed.',
    'I am exactly where I need to be.'
  ];

  const ICON = {
    play:  '<path d="M8 5v14l11-7z"/>',
    pause: '<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'
  };

  const panel  = document.getElementById('panel');
  const playbtn= document.getElementById('playbtn');
  const playSvg= playbtn.querySelector('svg');
  const muteBtn= document.getElementById('mute');
  const fsBtn  = document.getElementById('fs');

  document.documentElement.style.setProperty('--fade', CONFIG.fade + 's');

  // build slide elements
  const slideEls = SLIDES.map(s => {
    const d = document.createElement('div');
    if (s && s.img) { d.className = 'slide img'; const im = document.createElement('img'); im.src = s.img; d.appendChild(im); }
    else { d.className = 'slide'; d.textContent = s; }
    panel.appendChild(d);
    return d;
  });

  let cur = 0, playing = false, timer = null, muted = false;

  function show(i) {
    cur = (i + slideEls.length) % slideEls.length;
    slideEls.forEach((el, n) => el.classList.toggle('show', n === cur));
  }
  function renderPlay() { playSvg.innerHTML = playing ? ICON.pause : ICON.play; }
  function tick() { show(cur + 1); }
  function setPlaying(p) {
    playing = p; renderPlay();
    if (p && !timer) timer = setInterval(tick, CONFIG.secsPerSlide * 1000);
    if (!p && timer) { clearInterval(timer); timer = null; }
  }

  panel.addEventListener('click', () => setPlaying(!playing));     // tap the slide = play/pause
  playbtn.addEventListener('click', (e) => { e.stopPropagation(); setPlaying(!playing); });

  muteBtn.addEventListener('click', (e) => { e.stopPropagation();
    muted = !muted; muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound on'; });

  fsBtn.addEventListener('click', (e) => { e.stopPropagation();
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen||el.webkitRequestFullscreen).call(el); });

  show(0); renderPlay();
  setTimeout(() => setPlaying(true), 400);   // autostart
  </script>
</body>
</html>
