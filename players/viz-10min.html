<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10-Min Viz | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #111;
  color: #FFF;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* ── FRAME ──────────────────────────────────────── */
.frame {
  width: 100%;
  max-width: 480px;
  height: 100vh;
  max-height: 900px;
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: 0 0 0 4px #1a1a1a, 0 0 60px rgba(0,0,0,0.8);
}

/* ── START SCREEN ───────────────────────────────── */
.start-screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  background: #000;
  z-index: 20;
  transition: opacity 0.6s;
}
.start-screen.hidden { opacity: 0; pointer-events: none; }

.start-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  text-align: center;
}

.start-dur {
  font-size: 72px;
  font-weight: 100;
  color: #FFF;
  letter-spacing: -3px;
  line-height: 1;
}

.start-dur span {
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.5);
  margin-left: 6px;
  vertical-align: middle;
}

.begin-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.06);
  color: #FFF;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.22s;
}
.begin-btn:hover {
  border-color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.12);
  transform: scale(1.06);
}
.begin-btn:active { transform: scale(0.96); }

/* ── IMAGE AREA ─────────────────────────────────── */
.img-area {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

.vibe-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 1.2s ease;
}

.img-dim {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.25) 0%,
    transparent 35%,
    transparent 55%,
    rgba(0,0,0,0.65) 100%
  );
}

/* ── COUNTDOWN RING ─────────────────────────────── */
.cd-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.45);
  background: rgba(0,0,0,0.48);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.7s, border-color 0.4s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.cd-ring.show { opacity: 1; }
.cd-ring.ending {
  border-color: #C9A96E;
  animation: ring-pulse 1.2s ease-in-out infinite;
}
@keyframes ring-pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50%       { transform: translate(-50%, -50%) scale(1.05); }
}

.cd-number {
  font-size: 42px;
  font-weight: 200;
  color: #FFF;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -1px;
  transition: color 0.4s;
}
.cd-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  transition: color 0.4s;
}
.cd-ring.ending .cd-number,
.cd-ring.ending .cd-label { color: #C9A96E; }

/* ── PROGRESS BAR ───────────────────────────────── */
.progress-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: rgba(201,169,110,0.6);
  width: 0%;
  transition: width 1s linear;
}

/* ── SCENE INDICATOR ────────────────────────────── */
.scene-dots {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  opacity: 0;
  transition: opacity 0.5s;
}
.scene-dots.show { opacity: 1; }
.scene-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.28);
  transition: background 0.4s;
}
.scene-dot.active { background: rgba(255,255,255,0.85); }

/* ── BOTTOM SECTION ─────────────────────────────── */
.bottom {
  background: #000;
  border-top: 1px solid rgba(255,255,255,0.07);
  padding: 22px 28px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}

.iam-text {
  font-size: clamp(15px, 4.2vw, 20px);
  font-weight: 700;
  color: #FFF;
  text-align: center;
  line-height: 1.5;
  max-width: 340px;
  min-height: 52px;
  opacity: 0;
  transition: opacity 1.1s ease;
  letter-spacing: -0.2px;
}
.iam-text.show { opacity: 1; }

/* ── HOME BUTTON ────────────────────────────────── */
.home-btn {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.22);
  background: transparent;
  color: rgba(255,255,255,0.6);
  font-size: 22px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  line-height: 1;
}
.home-btn:hover {
  border-color: rgba(255,255,255,0.6);
  color: #FFF;
  background: rgba(255,255,255,0.06);
}
.home-btn:active { transform: scale(0.94); }
</style>
</head>
<body>

<div class="frame">

  <!-- START SCREEN -->
  <div class="start-screen" id="startScreen">
    <div class="start-label">Deep Visualization</div>
    <div class="start-dur">10 <span>min</span></div>
    <button class="begin-btn" onclick="start()">BEGIN</button>
  </div>

  <!-- IMAGE / SCENE -->
  <div class="img-area">
    <img class="vibe-img" id="vibeImg" src="" alt="" />
    <div class="img-dim"></div>

    <!-- Scene dots (13 scenes) -->
    <div class="scene-dots" id="sceneDots"></div>

    <!-- Countdown ring -->
    <div class="cd-ring" id="cdRing">
      <span class="cd-number" id="cdNum">10:00</span>
      <span class="cd-label">remaining</span>
    </div>

    <!-- Progress bar -->
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- AFFIRMATION + HOME -->
  <div class="bottom">
    <div class="iam-text" id="iamText"></div>
    <button class="home-btn" onclick="exit()">⌂</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/player-core.js"></script>
<script>
const SUPA_URL = 'https://wbqzwbubbeorcknevips.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndicXp3YnViYmVvcmNrbmV2aXBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0NTM3NzMsImV4cCI6MjA5MTAyOTc3M30.mF_YGj1E2ib0mEx07lkZyjgBzdGDT7saK8wofEjcqNc';

const TOTAL_SECS = 600; // 10 minutes
const NUM_SCENES = PLAYER_IMAGES.length;
const IMAGES = PLAYER_IMAGES;

let tick    = null;
let affTick = null;
let secs    = TOTAL_SECS;
let affs    = [];
let affIdx  = 0;
let sceneIdx = 0;

/* ── INIT ─────────────────────────────────────── */
async function init() {
  buildSceneDots();

  const params = new URLSearchParams(location.search);
  const idx    = parseInt(params.get('idx'), 10) || 0;

  affs = await loadAffirmations(idx);
  setImage(0, false);
}

/* ── SCENE DOTS ───────────────────────────────── */
function buildSceneDots() {
  const container = document.getElementById('sceneDots');
  for (let i = 0; i < NUM_SCENES; i++) {
    const d = document.createElement('div');
    d.className = 'scene-dot' + (i === 0 ? ' active' : '');
    d.id = `dot-${i}`;
    container.appendChild(d);
  }
}

function updateDot(i) {
  document.querySelectorAll('.scene-dot').forEach((d, n) => {
    d.classList.toggle('active', n === i);
  });
}

/* ── LOAD AFFIRMATIONS ─────────────────────────── */
async function loadAffirmations(idx) {
  try {
    const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    const { data: { user } } = await sb.auth.getUser();
    if (user) {
      const raw   = localStorage.getItem(`ci_intentions_${user.id}`) || localStorage.getItem('ci_intentions') || '[]';
      const intns = JSON.parse(raw);
      const goal  = intns[idx]?.title;
      if (goal) {
        const { data } = await sb
          .from('user_content')
          .select('core_blueprint')
          .eq('user_id', user.id)
          .eq('goal', goal)
          .order('generated_at', { ascending: false })
          .limit(1)
          .maybeSingle();
        const list = data?.core_blueprint?.affirmations;
        if (list?.length) return list;
      }
    }
  } catch(e) {}

  try {
    const raw  = localStorage.getItem('ci_intentions') || '[]';
    const list = JSON.parse(raw)[idx]?.mindset?.affirmations;
    if (list?.length) return list;
  } catch(e) {}

  return [
    'I AM exactly who I was born to become.',
    'I attract success, abundance, and deep purpose.',
    'Every action I take moves me closer to my vision.',
    'I am unstoppable. I am disciplined. I am free.',
    'My future is already written — I am living into it now.',
    'I choose growth. I choose clarity. I choose power.',
    'I am worthy of everything I desire.',
    'My mind is sharp, my body is strong, my spirit is aligned.',
    'I create results with consistency and intention.',
    'I am becoming more every single day.',
    'The universe conspires in my favor.',
    'I am the architect of my own destiny.',
    'I live with purpose, passion, and certainty.',
  ];
}

/* ── IMAGE ─────────────────────────────────────── */
function setImage(i, fade = true) {
  const img = document.getElementById('vibeImg');
  if (fade) {
    img.style.opacity = '0';
    setTimeout(() => {
      img.src = IMAGES[i % NUM_SCENES];
      img.onerror = () => { img.style.display = 'none'; };
      img.style.opacity = '1';
    }, 600);
  } else {
    img.src = IMAGES[i % NUM_SCENES];
    img.onerror = () => { img.style.display = 'none'; };
  }
  updateDot(i % NUM_SCENES);
  sceneIdx = i % NUM_SCENES;
}

/* ── AFFIRMATION ───────────────────────────────── */
function showAffirmation(i) {
  const el = document.getElementById('iamText');
  el.classList.remove('show');
  setTimeout(() => {
    el.textContent = affs[i % affs.length] || '';
    el.classList.add('show');
  }, 350);
  // Advance scene every affirmation cycle
  setImage(i % NUM_SCENES);
}

/* ── START ─────────────────────────────────────── */
function start() {
  secs = TOTAL_SECS;
  document.getElementById('startScreen').classList.add('hidden');

  const ring  = document.getElementById('cdRing');
  const numEl = document.getElementById('cdNum');
  const dots  = document.getElementById('sceneDots');
  ring.classList.add('show');
  dots.classList.add('show');
  numEl.textContent = formatTime(secs);

  setTimeout(() => showAffirmation(0), 700);
  speakText('Close your eyes. Breathe deeply. Let your vision fill your mind.');

  // Spread 13 affirmations over 10 minutes (≈46s each)
  const interval = Math.floor((TOTAL_SECS * 1000) / Math.max(affs.length, 1));
  affIdx  = 0;
  affTick = setInterval(() => {
    affIdx++;
    if (affIdx < affs.length) showAffirmation(affIdx);
  }, interval);

  tick = setInterval(() => {
    secs--;
    numEl.textContent = formatTime(secs);
    updateProgress(TOTAL_SECS - secs, TOTAL_SECS, 'progressBar');
    if (secs <= 30 && secs > 0) ring.classList.add('ending');
    if (secs <= 0) { clearInterval(tick); clearInterval(affTick); done(); }
  }, 1000);
}

/* ── DONE ──────────────────────────────────────── */
function done() {
  const ring  = document.getElementById('cdRing');
  const numEl = document.getElementById('cdNum');
  ring.classList.remove('ending');
  numEl.textContent = '✓';
  document.getElementById('progressBar').style.width = '100%';
  playBell();
  speakText('Open your eyes. Your vision is deeply planted. Go live it.');
  setTimeout(exit, 5000);
}

/* ── EXIT ──────────────────────────────────────── */
function exit() {
  if (tick)    clearInterval(tick);
  if (affTick) clearInterval(affTick);
  stopSpeech();
  returnToApp();
}

window.addEventListener('DOMContentLoaded', init);
document.addEventListener('keydown', e => { if (e.key === 'Escape') exit(); });
</script>

</body>
</html>
