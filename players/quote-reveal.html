<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Cosmic Intentions Quote Reveal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400&amp;display=swap">
  <style>
    :root { color-scheme: dark; --teal:#078e96; --green:#587c38; --ink:#202321; --paper:#f7f5ec; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; place-items:center; background:#05070b; font-family:Georgia,'Times New Roman',serif; }
    button { font:inherit; }
    .player { position:relative; width:min(100vw,177.7778vh); height:min(100vh,56.25vw); container-type:size; isolation:isolate; background:#fff; }
    .player::after { content:""; position:absolute; inset:0; z-index:4; border:2.1cqw solid #86ad7d; pointer-events:none; }
    .backdrop { position:absolute; inset:3.75cqh 2.1cqw; background:url('../images/quote-reveal/quote-background.webp') center/cover no-repeat; filter:blur(5.9px); transform:scale(1.018); }
    .backdrop::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(2,10,24,.08),rgba(2,8,20,.2)); }
    .stage { position:absolute; inset:0; display:grid; place-items:center; padding:4cqh 4cqw; }
    .card {
      position:relative; width:64.8cqw; height:43.28cqw; padding:14.5cqh 8.5cqw 13.5cqh;
      display:grid; place-items:center; text-align:center; color:var(--ink); background:transparent;
      filter:drop-shadow(0 26px 36px rgba(0,0,0,.34));
      opacity:0; transform:scale(1.0835); transition:opacity 1.1s ease,transform 1.1s ease;
    }
    .card.visible { opacity:1; transform:scale(1.1); }
    .card-shape { position:absolute; inset:0; width:100%; height:100%; z-index:-1; overflow:visible; }
    .quote { margin:0; width:124%; font-family:'Roboto Condensed',sans-serif; font-size:3.4cqw; line-height:1.27; letter-spacing:.025em; font-weight:400; text-transform:uppercase; text-wrap:balance; transform:translateY(-47px) scaleX(.9); }
    .quote-line { position:relative; display:block; width:max-content; max-width:100%; min-height:1.27em; margin:0 auto; white-space:nowrap; }
    .inline-mark { position:absolute; width:1.845em; height:1.845em; fill:#83ad78; }
    .inline-mark.open { right:calc(100% + .12em); top:50%; transform:translateY(-50%) rotate(180deg); }
    .inline-mark.close { left:calc(100% + .12em); top:50%; transform:translateY(-50%); }
    .author { position:absolute; right:11cqw; bottom:8cqh; color:#86aa76; font:700 1.45cqw/1.2 'Arial Narrow',Arial,sans-serif; letter-spacing:.1em; text-transform:uppercase; opacity:0; transform:translateY(-140px); transition:opacity .7s ease; }
    .author.visible { opacity:1; }
    .controls { position:absolute; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); z-index:3; display:flex; gap:10px; transform:translateX(-50%); opacity:.28; transition:opacity .2s; }
    .controls:hover,.controls:focus-within { opacity:1; }
    .control { min-width:82px; padding:9px 16px; color:#fff; background:rgba(5,12,25,.74); border:1px solid rgba(255,255,255,.65); border-radius:999px; cursor:pointer; font:700 12px/1 Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; backdrop-filter:blur(8px); }
    .progress { position:absolute; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.18); z-index:2; }
    .progress span { display:block; width:0; height:100%; background:#eb7d24; }
    .status { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
    @media (max-width:640px) {
      .stage { padding:18px; }
      .card { width:94vw; aspect-ratio:1.25/1; padding:16vh 13vw 15vh; }
      .quote { font-size:5.4vw; }
      .author { right:40px; bottom:48px; font-size:12px; }
      .mark.open { left:28px; top:28px; } .mark.close { right:28px; bottom:6px; }
    }
    @media (prefers-reduced-motion:reduce) { .card,.author { transition:none; } }
  </style>
</head>
<body>
  <main class="player" aria-label="Quote reveal player">
    <div class="backdrop" aria-hidden="true"></div>
    <section class="stage">
      <article class="card" id="card" aria-live="polite">
        <svg class="card-shape" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
          <path fill="#078e96" d="M0 78 Q500 0 1000 78 L1000 482 Q500 560 0 482 Z"/>
          <path fill="#f7f5ec" d="M22 92 Q500 26 978 92 L978 468 Q500 534 22 468 Z"/>
        </svg>
        <p class="quote">
          <span class="quote-line"><svg class="inline-mark open" viewBox="0 0 48 48" aria-hidden="true"><path d="M12.5 34h5l4.5-8V14H10v12h6zm16 0h5l4.5-8V14H26v12h6z"/></svg><span id="quote-line-1"></span><svg class="inline-mark close" id="closing-quote" viewBox="0 0 48 48" aria-hidden="true"><path d="M12.5 34h5l4.5-8V14H10v12h6zm16 0h5l4.5-8V14H26v12h6z"/></svg></span>
          <span class="quote-line" id="quote-line-2"></span>
          <span class="quote-line" id="quote-line-3"></span>
          <span class="quote-line"><span id="quote-line-4"></span></span>
        </p>
        <p class="author" id="author">– Marcus Aurelius</p>
      </article>
    </section>
    <div class="controls" aria-label="Playback controls">
      <button class="control" id="play" type="button">Start</button>
      <button class="control" id="replay" type="button">Replay</button>
    </div>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <p class="status" id="status">Ready</p>
  </main>
  <script>
    (() => {
      const LINES = ['LOOK WELL INTO THYSELF;', 'THERE IS A SOURCE OF STRENGTH', 'WHICH WILL ALWAYS SPRING UP', 'IF THOU WILT ALWAYS LOOK.'];
      const TEXT = LINES.join(' ');
      const params = new URLSearchParams(location.search);
      const fullSequence = params.has('full');
      const BLANK_MS = fullSequence ? 45000 : 300;
      const TYPE_MS = fullSequence ? 22000 : 8400;
      const HOLD_MS = fullSequence ? 8000 : 5000;
      const FADE_MS = fullSequence ? 1100 : 800;
      const TOTAL_MS = BLANK_MS + TYPE_MS + HOLD_MS + FADE_MS;
      const card = document.querySelector('#card');
      const quoteLines = LINES.map((_, index) => document.querySelector(`#quote-line-${index + 1}`));
      const lineContainers = [...document.querySelectorAll('.quote-line')];
      const closingQuote = document.querySelector('#closing-quote');
      const author = document.querySelector('#author');
      const play = document.querySelector('#play');
      const progress = document.querySelector('#progress');
      const status = document.querySelector('#status');
      let elapsed = 0, last = 0, raf = 0, running = false, complete = false;

      function render(ms) {
        const revealAt = BLANK_MS;
        const typeEnd = revealAt + TYPE_MS;
        const fadeAt = typeEnd + HOLD_MS;
        card.classList.toggle('visible', ms >= revealAt && ms < fadeAt + FADE_MS);
        if (ms < revealAt) {
          quoteLines.forEach(line => { line.textContent = ''; }); lineContainers[0].append(closingQuote); author.classList.remove('visible'); status.textContent = 'Preparing quote';
        } else {
          const typed = Math.min(TEXT.length, Math.floor(((ms - revealAt) / TYPE_MS) * TEXT.length));
          let remaining = typed;
          quoteLines.forEach((line, index) => {
            const count = Math.max(0, Math.min(LINES[index].length, remaining));
            line.textContent = LINES[index].slice(0, count);
            remaining = Math.max(0, remaining - LINES[index].length - 1);
          });
          let activeLine = 0;
          quoteLines.forEach((line, index) => { if (line.textContent.length) activeLine = index; });
          lineContainers[activeLine].append(closingQuote);
          author.classList.toggle('visible', ms >= typeEnd);
          status.textContent = ms < typeEnd ? 'Revealing quote' : 'Quote revealed';
        }
        if (ms >= fadeAt) card.style.opacity = String(Math.max(0, 1 - (ms - fadeAt) / FADE_MS)); else card.style.opacity = '';
        progress.style.width = `${Math.min(100, ms / TOTAL_MS * 100)}%`;
      }

      function tick(now) {
        if (!running) return;
        if (!last) last = now;
        elapsed += now - last; last = now; render(elapsed);
        if (elapsed >= TOTAL_MS) { running = false; complete = true; play.textContent = 'Start'; status.textContent = 'Complete'; return; }
        raf = requestAnimationFrame(tick);
      }
      function start() { if (complete) reset(); running = true; last = 0; play.textContent = 'Pause'; raf = requestAnimationFrame(tick); }
      function pause() { running = false; cancelAnimationFrame(raf); play.textContent = 'Resume'; status.textContent = 'Paused'; }
      function reset() { running = false; complete = false; cancelAnimationFrame(raf); elapsed = 0; last = 0; card.style.opacity = ''; play.textContent = 'Start'; render(0); }
      play.addEventListener('click', () => running ? pause() : start());
      document.querySelector('#replay').addEventListener('click', () => { reset(); start(); });
      document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); } });
      render(0);
      if (!params.has('paused')) start();
    })();
  </script>
</body>
</html>
