<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pegboard Loop | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;   /* fallback */
  min-height: 100dvh;  /* fills the phone, adapts to the address bar */
  overflow: hidden;
}

.slideshow-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
}

.slide {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1s ease;
  padding: 60px;
}

.slide.active { opacity: 1; }

.slide-label {
  font-size: 14px;
  font-weight: 600;
  color: rgba(255,255,255,0.6);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.slide-content {
  text-align: center;
  max-width: 900px;
}

.slide-title {
  font-size: 64px;
  font-weight: 700;
  color: #FFF;
  margin-bottom: 32px;
  line-height: 1.2;
}

.slide-text {
  font-size: 28px;
  font-weight: 400;
  color: rgba(255,255,255,0.9);
  line-height: 1.6;
}

.slide-list {
  font-size: 24px;
  color: rgba(255,255,255,0.85);
  line-height: 1.8;
  text-align: left;
  max-width: 700px;
  margin: 0 auto;
}

.progress-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: rgba(255,255,255,0.2);
  z-index: 100;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  width: 0%;
  transition: width 0.3s ease;
}

.slide-counter {
  position: fixed;
  top: 24px;
  right: 24px;
  font-size: 16px;
  font-weight: 600;
  color: #FFF;
  background: rgba(0,0,0,0.6);
  padding: 8px 16px;
  border-radius: 8px;
  backdrop-filter: blur(10px);
  z-index: 100;
}

.close-btn {
  position: fixed;
  top: 24px;
  left: 24px;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  color: #FFF;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 100;
}

.close-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

.controls {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  z-index: 100;
  background: rgba(0,0,0,0.6);
  padding: 16px 24px;
  border-radius: 12px;
  backdrop-filter: blur(10px);
}

.control-btn {
  padding: 12px 24px;
  font-size: 16px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  color: #FFF;
  cursor: pointer;
  transition: all 0.2s;
}

.control-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
}

.control-btn.play-pause {
  min-width: 100px;
}

.empty-state {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  max-width: 600px;
}

.empty-state-title {
  font-size: 32px;
  font-weight: 700;
  color: #FFF;
  margin-bottom: 16px;
}

.empty-state-text {
  font-size: 18px;
  color: rgba(255,255,255,0.7);
  line-height: 1.6;
  margin-bottom: 32px;
}

.setup-link-btn {
  display: inline-block;
  padding: 14px 32px;
  background: #FFFFFF;
  color: #000000;
  font-size: 15px;
  font-weight: 700;
  border-radius: 8px;
  text-decoration: none;
  letter-spacing: 0.04em;
  transition: opacity 0.15s;
}
.setup-link-btn:hover { opacity: 0.88; }

.peg-progress-wrap {
  width: 100%;
  max-width: 400px;
  height: 8px;
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
  margin: 0 auto 12px;
  overflow: hidden;
}

.peg-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 4px;
  transition: width 0.4s ease;
}

.peg-progress-label {
  font-size: 14px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 24px;
  letter-spacing: 0.04em;
}

.missing-list {
  text-align: left;
  max-width: 480px;
  margin: 0 auto 32px;
}

.missing-msg {
  margin-bottom: 12px;
  font-size: 16px;
  color: rgba(255,255,255,0.75);
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="progress-container">
  <div class="progress-bar" id="progressBar"></div>
</div>

<div class="slide-counter" id="slideCounter">1 / 1</div>

<button class="close-btn" onclick="exitSlideshow()" title="Exit">✕</button>

<div class="slideshow-container" id="slideshowContainer"></div>

<div class="controls" id="controls">
  <button class="control-btn" onclick="prevSlide()">‹ Prev</button>
  <button class="control-btn play-pause" id="playPauseBtn" onclick="togglePlayPause()">Pause</button>
  <button class="control-btn" onclick="nextSlide()">Next ›</button>
</div>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   PEGBOARD LOOP PLAYER — v2 with Decision Engine
   ══════════════════════════════════════════════════════════ */

const PEG_GROUP_FIELDS = {
  'Goal Clarity':       ['peg-01-goal-sentiment', 'peg-02-goal-deadline', 'peg-03-compelling-why'],
  'Mindset & Belief':   ['peg-04-belief-score', 'peg-05-belief-explanation'],
  'Planning Structure': ['peg-06-milestones', 'peg-07-obstacle-plan', 'peg-08-leading-indicators', 'peg-09-review-cadence'],
  'Behavior & Identity':['peg-10-friction-point', 'peg-11-environment-cue', 'peg-12-accountability', 'peg-13-recovery-action', 'peg-14-identity-statement', 'peg-15-early-win']
};

const ALL_PEG_KEYS = Object.values(PEG_GROUP_FIELDS).flat();

let slides = [];
let currentSlide = 0;
let isPlaying = true;
let slideTimer = null;

/* ── INITIALIZATION ─────────────────────────────────────── */

function init() {
  let raw;
  try { raw = localStorage.getItem('ci_pegboard'); } catch(e) {}
  if (!raw) { showEmptyState(); return; }

  let data;
  try { data = JSON.parse(raw); } catch(e) { showEmptyState(); return; }
  if (!data || typeof data !== 'object') { showEmptyState(); return; }

  // Run decision engine on unmodified data (needs real tracking values)
  const context = runDecisionEngine(data);

  if (context.isMissingData) {
    showMissingDataState(data, context);
    updateSessionTracking(data);
    return;
  }

  slides = generateSlidesFromData(data, context);
  generateSlides();
  showSlide(0);

  const name = data['pb-name'] || 'Friend';
  setTimeout(() => {
    speakText(getTones(context, name, data).opener);
  }, 1000);

  // Update tracking after decision engine has read the old values
  updateSessionTracking(data);
}

/* ── DECISION ENGINE ────────────────────────────────────── */

function runDecisionEngine(data) {
  const context = {
    mode: 'steady',
    beliefLevel: 'mid',
    isOnTrack: true,
    isMissingData: false,
    missingFields: [],
    recoveryNeeded: false,
    nextMilestone: null,
    reviewDue: false,
    sessionScore: null,
    planValidated: false,
    daysToDeadline: null
  };

  // STEP 1 — Gate: goal exists?
  if (!data['peg-01-goal-sentiment'] || !data['peg-02-goal-deadline']) {
    context.isMissingData = true;
    context.missingFields = getMissingRequiredFields(data);
    return context;
  }

  // STEP 2 — Enough filled?
  const fillPct = getCompletionPercent(data);
  if (fillPct < 0.4) {
    context.isMissingData = true;
    context.missingFields = getMissingRequiredFields(data);
    return context;
  }

  // STEP 3 — Belief score calibrates tone
  const belief = parseInt(data['peg-04-belief-score']) || 5;
  if (belief <= 3)      context.beliefLevel = 'low';
  else if (belief >= 8) context.beliefLevel = 'high';
  else                  context.beliefLevel = 'mid';

  // STEP 4 — Sprint or steady?
  const today = new Date();
  const deadline = parseDate(data['peg-02-goal-deadline']);
  if (deadline) {
    context.daysToDeadline = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
    const milestones = parseMilestones(data['peg-06-milestones']);
    context.nextMilestone = getNextMilestone(milestones, today);
    const nearMilestone = context.nextMilestone &&
      context.nextMilestone.daysAway !== null &&
      context.nextMilestone.daysAway <= 3;
    if (context.daysToDeadline <= 14 || nearMilestone) {
      context.mode = 'sprint';
    }
  }

  // STEP 5 — On track?
  const lastLogin = data['peg-last-login'] ? new Date(data['peg-last-login']) : null;
  const daysSinceLogin = lastLogin
    ? Math.floor((today - lastLogin) / (1000 * 60 * 60 * 24))
    : 0;
  const cadence = data['peg-09-review-cadence'] || 'weekly';
  const cadenceDays = cadence === 'daily' ? 1 : cadence === 'weekly' ? 7 : 30;
  if (daysSinceLogin > cadenceDays * 1.5) context.isOnTrack = false;

  // STEP 7 — Review due?
  context.reviewDue = daysSinceLogin >= cadenceDays;

  // STEP 8 — Recovery?
  const sessionsMissed = parseInt(data['peg-sessions-without-open']) || 0;
  if (daysSinceLogin >= 21 || sessionsMissed >= 6) {
    context.mode = 'recovery';
    context.recoveryNeeded = true;
  }

  // STEP 9 — Plan validated?
  context.planValidated = Boolean(
    data['peg-14-identity-statement'] && data['peg-01-goal-sentiment']
  );

  // STEP 10 — Session score
  context.sessionScore = belief;

  return context;
}

/* ── HELPERS ────────────────────────────────────────────── */

function getCompletionPercent(data) {
  const filled = ALL_PEG_KEYS.filter(k => data[k] && String(data[k]).trim()).length;
  return filled / ALL_PEG_KEYS.length;
}

function getMissingRequiredFields(data) {
  return ALL_PEG_KEYS.filter(k => !data[k] || !String(data[k]).trim());
}

function parseDate(val) {
  if (!val) return null;
  const d = new Date(val);
  return isNaN(d.getTime()) ? null : d;
}

function parseMilestones(val) {
  if (!val) return [];
  return val.split('\n').map(l => l.trim()).filter(Boolean);
}

function getNextMilestone(milestones, today) {
  if (!milestones.length) return null;
  for (const m of milestones) {
    const d = parseDate(m);
    if (d && d >= today) {
      return { text: m, daysAway: Math.ceil((d - today) / (1000 * 60 * 60 * 24)) };
    }
  }
  return { text: milestones[0], daysAway: null };
}

function getPreviousDay(dateStr) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() - 1);
  return d.toISOString().split('T')[0];
}

function getTones(context, name, data) {
  const days = context.daysToDeadline;
  return {
    recovery: {
      opener: `Welcome back, ${name}. You came back. That's what matters.`,
      closer: 'One step at a time. You know your why.'
    },
    sprint: {
      opener: `${name}. It's sprint time. ${days !== null ? days + ' days left.' : 'Deadline is close.'}`,
      closer: 'Lock in. You know what to do.'
    },
    steady: {
      opener: `Welcome, ${name}. Let's review your intentions.`,
      closer: 'Every day, you move closer to the person you decided to be.'
    }
  }[context.mode];
}

/* ── SLIDE GENERATION ───────────────────────────────────── */

function generateSlidesFromData(data, context) {
  const name = data['pb-name'] || 'Friend';
  const tones = getTones(context, name, data);
  if (context.mode === 'recovery') return buildRecoverySlides(data, context, name, tones);
  if (context.mode === 'sprint')   return buildSprintSlides(data, context, name, tones);
  return buildSteadySlides(data, context, name, tones);
}

function mkSlide(label, title, text, duration, voiceOver, list) {
  return {
    label,
    title,
    text: list ? undefined : text,
    list: list || undefined,
    duration: duration || 8000,
    voiceOver
  };
}

function mkListSlide(label, title, val, duration, voPrefix) {
  const lines = val.split('\n').filter(l => l.trim());
  if (lines.length > 1) {
    return mkSlide(label, title, null, duration, `${voPrefix}. ${lines.join('. ')}`, lines);
  }
  return mkSlide(label, title, val.trim(), duration, `${voPrefix}. ${val.trim()}`);
}

function buildRecoverySlides(data, context, name, tones) {
  const lastLogin = data['peg-last-login'];
  const daysAway = lastLogin
    ? Math.floor((new Date() - new Date(lastLogin)) / (1000 * 60 * 60 * 24))
    : null;
  const daysText = daysAway !== null
    ? `${daysAway} day${daysAway !== 1 ? 's' : ''} since your last session`
    : 'A while since your last session';

  const out = [mkSlide('Welcome Back', name, daysText, 7000, tones.opener)];

  if (data['peg-03-compelling-why'])
    out.push(mkSlide('Your Why', 'Why This Matters', data['peg-03-compelling-why'], 10000,
      `Your why. ${data['peg-03-compelling-why']}`));

  if (data['peg-14-identity-statement'])
    out.push(mkSlide('Identity', 'Who You Said You Are', data['peg-14-identity-statement'], 9000,
      `Identity statement. ${data['peg-14-identity-statement']}`));

  if (data['peg-13-recovery-action'])
    out.push(mkSlide('Recovery Action', 'What To Do Right Now', data['peg-13-recovery-action'], 9000,
      `Recovery action. ${data['peg-13-recovery-action']}`));

  if (context.nextMilestone)
    out.push(mkSlide('Next Milestone', 'Your Next Checkpoint', context.nextMilestone.text, 8000,
      `Next milestone. ${context.nextMilestone.text}`));

  out.push(mkSlide('Complete', 'You Came Back', "That's what matters.", 6000, tones.closer));
  return out;
}

function buildSprintSlides(data, context, name, tones) {
  const days = context.daysToDeadline;
  const daysText = days !== null
    ? `${days} day${days !== 1 ? 's' : ''} to deadline`
    : 'Deadline is close';

  const out = [mkSlide('Sprint Alert', 'Sprint Mode', daysText, 7000, tones.opener)];

  if (context.nextMilestone)
    out.push(mkSlide('Next Milestone', 'Focus Here', context.nextMilestone.text, 8000,
      `Next milestone. ${context.nextMilestone.text}`));

  if (data['peg-08-leading-indicators'])
    out.push(mkListSlide('Leading Indicators', 'Are Your Methods Working?',
      data['peg-08-leading-indicators'], 10000, 'Leading indicators'));

  if (data['peg-07-obstacle-plan'])
    out.push(mkSlide('Obstacle Plan', "Ready For What's Coming?", data['peg-07-obstacle-plan'], 9000,
      `Obstacle plan. ${data['peg-07-obstacle-plan']}`));

  const belief = parseInt(data['peg-04-belief-score']) || 5;
  out.push(mkSlide('Belief Score', 'Current Confidence', `${belief} out of 10`, 6000,
    `Current belief score. ${belief} out of 10.`));

  if (data['peg-15-early-win'])
    out.push(mkSlide('Early Win', 'Proof You Can Do This', data['peg-15-early-win'], 8000,
      `Early win. ${data['peg-15-early-win']}`));

  out.push(mkSlide('Sprint', 'Sprint Mode', 'You know what to do.', 5000, tones.closer));
  return out;
}

function buildSteadySlides(data, context, name, tones) {
  const out = [
    mkSlide('Pegboard Loop', name,
      data['peg-01-goal-sentiment'] || 'A review of your intentions.', 7000, tones.opener)
  ];

  if (data['peg-03-compelling-why'])
    out.push(mkSlide('Your Why', 'Compelling Why', data['peg-03-compelling-why'], 10000,
      `Your why. ${data['peg-03-compelling-why']}`));

  const belief = parseInt(data['peg-04-belief-score']) || 5;
  const beliefVO = `Belief score. ${belief} out of 10. ${data['peg-05-belief-explanation'] || ''}`;
  if (context.beliefLevel === 'low') {
    const items = [`Belief Score: ${belief} / 10`];
    if (data['peg-05-belief-explanation']) items.push(data['peg-05-belief-explanation']);
    out.push(mkSlide('Belief', 'Current Belief Level', null, 9000, beliefVO, items));
  } else {
    out.push(mkSlide('Belief', `Belief: ${belief} / 10`,
      data['peg-05-belief-explanation'] || 'Keep building.', 8000, beliefVO));
  }

  if (data['peg-06-milestones'])
    out.push(mkListSlide('Milestones', 'Your Checkpoints', data['peg-06-milestones'], 12000, 'Milestones'));

  if (context.reviewDue) {
    const cadence = data['peg-09-review-cadence'] || 'weekly';
    out.push(mkSlide('Review Due', 'Time to Review',
      `Your ${cadence} review is due. How are things going?`, 8000,
      `Your ${cadence} review is due.`));
  }

  if (data['peg-14-identity-statement'])
    out.push(mkSlide('Identity', "Who You're Becoming", data['peg-14-identity-statement'], 9000,
      `Identity statement. ${data['peg-14-identity-statement']}`));

  if (data['peg-12-accountability'])
    out.push(mkSlide('Accountability', 'Who Has Your Back', data['peg-12-accountability'], 8000,
      `Accountability. ${data['peg-12-accountability']}`));

  if (data['peg-11-environment-cue'])
    out.push(mkSlide('Environment', 'Your Trigger', data['peg-11-environment-cue'], 8000,
      `Environment cue. ${data['peg-11-environment-cue']}`));

  // HIGH BELIEF modifier — add leading indicators + obstacle plan
  if (context.beliefLevel === 'high') {
    if (data['peg-08-leading-indicators'])
      out.push(mkListSlide('Leading Indicators', 'Are Methods Working?',
        data['peg-08-leading-indicators'], 10000, 'Leading indicators'));
    if (data['peg-07-obstacle-plan'])
      out.push(mkSlide('Obstacle Plan', 'Stay Disciplined', data['peg-07-obstacle-plan'], 9000,
        `Obstacle plan. ${data['peg-07-obstacle-plan']}`));
  }

  // LOW BELIEF modifier — cap at 6, add extra Why, adjust closer tone
  if (context.beliefLevel === 'low') {
    const capped = out.slice(0, 5);
    if (data['peg-03-compelling-why'])
      capped.push(mkSlide('Your Why', 'Remember Why You Started', data['peg-03-compelling-why'],
        10000, `You don't have to feel ready. You just have to start. ${data['peg-03-compelling-why']}`));
    capped.push(mkSlide('Complete', "You Don't Have To Feel Ready", 'You just have to start.', 6000, tones.closer));
    return capped;
  }

  out.push(mkSlide('Complete', 'You Are Becoming', 'Every day, you move closer.', 6000, tones.closer));
  return out;
}

/* ── SESSION TRACKING ───────────────────────────────────── */

function updateSessionTracking(data) {
  const today = new Date().toISOString().split('T')[0];
  const lastLogin = data['peg-last-login'] || null;
  const lastDate = lastLogin ? lastLogin.split('T')[0] : null;

  data['peg-last-login'] = new Date().toISOString();

  if (lastDate === getPreviousDay(today)) {
    data['peg-login-streak'] = (parseInt(data['peg-login-streak']) || 0) + 1;
  } else if (lastDate !== today) {
    data['peg-login-streak'] = 1;
  }

  data['peg-sessions-without-open'] = 0;

  if (data['peg-04-belief-score']) {
    const history = JSON.parse(data['peg-belief-history'] || '[]');
    history.push({ date: today, score: parseInt(data['peg-04-belief-score']) });
    if (history.length > 30) history.shift();
    data['peg-belief-history'] = JSON.stringify(history);
  }

  localStorage.setItem('ci_pegboard', JSON.stringify(data));
}

/* ── MISSING DATA STATE ─────────────────────────────────── */

function showMissingDataState(data) {
  document.getElementById('controls').style.display = 'none';
  document.getElementById('slideCounter').style.display = 'none';

  const totalFilled = ALL_PEG_KEYS.filter(k => data[k] && String(data[k]).trim()).length;
  const pct = Math.round((totalFilled / ALL_PEG_KEYS.length) * 100);

  const msgs = [];
  if (PEG_GROUP_FIELDS['Goal Clarity'].some(k => !data[k] || !String(data[k]).trim()))
    msgs.push("Your goal isn't set up yet. Start with your Goal and Why.");
  if (PEG_GROUP_FIELDS['Mindset & Belief'].some(k => !data[k] || !String(data[k]).trim()))
    msgs.push('Add your Belief Score so CI can calibrate to where you are.');
  if (PEG_GROUP_FIELDS['Planning Structure'].some(k => !data[k] || !String(data[k]).trim()))
    msgs.push('Your plan structure is incomplete. Add Milestones and Obstacle Plan.');
  if (PEG_GROUP_FIELDS['Behavior & Identity'].some(k => !data[k] || !String(data[k]).trim()))
    msgs.push('Identity layer incomplete. These 6 fields make the system stick.');

  const msgHTML = msgs.map(m => `<div class="missing-msg">→ ${m}</div>`).join('');

  document.getElementById('slideshowContainer').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-title">PEG Board Incomplete</div>
      <div class="peg-progress-wrap">
        <div class="peg-progress-bar" style="width:${pct}%"></div>
      </div>
      <div class="peg-progress-label">${totalFilled} of ${ALL_PEG_KEYS.length} fields filled (${pct}%)</div>
      <div class="empty-state-text missing-list">${msgHTML}</div>
      <a class="setup-link-btn" href="../index.html">→ Complete Setup</a>
    </div>
  `;
}

/* ── SLIDE RENDERER ─────────────────────────────────────── */

function generateSlides() {
  const container = document.getElementById('slideshowContainer');
  container.innerHTML = '';

  slides.forEach((slide, index) => {
    const slideEl = document.createElement('div');
    slideEl.className = 'slide';
    slideEl.id = `slide-${index}`;

    if (slide.label) {
      const label = document.createElement('div');
      label.className = 'slide-label';
      label.textContent = slide.label;
      slideEl.appendChild(label);
    }

    const content = document.createElement('div');
    content.className = 'slide-content';

    if (slide.title) {
      const title = document.createElement('div');
      title.className = 'slide-title';
      title.textContent = slide.title;
      content.appendChild(title);
    }

    if (slide.text) {
      const text = document.createElement('div');
      text.className = 'slide-text';
      text.textContent = slide.text;
      content.appendChild(text);
    }

    if (slide.list) {
      const list = document.createElement('div');
      list.className = 'slide-list';
      slide.list.forEach(item => {
        const p = document.createElement('p');
        p.textContent = '• ' + item;
        p.style.marginBottom = '12px';
        list.appendChild(p);
      });
      content.appendChild(list);
    }

    slideEl.appendChild(content);
    container.appendChild(slideEl);
  });
}

function showSlide(index) {
  if (index < 0) index = 0;
  if (index >= slides.length) { endSession(); return; }

  currentSlide = index;
  const slide = slides[index];

  document.querySelectorAll('.slide').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });

  document.getElementById('slideCounter').textContent = `${index + 1} / ${slides.length}`;
  updateProgress(index + 1, slides.length, 'progressBar');

  if (slide.voiceOver) speakText(slide.voiceOver);

  if (isPlaying) {
    clearTimeout(slideTimer);
    slideTimer = setTimeout(() => showSlide(currentSlide + 1), slide.duration || 8000);
  }
}

function nextSlide() { clearTimeout(slideTimer); stopSpeech(); showSlide(currentSlide + 1); }
function prevSlide() { clearTimeout(slideTimer); stopSpeech(); showSlide(currentSlide - 1); }

function togglePlayPause() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('playPauseBtn');
  if (isPlaying) { btn.textContent = 'Pause'; showSlide(currentSlide); }
  else { btn.textContent = 'Play'; clearTimeout(slideTimer); stopSpeech(); }
}

function endSession() {
  isPlaying = false;
  clearTimeout(slideTimer);
  setTimeout(() => {
    speakText('Your pegboard loop is complete.');
    setTimeout(exitSlideshow, 3000);
  }, 1000);
}

function exitSlideshow() {
  stopSpeech();
  window.close();
  setTimeout(() => { window.location.href = '../index.html'; }, 300);
}

function showEmptyState() {
  document.getElementById('controls').style.display = 'none';
  document.getElementById('slideCounter').style.display = 'none';

  document.getElementById('slideshowContainer').innerHTML = `
    <div class="empty-state">
      <div class="empty-state-title">Master Identity Not Set Up</div>
      <div class="empty-state-text">
        Your Pegboard has no data yet. Set up your name, mission, values,
        and beliefs in the app first — then come back to run your loop.
      </div>
      <a class="setup-link-btn" href="../index.html">→ Go to Setup</a>
    </div>
  `;
}

window.addEventListener('DOMContentLoaded', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft')  prevSlide();
  if (e.key === 'ArrowRight') nextSlide();
  if (e.key === ' ')          { e.preventDefault(); togglePlayPause(); }
  if (e.key === 'Escape')     exitSlideshow();
});
</script>

</body>
</html>
