      }
      const meditationTimes=[1,2,3,5,10,15,30,45,60];let meditationMinutes=10,meditationMode='unguided',meditationSessionActive=false,meditationMenuOpen=false;
      let relaxationModuleEnabled=sessionStorage.getItem('ci-super-viz-relaxation-module')==='on',relaxationThenVisualization=false;
      const requestedCard=Number.parseInt(params.get('card'),10);
      let cardIndex;

        cardIndex=((requestedCard%entrepreneurCards.length)+entrepreneurCards.length)%entrepreneurCards.length;
      }else{
        let lastCardIndex=-1;

        const randomValue=globalThis.crypto?.getRandomValues
          ? globalThis.crypto.getRandomValues(new Uint32Array(1))[0]

        cardIndex=randomValue%entrepreneurCards.length;
        if(entrepreneurCards.length>1&&cardIndex===lastCardIndex)cardIndex=(cardIndex+1)%entrepreneurCards.length;
        try{sessionStorage.setItem('ci-last-ent-card',String(cardIndex))}catch(error){}

      let homeTroughColors={outer:'#000',inner:'#000'};
      function colorFromBucket(entry){
        const channel=value=>Math.round(value/entry.count).toString(16).padStart(2,'0');
        return '#'+channel(entry.r)+channel(entry.g)+channel(entry.b);
      }
      function applyTroughColors(){
        shell.style.setProperty('--header','#292929');
        shell.style.setProperty('--deck','#292929');
        shell.style.setProperty('--trough-fill','#747474');
        shell.style.setProperty('--trough-ink','#fff');
      }
      function matchTroughsToCard(img,rememberHome=false){
        try{
          const canvas=document.createElement('canvas');
          canvas.width=96;canvas.height=54;
          const context=canvas.getContext('2d',{willReadFrequently:true});
          context.drawImage(img,0,0,canvas.width,canvas.height);
          const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
          const edgeBuckets=new Map(),allBuckets=new Map();
          const addPixel=(buckets,offset)=>{
            const key=(pixels[offset]>>4)+','+(pixels[offset+1]>>4)+','+(pixels[offset+2]>>4);
            const entry=buckets.get(key)||{count:0,r:0,g:0,b:0};
            entry.count++;entry.r+=pixels[offset];entry.g+=pixels[offset+1];entry.b+=pixels[offset+2];
            buckets.set(key,entry);
          };
          for(let y=0;y<canvas.height;y++){
            for(let x=0;x<canvas.width;x++){
              const offset=(y*canvas.width+x)*4;
              if(pixels[offset+3]<220)continue;
              addPixel(allBuckets,offset);
              if(x<=4||x>=canvas.width-5||y<=4||y>=canvas.height-5)addPixel(edgeBuckets,offset);
            }
          }
          const outerEntry=[...edgeBuckets.values()].sort((a,b)=>b.count-a.count)[0];
          if(!outerEntry)throw new Error('No readable border pixels');
          const outerRgb=[outerEntry.r,outerEntry.g,outerEntry.b].map(value=>value/outerEntry.count);
          const innerEntry=[...allBuckets.values()]
            .filter(entry=>{
              const rgb=[entry.r,entry.g,entry.b].map(value=>value/entry.count);
              const max=Math.max(...rgb),min=Math.min(...rgb);
              const distance=Math.hypot(rgb[0]-outerRgb[0],rgb[1]-outerRgb[1],rgb[2]-outerRgb[2]);
              return !(min>224&&max>238)&&max>35&&distance>48;
            })
            .sort((a,b)=>b.count-a.count)[0]||outerEntry;
          const colors={outer:colorFromBucket(outerEntry),inner:colorFromBucket(innerEntry)};
          if(rememberHome)homeTroughColors=colors;
          applyTroughColors(colors.outer,colors.inner);
        }catch(error){
          const colors={outer:'#000',inner:'#000'};
          if(rememberHome)homeTroughColors=colors;
          applyTroughColors(colors.outer,colors.inner);
        }
      }
      const cardTitles={citadel:'Citadel',goals:'Goals','daily-habits':'Habits','action-plan':'Roadmap',visualization:'Visualize',meditation:'Meditate',favorites:'Favorites',gratitude:'Gratitude',journal:'Journal',thoughts:'Thoughts',wins:'Wins',proof:'Proof','cosmic-library':'Cosmic Library','quickie-move':'Quickie Move',admin:'Admin'};

      let selected=null,heightFrame=0;
      function reportHeight(){

      ];
      const notePages={home:'dashboard',citadel:'dashboard',goals:'setup','daily-habits':'habits','action-plan':'myroadmap',visualization:'vizlibrary','super-viz':'super-viz',favorites:'dailyfocus',gratitude:'gratitude',journal:'mynotes',thoughts:'notes',wins:'wins',proof:'proof','cosmic-library':'cosmiclibrary','entrepreneur-library':'entcard','ent-card':'entcard','task-notes':'tasknotes','goal-workspace':'goalworkspace','quickie-move':'entcard'};
      let citadelHomeVisible=false,notePage=null;
      {

      }
      function show(view){
        const nextPage=view===home?'dashboard':selected==='super-viz'&&params.get('reviewPage')==='new-gratitude'?'gratitude':notePages[selected]||null;
        const changedPage=nextPage!==notePage;
        notePage=nextPage;citadelHomeVisible=!!notePage;
        citadelNotes.forEach((note,index)=>{
          note.box.hidden=!citadelHomeVisible||!note.height;
          if(citadelHomeVisible&&(changedPage||!note.frame.getAttribute('src'))){
            note.height=0;note.box.hidden=false;note.box.classList.add('is-loading');
            const url=new URL(note.url,location.origin);url.searchParams.set('notePage',notePage);
            if(params.has('preview'))url.searchParams.set('preview','1');
            note.frame.title=notePage+' '+(index===0?'opening':'closing')+' administrator text';
            note.frame.src=url.pathname+url.search;
          }
        });
        shell.classList.toggle('home-mode',view===home);
        shell.classList.toggle('experience-mode',view===experience);
        [home,directoryView,experience].forEach(v=>v.hidden=v!==view);
        document.querySelectorAll('.nav[data-action]').forEach(n=>n.classList.toggle('active',n.dataset.action===selected));
        document.getElementById('lfmBack').hidden=view===home;
        reportHeight();
      }
      let meditationMenuAnimation=null;
      function setMeditationMenuOpen(open,fadeOut=false){
        if(shell.classList.contains("meditation-player-mode")&&window.CIMeditationDesign){meditationMenuOpen=open;window.CIMeditationDesign.setMenuOpen(open);return;}
        const opacity=Number.parseFloat(getComputedStyle(meditationMenu).opacity);
        if(meditationMenuAnimation){
          meditationMenuAnimation.cancel();
          meditationMenuAnimation=null;
        }
        meditationMenuOpen=open;
        meditationMenu.inert=!open;
        document.querySelector('[data-med-command="menu"]')?.setAttribute('aria-expanded',String(open));
        if(open){
          meditationMenu.hidden=false;
          reportHeight();
          return;
        }
        if(!fadeOut||meditationMenu.hidden||window.matchMedia('(prefers-reduced-motion: reduce)').matches){
          meditationMenu.hidden=true;
          reportHeight();
          return;
        }
        // Keep the options in place until the five-second fade has finished.
        const animation=meditationMenu.animate(
          [{opacity:Number.isFinite(opacity)?opacity:1},{opacity:0}],
          {duration:5000,easing:'linear',fill:'forwards'}
        );
        meditationMenuAnimation=animation;
        animation.finished.then(()=>{
          if(meditationMenuAnimation!==animation)return;
          meditationMenu.hidden=true;
          animation.cancel();
          meditationMenuAnimation=null;
          reportHeight();
        },()=>{});
      }
      function setMeditationMode(active){
        if(!active)meditationSessionActive=false;
        deck.classList.toggle('meditation-mode',active);
        deck.classList.toggle('meditation-session-active',active&&meditationSessionActive);
        shell.classList.toggle('meditation-player-mode',active);
        meditationControls.hidden=!active||!meditationSessionActive;
        setMeditationMenuOpen(active);
      }
      function notifyParentMode(action){
        try{parent.postMessage({type:'ci-lfm-mode',action:action},location.origin)}catch(_){}
      }
      let experienceObserver=null,experienceMutationObserver=null,settleTimer=0;
      function clearExperienceObservers(){
        if(experienceObserver){experienceObserver.disconnect();experienceObserver=null}
        if(experienceMutationObserver){experienceMutationObserver.disconnect();experienceMutationObserver=null}
        if(settleTimer){window.clearTimeout(settleTimer);settleTimer=0}
      }
      let stageTransitionId=0,stageAnimation=null,stageSurface=null;
      function currentVisualSurface(){
        if(!home.hidden)return home;
        if(!experience.hidden)return toolRotation.hidden?experienceFrame:toolRotation;
        return directoryView;
      }
      function isStaticPlayerImage(surface){
        return surface===home||surface===toolRotation||(surface===experienceFrame&&selected==='super-viz');
      }
      async function transitionStage(commit){
        const transitionId=++stageTransitionId;
        if(stageAnimation){stageAnimation.cancel();stageAnimation=null}
        if(stageSurface){
          stageSurface.style.opacity='';
          stageSurface.classList.remove('ci-visual-transition');
        }
        const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const fade=async(surface,from,to,duration)=>{
          stageSurface=surface;
          surface.classList.add('ci-visual-transition');
          stageAnimation=surface.animate([{opacity:from},{opacity:to}],{duration,easing:'ease',fill:'both'});
          try{await stageAnimation.finished}catch(_){return false}
          return transitionId===stageTransitionId;
        };
        try{
          const outgoingSurface=currentVisualSurface();
          if(!reduced&&!isStaticPlayerImage(outgoingSurface)&&!await fade(outgoingSurface,1,0,250))return;
          const outgoing=stageSurface||outgoingSurface;
          const ready=commit();
          const incoming=currentVisualSurface();
          if(stageAnimation){stageAnimation.cancel();stageAnimation=null}
          if(outgoing&&outgoing!==incoming)outgoing.classList.remove('ci-visual-transition');
          stageSurface=incoming;
          incoming.classList.add('ci-visual-transition');
          const staticImage=isStaticPlayerImage(incoming);
          incoming.style.opacity=reduced||staticImage?'1':'0';
          let readyTimeout;
          try{await Promise.race([Promise.resolve(ready),new Promise(resolve=>{readyTimeout=window.setTimeout(resolve,8000)})])}
          finally{window.clearTimeout(readyTimeout)}
          if(transitionId!==stageTransitionId)return;
          fitExperience();
          if(!reduced&&!staticImage)await fade(incoming,0,1,580);
        }finally{
          if(transitionId===stageTransitionId){
            if(stageSurface){
              stageSurface.style.opacity='';
              stageSurface.classList.remove('ci-visual-transition');
            }
            if(stageAnimation)stageAnimation.cancel();
            stageAnimation=null;stageSurface=null;
            reportHeight();
          }
        }
      }
      function applyHomeMode(){
        notifyParentMode('home');
        selected=null;dockDeck();shell.classList.remove('daily-habits-mode','goals-mode','three-button-nav-mode','lfm-shared-frame-mode');deck.classList.remove('compact-trough-mode','lfm-tool-mode','workspace-trough-hidden','ent-card-trough');toolRotation.hidden=true;setMeditationMode(false);clearExperienceObservers();experienceFrame.src='about:blank';experienceFrame.style.height='600px';shell.style.setProperty('--frame','#292929');shell.style.setProperty('--paper','#f2ede7');applyTroughColors(homeTroughColors.outer,homeTroughColors.inner);cap.textContent="";show(home);
      }
      function homeMode(){transitionStage(applyHomeMode)}
      function visibleContentHeight(root){
        const view=root.ownerDocument.defaultView;
        const scrollTop=view?view.scrollY:0;
        const rootTop=root.getBoundingClientRect().top+scrollTop;
        let bottom=rootTop;
        root.querySelectorAll('*').forEach(el=>{
          const style=getComputedStyle(el);
          if(style.display==='none'||style.visibility==='hidden'||style.opacity==='0'||style.position==='fixed')return;
          const rect=el.getBoundingClientRect();
          if(rect.width<=0||rect.height<=0)return;
          bottom=Math.max(bottom,rect.bottom+scrollTop);
        });
        const paddingBottom=parseFloat(getComputedStyle(root).paddingBottom)||0;
        return Math.ceil(Math.max(1,root.scrollHeight,bottom-rootTop+paddingBottom));
      }
      function fitExperience(){
        if(!selected)return;
        if(selected==='super-viz'){
          deck.style.setProperty('--meditation-side-border',(experienceFrame.clientWidth*35/1920)+'px');
          experienceFrame.style.height=(experienceFrame.clientWidth*9/16)+'px';
          reportHeight();
          return;
        }
        try{
          const doc=experienceFrame.contentDocument;
          if(!doc)return;
          const active=doc.querySelector('.page.active, main, [role="main"]');
          if(!active)return;
          const height=Math.max(180,selected==='cosmic-library'?active.scrollHeight:visibleContentHeight(active));
          if(height>0&&Math.abs(height-experienceFrame.offsetHeight)>2){
            experienceFrame.style.height=height+'px';
          }
        }catch(_){}
        reportHeight();
      }
      experienceFrame.addEventListener('load',()=>{
        clearExperienceObservers();
        [80,250,600,1200,2500,5000].forEach(delay=>window.setTimeout(fitExperience,delay));
        window.setTimeout(()=>{
          fitExperience();
          if(selected==='super-viz')return;
          try{
            const doc=experienceFrame.contentDocument;
            const active=doc&&doc.querySelector('.page.active, main, [role="main"]');
            if(!active)return;
            if('ResizeObserver'in window){
              experienceObserver=new ResizeObserver(()=>fitExperience());
              const resizeTargets=[active];
              resizeTargets.filter(Boolean).forEach(node=>experienceObserver.observe(node));
            }
            if('MutationObserver'in window){
              experienceMutationObserver=new MutationObserver(()=>{
                fitExperience();
                if(settleTimer)window.clearTimeout(settleTimer);
                settleTimer=window.setTimeout(fitExperience,120);
              });
              experienceMutationObserver.observe(active,{subtree:true,childList:true,characterData:true,attributes:true});
            }
          }catch(_){}
        },350);
      });
      function destinationUrl(action){
        if(action==='super-viz')return '/players/super-viz.html?v=lfm-16x9-1&t='+meditationMinutes+'&mode='+meditationMode+'&external=1';
        const url=new URL('/',location.origin);
        url.searchParams.set('masterInline',action);
        url.searchParams.set('lfm','fullheight-1');
        url.searchParams.set('playerNotes','1');
        if(Number.isInteger(goalIndex))url.searchParams.set('goal',String(goalIndex));
        if(action==='ent-card'&&entCardKey)url.searchParams.set('ent',entCardKey);
        return url.pathname+url.search;
      }
      function applySelection(action){
        deck.classList.toggle('ent-card-trough',action==='ent-card');
        if(action==='citadel'){
          applyHomeMode();
          cap.textContent="";
          notifyParentMode('citadel');
          reportHeight();
          return;
        } // Safety: never embed Citadel inside its own LFM shell.
        notifyParentMode(action);
        if(action==='everything'){selected='everything';dockDeck();shell.classList.remove('daily-habits-mode','goals-mode','three-button-nav-mode','lfm-shared-frame-mode');deck.classList.remove('compact-trough-mode','lfm-tool-mode','workspace-trough-hidden');toolRotation.hidden=true;cap.textContent='Cosmic Intentions Dashboard';show(directoryView);return}
        const item=items.find(i=>i[0]===action); if(!item)return;
        selected=action;
        const usesLfmTemplate=lfmTemplateActions.has(action);
        deck.classList.toggle('workspace-trough-hidden',pagesWithoutLowerTrough.has(action));
        dockDeck();
        shell.classList.toggle('daily-habits-mode',action==='daily-habits');
        shell.classList.toggle('goals-mode',action==='goals');
        shell.classList.toggle('three-button-nav-mode',['daily-habits','goals','visualization','action-plan','cosmic-library'].includes(action));
        shell.classList.toggle('lfm-shared-frame-mode',usesLfmTemplate);
        deck.classList.toggle('compact-trough-mode',usesLfmTemplate);
        deck.classList.toggle('lfm-tool-mode',usesLfmTemplate);
        toolRotation.hidden=!usesLfmTemplate||['task-notes','goal-workspace','entrepreneur-library','ent-card'].includes(action);
        const cardReady=usesLfmTemplate&&!['task-notes','goal-workspace','entrepreneur-library','ent-card'].includes(action)?setToolCard(action):Promise.resolve();
        setMeditationMode(action==='super-viz');
        const paletteIndex=Number.isInteger(goalIndex)&&goalIndex>=0?goalIndex:0;
        shell.style.setProperty('--frame','#292929');
        shell.style.setProperty('--paper',action==='daily-habits'?'#5f645e':'#f2ede7');
        clearExperienceObservers();
        cap.textContent=usesLfmTemplate&&!['entrepreneur-library','ent-card'].includes(action)?'':(action==='entrepreneur-library'?'Cosmic Library':(action==='daily-habits'?'Habits':item[1]));
        experienceFrame.title=item[1];
        experienceFrame.style.height=action==='super-viz'?(stage.clientWidth*9/16)+'px':'600px';
        const nextUrl=destinationUrl(action);
        const frameReady=new Promise(resolve=>{
          let settled=false;
          const done=()=>{
            if(settled)return;
            settled=true;
            window.clearTimeout(timeout);
            experienceFrame.removeEventListener('load',done);
            resolve();
          };
          const timeout=window.setTimeout(done,8000);
          experienceFrame.addEventListener('load',done,{once:true});
        });
        experienceFrame.src=nextUrl;show(experience);
        return Promise.all([frameReady,cardReady]);
      }
      function select(action){
        if(action==='visualization'&&relaxationModuleEnabled&&!relaxationThenVisualization){
          relaxationThenVisualization=true;
          transitionStage(()=>Promise.resolve(applySelection('super-viz')).then(()=>sendMeditation('toggle')));
          return;
        }
        transitionStage(()=>applySelection(action));
      }
      function syncMeditationUI(){
        document.querySelectorAll('[data-med-time]').forEach(b=>b.classList.toggle('active',Number(b.dataset.medTime)===meditationMinutes));
        document.querySelectorAll('[data-med-mode]').forEach(b=>b.classList.toggle('active',b.dataset.medMode===meditationMode));
        const modeIcon=document.getElementById('medModeIcon');
        const modeLabel=document.getElementById('medModeLabel');
        if(modeIcon)modeIcon.textContent=meditationMode==='guided'?'G':meditationMode==='lightly-guided'?'L':'U';
        if(modeLabel)modeLabel.textContent=meditationMode==='guided'?'Guided':meditationMode==='lightly-guided'?'Lightly Guided':'Unguided';
        const guidanceNote=document.getElementById('guidedNote');
        guidanceNote.hidden=false;
        guidanceNote.textContent=meditationMode==='unguided'?'Visualization with opening and closing bells.':'Temporary visualization guidance uses your browser voice. Final visualization scripts are pending.';
        const relaxationToggle=document.querySelector('[data-relaxation-toggle]');
        if(relaxationToggle){
          relaxationToggle.setAttribute('aria-pressed',String(relaxationModuleEnabled));
          relaxationToggle.setAttribute('aria-label','Relaxation Module '+(relaxationModuleEnabled?'on':'off'));
        }
      }
      function reloadMeditation(){experienceFrame.src=destinationUrl('super-viz');syncMeditationUI()}
      function sendMeditation(command,extra={}){experienceFrame.contentWindow?.postMessage({type:'ci-meditation-command',command,...extra},location.origin)}
      const siteMenuButton=document.getElementById('siteMenuButton');
      const standaloneSiteMenu=document.getElementById('standaloneSiteMenu');
      if(parent===window){
        siteMenuButton.setAttribute('aria-controls','standaloneSiteMenu');
        siteMenuButton.setAttribute('aria-expanded','false');
        const siteChoices=[
          ['citadel','Citadel'],['goals','Goals'],['daily-habits','Habits'],
          ['favorites','My Favorites Autoplay'],['thoughts','My Thoughts'],
          ['journal','My Journal'],['action-plan','Roadmap'],
          ['visualization','Visualization Library'],['super-viz','Super Viz'],
          ['gratitude','Gratitude'],['cosmic-library','Cosmic Library'],['entrepreneur-library','Entrepreneur Library'],['ent-card','Entrepreneur Skill Cards'],['wins','My Wins'],['task-notes','Notes'],['goal-workspace','Goal Workspace'],['admin','Admin']
        ];
        siteChoices.forEach(([action,label])=>{
          const button=document.createElement('button');
          button.type='button';
          button.textContent=label;
          button.addEventListener('click',()=>{
            standaloneSiteMenu.hidePopover();
            siteMenuButton.focus();
            select(action);
          });
          standaloneSiteMenu.appendChild(button);
        });
        [['/landing','Landing Page 1'],['/landing-v2','Landing Page 2'],['/landing-v3','Landing Page 3'],['/about','About Us']].forEach(([href,label])=>{
          const link=document.createElement('a');
          link.href=href;link.textContent=label;link.target='_blank';link.rel='noopener';
          link.addEventListener('click',()=>standaloneSiteMenu.hidePopover());
          standaloneSiteMenu.appendChild(link);
        });
        standaloneSiteMenu.addEventListener('toggle',event=>{
          const open=event.newState==='open';
          siteMenuButton.setAttribute('aria-expanded',String(open));
          siteMenuButton.setAttribute('aria-label',open?'Close site menu':'Open site menu');
        });
      }
      siteMenuButton.addEventListener('click',event=>{
        event.stopPropagation();
        if(parent===window){standaloneSiteMenu.togglePopover();return}
        try{parent.postMessage({type:'ci-site-menu-toggle'},location.origin)}catch(_){}
      });
      document.getElementById('medProgress').addEventListener('click',event=>{
        const rect=event.currentTarget.querySelector('.med-progress-track').getBoundingClientRect();
        const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
        sendMeditation('seek',{ratio});
      });
      document.querySelectorAll('[data-lfm-mini-command]').forEach(button=>button.addEventListener('click',()=>{
        const command=button.dataset.lfmMiniCommand;
        if(command==='menu'){select('everything');return}
        const current=Math.max(0,items.findIndex(item=>item[0]===selected));
        const step=command==='back'?-1:1;
        select(items[(current+step+items.length)%items.length][0]);
      }));
      document.querySelectorAll('[data-med-command]').forEach(button=>button.addEventListener('click',()=>{
        const command=button.dataset.medCommand;
        if(command==='back'){homeMode();return}
        if(command==='menu'){if(shell.classList.contains('meditation-player-mode')&&window.CIMeditationDesign){window.CIMeditationDesign.toggleMenu();return}setMeditationMenuOpen(!meditationMenuOpen,true);return}
        if(command==='toggle'){sendMeditation('toggle');return}
        if(command==='mode'){meditationMode=['unguided','guided'][(['unguided','guided'].indexOf(meditationMode)+1)%2];reloadMeditation();return}
        const index=meditationTimes.indexOf(meditationMinutes);
        if(command==='shorter'&&index>0){meditationMinutes=meditationTimes[index-1];reloadMeditation()}
        if(command==='longer'&&index<meditationTimes.length-1){meditationMinutes=meditationTimes[index+1];reloadMeditation()}
      }));
      document.querySelectorAll('[data-med-time]').forEach(button=>button.addEventListener('click',()=>{meditationMinutes=Number(button.dataset.medTime);reloadMeditation()}));
      document.querySelector('[data-relaxation-toggle]')?.addEventListener('click',event=>{
        relaxationModuleEnabled=!relaxationModuleEnabled;
        sessionStorage.setItem('ci-super-viz-relaxation-module',relaxationModuleEnabled?'on':'off');
        syncMeditationUI();
        event.currentTarget.focus();
      });
      document.querySelectorAll('[data-med-mode]').forEach(button=>button.addEventListener('click',()=>{meditationMode=button.dataset.medMode;reloadMeditation()}));
      addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==parent)return;
        const data=event.data||{};
        if(data.type==='ci-lfm-select'&&data.action){if(data.action==='goal-workspace')goalIndex=Number.isInteger(data.goalIndex)?data.goalIndex:null;if(data.action==='ent-card'&&typeof data.entKey==='string'&&/^[A-Z][A-Z ]{1,40}$/.test(data.entKey))entCardKey=data.entKey;if(data.action==='home')homeMode();else select(data.action);return}
        if(data.type==='ci-lfm-guide-command'){
          if(data.command==='back'){homeMode();return}
          if(data.command==='menu'){select('everything');return}
          if(data.command==='forward'){
            const current=Math.max(0,items.findIndex(item=>item[0]===selected));
            select(items[(current+1)%items.length][0]);
          }
        }
      });
      addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==experienceFrame.contentWindow)return;
        const data=event.data||{};
        if(data.type==='ci-open-goal-branch'&&
           ['visualization','action-plan'].includes(data.action)&&
           Number.isInteger(data.goalIndex)&&data.goalIndex>=0){
          goalIndex=data.goalIndex;
          select(data.action);
          return;
        }
        if(data.type==='ci-open-ent-card'&&typeof data.key==='string'&&/^[A-Z][A-Z ]{1,40}$/.test(data.key)){
          entCardKey=data.key;
          select('ent-card');
          return;
        }
        if(data.type==='ci-open-entrepreneur-library'){
          select('entrepreneur-library');
          return;
        }
        if(data.type==='ci-open-goal-workspace'){
          goalIndex=Number.isInteger(data.goalIndex)&&data.goalIndex>=0?data.goalIndex:null;
          select('goal-workspace');return;
        }
        if(data.type==='ci-lfm-mini-nav'){
          if(data.command==='menu'){select('everything');return}
          const current=Math.max(0,items.findIndex(item=>item[0]===selected));
          const step=data.command==='back'?-1:1;
          select(items[(current+step+items.length)%items.length][0]);
          return;
        }
        if(data.type!=='ci-meditation-state')return;
        if(data.state==='complete'&&relaxationThenVisualization){
          relaxationThenVisualization=false;
          transitionStage(()=>applySelection('visualization'));
          return;
        }
        const sessionActive=data.state!=='ready';
        if(sessionActive!==meditationSessionActive){
          meditationSessionActive=sessionActive;
          deck.classList.toggle('meditation-session-active',sessionActive);
          meditationControls.hidden=!sessionActive;
          setMeditationMenuOpen(sessionActive?false:meditationMenuOpen);
        }
        const running=data.state==='running';
        const remaining=Math.max(0,Number(data.remaining)||0);
        const total=Math.max(1,(Number(data.minutes)||meditationMinutes)*60000);
        const wholeSeconds=Math.max(0,Math.ceil(remaining/1000));
        const mm=Math.floor(wholeSeconds/60),ss=wholeSeconds%60;
        document.getElementById('medCountdown').textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
        document.getElementById('medProgressFill').style.width=(Math.max(0,Math.min(1,1-remaining/total))*100)+'%';
        const playIcon=document.getElementById('medPlayIcon');
        const playLabel=document.getElementById('medPlayLabel');
        if(playIcon)playIcon.textContent=running?'Ⅱ':'▶';
        if(playLabel)playLabel.textContent=running?'Pause':data.state==='paused'?'Resume':'Play';
      });
      syncMeditationUI();
      const grid=document.getElementById('directory');
      items.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+label+'</span><span aria-hidden="true">›</span>';b.addEventListener('click',()=>select(key));grid.appendChild(b)});
      document.querySelectorAll('.nav[data-action]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.action)));
      document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',homeMode));
      document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>select('everything')));
      addEventListener('resize',()=>{fitExperience();reportHeight()});
      if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(shell);
      const initialAction=params.get('start');
      if(initialAction&&items.some(item=>item[0]===initialAction))applySelection(initialAction);
      else show(home);
      reportHeight();
      window.setTimeout(reportHeight,120);
      window.setTimeout(reportHeight,600);
    })();
  </script>
