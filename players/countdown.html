<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Countdown Timer | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── IDLE SCREEN ──────────────────────────────────────── */
.idle-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 32px;
  opacity: 1;
  transition: opacity 0.4s ease;
}
.idle-screen.hidden { opacity: 0; pointer-events: none; }

.timer-title {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #FFF;
}

.duration-buttons {
  display: flex;
  gap: 16px;
}

.duration-btn {
  padding: 20px 40px;
  font-size: 18px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  color: #FFF;
  cursor: pointer;
  transition: all 0.2s;
}
.duration-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.5);
  transform: translateY(-2px);
}
.duration-btn.selected {
  background: rgba(255,255,255,0.3);
  border-color: #FFF;
}

.begin-btn {
  padding: 18px 60px;
  font-size: 20px;
  font-weight: 700;
  background: #FFF;
  color: #000;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
  margin-top: 16px;
}
.begin-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 24px rgba(255,255,255,0.3);
}

/* ── ACTIVE SCREEN ────────────────────────────────────── */
.active-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
.active-screen.visible {
  opacity: 1;
  pointer-events: all;
}

.breathing-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin-bottom: 60px;
}

.breathing-ring {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 2px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  animation: breathe 6s ease-in-out infinite;
}
.breathing-ring:nth-child(2) {
  animation-delay: -3s;
  border-color: rgba(255,255,255,0.2);
}

@keyframes breathe {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
  50%      { transform: translate(-50%, -50%) scale(1.4); opacity: 0.1; }
}

.countdown-number {
  font-size: 120px;
  font-weight: 700;
  color: #FFF;
  transition: all 0.3s;
  text-align: center;
  min-width: 200px;
}
.countdown-number.ending {
  color: #C9A96E;
  text-shadow: 0 0 40px rgba(201, 169, 110, 0.6);
}

.countdown-label {
  font-size: 18px;
  color: rgba(255,255,255,0.6);
  margin-top: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ── END SCREEN ───────────────────────────────────────── */
.end-screen {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 32px;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
.end-screen.visible {
  opacity: 1;
  pointer-events: all;
}

.end-message {
  font-size: 28px;
  font-weight: 500;
  color: #FFF;
  text-align: center;
  max-width: 600px;
  line-height: 1.6;
}

.reset-btn {
  padding: 16px 48px;
  font-size: 18px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 12px;
  color: #FFF;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 24px;
}
.reset-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: #FFF;
}

/* ── CLOSE BUTTON ─────────────────────────────────────── */
.close-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  width: 44px;
  height: 44px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  color: #FFF;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 1000;
}
.close-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}
</style>
</head>
<body>

<!-- IDLE SCREEN -->
<div class="idle-screen" id="idleScreen">
  <div class="timer-title">Simple Countdown Timer</div>
  
  <div class="duration-buttons">
    <button class="duration-btn" data-duration="15">15 seconds</button>
    <button class="duration-btn selected" data-duration="30">30 seconds</button>
    <button class="duration-btn" data-duration="60">60 seconds</button>
  </div>
  
  <button class="begin-btn" onclick="startSession()">Begin</button>
</div>

<!-- ACTIVE SCREEN -->
<div class="active-screen" id="activeScreen">
  <div class="breathing-container">
    <div class="breathing-ring"></div>
    <div class="breathing-ring"></div>
  </div>
  
  <div class="countdown-number" id="countdownNum">60</div>
  <div class="countdown-label">seconds remaining</div>
</div>

<!-- END SCREEN -->
<div class="end-screen" id="endScreen">
  <div class="end-message">Open your eyes and proceed.</div>
  <button class="reset-btn" onclick="resetSession()">Begin Again</button>
</div>

<!-- CLOSE BUTTON -->
<button class="close-btn" onclick="window.close()" title="Close">✕</button>

<script src="../shared/player-core.js"></script>
<script>
let selectedDuration = 30;
let countdown = null;
let countdownInterval = null;

/* ── DURATION SELECTION ─────────────────────────────────── */
document.querySelectorAll('.duration-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.duration-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDuration = parseInt(btn.dataset.duration);
  });
});

/* ── START SESSION ──────────────────────────────────────── */
function startSession() {
  // Hide idle screen
  document.getElementById('idleScreen').classList.add('hidden');
  
  // Speak opening instruction
  speakText("Close your eyes and begin.");
  
  // Show active screen after 1 second
  setTimeout(() => {
    document.getElementById('activeScreen').classList.add('visible');
    startCountdown();
  }, 1000);
}

/* ── COUNTDOWN LOGIC ────────────────────────────────────── */
function startCountdown() {
  countdown = selectedDuration;
  updateCountdownDisplay();
  
  countdownInterval = setInterval(() => {
    countdown--;
    updateCountdownDisplay();
    
    // Ending state
    if (countdown <= 5 && countdown > 0) {
      document.getElementById('countdownNum').classList.add('ending');
    }
    
    // End session
    if (countdown <= 0) {
      clearInterval(countdownInterval);
      endSession();
    }
  }, 1000);
}

function updateCountdownDisplay() {
  document.getElementById('countdownNum').textContent = countdown;
}

/* ── END SESSION ────────────────────────────────────────── */
function endSession() {
  // Play bell
  playBell();
  
  // Hide active screen
  document.getElementById('activeScreen').classList.remove('visible');
  
  // Show end screen with VO
  setTimeout(() => {
    document.getElementById('endScreen').classList.add('visible');
    speakText("Open your eyes and proceed.");
  }, 1000);
}

/* ── RESET ──────────────────────────────────────────────── */
function resetSession() {
  // Hide end screen
  document.getElementById('endScreen').classList.remove('visible');
  
  // Reset countdown number styling
  document.getElementById('countdownNum').classList.remove('ending');
  
  // Show idle screen
  setTimeout(() => {
    document.getElementById('idleScreen').classList.remove('hidden');
  }, 400);
}
</script>

</body>
</html>
