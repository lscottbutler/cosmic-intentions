<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Minute Visualization | Cosmic Intentions</title>
  <style>
    :root { --pink:#bf4170; --maroon:#6e1614; --ink:#2b2b2b; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:#0c0810; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; overflow:hidden;
      font-family:'Courier New','Roboto Mono',monospace; }
    .stage { position:relative; width:min(96vw, 92vh * 16 / 9); aspect-ratio:16/9; background:#fff; border:14px solid var(--pink); overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.5); }
    .scene { position:absolute; inset:0; }

    #logo { z-index:5; background:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .8s ease; }
    #logo img { width:42%; max-height:82%; object-fit:contain; }

    #split { z-index:2; display:flex; opacity:0; transition:opacity .5s ease; }
    .colA { position:relative; flex:1 1 auto; background:#fff; display:flex; align-items:center; justify-content:center; padding:5% 6%; overflow:hidden; transition:background .8s ease; }
    .colA.dark { background:#262626; }
    .colA.dark .card { color:#f3f3f3; }
    .post { flex:0 0 14px; background:var(--pink); }
    .colB { position:relative; flex:0 0 40%; background:url('../images/visualization/manifest-skull.jpg') center/cover no-repeat; filter:blur(16px); transition:filter 1.2s ease; }
    .colB.sharp { filter:blur(0); }

    .badge { position:absolute; border:4px solid var(--pink); border-radius:9px; background:#fff; padding:10px 20px; text-align:center; line-height:1.15; font-weight:800; letter-spacing:3px; color:#333; opacity:0; transform:scale(.2); transition:opacity .6s ease; }
    .badge .m { color:var(--pink); }
    .badge.reveal { animation:zoomin .9s cubic-bezier(.16,.84,.3,1) both; }
    @keyframes zoomin { from { opacity:0; transform:scale(.2);} 70%{opacity:1;} to { opacity:1; transform:scale(1);} }
    .card { position:absolute; max-width:90%; text-align:center; color:var(--maroon); text-transform:uppercase; letter-spacing:.07em; font-weight:700; line-height:1.5; font-size:clamp(13px,2.1vw,27px); opacity:0; transition:opacity .8s ease; }
    .card .iam { display:block; color:var(--pink); font-style:italic; font-weight:800; letter-spacing:.12em; margin-bottom:.4em; }

    #nav { position:absolute; left:calc(50% - 7%); bottom:-2px; transform:translateY(50%); z-index:6; width:14%; aspect-ratio:1; border-radius:50%;
      background:#fff; border:5px solid var(--pink); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .8s ease;
      color:var(--ink); font-weight:700; font-size:clamp(16px,2.6vw,34px); box-shadow:0 2px 10px rgba(0,0,0,.3); }
    #nav svg { width:54%; height:54%; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    #navNum { display:none; }

    .controls { display:flex; align-items:center; gap:26px; }
    .cbtn { background:none; border:none; color:#cfcfcf; font-size:1.3rem; cursor:pointer; line-height:1; padding:6px; }
    .play { background:var(--pink); color:#fff; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:0 2px 8px rgba(0,0,0,.5); }
    .menu { position:absolute; left:50%; transform:translateX(-50%); bottom:62px; background:#111; border:1px solid #333; border-radius:10px; overflow:hidden; z-index:9; }
    .menu.hidden { display:none; }
    .menu button { display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:11px 20px; font-size:13px; cursor:pointer; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="split">
      <div class="colA" id="colA">
        <div class="badge" id="badge"><span class="m">3 MIN</span><br>MANIFEST</div>
        <p class="card" id="card"></p>
      </div>
      <div class="post"></div>
      <div class="colB" id="colB"></div>
    </div>
    <div class="scene" id="logo"><img src="../images/clip-art/blue-hair-logo.png" alt="Cosmic Intentions"></div>
    <div id="nav"><svg id="navIcon" viewBox="0 0 24 24"></svg><span id="navNum"></span></div>
  </div>
  <div class="menu hidden" id="menu"><button id="mHome">Home page</button><button id="mPeg">My Pegboard</button></div>
  <div class="controls">
    <button class="cbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
  </div>

  <script>
    const goal = (new URLSearchParams(location.search).get('g') || localStorage.getItem('ci_goal_title')
      || 'I am the proud owner of a successful online business with 1000 subscribers').trim();
    const logo=document.getElementById('logo'), split=document.getElementById('split'),
          colA=document.getElementById('colA'), colB=document.getElementById('colB'),
          badge=document.getElementById('badge'), card=document.getElementById('card'),
          nav=document.getElementById('nav'), navIcon=document.getElementById('navIcon'),
          navNum=document.getElementById('navNum'), playBtn=document.getElementById('play');
    const ICON = {
      eyeOpen:  '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/>',
      eyeClosed:'<path d="M3 10c2.6 4 6.4 5 9 5s6.4-1 9-5"/><path d="M5 14l-1 2M19 14l1 2M12 16v2.2"/>',
      bell:     '<path d="M12 4a4 4 0 00-4 4v3l-1.6 2.6h11.2L16 11V8a4 4 0 00-4-4z"/><path d="M10.4 17.6a1.6 1.6 0 003.2 0"/>',
      rocket:   '<path d="M12 3c2.5 2 3.6 5.6 3.6 8.6L14 16h-4l-1.6-4.4C8.4 8.6 9.5 5 12 3z"/><circle cx="12" cy="9" r="1.3"/><path d="M9 16l-2.2 3.2 2.7-.9M15 16l2.2 3.2-2.7-.9"/>'
    };
    function navShowIcon(name){ navNum.style.display='none'; navIcon.style.display=''; navIcon.innerHTML=ICON[name]||''; }
    function navShowNum(n){ navIcon.style.display='none'; navNum.style.display=''; navNum.textContent=n; }

    function chime3(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
      [660,880,1175].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+i*0.16; o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.35,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.55); o.connect(g).connect(c.destination); o.start(s); o.stop(s+.6); }); }catch(e){} }
    function bell(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(),n=c.currentTime;
      [880,1320].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),s=n+i*0.16; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.4,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+2.2); o.connect(g).connect(c.destination); o.start(s); o.stop(s+2.3); }); }catch(e){} }

    const VOICE='shimmer', CACHE='ci_vizmod_vo';
    const rc=()=>{try{return JSON.parse(localStorage.getItem(CACHE)||'{}');}catch(e){return{};}};
    const wc=(o)=>{try{localStorage.setItem(CACHE,JSON.stringify(o));}catch(e){}};
    const hash=(s)=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h.toString(36);};
    async function tts(text){ const k=hash(VOICE+'|'+text), c=rc(); if(c[k])return new Audio('data:audio/mpeg;base64,'+c[k]);
      try{ const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.slice(0,160),voice:VOICE})}); if(!r.ok)throw 0; const {audio}=await r.json(); c[k]=audio; wc(c); return new Audio('data:audio/mpeg;base64,'+audio);}catch(e){return null;} }
    const VO={}; function playVO(k){ const a=VO[k]; if(a){try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}} }

    function setCard(html){ card.style.opacity='0'; setTimeout(()=>{ card.innerHTML=html; card.style.opacity='1'; },120); }
    function fadeCard(){ card.style.opacity='0'; }

    function closePlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.closePlayerColumn){window.parent.closePlayerColumn();return;} }catch(e){} if(history.length>1)history.back(); else window.close(); }
    function nv(t){ try{ if(window.parent&&window.parent!==window){ if(window.parent.closePlayerColumn)window.parent.closePlayerColumn(); if(window.parent.navTo){window.parent.navTo(t);return;} } }catch(e){} location.href='/'; }
    function finishPlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.playerFinished){window.parent.playerFinished();return;} }catch(e){} closePlayer(); }
    const menu=document.getElementById('menu'), menuBtn=document.getElementById('menuBtn');
    menuBtn.onclick=(e)=>{e.stopPropagation();menu.classList.toggle('hidden');};
    document.addEventListener('click',(e)=>{ if(!menu.classList.contains('hidden')&&!menu.contains(e.target)&&e.target!==menuBtn)menu.classList.add('hidden'); });
    document.getElementById('mHome').onclick=()=>{menu.classList.add('hidden');nv('home');};
    document.getElementById('mPeg').onclick =()=>{menu.classList.add('hidden');nv('setup');};
    badge.addEventListener('animationend', ()=>{ badge.classList.remove('reveal'); badge.style.opacity='1'; badge.style.transform='scale(1)'; });

    /* countdown shown in the nav circle */
    let cd=null;  // { start, secs, onZero, fired }
    function startCountdown(secs, onZero){ cd={ start:elapsed, secs, onZero, fired:false }; navShowNum(secs); }

    const goalHtml = '<span class="iam">I AM</span>' + goal.replace(/^i am\s+/i,'');
    const VOTEXT = {
      recall:'Recall a memory that fills you with joy or gratitude.',
      intensify:'Get ready to intensify and maintain that feeling for twenty seconds.',
      closeEyes:'OK. Close your eyes and begin.',
      maintain:'While maintaining your heightened emotional state, visualize what your life would look, feel, sound and smell like once your goal has been achieved.',
      release:'Release your intention. Believe it has been granted and is now on its way.'
    };

    const SEQ = [
      // S1 CI INTRO (0-9)
      { t:0,   fn:()=>{ logo.style.opacity='1'; chime3(); } },
      { t:7,   fn:()=>{ logo.style.opacity='0'; } },
      { t:9,   fn:()=>{ split.style.opacity='1'; } },
      // S2 TITLE (10-19)
      { t:10,  fn:()=>{ badge.classList.add('reveal'); colB.classList.add('sharp'); } },
      { t:15,  fn:()=>{ badge.style.opacity='0'; } },
      // S3 GOAL (20-29)
      { t:20,  fn:()=>setCard(goalHtml) },
      { t:21.4,fn:()=>playVO('goal') },
      { t:27,  fn:fadeCard },
      // S4 RECALL (30-39)
      { t:30,  fn:()=>setCard('Recall a memory that fills you with joy or gratitude.') },
      { t:31.4,fn:()=>playVO('recall') },
      { t:38,  fn:fadeCard },
      // S5 INTENSIFY (40-49)
      { t:40,  fn:()=>{ setCard('Get ready to intensify and maintain that feeling for twenty seconds.'); navShowIcon('eyeOpen'); nav.style.opacity='1'; } },
      { t:41.4,fn:()=>playVO('intensify') },
      { t:47,  fn:fadeCard },
      // S6 CLOSE YOUR EYES + 20s countdown (50-89)
      { t:50,  fn:()=>{ colA.classList.add('dark'); setCard('OK. Close your eyes and begin.'); navShowIcon('eyeClosed'); } },
      { t:51.5,fn:()=>playVO('closeEyes') },
      { t:53,  fn:fadeCard },
      { t:54,  fn:()=>startCountdown(20, ()=>navShowIcon('eyeClosed')) },
      // S7 CREATIVE VISUALIZATION (90-159): text+VO, countdown @100, bell at 0
      { t:90,  fn:()=>setCard('While maintaining your heightened emotional state, visualize what your life would look, feel, sound and smell like once your goal has been achieved.') },
      { t:91.6,fn:()=>playVO('maintain') },
      { t:97,  fn:fadeCard },
      { t:100, fn:()=>startCountdown(20, ()=>{ bell(); navShowIcon('bell'); }) },
      // S8 RELEASE YOUR INTENTION (160-169)
      { t:160, fn:()=>{ setCard('Release your intention. Believe it has been granted and is now on its way.'); navShowIcon('rocket'); } },
      { t:161.5,fn:()=>playVO('release') },
      { t:167, fn:fadeCard },
      // S9 OUTRO (170-175)
      { t:170, fn:()=>{ nav.style.opacity='0'; logo.style.opacity='1'; } },
      { t:175, fn:()=>end() },
    ];

    let elapsed=0, timer=null, playing=false, ended=false, idx=0;
    function step(){
      elapsed+=0.1;
      while(idx<SEQ.length && elapsed>=SEQ[idx].t){ try{SEQ[idx].fn();}catch(e){} idx++; }
      if(cd){ const t=elapsed-cd.start, rem=Math.max(0,Math.ceil(cd.secs-t)); navNum.textContent=rem;
        if(t>=cd.secs){ if(!cd.fired){cd.fired=true; cd.onZero&&cd.onZero();} cd=null; } }
    }
    function setPlaying(p){ playing=p; playBtn.innerHTML=p?'&#9208;':'&#9654;'; if(p&&!timer)timer=setInterval(step,100); if(!p&&timer){clearInterval(timer);timer=null;} }
    function end(){ if(ended)return; ended=true; setPlaying(false); setTimeout(finishPlayer,2500); }
    playBtn.onclick=()=>setPlaying(!playing);

    Promise.all([
      tts(goal).then(a=>VO.goal=a),
      ...Object.entries(VOTEXT).map(([k,t])=>tts(t).then(a=>VO[k]=a)),
    ]).finally(()=>{ setTimeout(()=>setPlaying(true), 400); });
  </script>
</body>
</html>
