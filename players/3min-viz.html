<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Minute Visualization | Cosmic Intentions</title>
  <style>
    /* defaults — overridden at runtime by CONFIG (see <script>) */
    :root { --pink:#bf4170; --maroon:#6e1614; --ink:#2b2b2b; --bw:14px; --frame:#58585a; --postw:0px; --skullcol:40%; --cardfont:2.1vw; --fade:.8s;
            --arch-fill:#000; --arch-line:#58585a; --arch-ring:#58585a; --arch-circle:#fff; --arch-icon:#444; --iconsize:9%; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:#0c0810; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; overflow:hidden;
      font-family:'Courier New','Roboto Mono',monospace; }
    .stagewrap { position:relative; width:min(96vw, 92vh * 16 / 9); aspect-ratio:16/9; container-type:inline-size; }
    .stage { position:absolute; inset:0; background:#fff; border:var(--bw) solid var(--pink); overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.5); }
    .scene { position:absolute; inset:0; }

    #logo { z-index:5; background:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity var(--fade) ease; }
    #logo img { width:42%; max-height:82%; object-fit:contain; }

    #split { z-index:2; display:flex; opacity:0; transition:opacity .5s ease; }
    .colA { position:relative; flex:1 1 50%; background:#fff; display:flex; align-items:center; justify-content:center; padding:5% 6%; overflow:hidden; transition:background var(--fade) ease; }
    .colA.dark { background:#262626; }
    .colA.dark .card { color:#f3f3f3; }
    .post { flex:0 0 var(--postw); background:var(--frame); }
    .colB { position:relative; flex:0 0 var(--skullcol); }
    /* full-frame art = bottom layer; colA's opaque 50% panel covers its LEFT half, so only the RIGHT half shows */
    .bg { position:absolute; inset:0; z-index:1; background:#000 center/cover no-repeat; filter:blur(16px); opacity:0; transition:filter 1.2s ease, opacity var(--fade) ease; }
    .bg.sharp { filter:blur(0); }

    .badge { border:.55cqw solid var(--pink); border-radius:10px; background:#f1f1f1; padding:1.3cqw 2.6cqw; text-align:center; line-height:1.12; font-style:italic; font-weight:800; letter-spacing:.13em; color:#2b2b2b; font-size:3.1cqw; opacity:0; transform:scale(.2); transition:opacity .6s ease; }
    .badge.reveal { animation:zoomin .9s cubic-bezier(.16,.84,.3,1) both; }
    @keyframes zoomin { from { opacity:0; transform:scale(.2);} 70%{opacity:1;} to { opacity:1; transform:scale(1);} }
    .card { position:absolute; left:8%; top:50%; transform:translateY(-50%); max-width:80%; text-align:left; color:#2b2b2b; text-transform:uppercase; letter-spacing:.05em; font-weight:800; line-height:1.45; font-size:clamp(13px,var(--cardfont),30px); opacity:0; transition:opacity var(--fade) ease; }
    .card .iam { display:block; color:var(--pink); font-style:italic; font-weight:800; letter-spacing:.1em; margin-bottom:.35em; font-size:1.3em; }

    /* bottom dome (red line + purple fill) with the black icon circle on its peak */
    #arch { position:absolute; inset:0; z-index:8; opacity:0; transition:opacity var(--fade) ease; pointer-events:none; }
    .archsvg { position:absolute; left:0; right:0; bottom:0; width:100%; height:30%; display:block; }
    .archsvg .af { fill:var(--arch-fill); }
    .archsvg .al { fill:none; stroke:var(--arch-line); stroke-width:12; }
    .iconcircle { position:absolute; left:50%; bottom:19%; transform:translateX(-50%); width:var(--iconsize); aspect-ratio:1; border-radius:50%;
      background:var(--arch-circle); border:5px solid var(--arch-ring); display:flex; align-items:center; justify-content:center;
      color:var(--arch-icon); font-weight:700; font-size:clamp(15px,2.4vw,32px); box-shadow:0 2px 10px rgba(0,0,0,.45);
      pointer-events:auto; cursor:pointer; }
    .iconcircle svg { width:54%; height:54%; fill:none; stroke:var(--arch-icon); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    #navNum { display:none; }
    .stage { cursor:pointer; }   /* tap anywhere to play/pause */
  </style>
</head>
<body>
  <div class="stagewrap">
    <div class="stage">
      <div class="bg" id="bg"></div>
      <div class="scene" id="split">
        <div class="colA" id="colA">
          <div class="badge" id="badge">3 MINUTE<br>MANIFEST</div>
          <p class="card" id="card"></p>
        </div>
        <div class="post"></div>
        <div class="colB" id="colB"></div>
      </div>
      <div class="scene" id="logo"><img src="../images/clip-art/blue-hair-logo.png" alt="Cosmic Intentions"></div>
      <div id="arch">
        <svg class="archsvg" viewBox="0 0 1920 300" preserveAspectRatio="none">
          <path class="af" d="M0 120 Q960 0 1920 120 L1920 300 L0 300 Z"/>
          <path class="al" d="M0 120 Q960 0 1920 120"/>
        </svg>
        <div class="iconcircle"><svg id="navIcon" viewBox="0 0 24 24"></svg><span id="navNum"></span></div>
      </div>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════════════
     CONFIG — every dial in one place. Live-test via URL params:
       ?border=%23ff0000  ?skull=50  ?nav=18  ?bw=10  ?fade=0.4  ?speed=3
     ════════════════════════════════════════════════════════════════════ */
  const CONFIG = {
    accent:'#bf4170', frame:'#58585a', maroon:'#6e1614', borderWidth:2.2, skullColumn:50, centerPost:0, dome:false,
    cardFont:2.1, iconSize:9, fadeSpeed:0.8, voice:'shimmer', speed:1,
    // bottom "dome skeleton" — grey/black/white
    arch:{ fill:'#000000', line:'#58585a', ring:'#58585a', circle:'#ffffff', icon:'#444444' },
    // timing (seconds)
    t:{ s1_logoOut:7, s1_splitIn:9,
        s2_titleIn:10, s2_titleOut:15,
        s3_in:20, s3_vo:21.4, s3_out:27,
        s4_in:30, s4_vo:31.4, s4_out:38,
        s5_in:40, s5_vo:41.4, s5_out:47,
        s6_in:50, s6_vo:51.5, s6_out:53, s6_count:54, s6_countSecs:20,
        s7_in:90, s7_vo:91.6, s7_out:97, s7_count:100, s7_countSecs:20,
        s8_in:160, s8_vo:161.5, s8_out:167,
        s9_logoIn:170, end:175 },
    vo:{ recall:'Recall a memory that fills you with joy or gratitude.',
         intensify:'Get ready to intensify and maintain that feeling for twenty seconds.',
         closeEyes:'OK. Close your eyes and begin.',
         maintain:'While maintaining your heightened emotional state, visualize what your life would look, feel, sound and smell like once your goal has been achieved.',
         release:'Release your intention. Believe it has been granted and is now on its way.' }
  };

  const P = new URLSearchParams(location.search);
  if (P.get('frame'))  CONFIG.frame = P.get('frame');
  if (P.get('accent')||P.get('border')) CONFIG.accent = P.get('accent')||P.get('border');
  if (P.get('skull'))  CONFIG.skullColumn = +P.get('skull');
  if (P.get('nav'))    CONFIG.iconSize = +P.get('nav');
  if (P.get('bw'))     CONFIG.borderWidth = +P.get('bw');
  if (P.get('post'))   CONFIG.centerPost = +P.get('post');
  if (P.get('dome')!==null) CONFIG.dome = P.get('dome')!=='0';
  if (P.get('fade'))   CONFIG.fadeSpeed = +P.get('fade');
  if (P.get('speed'))  CONFIG.speed = +P.get('speed');
  const R = document.documentElement.style;
  R.setProperty('--pink', CONFIG.accent);
  R.setProperty('--frame', CONFIG.frame);
  R.setProperty('--postw', CONFIG.centerPost + 'px');
  R.setProperty('--maroon', CONFIG.maroon);
  R.setProperty('--bw', CONFIG.borderWidth + 'cqw');
  R.setProperty('--skullcol', CONFIG.skullColumn + '%');
  R.setProperty('--cardfont', CONFIG.cardFont + 'vw');
  R.setProperty('--iconsize', CONFIG.iconSize + '%');
  R.setProperty('--fade', CONFIG.fadeSpeed + 's');
  R.setProperty('--arch-fill', CONFIG.arch.fill);
  R.setProperty('--arch-line', CONFIG.arch.line);
  R.setProperty('--arch-ring', CONFIG.arch.ring);
  R.setProperty('--arch-circle', CONFIG.arch.circle);
  R.setProperty('--arch-icon', CONFIG.arch.icon);
  document.querySelector('.archsvg').style.display = CONFIG.dome ? '' : 'none';   // hide dome, keep circle

  const T = CONFIG.t, VOTEXT = CONFIG.vo, VOICE = CONFIG.voice;
  const goal = (P.get('g') || localStorage.getItem('ci_goal_title')
    || 'I am the proud owner of a successful online business with 1000 subscribers').trim();

  const logo=document.getElementById('logo'), split=document.getElementById('split'),
        colA=document.getElementById('colA'), colB=document.getElementById('colB'), bg=document.getElementById('bg'),
        badge=document.getElementById('badge'), card=document.getElementById('card'),
        arch=document.getElementById('arch'), navIcon=document.getElementById('navIcon'),
        navNum=document.getElementById('navNum'), stage=document.querySelector('.stage');

  /* ── column B art: 79 pieces in images/50-50/, rotating one per day (day-of-year).
       override for testing: ?img=1060 picks the file whose name contains "1060" ── */
  const COLB_IMAGES = [
    '[000] 480.jpg','[000] 570.jpg','[000] 580.jpg','[000] 670.jpg','[000] 690.jpg',
    '[000] 700.jpg','[000] 710.jpg','[000] 720.jpg','[000] 740.jpg','[000] 810.jpg',
    '[000] 830.jpg','[000] 840.jpg','[000] 940.jpg','[000] 950.jpg','[000] 970.jpg',
    '[000] 990.jpg','[000] 1010.jpg','[000] 1020.jpg','[000] 1030.jpg','[000] 1040.jpg',
    '[000] 1060.jpg','[000] 1070.jpg','[000] 1080.jpg','[000] 1090.jpg','[000] 1100.jpg',
    '[000] 1160.jpg','[000] 1170.jpg','[000] 1180.jpg','[000] 1200.jpg','[000] 1210.jpg',
    '[000] 1230.jpg','[000] 1270.jpg','[000] 1280.jpg','[000] 1290.jpg','[000] 1300.jpg',
    '[000] 1330.jpg','[000] 1340.jpg','[000] 1350.jpg','[000] 1370.jpg','[000] 1380.jpg',
    '[000] 1390.jpg','[000] 1410.jpg','[000] 1420.jpg','[000] 1450.jpg','[000] 1460.jpg',
    '[000] 1500.jpg','[000] 1510.jpg','[000] 1550.jpg','[000] 1560.jpg','[000] 1570.jpg',
    '[000] 1660.jpg','[000] 1670.jpg','[000] 1690.jpg','[000] 1710.jpg','[000] 1720.jpg',
    '[000] 1730.jpg','[000] 1740.jpg','[000] 1750.jpg','[000] 1760.jpg','[000] 1770.jpg',
    '[000] 1880.jpg','[000] 1940.jpg','[000] 1950.jpg','[000] 1980.jpg','[000] 1990.jpg',
    '[000] 2000.jpg','[000] 2010.jpg','[000] 2040.jpg','[000] 2170.jpg','[000] 2230.jpg',
    '[000] 2260.jpg','[000] 2300.jpg','[000] 2330.jpg','[000] 2340.jpg','[000] 2490.jpg',
    '[000] 2500.jpg','[000] 2510.jpg','[000] 2560.jpg','[000] 2580.jpg'
  ];
  const dayOfYear = () => { const n=new Date(); return Math.floor((n - new Date(n.getFullYear(),0,0)) / 86400000); };
  const imgQ = P.get('img');
  const colbFile = imgQ ? (COLB_IMAGES.find(f => f.includes(imgQ)) || COLB_IMAGES[0])
                        : COLB_IMAGES[dayOfYear() % COLB_IMAGES.length];
  bg.style.backgroundImage = `url('../images/50-50/${encodeURIComponent(colbFile)}')`;
  const ICON = {
    eyeOpen:  '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/>',
    eyeClosed:'<path d="M3 10c2.6 4 6.4 5 9 5s6.4-1 9-5"/><path d="M5 14l-1 2M19 14l1 2M12 16v2.2"/>',
    bell:     '<path d="M12 4a4 4 0 00-4 4v3l-1.6 2.6h11.2L16 11V8a4 4 0 00-4-4z"/><path d="M10.4 17.6a1.6 1.6 0 003.2 0"/>',
    rocket:   '<path d="M12 3c2.5 2 3.6 5.6 3.6 8.6L14 16h-4l-1.6-4.4C8.4 8.6 9.5 5 12 3z"/><circle cx="12" cy="9" r="1.3"/><path d="M9 16l-2.2 3.2 2.7-.9M15 16l2.2 3.2-2.7-.9"/>',
    play:     '<path d="M9 6l9 6-9 6z" fill="currentColor" stroke="none"/>',
    pause:    '<rect x="8" y="6" width="3.2" height="12" fill="currentColor" stroke="none"/><rect x="12.8" y="6" width="3.2" height="12" fill="currentColor" stroke="none"/>'
  };
  /* the nav circle IS the play/pause: ▶ when paused, the section icon / countdown
     while playing, and ⏸ when playing with no section icon (so it never blocks one) */
  let playing=false, curIcon=null, curNum=null;
  function renderNav(){
    if(!playing){ navNum.style.display='none'; navIcon.style.display=''; navIcon.innerHTML=ICON.play; return; }
    if(curNum!=null){ navIcon.style.display='none'; navNum.style.display=''; navNum.textContent=curNum; return; }
    if(curIcon){ navNum.style.display='none'; navIcon.style.display=''; navIcon.innerHTML=ICON[curIcon]; return; }
    navNum.style.display='none'; navIcon.style.display=''; navIcon.innerHTML=ICON.pause;
  }
  function navShowIcon(name){ curIcon=name; curNum=null; renderNav(); }
  function navShowNum(n){ curNum=n; renderNav(); }

  function chime3(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
    [660,880,1175].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+i*0.16; o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.35,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.55); o.connect(g).connect(c.destination); o.start(s); o.stop(s+.6); }); }catch(e){} }
  function bell(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(),n=c.currentTime;
    [880,1320].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),s=n+i*0.16; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.4,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+2.2); o.connect(g).connect(c.destination); o.start(s); o.stop(s+2.3); }); }catch(e){} }

  const CACHE='ci_vizmod_vo';
  const rc=()=>{try{return JSON.parse(localStorage.getItem(CACHE)||'{}');}catch(e){return{};}};
  const wc=(o)=>{try{localStorage.setItem(CACHE,JSON.stringify(o));}catch(e){}};
  const hash=(s)=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h.toString(36);};
  async function tts(text){ const k=hash(VOICE+'|'+text), c=rc(); if(c[k])return new Audio('data:audio/mpeg;base64,'+c[k]);
    try{ const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.slice(0,160),voice:VOICE})}); if(!r.ok)throw 0; const {audio}=await r.json(); c[k]=audio; wc(c); return new Audio('data:audio/mpeg;base64,'+audio);}catch(e){return null;} }
  const VO={}; function playVO(k){ const a=VO[k]; if(a){try{a.currentTime=0;a.play().catch(()=>{});}catch(e){}} }

  function setCard(html){ card.style.opacity='0'; setTimeout(()=>{ card.innerHTML=html; card.style.opacity='1'; },120); }
  function fadeCard(){ card.style.opacity='0'; }

  function closePlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.closePlayerColumn){window.parent.closePlayerColumn();return;} }catch(e){} if(history.length>1)history.back(); else window.close(); }
  function finishPlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.playerFinished){window.parent.playerFinished();return;} }catch(e){} closePlayer(); }
  badge.addEventListener('animationend', ()=>{ badge.classList.remove('reveal'); badge.style.opacity='1'; badge.style.transform='scale(1)'; });
  stage.addEventListener('click', ()=>setPlaying(!playing));   // tap anywhere = play/pause

  let cd=null;
  function startCountdown(secs, onZero){ cd={ start:elapsed, secs, onZero, fired:false }; navShowNum(secs); }

  const goalHtml = '<span class="iam">I AM</span>' + goal.replace(/^i am\s+/i,'');
  const SEQ = [
    { t:0,            fn:()=>{ logo.style.opacity='1'; chime3(); } },
    { t:T.s1_logoOut, fn:()=>{ logo.style.opacity='0'; } },
    { t:T.s1_splitIn, fn:()=>{ split.style.opacity='1'; bg.style.opacity='1'; arch.style.opacity='1'; } },   // sections 2-8: dome visible
    { t:T.s2_titleIn, fn:()=>{ badge.classList.add('reveal'); bg.classList.add('sharp'); } },
    { t:T.s2_titleOut,fn:()=>{ badge.classList.remove('reveal'); badge.style.opacity='0'; } },
    { t:T.s3_in,  fn:()=>setCard(goalHtml) },
    { t:T.s3_vo,  fn:()=>playVO('goal') },
    { t:T.s3_out, fn:fadeCard },
    { t:T.s4_in,  fn:()=>setCard(VOTEXT.recall) },
    { t:T.s4_vo,  fn:()=>playVO('recall') },
    { t:T.s4_out, fn:fadeCard },
    { t:T.s5_in,  fn:()=>{ setCard(VOTEXT.intensify); navShowIcon('eyeOpen'); } },    // open eye in the circle
    { t:T.s5_vo,  fn:()=>playVO('intensify') },
    { t:T.s5_out, fn:fadeCard },
    { t:T.s6_in,  fn:()=>{ colA.classList.add('dark'); setCard(VOTEXT.closeEyes); navShowIcon('eyeClosed'); } },
    { t:T.s6_vo,  fn:()=>playVO('closeEyes') },
    { t:T.s6_out, fn:fadeCard },
    { t:T.s6_count,fn:()=>startCountdown(T.s6_countSecs, ()=>navShowIcon('eyeClosed')) },
    { t:T.s7_in,  fn:()=>setCard(VOTEXT.maintain) },
    { t:T.s7_vo,  fn:()=>playVO('maintain') },
    { t:T.s7_out, fn:fadeCard },
    { t:T.s7_count,fn:()=>startCountdown(T.s7_countSecs, ()=>{ bell(); navShowIcon('bell'); }) },
    { t:T.s8_in,  fn:()=>{ setCard(VOTEXT.release); navShowIcon('rocket'); } },
    { t:T.s8_vo,  fn:()=>playVO('release') },
    { t:T.s8_out, fn:fadeCard },
    { t:T.s9_logoIn,fn:()=>{ arch.style.opacity='0'; logo.style.opacity='1'; } },     // dome out, outro logo
    { t:T.end,    fn:()=>end() },
  ].sort((a,b)=>a.t-b.t);

  let elapsed=0, timer=null, ended=false, idx=0;
  function step(){
    elapsed += 0.1 * CONFIG.speed;
    while(idx<SEQ.length && elapsed>=SEQ[idx].t){ try{SEQ[idx].fn();}catch(e){} idx++; }
    if(cd){ const t=elapsed-cd.start, rem=Math.max(0,Math.ceil(cd.secs-t)); curNum=rem; navNum.textContent=rem;
      if(t>=cd.secs){ if(!cd.fired){cd.fired=true; cd.onZero&&cd.onZero();} cd=null; curNum=null; } }
  }
  function setPlaying(p){ playing=p; renderNav(); if(p&&!timer)timer=setInterval(step,100); if(!p&&timer){clearInterval(timer);timer=null;} }
  function end(){ if(ended)return; ended=true; setPlaying(false); setTimeout(finishPlayer,2500); }

  Promise.all([
    tts(goal).then(a=>VO.goal=a),
    ...Object.entries(VOTEXT).map(([k,t])=>tts(t).then(a=>VO[k]=a)),
  ]).finally(()=>{ setTimeout(()=>setPlaying(true), 400); });
  </script>
</body>
</html>
