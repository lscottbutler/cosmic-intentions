<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digital Vision Board | Cosmic Intentions</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap');
:root{--navy:#03131b;--panel:#0d303e;--teal:#43aaa9;--cyan:#0081ad;--gold:#ffae19;--cream:#d8d0a3;--muted:#617482}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#02090d;color:#fff;font-family:'Roboto Condensed',sans-serif;overflow:hidden}.shell{width:min(100vw,calc(100vh * 16 / 9),1280px)}
.player{position:relative;width:100%;aspect-ratio:16/9;background:var(--navy);overflow:hidden;border-top:2px solid var(--cyan)}
.header{position:absolute;z-index:20;top:0;left:0;right:0;height:14%;display:flex;align-items:center;padding:0 6.6%;background:linear-gradient(90deg,#03131bee,#061a24dd);border-top:2px solid var(--cyan)}.logo{display:flex;align-items:center;gap:17px;font-size:clamp(12px,1.55vw,22px);font-weight:700;letter-spacing:.16em;text-transform:uppercase}.diamond{width:17px;height:17px;border:3px solid var(--gold);transform:rotate(45deg);filter:drop-shadow(0 0 10px #ffae1980)}
.viewport{position:absolute;inset:14% 0 20%}.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.01);transition:opacity 1.2s ease}.slide.on{opacity:1;animation:drift 9s ease-in-out forwards}.empty{position:absolute;inset:0;display:none;place-items:center;background:#071d27;color:#9db0b8;font-size:clamp(16px,2vw,25px);letter-spacing:.08em}.empty.show{display:grid}
.controls{position:absolute;z-index:20;left:0;right:0;bottom:0;height:20%;display:flex;align-items:center;padding:0 7.5%;gap:4.2%;background:var(--navy);border-top:12px solid var(--cyan)}.controls:before{content:"";position:absolute;top:-12px;left:0;right:0;height:12px;background:linear-gradient(#d6d3a4 0 22%,#63a99f 22% 45%,#0081ad 45%)}button{font:inherit}.control{width:60px;aspect-ratio:1;border:1px solid #29404a;border-radius:50%;background:transparent;color:#b4c1c7;font-size:clamp(18px,2vw,28px);cursor:pointer}.control.play{width:78px;border:0;background:linear-gradient(135deg,#257b81,#4cbdb5);color:#02141b;font-size:clamp(22px,2.4vw,34px)}.control:hover,.control:focus-visible{outline:none;border-color:var(--teal);color:#fff}.sound-label{color:var(--muted);font-size:clamp(13px,1.4vw,20px);letter-spacing:.14em;text-transform:uppercase}.count{margin-left:auto;color:#526a76;font-size:clamp(12px,1.2vw,17px);letter-spacing:.16em}
.outro{position:absolute;z-index:30;inset:14% 0 20%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}.outro.show{opacity:1;visibility:visible}.seal{position:relative;width:clamp(66px,8vw,108px);aspect-ratio:1;border:1px solid #23848a;border-radius:50%;margin-bottom:4%}.seal:before{content:"";position:absolute;inset:15%;border:1px solid var(--gold);transform:rotate(45deg)}.seal:after{content:"";position:absolute;inset:32%;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 16px #ffae1966}.outro p{margin:0;color:#52d2d0;font-size:clamp(16px,2vw,27px);font-weight:600;letter-spacing:.34em;text-transform:uppercase}
@keyframes drift{from{transform:scale(1.01)}to{transform:scale(1.075)}}@media(max-width:650px){.controls{padding:0 5%;gap:3%}.control{width:46px}.control.play{width:60px}.sound-label{display:none}.header{padding:0 5%}.logo{gap:12px}}
@media(prefers-reduced-motion:reduce){.slide.on{animation:none}.slide{transition-duration:.01ms}}
</style>
</head>
<body>
<main class="shell"><section class="player" aria-label="Porsche Digital Vision Board">
 <header class="header"><div class="logo"><span class="diamond"></span>Cosmic Intentions</div></header>
 <div class="viewport"><div class="slide" id="a"></div><div class="slide" id="b"></div><div class="empty" id="empty">Add five images to your Porsche intention.</div></div>
 <div class="outro" id="outro"><div class="seal"></div><p>Carry it with you</p></div>
 <footer class="controls"><button class="control" id="restart" aria-label="Restart">↻</button><button class="control play" id="play" aria-label="Play">▶</button><button class="control" id="sound" aria-label="Sound on">♪</button><button class="control" id="close" aria-label="Close">×</button><span class="sound-label" id="soundLabel">Sound on</span><span class="count" id="count">1 / 5</span></footer>
</section></main>
<script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),seconds=7;
let images=[],index=0,front=true,playing=false,ended=false,muted=false,timer=null,ctx=null;
function parseList(value){try{const parsed=JSON.parse(value);return Array.isArray(parsed)?parsed:[]}catch(error){return String(value||'').split('|').filter(Boolean)}}
function findPorsche(){let all=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i)||'';if(/^ci_intentions(?:_|$)/.test(key)){const value=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(value))all.push(...value)}}}catch(error){}const goal=all.find(item=>/porsche/i.test(item?.title||''))||all[0];if(!goal)return[];return [goal.imageUrl,...(Array.isArray(goal.imageOptions)?goal.imageOptions:[]),...(Array.isArray(goal.images)?goal.images:[])].filter(Boolean)}
function unique(list){return [...new Set(list.filter(src=>typeof src==='string'&&src.trim()).map(src=>src.trim()))].slice(0,5)}
function loadImages(){images=unique(parseList(q.get('images')||''));if(!images.length){try{images=unique(parseList(localStorage.getItem('ci_dvb_images')||''))}catch(error){}}if(!images.length)images=unique(findPorsche());$('empty').classList.toggle('show',!images.length);if(images.length)show(0,false);images.forEach(src=>{const image=new Image();image.src=src})}
function show(next,animate=true){index=(next+images.length)%images.length;const incoming=front?$('a'):$('b'),outgoing=front?$('b'):$('a');incoming.style.backgroundImage=`url("${images[index].replace(/"/g,'')}")`;incoming.classList.add('on');outgoing.classList.remove('on');front=!front;$('count').textContent=`${index+1} / ${images.length}`}
function tone(){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain(),n=ctx.currentTime;o.frequency.value=659.25;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.11,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+1.5);o.connect(g).connect(ctx.destination);o.start(n);o.stop(n+1.6)}catch(error){}}
function advance(){if(index>=images.length-1){finish();return}show(index+1)}
function setPlaying(value){if(!images.length||ended)return;playing=value;$('play').textContent=value?'Ⅱ':'▶';clearInterval(timer);if(value)timer=setInterval(advance,seconds*1000)}
function start(){if(!images.length)return;ended=false;index=0;$('outro').classList.remove('show');show(0,false);tone();setPlaying(true)}
function finish(){clearInterval(timer);playing=false;ended=true;$('play').textContent='▶';$('outro').classList.add('show');$('count').textContent='Complete';tone();try{window.parent?.playerFinished?.()}catch(error){}}
$('play').onclick=()=>ended?start():setPlaying(!playing);$('restart').onclick=start;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♩':'♪';$('soundLabel').textContent=muted?'Sound off':'Sound on'};$('close').onclick=()=>{try{if(window.parent!==window&&window.parent.closePlayerColumn)return window.parent.closePlayerColumn()}catch(error){}history.length>1?history.back():window.close()};document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}if(e.key==='Escape')$('close').click()});loadImages();setTimeout(start,500);
</script>
</body></html>
