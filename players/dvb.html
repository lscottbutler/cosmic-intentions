<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Digital Vision Board | Cosmic Intentions</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:#111;font-family:'Arial Narrow','Roboto Condensed',Arial,sans-serif}
.player{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#6b6b6b;padding:2.15%;overflow:hidden}
.inside{position:relative;width:100%;height:100%;background:#050505;overflow:hidden}
.image-field{position:absolute;inset:0 0 14% 0;background:#050505;overflow:hidden}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;opacity:0;transition:opacity 1.2s ease;transform:scale(1)}
.slide.on{opacity:1;animation:drift 7s ease-in-out forwards}
.lower{position:absolute;z-index:5;left:0;right:0;bottom:0;height:14%;background:#333;display:grid;place-items:center}
.lower span{color:#fff;font-size:clamp(27px,4.1vw,68px);font-weight:700;letter-spacing:.23em;line-height:1;text-transform:uppercase;transition:opacity .22s ease;transform:translateY(-10pt)}
.curve{position:absolute;z-index:8;left:0;right:0;bottom:calc(14% - 1px);display:block;width:100%;height:7%;pointer-events:none;overflow:visible}
.curve .bed{fill:#333;stroke:none}
.curve .track,.curve .complete{fill:none;stroke-width:calc(10px + 15pt);stroke-linecap:round;vector-effect:non-scaling-stroke}
.curve .track{stroke:#6b6b6b}
.curve .complete{stroke:#e7a51a;stroke-dasharray:100;stroke-dashoffset:100}
.playhead{position:absolute;z-index:9;width:22px;height:22px;border-radius:50%;background:#e7a51a;transform:translate(-50%,-50%);pointer-events:none}
.outro{position:absolute;z-index:20;inset:0;background:#050505;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .8s,visibility .8s}
.outro.show{opacity:1;visibility:visible}
.outro p{margin:0;color:#fff;font-size:clamp(17px,2.2vw,31px);font-weight:700;letter-spacing:.34em;text-transform:uppercase}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
@media(prefers-reduced-motion:reduce){.slide.on{animation:none}.slide,.outro{transition-duration:.01ms}}
</style>
</head>
<body>
<main class="player" aria-label="Porsche Digital Vision Board">
 <div class="inside">
  <div class="image-field">
   <img class="slide" id="a" alt="Porsche 911 vision board image">
   <img class="slide" id="b" alt="Porsche 911 vision board image">
  </div>
  <svg class="curve" viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true">
   <path class="bed" d="M0 52 Q500 -20 1000 52 L1000 80 L0 80 Z"/>
   <path class="track" id="track" pathLength="100" d="M0 52 Q500 -20 1000 52"/>
   <path class="complete" id="complete" pathLength="100" d="M0 52 Q500 -20 1000 52"/>
  </svg>
  <div class="playhead" id="dot" aria-hidden="true"></div>
  <div class="lower"><span id="phaseText">See It</span></div>
  <div class="outro" id="outro"><p>Carry It With You</p></div>
 </div>
</main>
<script>
const IMAGES=[
 'https://images.unsplash.com/photo-1747641562813-2d230b791d4c?auto=format&fit=crop&w=1800&q=88',
 'https://images.unsplash.com/photo-1626847152035-cb3f14d8534b?auto=format&fit=crop&w=1800&q=88',
 'https://images.unsplash.com/photo-1766819755230-c98b557e33fe?auto=format&fit=crop&w=1800&q=88',
 'https://images.unsplash.com/photo-1772332196542-23b1c4e5202c?auto=format&fit=crop&w=1800&q=88',
 'https://images.unsplash.com/photo-1625762968079-57000eb254a1?auto=format&fit=crop&w=1800&q=88'
];
const SLIDE_MS=7000,TOTAL_MS=IMAGES.length*SLIDE_MS,PHASES=['See It','Feel It','Hear It'];
const $=id=>document.getElementById(id);
let index=-1,front=true,playing=true,ended=false,startedAt=0,pausedAt=0,raf=0,activePhase=0;

function show(next){
 index=next;
 const incoming=front?$('a'):$('b'),outgoing=front?$('b'):$('a');
 incoming.src=IMAGES[index];
 incoming.classList.remove('on');
 void incoming.offsetWidth;
 incoming.classList.add('on');
 outgoing.classList.remove('on');
 front=!front;
}

function draw(progress){
 const value=Math.max(0,Math.min(1,progress));
 const phaseIndex=Math.min(PHASES.length-1,Math.floor(value*PHASES.length));
 if(phaseIndex!==activePhase){activePhase=phaseIndex;$('phaseText').textContent=PHASES[activePhase]}
 $('complete').style.strokeDashoffset=String(100-(value*100));
 const path=$('track'),point=path.getPointAtLength(path.getTotalLength()*value);
 $('dot').style.left=(point.x/10)+'%';
 $('dot').style.top=(79+(point.y/80*7))+'%';
}

function tick(now){
 if(!playing)return;
 const elapsed=now-startedAt;
 const nextIndex=Math.min(IMAGES.length-1,Math.floor(elapsed/SLIDE_MS));
 if(nextIndex!==index)show(nextIndex);
 draw(elapsed/TOTAL_MS);
 if(elapsed>=TOTAL_MS){finish();return}
 raf=requestAnimationFrame(tick);
}

function start(){
 cancelAnimationFrame(raf);
 ended=false;playing=true;index=-1;pausedAt=0;activePhase=0;$('phaseText').textContent=PHASES[0];$('phaseText').style.opacity='1';
 $('outro').classList.remove('show');
 draw(0);show(0);startedAt=performance.now();
 raf=requestAnimationFrame(tick);
}

function pause(){playing=false;pausedAt=performance.now();cancelAnimationFrame(raf)}
function resume(){playing=true;startedAt+=performance.now()-pausedAt;raf=requestAnimationFrame(tick)}
function finish(){playing=false;ended=true;draw(1);$('outro').classList.add('show');try{window.parent?.playerFinished?.()}catch(error){}}

document.addEventListener('click',()=>ended?start():(playing?pause():resume()),{passive:true});
document.addEventListener('keydown',event=>{
 if(event.code==='Space'){event.preventDefault();ended?start():(playing?pause():resume())}
 if(event.key==='Escape'){try{if(window.parent!==window&&window.parent.closePlayerColumn)return window.parent.closePlayerColumn()}catch(error){}history.length>1?history.back():window.close()}
});
IMAGES.forEach(src=>{const image=new Image();image.src=src});
start();
</script>
</body>
</html>
