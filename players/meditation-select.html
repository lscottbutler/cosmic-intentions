<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Meditation | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;   /* fallback */
  min-height: 100dvh;  /* fills the phone, adapts to the address bar */
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

.player-container {
  width: 92%;
  max-width: 480px;
  background: #000;
  border: 14px solid #333;
  border-radius: 0;
  overflow: visible;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding-bottom: 28px;
  position: relative;
}

.image-wrap {
  width: 100%;
  position: relative;
}
.image-wrap::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 14px;
  background: #333;
  z-index: 5;
}

.vibe-image {
  width: 100%;
  height: 200px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  display: block;
}

.med-icon {
  width: 90px;
  height: 90px;
  object-fit: contain;
  mix-blend-mode: multiply;
  margin-top: 8px;
}

.section-banner {
  width: calc(100% - 32px);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #000;
  background: #FFF;
  text-align: center;
  padding: 7px 0;
}

.duration-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  width: calc(100% - 32px);
}

.dur-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid #333;
  border-radius: 0;
  color: #FFF;
  font-size: 13px;
  font-weight: 600;
  padding: 14px 4px;
  cursor: pointer;
  text-align: center;
  letter-spacing: 0.04em;
  transition: background 0.15s, border-color 0.15s;
}
.dur-btn:hover {
  background: rgba(255,255,255,0.18);
  border-color: #FFF;
}
.dur-btn:active {
  background: rgba(255,255,255,0.28);
}

.home-button {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #FFF;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  margin-top: 4px;
}
.home-button:hover {
  transform: scale(1.1);
  box-shadow: 0 4px 20px rgba(255,255,255,0.3);
}
.home-icon {
  width: 28px;
  height: 28px;
  fill: #000;
}

.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.15);
  border: 1px solid #333;
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  z-index: 100;
}
.close-btn:hover {
  background: rgba(255,255,255,0.25);
  transform: scale(1.1);
}
</style>
</head>
<body>

<div class="player-container">
  <div class="image-wrap">
    <div class="vibe-image" id="vibeImage"></div>
  </div>

  <img class="med-icon" src="../images/icons/meditations.png" alt="">

  <div class="section-banner">UNGUIDED MEDITATIONS</div>

  <div class="duration-grid" id="durationGrid"></div>

  <div class="section-banner">GUIDED MEDITATIONS</div>

  <div class="duration-grid" id="durationGridGuided"></div>

  <button class="home-button" onclick="goHome()">
    <svg class="home-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
    </svg>
  </button>
</div>

<button class="close-btn" onclick="goHome()">✕</button>

<script src="../shared/player-core.js"></script>
<script>
const MEDITATION_IMAGES = [
  '../images/meditations/bg-meditations-1.jpg',
  '../images/meditations/bg-meditations-2.jpg',
  '../images/meditations/bg-meditations-3.jpg',
  '../images/meditations/bg-meditations-4.jpg',
];

const DURATIONS = [
  { label: '1 min',  s: 60   },
  { label: '2 min',  s: 120  },
  { label: '3 min',  s: 180  },
  { label: '5 min',  s: 300  },
  { label: '7 min',  s: 420  },
  { label: '10 min', s: 600  },
  { label: '12 min', s: 720  },
  { label: '15 min', s: 900  },
  { label: '20 min', s: 1200 },
  { label: '25 min', s: 1500 },
  { label: '30 min', s: 1800 },
  { label: '40 min', s: 2400 },
  { label: '45 min', s: 2700 },
  { label: '60 min', s: 3600 },
  { label: '90 min', s: 5400 },
];

function init() {
  const medIdx = Math.floor(Date.now() / 86400000) % MEDITATION_IMAGES.length;
  document.getElementById('vibeImage').style.backgroundImage =
    `url("${MEDITATION_IMAGES[medIdx]}")`;

  ['durationGrid', 'durationGridGuided'].forEach(id => {
    const grid = document.getElementById(id);
    DURATIONS.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'dur-btn';
      btn.textContent = d.label;
      btn.onclick = () => selectDuration(d.s);
      grid.appendChild(btn);
    });
  });
}

function selectDuration(seconds) {
  window.location.href = `meditation-timer.html?duration=${seconds}`;
}

function goHome() {
  returnToApp();
}

window.addEventListener('DOMContentLoaded', init);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') goHome();
});
</script>

</body>
</html>
