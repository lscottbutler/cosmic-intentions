<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Cosmic Intentions Dashboard</title>
  <style>
    /* APPROVED MASTER PLAYER — LOCKED 2026-09-21
       Permanent shared shell for all member players.
       Outer shell: #292929. Title/icon troughs: #747474.
       Preserve the approved spacing, curves, typography and icon layout.
       Page-specific content may change; this shared chrome must remain consistent. */
    :root{color-scheme:light;--frame:#292929;--header:#292929;--paper:#f2ede7;--deck:#292929;--trough-fill:#747474;--trough-ink:#fff;--frame-border:17.5px;--frame-bottom-border:clamp(6px,1.823vw,18px);--trough-curve:35px;--ink:#1f2724;--muted:#fff;--line:#050706}
    *{box-sizing:border-box}
    html,body{width:100%;margin:0;overflow:hidden;background:transparent;font-family:"Arial Narrow","Nimbus Sans Narrow","Roboto Condensed",Arial,sans-serif}
    body{padding:0}
    button{font:inherit}
    .shell{width:100%;border:0;background:transparent;overflow:hidden;transition:min-height .35s ease}
    .shell.home-mode{background:var(--header);padding:0 0 27px}
    .shell.daily-habits-mode{border:0!important;outline:0!important;box-shadow:none!important}
    .shell.daily-habits-mode .stage{background:#292929!important}
    .cap{position:relative;isolation:isolate;margin:0;padding:38px 18px 19px;background:var(--header);color:var(--trough-ink);display:grid;place-items:center;text-align:center;font-size:28px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-radius:50% 50% 0 0/var(--trough-curve) var(--trough-curve) 0 0;transition:background-color .25s ease}
    .cap::before{content:"";position:absolute;z-index:-1;inset:var(--frame-border) var(--frame-border) 0;background:var(--trough-fill);border-radius:50% 50% 0 0/var(--trough-curve) var(--trough-curve) 0 0;pointer-events:none;transition:background-color .25s ease}
    .stage{position:relative;margin:0;background:var(--paper);color:var(--ink);min-height:134px;padding:28px 28px 26px;overflow:hidden;opacity:1;transition:min-height .35s ease,padding .35s ease,opacity .58s ease}
    .stage.ci-stage-fade-out{opacity:1}
    .view{animation:fadeIn .24s ease both}
    .view[hidden]{display:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .inspiration{position:relative;width:100%;min-height:0;align-self:stretch;display:grid;grid-template-rows:auto minmax(0,1fr) auto;align-items:center;text-align:center;text-transform:uppercase}
    .inspiration-card{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:center;opacity:0;transition:opacity 3s ease}
    .inspiration.has-card .inspiration-card{opacity:1;transition-duration:3s}
    .inspiration.has-card .inspiration-kind,.inspiration.has-card .statement,.inspiration.has-card .inspiration-author{visibility:hidden}
    .inspiration-kind{align-self:start;font-size:clamp(9px,1.7vw,12px);font-weight:800;letter-spacing:2px;color:#6b716d}
    .statement{margin:0;display:grid;place-items:center;text-align:center;font-size:clamp(17px,4.5vw,31px);font-weight:800;line-height:1.35;letter-spacing:clamp(1.2px,.34vw,2.2px)}
    .inspiration-author{align-self:end;font-size:clamp(9px,1.8vw,12px);font-weight:800;letter-spacing:1.3px;color:#59605b}
    .shell.home-mode .stage{width:auto;height:auto;min-height:0;max-height:none;aspect-ratio:auto;padding:17.5px;background:var(--header);display:grid}
    .shell.home-mode #homeView{width:100%;min-height:0;aspect-ratio:16/9;align-self:stretch;display:grid}
    .view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.experience-toolbar{justify-content:flex-end}
    .view-title{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:1.4px;text-transform:uppercase}
    .back{border:0;border-radius:9px;background:#fff;color:#1f2724;padding:7px 9px;font-weight:800;cursor:pointer}
    .nav[hidden]{display:none}
    .hamb-lines{display:grid;gap:4.2px;width:30.8px}.hamb-lines i{display:block;height:4.2px;background:currentColor;border-radius:2px}
    .directory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .directory button,.launch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;border:1px solid #bdc1bc;border-radius:8px;background:#fff;color:#202622;padding:11px 14px;text-align:left;font-weight:800;letter-spacing:.45px;cursor:pointer}
    .directory button:hover,.directory button:focus-visible,.launch:hover,.launch:focus-visible{outline:2px solid #1f2724;outline-offset:2px}
    #experienceView{width:100%;min-height:0}
    .lfm-tool-rotation{width:100%;min-height:0;padding:14px;background:var(--frame);display:grid;overflow:hidden;transition:background .25s ease}
    .lfm-tool-rotation[hidden]{display:none}
    .lfm-tool-rotation .inspiration{width:100%;height:auto;aspect-ratio:16/9;padding:0;background:var(--paper)}
    .experience-frame{display:block;width:100%;height:600px;border:0;background:#fff;border-radius:8px;overflow:hidden;transition:height .3s ease}
    .shell.experience-mode .stage{padding:0;background:var(--header)}
    .shell.experience-mode .experience-frame{border-radius:0}
    .shell.lfm-shared-frame-mode{background:var(--header)}
    .shell.lfm-shared-frame-mode #experienceView{background:var(--header);padding-bottom:17.5px}
    .shell.lfm-shared-frame-mode .stage{margin-left:0;margin-right:0}
    .shell.lfm-shared-frame-mode .lfm-tool-rotation{padding:17.5px;background:var(--header)}
    .shell.lfm-shared-frame-mode .lfm-tool-rotation .inspiration{background:var(--paper)}
    .shell.lfm-shared-frame-mode .experience-frame{width:calc(100% - 35px);margin:0 17.5px}
    .experience-copy,.launch{display:none}
    .deck{position:relative;isolation:isolate;margin:0 0 16px;padding:14px 10px calc(17px + 3in);background:var(--deck);border-radius:3px 3px 50% 50%/3px 3px 32% 32%;display:grid;transition:background-color .25s ease;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .deck::before{content:"";position:absolute;z-index:-1;inset:0 var(--frame-border) var(--frame-bottom-border);background:var(--trough-fill);border-radius:8px 8px 50% 50%/8px 8px 34% 34%;pointer-events:none;transition:background-color .25s ease}
    .shell.home-mode .deck{min-height:329px;margin-bottom:0;padding:24px 22px 117px;column-gap:14px;row-gap:22px;align-content:start;border-radius:0 0 50% 50%/0 0 var(--trough-curve) var(--trough-curve)}
    .shell.home-mode .deck::before{border-radius:0 0 50% 50%/0 0 var(--trough-curve) var(--trough-curve)}
    .nav{min-width:0;border:0;background:transparent;color:var(--trough-ink);padding:3px 2px;cursor:pointer;display:grid;grid-template-rows:58px auto;align-items:start;justify-items:center;gap:8px}
    .nav:hover,.nav:focus-visible,.nav.active{color:var(--trough-ink);outline:none}
    .nav svg{width:56px;height:56px;padding:9px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .nav span:last-child{font-size:18px;line-height:1.1;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:normal;text-align:center}
    .nav .hamb-lines{width:56px;height:56px;padding:15px 11px;display:grid;align-content:center;gap:5px;border:1px solid rgba(255,255,255,.42);border-radius:50%;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
    .nav .hamb-lines i{height:4px}
    .deck.meditation-mode .normal-control{position:absolute;opacity:0;pointer-events:none}
    .deck.meditation-mode{padding-top:31px;padding-bottom:20px}
    .deck.compact-trough-mode{padding-bottom:20px}
    .lfm-tool-controls{grid-column:1/-1;display:none;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;padding:0 6px}
    .deck.lfm-tool-mode{padding:18px 10px 20px;border-radius:3px 3px 14px 14px}
    .deck.lfm-tool-mode .normal-control{display:none}
    .deck.lfm-tool-mode .lfm-tool-controls{display:grid;animation:controlFadeIn .28s .08s ease both}
    .deck.meditation-mode.meditation-session-active{padding:18px 10px 20px;border-radius:3px 3px 14px 14px}
    .deck.meditation-mode.meditation-session-active .med-controls{grid-template-columns:repeat(3,minmax(0,1fr));padding:0 6px}
    .deck.meditation-mode.meditation-session-active [data-med-command="menu"],.deck.meditation-mode.meditation-session-active .med-menu{display:none}
    .med-progress{position:absolute;z-index:3;top:0;left:0;right:0;display:none;width:auto;height:30px;border:0;background:transparent;padding:0 25px;cursor:pointer;transform:translateY(-50%);-webkit-tap-highlight-color:transparent}
    .med-progress-track{display:block;position:relative;width:100%;height:3px;border-radius:999px;background:rgba(255,255,255,.28);overflow:visible}
    .med-progress-fill{position:relative;display:block;width:0;height:100%;border-radius:inherit;background:#a7c526;transition:width .2s linear}
    .med-progress-fill::after{content:"";position:absolute;top:50%;right:-15px;width:30px;height:30px;border:3px solid #315f12;border-radius:50%;background:#a7c526;box-shadow:0 0 0 2px rgba(0,0,0,.45);transform:translateY(-50%)}
    .med-progress:focus-visible{outline:2px solid #fff;outline-offset:2px}
    .deck.meditation-mode .med-progress{display:none}
    .med-controls{grid-column:1/-1;display:none;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;padding:2px 6px 0}
    .deck.meditation-mode .med-controls{display:grid;animation:controlFadeIn .28s .14s ease both}
    .med-control{border:0;background:transparent;color:#fff;display:grid;justify-items:center;gap:5px;padding:0;cursor:pointer;outline:none}
    .med-circle{width:42px;height:42px;border:2px solid #a7c526;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;font-size:18px;font-weight:900;transition:transform .18s ease,background .18s ease}
    .med-control:hover .med-circle,.med-control:focus-visible .med-circle{background:#86a41d;transform:translateY(-2px);outline:none}
    .med-control.play-control{position:relative;transform:translateY(10px)}
    .med-countdown{position:absolute;left:100%;bottom:calc(100% + 13px);transform:translateX(-50%);min-width:54px;text-align:center;font-size:14px!important;font-weight:800!important;letter-spacing:1px!important;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-variant-numeric:tabular-nums;pointer-events:none}
    .med-control.play-control .med-circle{width:58px;height:58px;background:#85a620;border:5px solid #315f12;font-size:25px}
    .med-control span:last-child{font-size:8px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}
    /* GOALS + HABITS PLAYER NAV — Scott's approved centered three-button cluster.
       This replaces the small labeled controls only in the Goals and Habits troughs. */
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls{grid-template-columns:repeat(3,58px);justify-content:center;align-items:center;gap:18px;padding:0}
    .shell:is(.daily-habits-mode,.goals-mode) .deck.lfm-tool-mode{padding-top:16px;padding-bottom:22px}
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls .med-control{display:grid;place-items:center}
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls .med-circle{width:58px;height:58px;border:7px solid #8f8f8f;background:#000;color:#fff;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.28)}
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls .med-control:hover .med-circle,
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls .med-control:focus-visible .med-circle{background:#000;filter:brightness(1.12);transform:translateY(-1px)}
    .shell:is(.daily-habits-mode,.goals-mode) .lfm-tool-controls .med-control>span:last-child{display:none}
    .med-menu{grid-column:1/-1;margin:24px 14px 0;padding:18px;border:1px solid #7f847e;border-radius:10px;background:var(--deck);color:#fff;animation:fadeIn .22s ease both}
    .deck:not(.meditation-mode) .med-menu{display:none}
    .med-menu[hidden]{display:none}.med-menu h2{margin:0 0 14px;font-size:18px;letter-spacing:1px;text-transform:uppercase}
    .med-menu-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
    .med-menu-row.mode{grid-template-columns:repeat(2,1fr)}
    .med-option{border:1px solid #aab1a6;border-radius:999px;background:#6b706a;color:#fff;padding:9px 6px;font-weight:800;cursor:pointer}
    .med-option.active{background:#171b18;color:#fff;border-color:#a7c526}
    .guided-note{margin:10px 0 0;font-size:12px;color:#dedbd2}
    @keyframes controlFadeOut{to{opacity:0;transform:translateY(6px)}}@keyframes controlFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:620px){
      .cap{margin:0;padding:35px 8px 17px;font-size:22px;letter-spacing:2px}
      .stage{margin:0;padding:22px 14px}
      .shell.home-mode .stage{height:auto;max-height:none;aspect-ratio:auto;padding:17.5px}
      .directory{grid-template-columns:1fr}
      .deck{margin:0 0 10px;grid-template-columns:repeat(4,minmax(0,1fr))}
      .shell.home-mode .deck{min-height:317px;padding:22px 10px 113px;column-gap:7px;row-gap:18px}
      .nav span:last-child{font-size:16px;letter-spacing:1px}
    }
    @media(prefers-reduced-motion:reduce){.shell,.stage{transition:none}.view{animation:none}.stage.ci-stage-fade-out{opacity:1}}
  </style>
</head>
<body>
  <main class="shell home-mode" aria-label="Cosmic Intentions master dashboard">
    <header class="cap" id="capTitle">Affirmation</header>
    <section class="stage" id="stage">
      <div class="view" id="homeView">
        <div class="inspiration" id="dailyInspiration">
          <img class="inspiration-card" id="inspirationCard" alt="" decoding="async" fetchpriority="high">
          <div class="inspiration-kind" id="inspirationKind">Affirmation</div>
          <blockquote class="statement" id="statement">I AM BECOMING THE PERSON MY FUTURE SELF ALREADY IS.</blockquote>
          <div class="inspiration-author" id="inspirationAuthor" hidden></div>
        </div>
      </div>
      <div class="view" id="directoryView" hidden>
        <div class="view-head"><h1 class="view-title">Menu</h1></div>
        <div class="directory" id="directory"></div>
      </div>
      <div class="view" id="experienceView" hidden>
        <section class="lfm-tool-rotation" id="lfmToolRotation" aria-label="Daily rotating affirmation, belief or quote" hidden>
          <div class="inspiration" id="toolDailyInspiration">
            <img class="inspiration-card" id="toolInspirationCard" alt="" decoding="async">
            <div class="inspiration-kind" id="toolInspirationKind">Affirmation</div>
            <blockquote class="statement" id="toolStatement">I AM BECOMING THE PERSON MY FUTURE SELF ALREADY IS.</blockquote>
            <div class="inspiration-author" id="toolInspirationAuthor" hidden></div>
          </div>
        </section>
        <iframe class="experience-frame" id="experienceFrame" title="Cosmic Intentions tool" loading="eager" allow="autoplay; fullscreen" allowfullscreen scrolling="no"></iframe>
      </div>
    </section>
    <nav class="deck" aria-label="Master dashboard controls">
      <button class="nav normal-control" data-action="meditation" aria-label="Meditate"><svg viewBox="0 0 28 28"><circle cx="12" cy="5" r="2"/><path d="M12 9v7l-6 7m6-6 7 2m-7-6 5-4M5 23h15"/></svg><span>Meditate</span></button>
      <button class="nav normal-control" data-action="daily-habits" aria-label="Daily Habits"><svg viewBox="0 0 28 28"><path d="M7 5h14v19H7zM11 2h6v6h-6zM11 12h6m-6 4h6m-6 4h5"/></svg><span>Habits</span></button>
      <button class="nav normal-control" data-action="goals" aria-label="Goals"><svg viewBox="0 0 28 28"><circle cx="13" cy="14" r="10"/><circle cx="13" cy="14" r="6"/><circle cx="13" cy="14" r="2"/><path d="m15 12 9-9m-4 0h4v4"/></svg><span>Goals</span></button>
      <button class="nav normal-control" data-action="visualization" aria-label="Visualize"><svg viewBox="0 0 28 28"><path d="M2 14q12-12 24 0-12 12-24 0Z"/><circle cx="14" cy="14" r="4"/></svg><span>Visualize</span></button>
      <button class="nav normal-control" data-action="action-plan" aria-label="Action Plan"><svg viewBox="0 0 28 28"><path d="M8 5c4 2 5 7 2 11s-7 3-8-1 2-8 6-10Zm12 7c4 2 6 7 3 10s-7 1-7-3 1-6 4-7Z"/></svg><span>Action Plan</span></button>
      <button class="nav normal-control" data-action="cosmic-library" aria-label="Cosmic Library"><svg viewBox="0 0 28 28"><path d="M12 18q8-7 10-16-9 2-16 10Z"/><circle cx="17" cy="7" r="2"/><path d="m8 14-6 2 5 3m5-5 2 6-4 1m-4 1-3 4"/></svg><span>Library</span></button>
      <button class="nav normal-control" id="lfmBack" data-home aria-label="Back" hidden><svg viewBox="0 0 28 28"><path d="M22 14H6m7-7-7 7 7 7"/></svg><span>Back</span></button>
      <button class="nav normal-control" id="lfmMenu" data-menu aria-label="Menu"><span class="hamb-lines" aria-hidden="true"><i></i><i></i><i></i></span><span>Menu</span></button>
      <div class="lfm-tool-controls" id="lfmToolControls" aria-label="Long Form Manifestation controls">
        <button class="med-control" type="button" data-home><span class="med-circle">◀</span><span>Back</span></button>
        <button class="med-control" type="button" data-lfm-mini-command="menu"><span class="med-circle">☰</span><span>LFM Menu</span></button>
        <button class="med-control" type="button" data-lfm-mini-command="forward"><span class="med-circle">▶</span><span>Next</span></button>
      </div>
      <button class="med-progress" id="medProgress" type="button" aria-label="Meditation progress; click to seek"><span class="med-progress-track"><span class="med-progress-fill" id="medProgressFill"><span class="med-countdown" id="medCountdown">15:00</span></span></span></button>
      <div class="med-controls" id="meditationControls" aria-label="Meditation controls">
        <button class="med-control" type="button" data-med-command="back"><span class="med-circle">◀</span><span>Back</span></button>
        <button class="med-control" type="button" data-lfm-mini-command="menu"><span class="med-circle">☰</span><span>LFM Menu</span></button>
        <button class="med-control" type="button" data-lfm-mini-command="forward"><span class="med-circle">▶</span><span>Next</span></button>
      </div>
        <section class="med-menu" id="meditationMenu" aria-label="Meditation choices" hidden>
          <h2>Meditation Menu</h2>
          <div><strong>Style</strong></div>
          <div class="med-menu-row mode" id="meditationModes">
            <button class="med-option active" type="button" data-med-mode="unguided">Unguided</button>
            <button class="med-option" type="button" data-med-mode="guided">Guided</button>
          </div>
          <div style="margin-top:14px"><strong>Time</strong></div>
          <div class="med-menu-row" id="meditationTimes">
            <button class="med-option" type="button" data-med-time="2">2 min</button>
            <button class="med-option" type="button" data-med-time="5">5 min</button>
            <button class="med-option" type="button" data-med-time="10">10 min</button>
            <button class="med-option active" type="button" data-med-time="15">15 min</button>
            <button class="med-option" type="button" data-med-time="30">30 min</button>
          </div>
          <p class="guided-note" id="guidedNote" hidden>Guided mode is selected. Guided audio will connect here as sessions are added.</p>
        </section>
    </nav>
  </main>
  <script type="module">
    import { getDailyInspiration } from './daily-inspiration.js';
    (() => {
      const params=new URLSearchParams(location.search);
      const inspiration=getDailyInspiration();
      const entrepreneurCards=[
        'ENT - FAIRNESS.PNG',
        'ENT - GOOD LISTENER.PNG',
        'ENT - METICULOUS PLANNER.PNG',

        'ENT STRONG WORK ETHIC.PNG',
        'ENT SUCCESSFUL NEGOTIATOR.PNG',
        'ORGANIZATIONAL SKILLS.JPG'
      ];
      const toolCardByAction={
        goals:'ENT STRATEGIC THINKER.PNG',
        'daily-habits':'ENT DISCIPLINED.PNG',
        'action-plan':'ENT - METICULOUS PLANNER.PNG',
        visualization:'ENT OUTSIDE BOX.PNG',
        meditation:'ENT BALANCE IN LIFE.PNG',
        favorites:'ENT MANAGING TIME WISELY.PNG',
        gratitude:'ENT EMPATHETIC.PNG',
        journal:'ENT - GOOD LISTENER.PNG',
        thoughts:'ENT SKILLFUL COMMUNICATOR.PNG',
        wins:'ENT SELF CONFIDENT.PNG',
        proof:'ENT LIVING THE BRAND.PNG',
        'cosmic-library':'ENT QUALITY PEOPLE.PNG',
        'quickie-move':'ENT SELF STARTER.PNG',

      };
      const cardAlt=file=>file.replace(/\.(png|jpe?g)$/i,'').replace(/^ENT\s*-?\s*/i,'Entrepreneur affirmation: ').replace(/\s+copy$/i,'');
      const goalRaw=params.get('goal')??params.get('idx');
      const goalIndex=goalRaw===null?null:Number.parseInt(goalRaw,10);
      const goalColors=['#E84040','#E86030','#E88020','#E8A828','#E8C830','#A8C830','#48B860','#38A888','#2898A8','#7888A8','#3878A8'];
      const items=[
        ['goals','Goals','Review and work with your active intentions.'],
        ['daily-habits','Habits','Build the repeatable actions that support your goals.'],
        ['action-plan','Roadmap','Turn intentions into clear next steps.'],
        ['visualization','Visualize','Enter the visual manifestation experience.'],
        ['meditation','Meditate','Choose and play a meditation session.'],
        ['favorites','My Favorites Autoplay','Build and play your saved daily sequence.'],
        ['gratitude','Gratitude','Practice gratitude and guided reflection.'],
        ['journal','My Journal','Write and revisit your journal entries.'],
        ['thoughts','My Thoughts','Capture ideas, notes and reflections.'],
        ['wins','My Wins','Record and review progress worth celebrating.'],
        ['proof','Proof','Collect evidence that your intentions are becoming real.'],
        ['cosmic-library','Cosmic Library','Browse every Cosmic Intentions resource.'],
        ['quickie-move','Quickie Move','Take one fast action right now.'],
        ['admin','Admin','Manage content and site controls.']
      ];
      const lfmTemplateActions=new Set(['goals','daily-habits','favorites','thoughts','journal','action-plan','visualization','gratitude','wins','cosmic-library']);
      const shell=document.querySelector('.shell');
      const stage=document.getElementById('stage');
      const home=document.getElementById('homeView'),directoryView=document.getElementById('directoryView'),experience=document.getElementById('experienceView');
      const experienceFrame=document.getElementById('experienceFrame'),cap=document.getElementById('capTitle');
      cap.textContent=inspiration.label;
      const toolRotation=document.getElementById('lfmToolRotation');
      const deck=document.querySelector('.deck'),meditationMenu=document.getElementById('meditationMenu');
      function dockDeck(insideExperience){
        if(insideExperience){
          if(deck.parentElement!==experience||deck.nextElementSibling!==experienceFrame)experience.insertBefore(deck,experienceFrame);
        }else if(deck.parentElement!==shell||deck.previousElementSibling!==stage){
          stage.insertAdjacentElement('afterend',deck);
        }
      }
      const meditationTimes=[2,5,10,15,30];let meditationMinutes=15,meditationMode='unguided',meditationSessionActive=false,meditationMenuOpen=false;
      const requestedCard=Number.parseInt(params.get('card'),10);
      let cardIndex;
      if(Number.isInteger(requestedCard)){
        cardIndex=((requestedCard%entrepreneurCards.length)+entrepreneurCards.length)%entrepreneurCards.length;
      }else{
        let lastCardIndex=-1;
        try{lastCardIndex=Number.parseInt(sessionStorage.getItem('ci-last-ent-card'),10)}catch(error){}
        const randomValue=globalThis.crypto?.getRandomValues
          ? globalThis.crypto.getRandomValues(new Uint32Array(1))[0]
          : Math.floor(Math.random()*0x100000000);
        cardIndex=randomValue%entrepreneurCards.length;
        if(entrepreneurCards.length>1&&cardIndex===lastCardIndex)cardIndex=(cardIndex+1)%entrepreneurCards.length;
        try{sessionStorage.setItem('ci-last-ent-card',String(cardIndex))}catch(error){}
      }
      const cardFile=entrepreneurCards[cardIndex];
      const inspirationCard=document.getElementById('inspirationCard');
      const inspirationPanel=document.getElementById('dailyInspiration');
      let homeTroughColors={outer:'#000',inner:'#000'};
      function colorFromBucket(entry){
        const channel=value=>Math.round(value/entry.count).toString(16).padStart(2,'0');
        return '#'+channel(entry.r)+channel(entry.g)+channel(entry.b);
      }
      function applyTroughColors(){
        shell.style.setProperty('--header','#292929');
        shell.style.setProperty('--deck','#292929');
        shell.style.setProperty('--trough-fill','#747474');
        shell.style.setProperty('--trough-ink','#fff');
      }
      function matchTroughsToCard(img,rememberHome=false){
        try{
          const canvas=document.createElement('canvas');
          canvas.width=96;canvas.height=54;
          const context=canvas.getContext('2d',{willReadFrequently:true});
          context.drawImage(img,0,0,canvas.width,canvas.height);
          const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
          const edgeBuckets=new Map(),allBuckets=new Map();
          const addPixel=(buckets,offset)=>{
            const key=(pixels[offset]>>4)+','+(pixels[offset+1]>>4)+','+(pixels[offset+2]>>4);
            const entry=buckets.get(key)||{count:0,r:0,g:0,b:0};
            entry.count++;entry.r+=pixels[offset];entry.g+=pixels[offset+1];entry.b+=pixels[offset+2];
            buckets.set(key,entry);
          };
          for(let y=0;y<canvas.height;y++){
            for(let x=0;x<canvas.width;x++){
              const offset=(y*canvas.width+x)*4;
              if(pixels[offset+3]<220)continue;
              addPixel(allBuckets,offset);
              if(x<=4||x>=canvas.width-5||y<=4||y>=canvas.height-5)addPixel(edgeBuckets,offset);
            }
          }
          const outerEntry=[...edgeBuckets.values()].sort((a,b)=>b.count-a.count)[0];
          if(!outerEntry)throw new Error('No readable border pixels');
          const outerRgb=[outerEntry.r,outerEntry.g,outerEntry.b].map(value=>value/outerEntry.count);
          const innerEntry=[...allBuckets.values()]
            .filter(entry=>{
              const rgb=[entry.r,entry.g,entry.b].map(value=>value/entry.count);
              const max=Math.max(...rgb),min=Math.min(...rgb);
              const distance=Math.hypot(rgb[0]-outerRgb[0],rgb[1]-outerRgb[1],rgb[2]-outerRgb[2]);
              return !(min>224&&max>238)&&max>35&&distance>48;
            })
            .sort((a,b)=>b.count-a.count)[0]||outerEntry;
          const colors={outer:colorFromBucket(outerEntry),inner:colorFromBucket(innerEntry)};
          if(rememberHome)homeTroughColors=colors;
          applyTroughColors(colors.outer,colors.inner);
        }catch(error){
          const colors={outer:'#000',inner:'#000'};
          if(rememberHome)homeTroughColors=colors;
          applyTroughColors(colors.outer,colors.inner);
        }
      }
      inspirationCard.alt=cardAlt(cardFile);
      inspirationCard.addEventListener('load',()=>{inspirationPanel.classList.add('has-card');matchTroughsToCard(inspirationCard,true)},{once:true});
      inspirationCard.addEventListener('error',()=>{inspirationCard.hidden=true},{once:true});
      inspirationCard.src='/images/entrepreneur-library/'+encodeURIComponent(cardFile);
      document.getElementById('inspirationKind').textContent=inspiration.label;
      document.getElementById('statement').textContent=inspiration.text;
      const inspirationAuthor=document.getElementById('inspirationAuthor');
      inspirationAuthor.hidden=!inspiration.author;
      inspirationAuthor.textContent=inspiration.author?'— '+inspiration.author:'';
      const toolInspirationCard=document.getElementById('toolInspirationCard');
      const toolInspirationPanel=document.getElementById('toolDailyInspiration');
      let toolCardTransitionId=0;
      function setToolCard(action){
        const transitionId=++toolCardTransitionId;
        const itemIndex=Math.max(0,items.findIndex(item=>item[0]===action));
        const file=toolCardByAction[action]||entrepreneurCards[(cardIndex+itemIndex+1)%entrepreneurCards.length];
        const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        toolInspirationPanel.classList.remove('has-card');
        return new Promise(resolve=>{
          const swapCard=()=>{
            if(transitionId!==toolCardTransitionId){resolve();return}
            toolInspirationCard.hidden=false;
            toolInspirationCard.alt=cardAlt(file);
            toolInspirationCard.onload=()=>{
              if(transitionId!==toolCardTransitionId){resolve();return}
              matchTroughsToCard(toolInspirationCard);
              requestAnimationFrame(()=>requestAnimationFrame(()=>{
                toolInspirationPanel.classList.add('has-card');
                resolve();
              }));
            };
            toolInspirationCard.onerror=()=>{
              toolInspirationCard.hidden=true;
              toolInspirationPanel.classList.remove('has-card');
              resolve();
            };
            toolInspirationCard.src='/images/entrepreneur-library/'+encodeURIComponent(file);
          };
          if(reduced)swapCard();
          else window.setTimeout(swapCard,3000);
        });
      }
      document.getElementById('toolInspirationKind').textContent=inspiration.label;
      document.getElementById('toolStatement').textContent=inspiration.text;
      const toolInspirationAuthor=document.getElementById('toolInspirationAuthor');
      toolInspirationAuthor.hidden=!inspiration.author;
      toolInspirationAuthor.textContent=inspiration.author?'— '+inspiration.author:'';
      let selected=null,heightFrame=0;
      function reportHeight(){
        if(heightFrame)return;
        heightFrame=requestAnimationFrame(()=>{
          heightFrame=0;
          const height=Math.ceil(shell.getBoundingClientRect().height);
          parent.postMessage({type:'ci-lfm-height',height},location.origin);
        });
      }
      function show(view){
        shell.classList.toggle('home-mode',view===home);
        shell.classList.toggle('experience-mode',view===experience);
        [home,directoryView,experience].forEach(v=>v.hidden=v!==view);
        document.querySelectorAll('.nav[data-action]').forEach(n=>n.classList.toggle('active',n.dataset.action===selected));
        document.getElementById('lfmBack').hidden=view===home;
        reportHeight();
      }
      function setMeditationMode(active){
        if(!active)meditationSessionActive=false;
        meditationMenuOpen=false;
        deck.classList.toggle('meditation-mode',active);
        deck.classList.toggle('meditation-session-active',active&&meditationSessionActive);
        shell.classList.toggle('meditation-player-mode',active);
        meditationMenu.hidden=true;
      }
      function notifyParentMode(action){
        try{parent.postMessage({type:'ci-lfm-mode',action:action},location.origin)}catch(_){}
      }
      let experienceObserver=null,experienceMutationObserver=null,settleTimer=0;
      function clearExperienceObservers(){
        if(experienceObserver){experienceObserver.disconnect();experienceObserver=null}
        if(experienceMutationObserver){experienceMutationObserver.disconnect();experienceMutationObserver=null}
        if(settleTimer){window.clearTimeout(settleTimer);settleTimer=0}
      }
      function transitionStage(commit){
        let result;
        try{result=commit()}catch(error){throw error}
        Promise.resolve(result).finally(reportHeight);
      }
      function applyHomeMode(){
        notifyParentMode('home');
        selected=null;dockDeck(false);shell.classList.remove('daily-habits-mode','goals-mode','lfm-shared-frame-mode');deck.classList.remove('compact-trough-mode','lfm-tool-mode');toolRotation.hidden=true;setMeditationMode(false);clearExperienceObservers();experienceFrame.src='about:blank';experienceFrame.style.height='600px';shell.style.setProperty('--frame','#292929');shell.style.setProperty('--paper','#f2ede7');applyTroughColors(homeTroughColors.outer,homeTroughColors.inner);cap.textContent=inspiration.label;show(home);
      }
      function homeMode(){transitionStage(applyHomeMode)}
      function visibleContentHeight(root){
        const view=root.ownerDocument.defaultView;
        const scrollTop=view?view.scrollY:0;
        const rootTop=root.getBoundingClientRect().top+scrollTop;
        let bottom=rootTop;
        root.querySelectorAll('*').forEach(el=>{
          const style=getComputedStyle(el);
          if(style.display==='none'||style.visibility==='hidden'||style.opacity==='0'||style.position==='fixed')return;
          const rect=el.getBoundingClientRect();
          if(rect.width<=0||rect.height<=0)return;
          bottom=Math.max(bottom,rect.bottom+scrollTop);
        });
        const paddingBottom=parseFloat(getComputedStyle(root).paddingBottom)||0;
        return Math.ceil(Math.max(1,root.scrollHeight,bottom-rootTop+paddingBottom));
      }
      function fitExperience(){
        if(!selected)return;
        if(selected==='meditation'){
          experienceFrame.style.height=(experienceFrame.clientWidth*9/16)+'px';
          reportHeight();
          return;
        }
        try{
          const doc=experienceFrame.contentDocument;
          if(!doc)return;
          const active=doc.querySelector('.page.active, main, [role="main"]');
          if(!active)return;
          const height=Math.max(180,selected==='cosmic-library'?active.scrollHeight:visibleContentHeight(active));
          if(height>0&&Math.abs(height-experienceFrame.offsetHeight)>2){
            experienceFrame.style.height=height+'px';
          }
        }catch(_){}
        reportHeight();
      }
      experienceFrame.addEventListener('load',()=>{
        clearExperienceObservers();
        [80,250,600,1200,2500,5000].forEach(delay=>window.setTimeout(fitExperience,delay));
        window.setTimeout(()=>{
          fitExperience();
          if(selected==='meditation')return;
          try{
            const doc=experienceFrame.contentDocument;
            const active=doc&&doc.querySelector('.page.active, main, [role="main"]');
            if(!active)return;
            if('ResizeObserver'in window){
              experienceObserver=new ResizeObserver(()=>fitExperience());
              const resizeTargets=[active];
              resizeTargets.filter(Boolean).forEach(node=>experienceObserver.observe(node));
            }
            if('MutationObserver'in window){
              experienceMutationObserver=new MutationObserver(()=>{
                fitExperience();
                if(settleTimer)window.clearTimeout(settleTimer);
                settleTimer=window.setTimeout(fitExperience,120);
              });
              experienceMutationObserver.observe(active,{subtree:true,childList:true,characterData:true,attributes:true});
            }
          }catch(_){}
        },350);
      });
      function destinationUrl(action){
        if(action==='meditation')return '/players/meditation.html?v=lfm-16x9-1&t='+meditationMinutes+'&mode='+meditationMode+'&external=1';
        const url=new URL('/',location.origin);
        url.searchParams.set('masterInline',action);
        url.searchParams.set('lfm','fullheight-1');
        if(Number.isInteger(goalIndex))url.searchParams.set('goal',String(goalIndex));
        return url.pathname+url.search;
      }
      function applySelection(action){
        if(action==='citadel'){
          applyHomeMode();
          cap.textContent=inspiration.label;
          notifyParentMode('citadel');
          reportHeight();
          return;
        } // Safety: never embed Citadel inside its own LFM shell.
        notifyParentMode(action);
        if(action==='everything'){selected='everything';dockDeck(false);shell.classList.remove('daily-habits-mode','goals-mode','lfm-shared-frame-mode');deck.classList.remove('compact-trough-mode','lfm-tool-mode');toolRotation.hidden=true;cap.textContent='Cosmic Intentions Dashboard';show(directoryView);return}
        const item=items.find(i=>i[0]===action); if(!item)return;
        selected=action;
        const usesLfmTemplate=lfmTemplateActions.has(action);
        dockDeck(usesLfmTemplate);
        shell.classList.toggle('daily-habits-mode',action==='daily-habits');
        shell.classList.toggle('goals-mode',action==='goals');
        shell.classList.toggle('lfm-shared-frame-mode',usesLfmTemplate);
        deck.classList.toggle('compact-trough-mode',usesLfmTemplate);
        deck.classList.toggle('lfm-tool-mode',usesLfmTemplate);
        toolRotation.hidden=!usesLfmTemplate;
        if(usesLfmTemplate)setToolCard(action);
        setMeditationMode(action==='meditation');
        const paletteIndex=Number.isInteger(goalIndex)&&goalIndex>=0?goalIndex:0;
        shell.style.setProperty('--frame','#292929');
        shell.style.setProperty('--paper',action==='daily-habits'?'#5f645e':'#f2ede7');
        clearExperienceObservers();
        cap.textContent=usesLfmTemplate?inspiration.label:(action==='daily-habits'?'Habits':item[1]);
        experienceFrame.title=item[1];
        experienceFrame.style.height=action==='meditation'?(experienceFrame.clientWidth*9/16)+'px':'600px';
        const nextUrl=destinationUrl(action);
        const frameReady=new Promise(resolve=>{
          let settled=false;
          const done=()=>{if(settled)return;settled=true;resolve()};
          experienceFrame.addEventListener('load',done,{once:true});
          window.setTimeout(done,650);
        });
        experienceFrame.src=nextUrl;show(experience);
        return frameReady;
      }
      function select(action){transitionStage(()=>applySelection(action))}
      function syncMeditationUI(){
        document.querySelectorAll('[data-med-time]').forEach(b=>b.classList.toggle('active',Number(b.dataset.medTime)===meditationMinutes));
        document.querySelectorAll('[data-med-mode]').forEach(b=>b.classList.toggle('active',b.dataset.medMode===meditationMode));
        const modeIcon=document.getElementById('medModeIcon');
        const modeLabel=document.getElementById('medModeLabel');
        if(modeIcon)modeIcon.textContent=meditationMode==='guided'?'G':'U';
        if(modeLabel)modeLabel.textContent=meditationMode==='guided'?'Guided':'Unguided';
        document.getElementById('guidedNote').hidden=meditationMode!=='guided';
      }
      function reloadMeditation(){experienceFrame.src=destinationUrl('meditation');syncMeditationUI()}
      function sendMeditation(command,extra={}){experienceFrame.contentWindow?.postMessage({type:'ci-meditation-command',command,...extra},location.origin)}
      document.getElementById('medProgress').addEventListener('click',event=>{
        const rect=event.currentTarget.querySelector('.med-progress-track').getBoundingClientRect();
        const ratio=Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
        sendMeditation('seek',{ratio});
      });
      document.querySelectorAll('[data-lfm-mini-command]').forEach(button=>button.addEventListener('click',()=>{
        const command=button.dataset.lfmMiniCommand;
        if(command==='menu'){select('everything');return}
        const current=Math.max(0,items.findIndex(item=>item[0]===selected));
        const step=command==='back'?-1:1;
        select(items[(current+step+items.length)%items.length][0]);
      }));
      document.querySelectorAll('[data-med-command]').forEach(button=>button.addEventListener('click',()=>{
        const command=button.dataset.medCommand;
        if(command==='back'){homeMode();return}
        if(command==='menu'){meditationMenuOpen=!meditationMenuOpen;meditationMenu.hidden=!meditationMenuOpen;reportHeight();return}
        if(command==='toggle'){sendMeditation('toggle');return}
        if(command==='mode'){meditationMode=meditationMode==='guided'?'unguided':'guided';reloadMeditation();return}
        const index=meditationTimes.indexOf(meditationMinutes);
        if(command==='shorter'&&index>0){meditationMinutes=meditationTimes[index-1];reloadMeditation()}
        if(command==='longer'&&index<meditationTimes.length-1){meditationMinutes=meditationTimes[index+1];reloadMeditation()}
      }));
      document.querySelectorAll('[data-med-time]').forEach(button=>button.addEventListener('click',()=>{meditationMinutes=Number(button.dataset.medTime);reloadMeditation()}));
      document.querySelectorAll('[data-med-mode]').forEach(button=>button.addEventListener('click',()=>{meditationMode=button.dataset.medMode;reloadMeditation()}));
      addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==parent)return;
        const data=event.data||{};
        if(data.type==='ci-lfm-select'&&data.action){if(data.action==='home')homeMode();else select(data.action);return}
        if(data.type==='ci-lfm-guide-command'){
          if(data.command==='back'){homeMode();return}
          if(data.command==='menu'){select('everything');return}
          if(data.command==='forward'){
            const current=Math.max(0,items.findIndex(item=>item[0]===selected));
            select(items[(current+1)%items.length][0]);
          }
        }
      });
      addEventListener('message',event=>{
        if(event.origin!==location.origin||event.source!==experienceFrame.contentWindow)return;
        const data=event.data||{};
        if(data.type==='ci-lfm-mini-nav'){
          if(data.command==='menu'){select('everything');return}
          const current=Math.max(0,items.findIndex(item=>item[0]===selected));
          const step=data.command==='back'?-1:1;
          select(items[(current+step+items.length)%items.length][0]);
          return;
        }
        if(data.type!=='ci-meditation-state')return;
        const sessionActive=data.state!=='ready';
        if(sessionActive!==meditationSessionActive){
          meditationSessionActive=sessionActive;
          deck.classList.toggle('meditation-session-active',sessionActive);
          meditationMenu.hidden=sessionActive||!meditationMenuOpen;
          reportHeight();
        }
        const running=data.state==='running';
        const remaining=Math.max(0,Number(data.remaining)||0);
        const total=Math.max(1,(Number(data.minutes)||meditationMinutes)*60000);
        const wholeSeconds=Math.max(0,Math.ceil(remaining/1000));
        const mm=Math.floor(wholeSeconds/60),ss=wholeSeconds%60;
        document.getElementById('medCountdown').textContent=String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
        document.getElementById('medProgressFill').style.width=(Math.max(0,Math.min(1,1-remaining/total))*100)+'%';
        const playIcon=document.getElementById('medPlayIcon');
        const playLabel=document.getElementById('medPlayLabel');
        if(playIcon)playIcon.textContent=running?'Ⅱ':'▶';
        if(playLabel)playLabel.textContent=running?'Pause':data.state==='paused'?'Resume':'Play';
      });
      syncMeditationUI();
      const grid=document.getElementById('directory');
      items.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+label+'</span><span aria-hidden="true">›</span>';b.addEventListener('click',()=>select(key));grid.appendChild(b)});
      document.querySelectorAll('.nav[data-action]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.action)));
      document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',homeMode));
      document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>select('everything')));
      addEventListener('resize',()=>{fitExperience();reportHeight()});
      if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(shell);
      const initialAction=params.get('start');
      if(initialAction&&items.some(item=>item[0]===initialAction))applySelection(initialAction);
      reportHeight();
      window.setTimeout(reportHeight,120);
      window.setTimeout(reportHeight,600);
    })();
  </script>
