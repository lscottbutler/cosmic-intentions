<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Cosmic Intentions Dashboard</title>
  <style>
    :root{color-scheme:light;--frame:#82ad77;--header:#5f645e;--paper:#f2ede7;--deck:#171b18;--ink:#1f2724;--muted:#aab1a6;--line:#050706}
    *{box-sizing:border-box}
    html,body{width:100%;margin:0;overflow:hidden;background:transparent;font-family:"Arial Narrow","Nimbus Sans Narrow","Roboto Condensed",Arial,sans-serif}
    body{padding:0}
    button{font:inherit}
    .shell{width:100%;border:2px solid var(--line);background:var(--frame);overflow:hidden;transition:min-height .35s ease}
    .cap{margin:16px 14px 0;padding:14px 18px 13px;background:var(--header);color:#dedbd2;text-align:center;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:50% 50% 3px 3px/12% 12% 3px 3px}
    .stage{position:relative;margin:0 14px;background:var(--paper);color:var(--ink);min-height:134px;padding:28px 28px 26px;overflow:hidden;transition:min-height .35s ease,padding .35s ease}
    .view{animation:fadeIn .24s ease both}
    .view[hidden]{display:none}
    @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    .statement{min-height:80px;display:grid;place-items:center;text-align:center;text-transform:uppercase;font-size:clamp(19px,4.5vw,31px);font-weight:800;line-height:1.45;letter-spacing:2.2px}
    .view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}
    .view-title{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:1.4px;text-transform:uppercase}
    .back{border:1px solid #8b918c;border-radius:999px;background:#fff;color:#1f2724;padding:8px 13px;font-weight:800;cursor:pointer}
    .directory{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .directory button,.launch{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;border:1px solid #bdc1bc;border-radius:8px;background:#fff;color:#202622;padding:11px 14px;text-align:left;font-weight:800;letter-spacing:.45px;cursor:pointer}
    .directory button:hover,.directory button:focus-visible,.launch:hover,.launch:focus-visible{outline:2px solid #1f2724;outline-offset:2px}
    .experience-copy{margin:0 0 20px;font-size:16px;line-height:1.55}
    .launch{justify-content:center;background:#1f2724;color:#fff;border-color:#1f2724;text-transform:uppercase}
    .deck{margin:0 14px 16px;padding:14px 10px 17px;background:var(--deck);border-radius:3px 3px 50% 50%/3px 3px 14% 14%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
    .nav{min-width:0;border:0;background:transparent;color:var(--muted);padding:4px 2px;cursor:pointer;display:grid;justify-items:center;gap:5px}
    .nav:hover,.nav:focus-visible,.nav.active{color:#fff;outline:none}
    .nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .nav span{font-size:9px;font-weight:800;letter-spacing:.45px;text-transform:uppercase;white-space:nowrap}
    @media(max-width:620px){
      .cap{margin:10px 8px 0;padding:11px 8px;font-size:11px;letter-spacing:1.4px}
      .stage{margin:0 8px;padding:22px 14px}
      .directory{grid-template-columns:1fr}
      .deck{margin:0 8px 10px;grid-template-columns:repeat(4,minmax(0,1fr));border-radius:3px 3px 22px 22px}
      .nav span{font-size:8px}
    }
    @media(prefers-reduced-motion:reduce){.shell,.stage{transition:none}.view{animation:none}}
  </style>
</head>
<body>
  <main class="shell" aria-label="Cosmic Intentions master dashboard">
    <header class="cap" id="capTitle">Long Form Manifestation</header>
    <section class="stage" id="stage">
      <div class="view" id="homeView">
        <div class="statement" id="statement">I AM THE PROUD OWNER OF A SUCCESSFUL ONLINE TRAINING COURSE</div>
      </div>
      <div class="view" id="directoryView" hidden>
        <div class="view-head"><h1 class="view-title">Everything</h1><button class="back" data-home>Back</button></div>
        <div class="directory" id="directory"></div>
      </div>
      <div class="view" id="experienceView" hidden>
        <div class="view-head"><h1 class="view-title" id="experienceTitle"></h1><button class="back" data-home>Back</button></div>
        <p class="experience-copy" id="experienceCopy"></p>
        <button class="launch" id="launchButton">Open</button>
      </div>
    </section>
    <nav class="deck" aria-label="Master dashboard controls">
      <button class="nav" data-action="meditation" aria-label="Meditate"><svg viewBox="0 0 28 28"><circle cx="12" cy="5" r="2"/><path d="M12 9v7l-6 7m6-6 7 2m-7-6 5-4M5 23h15"/></svg><span>Meditate</span></button>
      <button class="nav" data-action="daily-habits" aria-label="Daily Habits"><svg viewBox="0 0 28 28"><path d="M7 5h14v19H7zM11 2h6v6h-6zM11 12h6m-6 4h6m-6 4h5"/></svg><span>Habits</span></button>
      <button class="nav" data-action="goals" aria-label="Goals"><svg viewBox="0 0 28 28"><circle cx="13" cy="14" r="10"/><circle cx="13" cy="14" r="6"/><circle cx="13" cy="14" r="2"/><path d="m15 12 9-9m-4 0h4v4"/></svg><span>Goals</span></button>
      <button class="nav" data-action="visualization" aria-label="Visualize"><svg viewBox="0 0 28 28"><path d="M2 14q12-12 24 0-12 12-24 0Z"/><circle cx="14" cy="14" r="4"/></svg><span>Visualize</span></button>
      <button class="nav" data-action="action-plan" aria-label="Action Plan"><svg viewBox="0 0 28 28"><path d="M8 5c4 2 5 7 2 11s-7 3-8-1 2-8 6-10Zm12 7c4 2 6 7 3 10s-7 1-7-3 1-6 4-7Z"/></svg><span>Action Plan</span></button>
      <button class="nav" data-action="cosmic-library" aria-label="Cosmic Library"><svg viewBox="0 0 28 28"><path d="M12 18q8-7 10-16-9 2-16 10Z"/><circle cx="17" cy="7" r="2"/><path d="m8 14-6 2 5 3m5-5 2 6-4 1m-4 1-3 4"/></svg><span>Library</span></button>
      <button class="nav" data-action="everything" aria-label="Everything"><svg viewBox="0 0 28 28"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="17" y="3" width="8" height="8" rx="1"/><rect x="3" y="17" width="8" height="8" rx="1"/><rect x="17" y="17" width="8" height="8" rx="1"/></svg><span>Everything</span></button>
    </nav>
  </main>
  <script>
    (() => {
      const params=new URLSearchParams(location.search);
      const statement=(params.get('text')||'I AM THE PROUD OWNER OF A SUCCESSFUL ONLINE TRAINING COURSE').trim().toUpperCase();
      const goalRaw=params.get('goal')??params.get('idx');
      const goalIndex=goalRaw===null?null:Number.parseInt(goalRaw,10);
      const items=[
        ['goals','Goals','Review and work with your active intentions.'],
        ['daily-habits','Daily Habits','Build the repeatable actions that support your goals.'],
        ['action-plan','Action Plan','Turn intentions into clear next steps.'],
        ['visualization','Visualize','Enter the visual manifestation experience.'],
        ['meditation','Meditate','Choose and play a meditation session.'],
        ['favorites','Favorites Autoplay','Build and play your saved daily sequence.'],
        ['gratitude','Gratitude','Practice gratitude and guided reflection.'],
        ['journal','Journal','Write and revisit your journal entries.'],
        ['thoughts','My Thoughts','Capture ideas, notes and reflections.'],
        ['wins','Wins','Record and review progress worth celebrating.'],
        ['proof','Proof','Collect evidence that your intentions are becoming real.'],
        ['cosmic-library','Cosmic Library','Browse every Cosmic Intentions resource.'],
        ['quickie-move','Quickie Move','Take one fast action right now.'],
        ['admin','Admin','Manage content and site controls.']
      ];
      const home=document.getElementById('homeView'),directoryView=document.getElementById('directoryView'),experience=document.getElementById('experienceView');
      const title=document.getElementById('experienceTitle'),copy=document.getElementById('experienceCopy'),launch=document.getElementById('launchButton'),cap=document.getElementById('capTitle');
      document.getElementById('statement').textContent=statement;
      let selected=null;
      const shell=document.querySelector('.shell');
      function reportHeight(){
        requestAnimationFrame(()=>{
          const height=Math.ceil(Math.max(shell.scrollHeight,shell.getBoundingClientRect().height));
          parent.postMessage({type:'ci-lfm-height',height},location.origin);
        });
      }
      function show(view){
        [home,directoryView,experience].forEach(v=>v.hidden=v!==view);
        document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.action===selected));
        reportHeight();
      }
      function homeMode(){selected=null;cap.textContent='Long Form Manifestation';show(home)}
      function select(action){
        if(action==='everything'){selected='everything';cap.textContent='Cosmic Intentions Dashboard';show(directoryView);return}
        const item=items.find(i=>i[0]===action); if(!item)return;
        selected=action;title.textContent=item[1];copy.textContent=item[2];launch.textContent='Open '+item[1];cap.textContent=item[1];show(experience);
      }
      function openDestination(action){
        let host=null;try{if(parent&&parent!==window)host=parent;else if(opener&&!opener.closed)host=opener}catch(_){}
        try{if(host&&typeof host.openMasterDestination==='function'){host.openMasterDestination(action,Number.isInteger(goalIndex)?goalIndex:null);return}}catch(_){}
        try{sessionStorage.setItem('ci_master_destination',JSON.stringify({action,goalIndex}))}catch(_){}
        location.assign('../');
      }
      const grid=document.getElementById('directory');
      items.forEach(([key,label])=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>'+label+'</span><span aria-hidden="true">›</span>';b.addEventListener('click',()=>select(key));grid.appendChild(b)});
      document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>select(b.dataset.action)));
      document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',homeMode));
      launch.addEventListener('click',()=>selected&&openDestination(selected));
      addEventListener('resize',reportHeight);
      if('ResizeObserver'in window)new ResizeObserver(reportHeight).observe(shell);
      reportHeight();
    })();
  </script>
</body>
</html>
