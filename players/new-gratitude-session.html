<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NEW GRATITUDE | Cosmic Intentions</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
body{display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}
.player{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#4c812f;border:2px solid #000;overflow:hidden}
.image{position:absolute;inset:3.45% 2.05% 3.35%;background:url('/images/meditation/meditation-1.jpg') center center/cover no-repeat}
.image.test-slides{background:#000!important;display:grid;place-items:center}.test-slide{display:block;width:100%;height:100%;object-fit:contain}.slide-error{position:absolute;z-index:6;inset:20% 10% auto;background:#292929;color:#fff;padding:20px;text-align:center;font:16px/1.5 Arial,sans-serif}
.ccb-curve{position:absolute;z-index:2;inset:0;width:100%;height:100%;display:block;pointer-events:auto;cursor:pointer}
.ccb-scrubber{position:absolute;z-index:5;left:1.8229167%;top:89.8148148%;width:1.5625%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:#a7c526;box-shadow:0 1px 3px rgba(0,0,0,.28);pointer-events:none}
.timer{position:absolute;z-index:4;left:50%;top:85.1851852%;transform:translate(-50%,-50%);width:10.4166667%;aspect-ratio:1;border:clamp(4px,1.5625vw,30px) solid #82ad77;border-radius:50%;padding:0;background:#a7c526;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.timer::before{display:none}
.timer:focus-visible{outline:none}
.value,.playicon{position:relative;z-index:1;color:#fff}
.value{font-size:clamp(22px,3.1vw,44px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.2px;white-space:pre-line;text-align:center}
.playicon{width:0;height:0;border-top:clamp(10px,1.3vw,20px) solid transparent;border-bottom:clamp(10px,1.3vw,20px) solid transparent;border-left:clamp(16px,2vw,30px) solid #fff;margin-left:7%}
.playicon.pauseicon{width:30%;height:40%;border:0;border-left:clamp(5px,.6vw,10px) solid #fff;border-right:clamp(5px,.6vw,10px) solid #fff;margin:0}
[hidden]{display:none!important}
body.external .player{width:100vw;height:100vh;aspect-ratio:auto;border:0;background:#292929}
body.external .image{inset:0}
body.external .ccb-curve rect{display:block;fill:none;stroke:#292929}
body.external .ccb-curve ellipse{fill:#292929;stroke:#747474}
body.external .ccb-scrubber{background:#f2f2f2}
body.external .timer{background:#747474;border-color:#292929}
/* Original grey player, with the current slide statement below its circle. */
.test-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide-caption{position:absolute;z-index:3;left:4%;right:4%;bottom:1.4%;height:4%;display:grid;place-items:center;color:#fff;text-align:center;font:800 clamp(8px,1.65vw,30px)/1.1 Arial,Helvetica,sans-serif;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.timer,.ccb-curve ellipse{transition:opacity 1s ease}
.player[data-phase="slides"]:not([data-state="ready"]):not([data-reveal="true"]) .timer,.player[data-phase="slides"]:not([data-state="ready"]):not([data-reveal="true"]) .ccb-curve ellipse{opacity:0}
.player[data-phase="slides"]:not([data-state="ready"]) .timer{pointer-events:none}
.slideshow-toggle{position:absolute;z-index:3;inset:0 0 16%;border:0;padding:0;background:transparent;cursor:pointer}
.slideshow-toggle:focus-visible{outline:2px solid #fff;outline-offset:-8px}
.timer:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.timer,.ccb-curve ellipse{transition:none}}
</style>
</head>
<body>
<main class="player" id="player" aria-label="NEW GRATITUDE player">
  <div class="image" aria-hidden="true"></div>
  <div class="slide-caption" id="slideCaption" hidden></div>
  <svg class="ccb-curve" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <ellipse cx="960" cy="1189" rx="1379" ry="296" fill="#292929" stroke="#747474" stroke-width="30"/>
    <rect x="17.5" y="17.5" width="1885" height="1045" fill="none" stroke="#292929" stroke-width="35"/>
  </svg>
  <span class="ccb-scrubber" id="ccbScrubber" aria-hidden="true" hidden></span>
  <button class="slideshow-toggle" id="slideshowToggle" type="button" aria-label="Pause gratitude slideshow" hidden></button>
  <button class="timer" id="timer" type="button" aria-label="Start gratitude">
    <span class="playicon" id="playIcon" aria-hidden="true"></span>
    <span class="value" id="value" hidden>15
00</span>
  </button>
</main>
<script>
(()=>{
  const allowed=[15,10,5,3,2,1,0.5,0.25];
  const search=new URLSearchParams(location.search);
  const requested=Number(search.get('t'));
  const external=search.get('external')==='1';
  if(external)document.body.classList.add('external');
  const minutes=allowed.includes(requested)?requested:15;
  const totalMs=minutes*60000;
  const player=document.getElementById('player');
  const button=document.getElementById('timer');
  const value=document.getElementById('value');
  const playIcon=document.getElementById('playIcon');
  const curve=document.querySelector('.ccb-curve');
  const scrubber=document.getElementById('ccbScrubber');
  const slideshowToggle=document.getElementById('slideshowToggle');
  const testModule=search.get('module')==='1';
  const slideFiles=['a-great-burger.avif','a-walk-in-nature.avif','comfort-food.avif','exotic-beach-vacation.avif','for-my-life-partner.avif'];
  const slideOriginalNames=['A GREAT BURGER.jpg','A WALK IN NATURE.jpg','COMFORT FOOD.jpg','EXOTIC BEACH VACATION.jpg','FOR MY LIFE PARTNER.jpg'];
  const slideNames=slideOriginalNames.map(name=>name.replace(/\.[^.]+$/,''));
  const slideStatements=slideNames.map(name=>'I AM GRATEFUL FOR '+name.replace(/^FOR\s+/i,''));
  const caption=document.getElementById('slideCaption');
  const slideHoldMs=8000,fadeMs=1000,slideSlotMs=slideHoldMs+fadeMs*2;
  const cardHoldMs=6000,openingMs=cardHoldMs+fadeMs,photoMs=slideFiles.length*slideSlotMs,closingMs=cardHoldMs+fadeMs*2;
  const introMs=openingMs+photoMs+closingMs;
  const openingFile='opening-card.webp',closingFile='reflection-card.webp';
  const openingText='GRATITUDE. Here are a few things that some in the Cosmic Community are grateful for.';
  const closingText='GRATITUDE. Now take a minute and reflect on some of the things in your life that your grateful for. As always, when you hear the Bell open your eyes and proceed.';
  const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
  const surface=document.querySelector('.image');
  let phase=testModule?'slides':'meditation',introRemaining=introMs;
  let slidesReady=!testModule,slideIndex=-1,slideImage=null;
  if(testModule){
    const surface=document.querySelector('.image');surface.classList.add('test-slides');surface.removeAttribute('aria-hidden');
    slideImage=document.createElement('img');slideImage.className='test-slide';surface.append(slideImage);button.disabled=true;
    Promise.all([openingFile,...slideFiles,closingFile].map(file=>new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=reject;image.src='/images/gratitude/test-module-1/'+file;}))).then(()=>{slidesReady=true;button.disabled=false;render();}).catch(()=>{
      const error=document.createElement('p');error.className='slide-error';error.setAttribute('role','alert');error.textContent='The test slides could not load. Reload to try again.';player.append(error);
    });
  }
  function renderSlide(){
    if(!testModule)return;
    player.dataset.phase=phase;
    if(phase==='meditation'){
      surface.classList.remove('test-slides');surface.setAttribute('aria-hidden','true');
      slideImage.hidden=true;caption.hidden=true;delete player.dataset.slide;delete player.dataset.voiceover;player.dataset.stage='meditation';return;
    }
    surface.classList.add('test-slides');surface.removeAttribute('aria-hidden');slideImage.hidden=false;caption.hidden=false;
    const elapsed=Math.max(0,introMs-introRemaining);
    let next,file,text,opacity,stage;
    if(elapsed<openingMs){
      next=-2;file=openingFile;text=openingText;stage='opening';
      opacity=elapsed<cardHoldMs?1:Math.max(0,(openingMs-elapsed)/fadeMs);
    }else if(elapsed<openingMs+photoMs){
      const photoElapsed=elapsed-openingMs;
      next=Math.min(slideFiles.length-1,Math.floor(photoElapsed/slideSlotMs));
      const position=photoElapsed-next*slideSlotMs;
      file=slideFiles[next];text=slideStatements[next];stage='photos';
      opacity=position<fadeMs?position/fadeMs:position<fadeMs+slideHoldMs?1:Math.max(0,(slideSlotMs-position)/fadeMs);
    }else{
      const position=elapsed-openingMs-photoMs;
      next=slideFiles.length;file=closingFile;text=closingText;stage='closing';
      opacity=position<fadeMs?position/fadeMs:position<fadeMs+cardHoldMs?1:Math.max(0,(closingMs-position)/fadeMs);
    }
    if(next!==slideIndex){slideIndex=next;slideImage.src='/images/gratitude/test-module-1/'+file;slideImage.alt=text;caption.textContent=stage==='photos'?text:'';}
    caption.hidden=stage!=='photos';
    slideImage.style.opacity=state==='ready'||reducedMotion.matches?'1':String(opacity);
    caption.style.opacity=slideImage.style.opacity;
    player.dataset.stage=stage;
    if(stage==='photos'){player.dataset.slide=String(next+1);player.dataset.voiceover=text;}
    else{delete player.dataset.slide;delete player.dataset.voiceover;}

  }
  let state='ready',remaining=totalMs,deadline=0,tickHandle=0;
  const shown=()=>{
    const seconds=Math.max(0,Math.ceil(remaining/1000));
    return `${Math.floor(seconds/60)}\n${String(seconds%60).padStart(2,'0')}`;
  };
  function renderScrubber(){
    const progress=phase==='slides'?0:Math.max(0,Math.min(1,1-remaining/totalMs));
    const x=35+progress*1850;
    const dx=(x-960)/1379;
    let y=1189-296*Math.sqrt(Math.max(0,1-dx*dx));
    // Follow the center of the timer rim where it rises above the lower curve.
    const curveBox=curve.getBoundingClientRect();
    const timerBox=button.getBoundingClientRect();
    if(curveBox.width&&curveBox.height){
      const scaleX=1920/curveBox.width,scaleY=1080/curveBox.height;
      const radius=timerBox.width/2-parseFloat(getComputedStyle(button).borderTopWidth)/2;
      const centerX=(timerBox.left+timerBox.width/2-curveBox.left)*scaleX;
      const centerY=(timerBox.top+timerBox.height/2-curveBox.top)*scaleY;
      const circleX=(x-centerX)/(radius*scaleX);
      if(Math.abs(circleX)<=1){
        const rimY=centerY-radius*scaleY*Math.sqrt(Math.max(0,1-circleX*circleX));
        y=Math.min(y,rimY);
      }
    }
    scrubber.style.left=(x/19.2)+'%';
    scrubber.style.top=(y/10.8)+'%';
  }
  function notify(){parent.postMessage({type:'ci-meditation-state',state,minutes,remaining,phase},location.origin)}
  function render(){
    const ready=state==='ready';
    const hideCircle=phase==='slides'&&!ready;
    const reveal=hideCircle&&introRemaining<=fadeMs;
    player.dataset.reveal=String(reveal);
    scrubber.hidden=phase!=='meditation'||ready;
    slideshowToggle.hidden=!hideCircle;
    slideshowToggle.setAttribute('aria-label',state==='paused'?'Resume gratitude slideshow':'Pause gratitude slideshow');
    slideshowToggle.title=state==='paused'?'Resume slideshow':'Pause slideshow';
    button.tabIndex=hideCircle?-1:0;
    button.setAttribute('aria-hidden',String(hideCircle));
    playIcon.hidden=reveal||!(ready||phase==='slides'); value.hidden=ready||phase==='slides';
    playIcon.classList.toggle('pauseicon',phase==='slides'&&state==='running'); value.textContent=shown(); renderScrubber();renderSlide();
    const action=state==='ready'?'Start':state==='running'?'Pause':state==='paused'?'Resume':'Replay';
    button.setAttribute('aria-label',phase==='slides'?`${action} gratitude slideshow`:`${action} ${minutes} minute gratitude`); player.dataset.state=state;notify();
  }
  function clearTick(){if(tickHandle){clearTimeout(tickHandle);tickHandle=0}}
  function beginMeditation(running=true){
    phase='meditation';introRemaining=0;remaining=totalMs;deadline=performance.now()+remaining;
    state=running?'running':'paused';render();
  }
  function tick(){
    if(state!=='running')return;
    const left=Math.max(0,deadline-performance.now());
    if(phase==='slides'){
      introRemaining=left;
      if(left<=0)beginMeditation();
    }else{
      remaining=left;
      if(left<=0){state='complete';clearTick();render();return;}
    }
    render();tickHandle=setTimeout(tick,phase==='slides'?40:250);
  }
  function toggle(){
    if(!slidesReady)return;
    clearTick();
    if(state==='ready'||state==='complete'){
      phase=testModule?'slides':'meditation';introRemaining=introMs;remaining=totalMs;
      deadline=performance.now()+(phase==='slides'?introRemaining:remaining);state='running';render();tick();return;
    }
    if(state==='running'){
      if(phase==='slides')introRemaining=Math.max(0,deadline-performance.now());
      else remaining=Math.max(0,deadline-performance.now());
      state='paused';render();return;
    }
    if(state==='paused'){deadline=performance.now()+(phase==='slides'?introRemaining:remaining);state='running';render();tick();}
  }
  function seek(ratio){
    if(!slidesReady)return;
    const progress=Math.max(0,Math.min(1,Number(ratio)||0));
    if(phase==='slides'){
      introRemaining=introMs*(1-progress);
      if(progress===1){beginMeditation(state==='running');return;}
      if(state==='running')deadline=performance.now()+introRemaining;
      else if(state==='ready')state='paused';
    }else{
      remaining=totalMs*(1-progress);
      if(state==='running')deadline=performance.now()+remaining;
      if(remaining<=0){state='complete';clearTick();}
      else if(state==='ready')state='paused';
    }
    render();
  }
  button.addEventListener('click',toggle);
  slideshowToggle.addEventListener('click',toggle);
  curve.addEventListener('click',event=>{
    const rect=curve.getBoundingClientRect();
    const x=(event.clientX-rect.left)/rect.width*1920;
    seek((x-35)/1850);
  });
  addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='ci-meditation-command')return;
    if(event.data.command==='toggle')toggle();
    if(event.data.command==='seek')seek(event.data.ratio);
  });
  addEventListener('resize',renderScrubber);
  render();
})();
</script>
</body>
</html>
