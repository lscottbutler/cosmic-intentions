<html lang="en">
<head>

<title>NEW GRATITUDE | Cosmic Intentions</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
body{display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}
.player{position:relative;width:min(100vw,calc(100vh * 16 / 9));aspect-ratio:16/9;background:#4c812f;border:2px solid #000;overflow:hidden}
.image{position:absolute;inset:3.45% 2.05% 3.35%;background:url('/images/meditation/meditation-1.jpg') center center/cover no-repeat}
.image.test-slides{background:#000!important;display:grid;place-items:center}.test-slide{display:block;width:100%;height:100%;object-fit:contain}.slide-error{position:absolute;z-index:6;inset:20% 10% auto;background:#292929;color:#fff;padding:20px;text-align:center;font:16px/1.5 Arial,sans-serif}
.ccb-curve{position:absolute;z-index:2;inset:0;width:100%;height:100%;display:block;pointer-events:auto;cursor:pointer}
.ccb-scrubber{position:absolute;z-index:5;left:1.8229167%;top:89.8148148%;width:1.5625%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:#a7c526;box-shadow:0 1px 3px rgba(0,0,0,.28);pointer-events:none}
.timer{position:absolute;z-index:4;left:50%;top:85.1851852%;transform:translate(-50%,-50%);width:10.4166667%;aspect-ratio:1;border:clamp(4px,1.5625vw,30px) solid #82ad77;border-radius:50%;padding:0;background:#a7c526;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.timer::before{display:none}
.timer:focus-visible{outline:none}
.value,.playicon{position:relative;z-index:1;color:#fff}
.value{font-size:clamp(22px,3.1vw,44px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:.2px;white-space:pre-line;text-align:center}
.playicon{width:0;height:0;border-top:clamp(10px,1.3vw,20px) solid transparent;border-bottom:clamp(10px,1.3vw,20px) solid transparent;border-left:clamp(16px,2vw,30px) solid #fff;margin-left:7%}
.playicon.pauseicon{width:30%;height:40%;border:0;border-left:clamp(5px,.6vw,10px) solid #fff;border-right:clamp(5px,.6vw,10px) solid #fff;margin:0}
[hidden]{display:none!important}
body.external .player{width:100vw;height:100vh;aspect-ratio:auto;border:0;background:#292929}
body.external .image{inset:0}
body.external .ccb-curve rect{display:block;fill:none;stroke:#292929}
body.external .ccb-curve ellipse{fill:#292929;stroke:#747474}
body.external .ccb-scrubber{background:#f2f2f2}
body.panel-play .player[data-state="ready"] .timer{opacity:0;pointer-events:none}
body.external .timer{background:#747474;border-color:#292929}
body.counter-docked .timer{opacity:0!important;pointer-events:none}
/* Original grey player, with the current slide statement below its circle. */
.test-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.slide-caption{position:absolute;z-index:3;left:4%;right:4%;bottom:1.4%;min-height:8%;display:grid;place-items:center;color:#fff;text-align:center;font:800 clamp(16px,3.3vw,60px)/1.1 Arial,Helvetica,sans-serif;letter-spacing:.06em;text-transform:uppercase;white-space:normal;pointer-events:none}
.instruction-card{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.player[data-phase="slides"][data-controls-visible="false"] .timer{pointer-events:none}
.slideshow-toggle{position:absolute;z-index:3;inset:0 0 16%;border:0;padding:0;background:transparent;cursor:pointer}
.slideshow-toggle:focus-visible{outline:2px solid #fff;outline-offset:-8px}
.timer:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.timer,.ccb-curve ellipse{transition:none}}
</style>

    }
    if(next!==slideIndex){slideIndex=next;if(file)slideImage.src='/images/gratitude/test-module-1/'+file;slideImage.alt=text;instructionCopy.textContent=stage==='instruction'?text:'';if(stage==='instruction'){instructionCard.src=instructionArtwork[-next-10];instructionCard.alt='GRATITUDE. '+text;}caption.textContent=stage==='photos'?text:'';}
    instructionCard.hidden=stage!=='instruction';slideImage.hidden=stage==='instruction';
    instructionCard.style.opacity=state==='ready'||reducedMotion.matches?'1':String(opacity);
    caption.hidden=stage!=='photos';
    slideImage.style.opacity=state==='ready'||reducedMotion.matches?'1':String(opacity);
    caption.style.opacity=slideImage.style.opacity;
    player.dataset.stage=stage;
    if(stage==='photos'){player.dataset.slide=String(next+1);player.dataset.voiceover=text;}
    else{delete player.dataset.slide;delete player.dataset.voiceover;}

  }
  let state='ready',remaining=totalMs,deadline=0,tickHandle=0;
  const shown=()=>{
    const seconds=Math.max(0,Math.ceil(remaining/1000));
    return `${Math.floor(seconds/60)}\n${String(seconds%60).padStart(2,'0')}`;
  };
  function renderScrubber(){
    const progress=phase==='slides'?0:Math.max(0,Math.min(1,1-remaining/totalMs));
    const x=35+progress*1850;
    const dx=(x-960)/1379;
    let y=1189-296*Math.sqrt(Math.max(0,1-dx*dx));
    // Follow the center of the timer rim where it rises above the lower curve.
    const curveBox=curve.getBoundingClientRect();
    const timerBox=button.getBoundingClientRect();
    if(curveBox.width&&curveBox.height&&!dockCounter){
      const scaleX=1920/curveBox.width,scaleY=1080/curveBox.height;
      const radius=timerBox.width/2-parseFloat(getComputedStyle(button).borderTopWidth)/2;
      const centerX=(timerBox.left+timerBox.width/2-curveBox.left)*scaleX;
      const centerY=(timerBox.top+timerBox.height/2-curveBox.top)*scaleY;
      const circleX=(x-centerX)/(radius*scaleX);
      if(Math.abs(circleX)<=1){
        const rimY=centerY-radius*scaleY*Math.sqrt(Math.max(0,1-circleX*circleX));
        y=Math.min(y,rimY);
      }
    }
    scrubber.style.left=(x/19.2)+'%';
    scrubber.style.top=(y/10.8)+'%';
  }
  function notify(){parent.postMessage({type:'ci-meditation-state',state,minutes,remaining,phase,slideCounter:value.textContent,counterOpacity:phase==='slides'?Number(scrubber.style.opacity):0},location.origin)}
  function render(){
    const ready=state==='ready';
    const elapsed=Math.max(0,introMs-introRemaining);
    const controlsOpacity=phase==='slides'?(ready?0:Math.max(0,Math.min(1,(elapsed-openingMs)/controlsFadeMs))):1;
    const controlsVisible=phase!=='slides'||controlsOpacity>0;
    const hideCircle=phase==='slides'&&!ready&&!controlsVisible;
    player.dataset.controlsVisible=String(controlsVisible);
    const visibleOpacity=reducedMotion.matches?(controlsOpacity>0?1:0):controlsOpacity;
    curve.querySelector('ellipse').style.opacity=String(visibleOpacity);
    button.style.opacity=String(ready?(panelPlay?0:1):visibleOpacity);
    scrubber.style.opacity=String(visibleOpacity);
    scrubber.hidden=phase!=='meditation'||ready;
    slideshowToggle.hidden=phase!=='slides'||ready;
    slideshowToggle.setAttribute('aria-label',state==='paused'?'Resume gratitude slideshow':'Pause gratitude slideshow');
    slideshowToggle.title=state==='paused'?'Resume slideshow':'Pause slideshow';
    button.tabIndex=hideCircle||dockCounter||(panelPlay&&ready)?-1:0;
    button.setAttribute('aria-hidden',String(hideCircle||(dockCounter&&phase==='slides')||(panelPlay&&ready)));
    playIcon.hidden=!ready; value.hidden=ready||hideCircle;
    playIcon.classList.toggle('pauseicon',phase==='slides'&&state==='running'); renderScrubber();renderSlide();
    value.textContent=phase==='slides'?`${Math.max(1,Math.min(slideFiles.length,slideIndex+1))}/${slideFiles.length}`:shown();
    const action=state==='ready'?'Start':state==='running'?'Pause':state==='paused'?'Resume':'Replay';
    button.setAttribute('aria-label',phase==='slides'?`${action} gratitude slideshow`:`${action} ${minutes} minute gratitude`); player.dataset.state=state;notify();
  }
  function clearTick(){if(tickHandle){clearTimeout(tickHandle);tickHandle=0}}
  function beginMeditation(running=true){
    phase='meditation';introRemaining=0;remaining=totalMs;deadline=performance.now()+remaining;
    state=running?'running':'paused';render();
  }
  function tick(){
    if(state!=='running')return;
    const left=Math.max(0,deadline-performance.now());
    if(phase==='slides'){
      introRemaining=left;
      if(left<=0)beginMeditation();
    }else{
      remaining=left;
      if(left<=0){state='complete';clearTick();render();return;}
    }
    render();tickHandle=setTimeout(tick,phase==='slides'?40:250);
  }
  function toggle(){
    if(!slidesReady)return;
    clearTick();
    if(state==='ready'||state==='complete'){
      phase=testModule?'slides':'meditation';introRemaining=introMs;remaining=totalMs;
      deadline=performance.now()+(phase==='slides'?introRemaining:remaining);state='running';render();tick();return;
    }
    if(state==='running'){
      if(phase==='slides')introRemaining=Math.max(0,deadline-performance.now());
      else remaining=Math.max(0,deadline-performance.now());
      state='paused';render();return;
    }
    if(state==='paused'){deadline=performance.now()+(phase==='slides'?introRemaining:remaining);state='running';render();tick();}
  }
  function seek(ratio){
    if(!slidesReady)return;
    const progress=Math.max(0,Math.min(1,Number(ratio)||0));
    if(phase==='slides'){
      introRemaining=introMs*(1-progress);
      if(progress===1){beginMeditation(state==='running');return;}
      if(state==='running')deadline=performance.now()+introRemaining;
      else if(state==='ready')state='paused';
    }else{
      remaining=totalMs*(1-progress);
      if(state==='running')deadline=performance.now()+remaining;
      if(remaining<=0){state='complete';clearTick();}
      else if(state==='ready')state='paused';
    }
    render();
  }
  button.addEventListener('click',toggle);
  slideshowToggle.addEventListener('click',toggle);
  curve.addEventListener('click',event=>{
    const rect=curve.getBoundingClientRect();
    const x=(event.clientX-rect.left)/rect.width*1920;
    seek((x-35)/1850);
  });
  addEventListener('message',event=>{
    if(event.origin!==location.origin||event.data?.type!=='ci-meditation-command')return;
    if(event.data.command==='toggle')toggle();
    if(event.data.command==='seek')seek(event.data.ratio);
  });
  addEventListener('resize',renderScrubber);
  render();
})();
</script>
</body>
</html>
