<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualization | Cosmic Intentions</title>
  <style>
    :root {
      --frame-gray:  #8b8b8b;
      --frame-width: 12px;
      --frame-ratio: 5 / 6;
      --bar:         #1c1c1c;     /* dark control pill */
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    .frame {
      position: relative;
      width: min(95vw, 95vh * 5 / 6, 560px);
      aspect-ratio: var(--frame-ratio);
      border: var(--frame-width) solid #e02020;
      box-sizing: border-box;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .photowrap { position: relative; flex: 0 0 56%; overflow: hidden; }
    .photo {
      position: absolute; inset: 0;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: #ffffff;
    }
    .photo-b { opacity: 0; }                          /* crossfade layer */
    .fade-cover { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 3; }
    .panel {
      flex: 1 1 auto;
      position: relative;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .label {
      margin: 0;
      padding: 16px 16px 10px;
      text-align: center;
      font-size: clamp(13px, 3.2vw, 17px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #222;
    }
    /* dark music-player control pill */
    .bar {
      background: #e02020;
      border-radius: 0;
      padding: 14px 18px;
      box-shadow: none;
    }
    .row   { display: flex; align-items: center; justify-content: space-between; }
    /* progress dot — straddles the image/panel seam, travels left→right with time */
    .scrubdot {
      position: absolute;
      top: 56%;                 /* the bottom of the image / top of the white panel */
      left: 0;
      width: 16px; height: 16px;
      background: radial-gradient(circle at center, #fff 0 3px, #000 3px 100%);
      border: none;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 1px 4px rgba(0,0,0,0.55);
      z-index: 4;
      pointer-events: none;
      transition: left 1s linear;   /* glide between 1s ticks instead of jumping */
    }
    .cbtn  { background: none; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; line-height: 1; padding: 4px; }
    .cbtn:active { transform: scale(0.92); }
    .play  { background: #fff; color: #111; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.15rem; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .fav.on { color: #ff5a7a; }
    /* ≡ dropdown menu */
    .menu { position: absolute; left: 18px; bottom: 92px; background: #111; border: 1px solid #333; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.45); z-index: 5; }
    .menu.hidden { display: none; }
    .menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: #fff; padding: 11px 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .menu button:hover { background: #222; }
    /* DEV_MODE only — caption of the current VO block, overlaid on the image.
       Hidden entirely in production so the UI is identical to Meditation. */
    .cap { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: none;
      padding: 8px 12px; background: rgba(0,0,0,0.62); color: #fff;
      font-size: 12px; line-height: 1.35; letter-spacing: .3px; }
    .cap.show { display: block; }
    .cap b { color: #ff8a8a; text-transform: uppercase; letter-spacing: 1px; font-size: 10px; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="photowrap">
      <div class="photo" id="photo"></div>
      <div class="photo photo-b" id="photoB"></div>
      <div class="fade-cover" id="fadeCover"></div>
      <div class="cap" id="cap"></div>
    </div>
    <div class="scrubdot" id="dot"></div>
    <div class="panel">
      <p class="label" id="label">visualization</p>

      <div class="menu hidden" id="menu">
        <button id="mHome">Home page</button>
        <button id="mPeg">My Pegboard</button>
      </div>

      <div class="bar">
        <div class="row">
          <button class="cbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
          <button class="cbtn" id="rew" aria-label="Rewind">&#9198;</button>
          <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
          <button class="cbtn" id="fwd" aria-label="Forward">&#9197;</button>
          <button class="cbtn fav" id="fav" aria-label="Favorite">&#9825;</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const DEV_MODE = true;                 // true = on-screen block caption + console logs
    const PLAYER = 'visualization';

    /* ── inputs: duration (?t minutes) + goal text/image (URL or ci_goal_*) ── */
    const params  = new URLSearchParams(location.search);
    const minutes = parseInt(params.get('t')) || 3;
    const total   = minutes * 60;
    const goal    = (params.get('g') || localStorage.getItem('ci_goal_title') || 'your vision').trim();
    const goalImg = params.get('img') || localStorage.getItem('ci_goal_image') || '../images/meditation/meditation.jpg';

    let timeRemaining = total;
    document.getElementById('label').textContent = goal;

    /* goal image fills the top (same contain layout as Meditation) */
    const photo = document.getElementById('photo');
    (function showGoalImage() {
      const probe = new Image();
      probe.onload  = () => { photo.style.backgroundImage = `url('${goalImg}')`; };
      probe.onerror = () => { photo.style.backgroundImage = `url('../images/meditation/meditation.jpg')`; };
      probe.src = goalImg;
    })();

    const dot = document.getElementById('dot');
    const playBtn = document.getElementById('play');
    const cap = document.getElementById('cap');

    function render() {
      const pct = total ? ((total - timeRemaining) / total) * 100 : 0;
      dot.style.left = pct + '%';
    }
    render();

    /* ── close / parent navigation (identical to Meditation) ── */
    function closePlayer() {
      try { if (window.parent && window.parent !== window && window.parent.closePlayerColumn) { window.parent.closePlayerColumn(); return; } } catch (e) {}
      if (history.length > 1) history.back(); else window.close();
    }
    function nav(target) {
      try {
        if (window.parent && window.parent !== window) {
          if (window.parent.closePlayerColumn) window.parent.closePlayerColumn();
          if (window.parent.navTo) { window.parent.navTo(target); return; }
        }
      } catch (e) {}
      window.location.href = '/';
    }
    function finishPlayer() {
      try { if (window.parent && window.parent !== window && window.parent.playerFinished) { window.parent.playerFinished(); return; } } catch (e) {}
      closePlayer();
    }

    /* ── ≡ menu ── */
    const menu = document.getElementById('menu');
    const menuBtn = document.getElementById('menuBtn');
    menuBtn.onclick = (e) => { e.stopPropagation(); menu.classList.toggle('hidden'); };
    document.addEventListener('click', (e) => {
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && e.target !== menuBtn) menu.classList.add('hidden');
    });
    document.getElementById('mHome').onclick = () => { menu.classList.add('hidden'); nav('home'); };
    document.getElementById('mPeg').onclick  = () => { menu.classList.add('hidden'); nav('setup'); };

    /* ── ♥ favorite (shares ci_favorites with the playlist) ── */
    const favBtn = document.getElementById('fav');
    const FAVS_KEY = 'ci_favorites';
    const readFavs = () => { try { return JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'); } catch (e) { return []; } };
    const isFav = (a) => a.some(f => f.player === PLAYER && f.minutes === minutes);
    function renderFav() { const on = isFav(readFavs()); favBtn.innerHTML = on ? '&#9829;' : '&#9825;'; favBtn.classList.toggle('on', on); }
    favBtn.onclick = () => {
      let a = readFavs();
      if (isFav(a)) a = a.filter(f => !(f.player === PLAYER && f.minutes === minutes));
      else a.push({ player: PLAYER, minutes });
      localStorage.setItem(FAVS_KEY, JSON.stringify(a));
      renderFav();
    };
    renderFav();

    /* ── bell (identical) ── */
    function playBell() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        [660, 990].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const start = now + i * 0.18;
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.4, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 2.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 2.3);
        });
      } catch (e) { console.log('Audio blocked:', e); }
    }

    /* ── CONFIG-DRIVEN VO STATE MACHINE ──────────────────────────
       Blocks (timing + text) come from a Google Sheet via /api/viz-config.
       Each block is spoken with cached runtime TTS, so editing the sheet text
       changes what you hear. {GOAL} in any line becomes the user's goal.
       Falls back to these built-in defaults if the config can't be fetched.
       (Edit timing/words in the sheet — see docs/VIZ_SHEET_SETUP.md.) */
    const DEFAULT_CFG = {
      settings: { voice: 'shimmer', image: '' },
      blocks: [
        { key:'hook',        phase:'Hook',          at:{ '3':0,   '10':0   }, text:'Close your eyes. For the next few minutes, your only job is to see what you want as if it is already yours.' },
        { key:'descent',     phase:'Descent',       at:{ '3':8,   '10':8   }, text:'Take a slow breath in... and let it go. With each breath, let your body soften and sink down.' },
        { key:'lungs',       phase:'Lungs',         at:{ '3':20,  '10':20  }, text:'One more deep breath in. And out. Feel yourself dropping into a calm, focused state.' },
        { key:'core_enter',  phase:'Core · Enter',  at:{ '3':34,  '10':34  }, text:'Picture it now, already real. {GOAL}.' },
        { key:'core_deepen', phase:'Core · Deepen', at:{ '3':76,  '10':219 }, text:'Step inside the picture. Feel it on your skin, hear the sounds around you. Notice how good it feels to be here.' },
        { key:'core_embody', phase:'Core · Embody', at:{ '3':118, '10':404 }, text:'This is yours. Feel the gratitude of already having it. Say silently to yourself: this is who I am.' },
        { key:'exit',        phase:'Exit',          at:{ '3':158, '10':578 }, text:'Hold that feeling. Slowly begin to return. When you are ready, open your eyes, and carry it with you.' },
      ],
    };

    let VOICE = 'shimmer';
    let EVENTS = [];
    const photoB = document.getElementById('photoB');
    const fadeCover = document.getElementById('fadeCover');

    /* cached runtime TTS — repeat sessions are instant + free; sheet edits regenerate */
    const TTS_CACHE = 'ci_vizvo_v1';
    const readCache  = () => { try { return JSON.parse(localStorage.getItem(TTS_CACHE) || '{}'); } catch (e) { return {}; } };
    const writeCache = (c) => { try { localStorage.setItem(TTS_CACHE, JSON.stringify(c)); } catch (e) {} };
    const hashStr = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h.toString(36); };
    async function ttsAudio(text) {
      if (!text) return null;
      const key = hashStr(VOICE + '|' + text);
      const cache = readCache();
      if (cache[key]) return new Audio('data:audio/mpeg;base64,' + cache[key]);
      try {
        const res = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text.slice(0, 150), voice: VOICE }) });
        if (!res.ok) throw new Error('tts ' + res.status);
        const { audio } = await res.json();
        cache[key] = audio; writeCache(cache);
        return new Audio('data:audio/mpeg;base64,' + audio);
      } catch (e) { console.log('TTS unavailable (caption only):', e.message); return null; }
    }

    /* run one timeline element: VO (speak), FADE (image), BELL, or HOLD (silence) */
    function execute(ev) {
      if (DEV_MODE) {
        console.log(`[${ev.type}] @${total - timeRemaining}s (${ev.dur || 0}s): ${ev.text || ev.to || (ev.image ? '[image]' : '')}`);
        cap.innerHTML = `<b>${ev.phase || ev.type}</b>` + (ev.text ? `<br>${ev.text}` : '');
        cap.classList.add('show');
      }
      if (ev.type === 'vo') {
        if (ev.audio) { try { ev.audio.currentTime = 0; const p = ev.audio.play(); if (p) p.catch(() => {}); } catch (e) {} }
      } else if (ev.type === 'image') {            // slideshow slide — crossfade to it
        const d = Number(ev.fade) || 0.6;
        photoB.style.backgroundImage = `url('${ev.image}')`;
        photoB.style.transition = `opacity ${d}s ease`;
        requestAnimationFrame(() => { photoB.style.opacity = '1'; });
        setTimeout(() => { photo.style.backgroundImage = `url('${ev.image}')`; photoB.style.transition = 'none'; photoB.style.opacity = '0'; }, d * 1000 + 60);
      } else if (ev.type === 'bell') {
        playBell();
      } else if (ev.type === 'fade') {
        const d = Number(ev.dur) || 1.5;
        if (ev.to === 'black') {
          fadeCover.style.transition = `opacity ${d}s ease`;
          requestAnimationFrame(() => { fadeCover.style.opacity = '1'; });
        } else if (ev.to === 'reveal' || ev.to === 'clear') {
          fadeCover.style.transition = `opacity ${d}s ease`;
          requestAnimationFrame(() => { fadeCover.style.opacity = '0'; });
        } else if (ev.image) {                       // crossfade to a new image
          photoB.style.backgroundImage = `url('${ev.image}')`;
          photoB.style.transition = `opacity ${d}s ease`;
          requestAnimationFrame(() => { photoB.style.opacity = '1'; });
          setTimeout(() => { photo.style.backgroundImage = `url('${ev.image}')`; photoB.style.transition = 'none'; photoB.style.opacity = '0'; }, d * 1000 + 60);
        }
      }
      /* 'hold' = intentional silence; nothing to do */
    }

    // Prime audio on first gesture (browsers block autoplay until then).
    let unlocked = false;
    document.addEventListener('pointerdown', () => {
      if (unlocked) return; unlocked = true;
      EVENTS.forEach(ev => { if (!ev.audio) return; ev.audio.muted = true;
        const p = ev.audio.play(); if (p) p.then(() => { ev.audio.pause(); ev.audio.currentTime = 0; ev.audio.muted = false; }).catch(() => { ev.audio.muted = false; }); });
    }, { once: true });

    /* convert the legacy /api/viz-config block format into timeline events */
    function cfgToScene(cfg) {
      const durKey = (minutes >= 10) ? '10' : '3';
      return {
        settings: cfg.settings || { voice: 'shimmer' },
        events: (cfg.blocks || []).map(b => ({
          type: 'vo', phase: b.phase || b.key, dur: 6,
          start: Number((b.at && (b.at[durKey] != null ? b.at[durKey] : b.at['3'])) || 0) || 0,
          text: b.text,
        })),
      };
    }

    /* Load the scene: the editor's ci_viz_scene wins; otherwise /api/viz-config
       (Google Sheet → built-in defaults). Then pre-generate VO audio. */
    async function initScene() {
      let scene = null;
      try { scene = JSON.parse(localStorage.getItem('ci_viz_scene') || 'null'); } catch (e) {}
      if (!scene || !Array.isArray(scene.events)) {
        let cfg = null;
        try { const r = await fetch('/api/viz-config'); if (r.ok) cfg = await r.json(); } catch (e) {}
        scene = cfgToScene(cfg && Array.isArray(cfg.blocks) ? cfg : DEFAULT_CFG);
      }
      VOICE = (scene.settings && scene.settings.voice) || 'shimmer';
      if (scene.settings && scene.settings.image) photo.style.backgroundImage = `url('${scene.settings.image}')`;
      EVENTS = scene.events.map((e, i) => ({
        ...e, _i: i,
        start: Number(e.start) || 0,
        dur:   Number(e.dur) || 0,
        text:  String(e.text || '').replace(/\{GOAL\}/gi, goal),
      }));
      await Promise.all(EVENTS.filter(e => e.type === 'vo' && e.text).map(async e => { e.audio = await ttsAudio(e.text); }));
    }

    /* ── timer + play/pause (same engine as Meditation) ── */
    const fired = new Set();
    let timer = null, playing = false, ended = false;
    function endSession() {
      if (ended) return;
      ended = true;
      timeRemaining = 0;
      setPlaying(false);
      render();
      playBell();
      setTimeout(finishPlayer, 4000);
    }
    function tick() {
      timeRemaining--;
      if (timeRemaining <= 0) { endSession(); return; }
      render();
      const elapsed = total - timeRemaining;
      EVENTS.forEach(ev => { if (ev.start > 0 && ev.start < total && !fired.has(ev._i) && elapsed >= ev.start) { fired.add(ev._i); execute(ev); } });
    }
    function setPlaying(p) {
      playing = p;
      playBtn.innerHTML = p ? '&#9208;' : '&#9654;';   // ⏸ / ▶
      if (p && !timer) timer = setInterval(tick, 1000);
      if (!p && timer) { clearInterval(timer); timer = null; }
    }
    playBtn.onclick = () => setPlaying(!playing);

    const STEP = 10;
    function adjust(delta) {
      timeRemaining = Math.max(0, Math.min(total, timeRemaining + delta));
      render();
      if (timeRemaining === 0) endSession();
    }
    document.getElementById('rew').onclick = () => adjust(+STEP);
    document.getElementById('fwd').onclick = () => adjust(-STEP);

    // Build the scene (→ cached TTS), then auto-start; fire any start=0 elements.
    initScene().then(() => {
      setTimeout(() => {
        setPlaying(true);
        EVENTS.forEach(ev => { if (ev.start <= 0 && !fired.has(ev._i)) { fired.add(ev._i); execute(ev); } });
      }, 800);
    });
  </script>
</body>
</html>
