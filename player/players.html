<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Players — one engine, three players</title>
<link rel="stylesheet" href="ci-player.css">
<style>
  body { margin: 0; background: #15151a; color: #ddd; font-family: system-ui, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.note { color: #888; margin: 0 0 24px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .col h2 { font-size: 12px; color: #9aa; letter-spacing: 1px; margin: 0 0 10px; text-transform: uppercase; }
  .stage { box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>CIPlayer — one engine, three players</h1>
  <p class="note">All three boxes below are the <b>same</b> <code>CIPlayer</code> class — only the <code>mode</code> and <code>durationSec</code> differ. Hover for controls.</p>

  <div class="grid">
    <div class="col">
      <h2>Visualization</h2>
      <div id="pViz" class="stage"></div>
    </div>
    <div class="col">
      <h2>Meditation</h2>
      <div id="pMed" class="stage"></div>
    </div>
    <div class="col">
      <h2>Gratitude</h2>
      <div id="pGrat" class="stage"></div>
    </div>
  </div>
</div>

<script src="ci-player.js"></script>
<script>
  // VISUALIZATION — vision image(s) + affirmations, timed
  new CIPlayer("#pViz", {
    mode: "visualization",
    durationSec: 180,                 // "viz-3min" is just a duration now
    images: ["art/artwork.svg"],
    affirmations: [
      "I AM INCREASING MY CREDIT SCORE TO 800+",
      "MONEY FLOWS TO ME EASILY",
      "I AM DEBT-FREE AND FREE",
    ],
    slideMs: 3500, fadeMs: 700,
  });

  // MEDITATION — timer + breathing cues + (optional) bell
  new CIPlayer("#pMed", {
    mode: "meditation",
    durationSec: 300,                 // "meditation-timer 5 min" = a parameter
    meditationFocus: "your breath",
    slideMs: 4000,
  });

  // GRATITUDE — cycling gratitude lines, timed
  new CIPlayer("#pGrat", {
    mode: "gratitude",
    durationSec: 120,
    gratitude: ["my health", "the people who believe in me", "the work in front of me", "this quiet moment"],
    slideMs: 3500, fadeMs: 700,
  });
</script>
</body>
</html>
