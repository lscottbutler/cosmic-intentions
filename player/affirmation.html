<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affirmation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #111; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* PLAYER ONE — AFFIRMATION
     Dead simple: an image on top, a header with one sentence underneath. */
  .aff {
    width: 100%;
    max-width: 520px;
    height: 100%;
    max-height: 920px;
    display: flex;
    flex-direction: column;
    background: #000;
    overflow: hidden;
  }

  /* the image */
  .aff__image {
    flex: 1 1 auto;
    min-height: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.6s ease;
  }

  /* the header underneath, with the sentence on it */
  .aff__header {
    flex: 0 0 auto;
    background: #1A1A1A;
    color: #fff;
    text-align: center;
    padding: 30px 26px;
  }
  .aff__text {
    font-size: clamp(20px, 5.4vw, 30px);
    font-weight: 700;
    line-height: 1.4;
    letter-spacing: 0.2px;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>
  <div class="aff">
    <div class="aff__image" id="affImage"></div>
    <div class="aff__header"><p class="aff__text" id="affText"></p></div>
  </div>

<script>
  /* Each affirmation = one image + one sentence. Edit this list. */
  const AFFIRMATIONS = [
    { image: "../images/players/player-01.jpg", text: "I am exactly who I was born to become." },
    { image: "../images/players/player-02.jpg", text: "Every action I take moves me closer to my vision." },
    { image: "../images/players/player-03.jpg", text: "I attract success, abundance, and deep purpose." },
    { image: "../images/players/player-04.jpg", text: "I am disciplined, focused, and unstoppable." },
  ];

  const imgEl  = document.getElementById("affImage");
  const textEl = document.getElementById("affText");
  let i = -1;

  function show(n) {
    const a = AFFIRMATIONS[n % AFFIRMATIONS.length];
    imgEl.style.opacity = "0";
    textEl.style.opacity = "0";
    setTimeout(() => {
      imgEl.style.backgroundImage = `url("${a.image}")`;
      textEl.textContent = a.text;
      imgEl.style.opacity = "1";
      textEl.style.opacity = "1";
    }, 300);
  }

  function next() { i = (i + 1) % AFFIRMATIONS.length; show(i); }
  next();
  setInterval(next, 6000);   // new image + sentence every 6s
</script>
</body>
</html>
