<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affirmation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --frame-green: #5f9e3e;   /* green letterbox border */
    --frame-width: 16px;
    --frame-ratio: 16 / 9;
  }
  html, body { height: 100%; background: #1a1a1a; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* PLAYER ONE — AFFIRMATION, letterbox frame.
     Image fills behind the green border; the sentence overlays the bottom. */
  .lb-frame {
    position: relative;
    width: min(95vw, 1100px);
    aspect-ratio: var(--frame-ratio);
    border: var(--frame-width) solid var(--frame-green);
    box-sizing: border-box;
    background: #000;
    overflow: hidden;
    outline: 2px solid #2c3b1c;
  }

  /* the cycling image */
  .aff__image {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 0.6s ease;
  }

  /* the sentence, on a gradient bar across the bottom */
  .aff__caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 60px 32px 26px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    text-align: center;
  }
  .aff__text {
    color: #fff;
    font-size: clamp(20px, 3.4vw, 34px);
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: 0.2px;
    transition: opacity 0.5s ease;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="lb-frame">
    <div class="aff__image" id="affImage"></div>
    <div class="aff__caption"><p class="aff__text" id="affText"></p></div>
  </div>

<script>
  /* Each affirmation = one image + one sentence. Edit this list. */
  const AFFIRMATIONS = [
    { image: "../images/players/player-01.jpg", text: "I am exactly who I was born to become." },
    { image: "../images/players/player-02.jpg", text: "Every action I take moves me closer to my vision." },
    { image: "../images/players/player-03.jpg", text: "I attract success, abundance, and deep purpose." },
    { image: "../images/players/player-04.jpg", text: "I am disciplined, focused, and unstoppable." },
  ];

  const imgEl  = document.getElementById("affImage");
  const textEl = document.getElementById("affText");
  let i = -1;

  function show(n) {
    const a = AFFIRMATIONS[n % AFFIRMATIONS.length];
    imgEl.style.opacity = "0";
    textEl.style.opacity = "0";
    setTimeout(() => {
      imgEl.style.backgroundImage = `url("${a.image}")`;
      textEl.textContent = a.text;
      imgEl.style.opacity = "1";
      textEl.style.opacity = "1";
    }, 300);
  }

  function next() { i = (i + 1) % AFFIRMATIONS.length; show(i); }
  next();
  setInterval(next, 6000);   // new image + sentence every 6s
</script>
</body>
</html>
