<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Lab — instant local testing</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#15151a;color:#ddd;font-family:system-ui,sans-serif;}
  header{padding:14px 18px;border-bottom:1px solid #2a2a2a;}
  h1{font-size:16px;margin:0 0 2px;}
  p{margin:0;color:#888;font-size:12px;}
  .bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;align-items:center;}
  .grp{display:flex;gap:6px;align-items:center;background:#1d1d22;border:1px solid #2a2a2a;border-radius:8px;padding:6px 8px;}
  .grp b{font-size:10px;letter-spacing:1px;color:#9aa;text-transform:uppercase;margin-right:4px;}
  button{background:#2a2a30;border:1px solid #3a3a42;color:#eee;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:12px;}
  button:hover{background:#3a3a44;}
  a.ext{color:#7CE0C8;font-size:12px;text-decoration:none;margin-left:auto;}
  .frame-wrap{padding:0 18px 18px;}
  iframe{width:100%;height:72vh;border:1px solid #2a2a2a;border-radius:10px;background:#000;}
</style>
</head>
<body>
  <header>
    <h1>Player Lab</h1>
    <p>Click any player — it loads instantly below. Edits to ci-player.css/js / session.html auto-reload. No app login, no deploy.</p>
  </header>
  <div class="bar">
    <div class="grp"><b>Visualization</b>
      <button onclick="go('visualization',60)">1m</button>
      <button onclick="go('visualization',180)">3m</button>
      <button onclick="go('visualization',600)">10m</button>
    </div>
    <div class="grp"><b>Meditation</b>
      <button onclick="go('meditation',60)">1m</button>
      <button onclick="go('meditation',300)">5m</button>
      <button onclick="go('meditation',600)">10m</button>
    </div>
    <div class="grp"><b>Gratitude</b>
      <button onclick="go('gratitude',120)">2m</button>
      <button onclick="go('gratitude',300)">5m</button>
    </div>
    <a class="ext" href="players.html" target="player">▶ 3-up demo</a>
  </div>
  <div class="frame-wrap">
    <iframe name="player" id="player" src="../players/session.html?mode=visualization&duration=180"></iframe>
  </div>
<script>
  function go(mode, dur){
    document.getElementById('player').src =
      `../players/session.html?mode=${mode}&duration=${dur}&_t=${performance.now()|0}`;
  }
</script>
</body>
</html>
