<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Night Protocol | Cosmic Intentions</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #000;
  color: #FFF;
  min-height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

.night-container {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

.scene {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.5s ease;
  padding: 40px 24px;
  text-align: center;
}

.scene.active {
  opacity: 1;
}

.scene-title {
  font-size: 32px;
  font-weight: 600;
  color: #FFF;
  margin-bottom: 20px;
  line-height: 1.3;
}

.scene-text {
  font-size: 20px;
  color: rgba(255,255,255,0.85);
  line-height: 1.7;
  max-width: 400px;
}

.scene-instruction {
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin-top: 16px;
  font-style: italic;
}

/* Breathing animation */
.breathing-orb {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(103,126,234,0.4), rgba(118,75,162,0.2));
  border: 2px solid rgba(255,255,255,0.3);
  margin-bottom: 40px;
  animation: breathe-slow 6s ease-in-out infinite;
}

@keyframes breathe-slow {
  0%, 100% { transform: scale(0.8); opacity: 0.5; }
  50%      { transform: scale(1.2); opacity: 1; }
}

/* Vision board image */
.vision-image {
  width: 100%;
  max-width: 400px;
  height: 300px;
  background-size: cover;
  background-position: center;
  border-radius: 16px;
  margin-bottom: 24px;
  opacity: 0;
  animation: fadeInImage 1s ease forwards;
}

@keyframes fadeInImage {
  to { opacity: 1; }
}

/* I AM statement */
.iam-statement {
  font-family: 'Georgia', serif;
  font-size: 28px;
  font-style: italic;
  color: #C9A96E;
  line-height: 1.5;
  max-width: 360px;
  margin-bottom: 20px;
}

/* Affirmation list */
.affirmation-item {
  font-size: 22px;
  color: rgba(255,255,255,0.9);
  line-height: 1.6;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeInUp 1s ease forwards;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Progress dots */
.progress-dots {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  z-index: 100;
}

.progress-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transition: all 0.3s;
}

.progress-dot.active {
  background: rgba(255,255,255,0.9);
  transform: scale(1.3);
}

/* Close button */
.close-btn {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 40px;
  height: 40px;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 50%;
  color: #FFF;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0.5;
  transition: opacity 0.3s;
}

.close-btn:active {
  opacity: 1;
}

/* Volume reminder */
.volume-reminder {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.95);
  padding: 32px 24px;
  border-radius: 16px;
  text-align: center;
  max-width: 340px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.volume-reminder.show {
  opacity: 1;
  pointer-events: all;
}

.volume-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.volume-text {
  font-size: 18px;
  color: rgba(255,255,255,0.9);
  margin-bottom: 24px;
  line-height: 1.5;
}

.volume-btn {
  padding: 14px 32px;
  background: #FFF;
  color: #000;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

/* Fade to black ending */
.fade-to-black {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 3s ease;
  z-index: 150;
}

.fade-to-black.active {
  opacity: 1;
}
</style>
</head>
<body>

<!-- VOLUME REMINDER -->
<div class="volume-reminder" id="volumeReminder">
  <div class="volume-icon">🔊</div>
  <div class="volume-text">Turn up your volume for the full experience. Use headphones for best results.</div>
  <button class="volume-btn" onclick="startNightProtocol()">Begin Night Protocol</button>
</div>

<!-- PROGRESS DOTS -->
<div class="progress-dots" id="progressDots"></div>

<!-- CLOSE BUTTON -->
<button class="close-btn" onclick="exitProtocol()">✕</button>

<!-- SCENES CONTAINER -->
<div class="night-container" id="nightContainer"></div>

<!-- FADE TO BLACK -->
<div class="fade-to-black" id="fadeToBlack"></div>

<script src="../shared/player-core.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   NIGHT PROTOCOL - BEDTIME PLAYER
   3-5 minute wind-down before sleep
   ══════════════════════════════════════════════════════════ */

const SCENES = [
  {
    type: 'welcome',
    title: 'You Made It',
    text: 'You made it through another day. Well done.',
    duration: 10000,
    voiceOver: 'You made it through another day. Well done.'
  },
  {
    type: 'breathe',
    title: 'Breathe',
    text: 'Let the day go. You did enough.',
    showBreathing: true,
    duration: 30000,
    voiceOver: 'Let the day go. You did enough. Just breathe.'
  },
  {
    type: 'vision-intro',
    title: 'Remember Why',
    text: 'Here is what you are building toward.',
    duration: 8000,
    voiceOver: 'Here is what you are building toward.'
  },
  {
    type: 'vision-board',
    title: null,
    visionBoardSlides: true,
    duration: 60000, // 12 images x 5 seconds
    voiceOver: null
  },
  {
    type: 'iam',
    title: null,
    showIAM: true,
    duration: 30000,
    voiceOver: null // Will read I AM statement
  },
  {
    type: 'tomorrow',
    title: 'Tomorrow',
    text: 'Tomorrow, you will wake up ready. One step closer.',
    duration: 20000,
    voiceOver: 'Tomorrow, you will wake up ready. One step closer.'
  },
  {
    type: 'affirmations',
    title: 'You Are',
    affirmations: [
      'You are worthy of rest.',
      'Your subconscious is working while you sleep.',
      'You trust the process.'
    ],
    duration: 60000,
    voiceOver: 'You are worthy of rest. Your subconscious is working while you sleep. You trust the process.'
  },
  {
    type: 'goodnight',
    title: 'Rest Well',
    text: 'See you tomorrow.',
    duration: 10000,
    fadeToBlack: true,
    voiceOver: 'Rest well. See you tomorrow.'
  }
];

const VISION_BOARD_IMAGES = [
  '../vision_stills/vision1.jpg',
  '../vision_stills/vision2.jpg',
  '../vision_stills/vision3.jpg',
  '../vision_stills/vision4.jpg',
  '../vision_stills/vision5.jpg',
  '../vision_stills/vision6.jpg',
  '../vision_stills/vision7.jpg',
  '../vision_stills/vision8.jpg',
  '../vision_stills/vision9.jpg',
  '../vision_stills/vision10.jpg',
  '../vision_stills/vision11.jpg',
  '../vision_stills/vision12.jpg'
];

let currentScene = 0;
let sceneTimer = null;
let visionBoardIndex = 0;
let visionBoardInterval = null;

/* ══════════════════════════════════════════════════════════
   INITIALIZATION
   ══════════════════════════════════════════════════════════ */

function init() {
  // Show volume reminder
  document.getElementById('volumeReminder').classList.add('show');
  
  // Generate progress dots
  generateProgressDots();
  
  // Keep screen awake (mobile)
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
}

function startNightProtocol() {
  // Hide volume reminder
  document.getElementById('volumeReminder').classList.remove('show');
  
  // Generate scenes
  generateScenes();
  
  // Start
  setTimeout(() => {
    showScene(0);
  }, 500);
}

/* ══════════════════════════════════════════════════════════
   SCENE GENERATION
   ══════════════════════════════════════════════════════════ */

function generateProgressDots() {
  const container = document.getElementById('progressDots');
  container.innerHTML = '';
  
  SCENES.forEach((_, index) => {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.id = `dot-${index}`;
    container.appendChild(dot);
  });
}

function generateScenes() {
  const container = document.getElementById('nightContainer');
  container.innerHTML = '';
  
  SCENES.forEach((scene, index) => {
    const sceneEl = document.createElement('div');
    sceneEl.className = 'scene';
    sceneEl.id = `scene-${index}`;
    
    if (scene.showBreathing) {
      const orb = document.createElement('div');
      orb.className = 'breathing-orb';
      sceneEl.appendChild(orb);
    }
    
    if (scene.title) {
      const title = document.createElement('div');
      title.className = 'scene-title';
      title.textContent = scene.title;
      sceneEl.appendChild(title);
    }
    
    if (scene.text) {
      const text = document.createElement('div');
      text.className = 'scene-text';
      text.textContent = scene.text;
      sceneEl.appendChild(text);
    }
    
    if (scene.showIAM) {
      const iam = document.createElement('div');
      iam.className = 'iam-statement';
      iam.id = 'iamStatement';
      iam.textContent = LS.get('user_iam_statement') || 'I AM becoming the person I have decided to be.';
      sceneEl.appendChild(iam);
    }
    
    if (scene.affirmations) {
      scene.affirmations.forEach((aff, i) => {
        const affEl = document.createElement('div');
        affEl.className = 'affirmation-item';
        affEl.style.animationDelay = `${i * 0.5}s`;
        affEl.textContent = aff;
        sceneEl.appendChild(affEl);
      });
    }
    
    if (scene.visionBoardSlides) {
      const visionImg = document.createElement('div');
      visionImg.className = 'vision-image';
      visionImg.id = 'visionImage';
      sceneEl.appendChild(visionImg);
    }
    
    container.appendChild(sceneEl);
  });
}

/* ══════════════════════════════════════════════════════════
   SCENE CONTROL
   ══════════════════════════════════════════════════════════ */

function showScene(index) {
  if (index >= SCENES.length) {
    endProtocol();
    return;
  }
  
  currentScene = index;
  const scene = SCENES[index];
  
  // Update UI
  document.querySelectorAll('.scene').forEach((el, i) => {
    el.classList.toggle('active', i === index);
  });
  
  // Update progress dots
  document.querySelectorAll('.progress-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === index);
  });
  
  // Handle vision board cycling
  if (scene.visionBoardSlides) {
    startVisionBoardCycle();
  } else {
    clearInterval(visionBoardInterval);
  }
  
  // Play voice-over
  if (scene.voiceOver) {
    setTimeout(() => {
      speakText(scene.voiceOver);
    }, 1000);
  } else if (scene.showIAM) {
    const iamText = document.getElementById('iamStatement').textContent;
    setTimeout(() => {
      speakText(iamText);
    }, 1000);
  }
  
  // Fade to black ending
  if (scene.fadeToBlack) {
    setTimeout(() => {
      document.getElementById('fadeToBlack').classList.add('active');
    }, 7000);
  }
  
  // Play bell at key moments
  if ([0, 2, 5, 7].includes(index)) {
    playBell();
  }
  
  // Auto-advance
  clearTimeout(sceneTimer);
  sceneTimer = setTimeout(() => {
    showScene(index + 1);
  }, scene.duration);
}

function startVisionBoardCycle() {
  visionBoardIndex = 0;
  const imgEl = document.getElementById('visionImage');
  
  // Show first image
  imgEl.style.backgroundImage = `url(${VISION_BOARD_IMAGES[0]})`;
  
  // Cycle every 5 seconds
  visionBoardInterval = setInterval(() => {
    visionBoardIndex++;
    if (visionBoardIndex >= VISION_BOARD_IMAGES.length) {
      visionBoardIndex = 0;
    }
    imgEl.style.backgroundImage = `url(${VISION_BOARD_IMAGES[visionBoardIndex]})`;
  }, 5000);
}

function endProtocol() {
  clearTimeout(sceneTimer);
  clearInterval(visionBoardInterval);
  stopSpeech();
  
  // Keep black screen
  // Auto-close after 5 seconds or let user close manually
  setTimeout(() => {
    // Don't auto-close - let user fall asleep with black screen
  }, 5000);
}

function exitProtocol() {
  clearTimeout(sceneTimer);
  clearInterval(visionBoardInterval);
  stopSpeech();
  
  if (window.opener) {
    window.close();
  } else {
    setTimeout(() => {
      window.location.href = '../index.html';
    }, 100);
  }
}

window.addEventListener('DOMContentLoaded', init);

// Prevent accidental navigation
window.addEventListener('beforeunload', (e) => {
  if (currentScene > 0 && currentScene < SCENES.length - 1) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>

</body>
</html>
