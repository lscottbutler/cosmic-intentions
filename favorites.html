<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites | Cosmic Intentions — PROTOTYPE</title>
  <style>
    :root { --red:#e02020; --ink:#1c1c1c; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: #141414; color: #f2f2f2;
      font-family: 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px 40px; }
    h1 {
      font-size: 22px; letter-spacing: 3px; text-transform: uppercase;
      margin: 0 0 4px; font-weight: 800;
    }
    .tag { color: var(--red); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 20px; }

    /* loops control */
    .loops {
      display: flex; align-items: center; gap: 10px;
      background: #1e1e1e; border: 2px solid var(--red); border-radius: 12px;
      padding: 14px 16px; margin-bottom: 18px;
    }
    .loops label { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
    .loops input {
      width: 70px; font-size: 20px; text-align: center; font-weight: 800;
      background: #0d0d0d; color: #fff; border: 1px solid #444; border-radius: 8px;
      padding: 8px 6px;
    }
    .loops .hint { color: #888; font-size: 12px; margin-left: auto; }

    /* favorites list */
    .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .fav {
      display: flex; align-items: center; gap: 14px;
      background: #1e1e1e; border: 1px solid #333; border-radius: 12px;
      padding: 14px 16px; cursor: pointer; user-select: none;
      transition: border-color .15s, background .15s;
    }
    .fav.checked { border-color: var(--red); background: #261515; }
    .fav input { width: 22px; height: 22px; accent-color: var(--red); cursor: pointer; flex: 0 0 auto; }
    .fav .name { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .fav .mins { margin-left: auto; color: #9a9a9a; font-size: 14px; }
    .fav.dragging { opacity: .4; }
    .grip { cursor: grab; color: #666; font-size: 22px; line-height: .55; letter-spacing: -4px; flex: 0 0 auto; padding-right: 2px; }
    .grip:active { cursor: grabbing; }
    .empty { color: #777; font-size: 14px; padding: 18px 2px; }

    .play {
      display: block; width: 100%; padding: 16px; border: none; border-radius: 12px;
      background: var(--red); color: #fff; font-size: 16px; font-weight: 800;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    }
    .play:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* player overlay */
    .stage { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
    .stage.on { display: flex; }
    .stage .bar {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; background: var(--ink); color: #fff;
    }
    .stage .bar .now { font-size: 13px; letter-spacing: 1px; }
    .stage .bar .stop {
      margin-left: auto; background: var(--red); color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer;
    }
    .stage iframe { flex: 1 1 auto; width: 100%; border: 0; background: #000; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Favorites</h1>
    <p class="tag">prototype — not committed</p>

    <div class="loops">
      <label for="loops">Loops</label>
      <input id="loops" type="number" min="1" max="99" value="1">
      <span class="hint">how many times to play the whole list</span>
    </div>

    <div class="list" id="list"></div>

    <button class="play" id="play">&#9654; Play selected</button>
  </div>

  <div class="stage" id="stage">
    <div class="bar">
      <span class="now" id="now">—</span>
      <button class="stop" id="stop">&#10006; Stop</button>
    </div>
    <iframe id="frame" title="player"></iframe>
  </div>

  <script>
    const FAV_LABEL = { meditation:'Meditation', countdown:'Countdown', gratitude:'Gratitude', affirmation:'Affirmations', stoic:'Stoic', visualization:'Visualization' };
    const DEMO = [
      { player:'meditation', minutes:5 },
      { player:'meditation', minutes:10 },
      { player:'countdown',  minutes:3 },
    ];

    function readFavs() {
      try { return JSON.parse(localStorage.getItem('ci_favorites') || '[]'); } catch (e) { return []; }
    }
    const params = new URLSearchParams(location.search);
    let favs = readFavs();
    if (!favs.length && params.has('demo')) favs = DEMO;

    /* ── render the checkbox list ── */
    const listEl = document.getElementById('list');
    const playBtn = document.getElementById('play');
    if (!favs.length) {
      listEl.innerHTML = '<div class="empty">No favorites yet — tap &#9829; in any player. (Add ?demo=1 to preview.)</div>';
      playBtn.disabled = true;
    } else {
      let dragEl = null;
      favs.forEach((f) => {
        const row = document.createElement('div');
        row.className = 'fav';
        row.draggable = true;
        row._fav = f;
        row.innerHTML =
          `<span class="grip" title="Drag to reorder">&#8942;&#8942;</span>` +
          `<input type="checkbox">` +
          `<span class="name">${FAV_LABEL[f.player] || f.player}</span>` +
          `<span class="mins">${f.minutes} min</span>`;
        const cb = row.querySelector('input');
        cb.addEventListener('change', () => { row.classList.toggle('checked', cb.checked); syncPlay(); });
        // Click anywhere on the row (except the grip / box itself) toggles it.
        row.addEventListener('click', (e) => {
          if (e.target === cb || e.target.classList.contains('grip')) return;
          cb.checked = !cb.checked;
          cb.dispatchEvent(new Event('change'));
        });
        // Drag-to-reorder — live-moves the row as you drag past neighbours.
        row.addEventListener('dragstart', () => { dragEl = row; row.classList.add('dragging'); });
        row.addEventListener('dragend',   () => { row.classList.remove('dragging'); dragEl = null; });
        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!dragEl || dragEl === row) return;
          const r = row.getBoundingClientRect();
          const before = (e.clientY - r.top) < r.height / 2;
          listEl.insertBefore(dragEl, before ? row : row.nextSibling);
        });
        listEl.appendChild(row);
      });
    }
    // Selection + play order both follow the current top-to-bottom list order.
    function selected() {
      return [...listEl.querySelectorAll('.fav')].filter(r => r.querySelector('input').checked).map(r => r._fav);
    }
    function syncPlay() {
      const n = selected().length;
      playBtn.disabled = n === 0;
      playBtn.innerHTML = n ? `&#9654; Play ${n} selected` : '&#9654; Play selected';
    }
    syncPlay();

    /* ── auto-loop playback ──
       Build a queue = (selected favorites) repeated <loops> times, then play
       each in the iframe. Players call parent.playerFinished() when their timer
       ends (and parent.closePlayerColumn() on manual close) — we advance on that. */
    const stage = document.getElementById('stage');
    const frame = document.getElementById('frame');
    const nowEl = document.getElementById('now');
    let queue = [], pos = 0;

    function loadCurrent() {
      const f = queue[pos];
      nowEl.textContent = `Now playing ${pos + 1} / ${queue.length} — ${FAV_LABEL[f.player] || f.player} ${f.minutes} min`;
      frame.src = `players/${f.player}.html?t=${f.minutes}`;
    }
    function stop() {
      stage.classList.remove('on');
      frame.src = 'about:blank';
      queue = []; pos = 0;
    }
    // Hooks the player pages call on the parent window:
    window.playerFinished = function () {
      pos++;
      if (pos >= queue.length) { stop(); return; }   // whole queue (all loops) done
      loadCurrent();
    };
    window.closePlayerColumn = stop;                  // player's ✕ / manual close
    window.navTo = function () { stop(); };           // menu nav out → just stop the loop

    playBtn.addEventListener('click', () => {
      const sel = selected();
      if (!sel.length) return;
      const loops = Math.max(1, Math.min(99, parseInt(document.getElementById('loops').value) || 1));
      queue = [];
      for (let l = 0; l < loops; l++) queue.push(...sel);
      pos = 0;
      stage.classList.add('on');
      loadCurrent();
    });
    document.getElementById('stop').addEventListener('click', stop);
  </script>
</body>
</html>
