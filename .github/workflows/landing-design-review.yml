name: Landing design review
on:
  pull_request:
    paths:
      - 'standalone/landing*.html'
      - 'standalone/landing-calm*'
      - 'tests/landing-calm.spec.js'
      - 'tests/fixtures/landing-original-content.json'
      - '.github/workflows/landing-design-review.yml'
permissions:
  contents: read
jobs:
  landing-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify unchanged copy, links, desktop and mobile layouts
        run: npm test -- tests/landing-calm.spec.js --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-design-evidence
          path: test-results/
          retention-days: 7
