name: Morning publish (staging -> live)
# Scott 13 Nov 2026: publish staging to live every morning at 5:00 AM Bangkok
# so nothing ever sits stranded on staging. 22:00 UTC = 05:00 ICT.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: morning-publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Merge staging into main (one deploy, only if there is new work)
        run: |
          git fetch -q origin staging
          if [ -z "$(git rev-list origin/main..origin/staging)" ]; then
            echo "Nothing new on staging - no deploy, 0 credits."; exit 0
          fi
          git config user.name "CI morning publish"
          git config user.email "actions@github.com"
          git merge --no-ff origin/staging -m "Publish: morning publish $(TZ=Asia/Bangkok date +%Y-%m-%d)"
          git push origin HEAD:main
          git push origin HEAD:staging
          echo "Published $(git rev-list --count HEAD^1..HEAD^2) commit(s)."
