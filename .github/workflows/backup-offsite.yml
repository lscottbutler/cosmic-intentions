name: Encrypted off-site backup

on:
  push:
    branches: ['review/backup-credentials-20261019', 'review/backup-recovery-20261027']
    paths: ['.github/workflows/backup-offsite.yml', 'scripts/backup-offsite.sh', 'scripts/backup-storage.py']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-encrypted-backup
  cancel-in-progress: false

jobs:
  offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require backup credentials
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE || secrets.BACK_PASSPHRASE }}
          STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          missing=0
          if [ -z "$DB_PASSWORD$DB_URL" ]; then
            echo "::error::Missing SUPABASE_DB_PASSWORD or SUPABASE_DB_URL"
            missing=1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::Missing BACKUP_PASSPHRASE (legacy BACK_PASSPHRASE also accepted)"
            missing=1
          fi
          if [ -z "$STORAGE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Missing RCLONE_CONF (gdrive and onedrive connections)"
            missing=1
          fi
          exit "$missing"
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Capture, encrypt and verify both offsite copies
        id: capture
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.BACK_PASSPHRASE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          BACKUP_EXPORT_DIR: ${{ runner.temp }}/ci-encrypted-recovery
        run: bash scripts/backup-offsite.sh
      - name: Preserve verified encrypted recovery copy even when a remote fails
        if: ${{ always() && steps.capture.outputs.captured == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-encrypted-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci-encrypted-recovery/*.tar.gz.gpg
            ${{ runner.temp }}/ci-encrypted-recovery/*.tar.gz.gpg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
          CAPTURED: ${{ steps.capture.outputs.captured }}
        run: |
          printf '## Backup result: %s\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          printf 'Encrypted capture completed: %s\n\n' "${CAPTURED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Both configured off-site copies must pass upload and downloaded-content checks before full off-site success. A retained encrypted artifact is emergency recovery, not a substitute for independent copies or an isolated restore test. No plaintext database, credentials or encryption passphrase are uploaded. No old backups are deleted.' >> "$GITHUB_STEP_SUMMARY"
