name: Encrypted off-site backup

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-encrypted-backup
  cancel-in-progress: false

jobs:
  offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require backup credentials
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
          STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          test -n "$DB_PASSWORD$DB_URL" && test -n "$PASS" && test -n "$STORAGE_KEY" && test -n "$RCLONE_CONF" || {
            echo "::error::Backup credentials missing. Review the required secret NAMES in docs/BACKUP-RECOVERY.md."
            exit 1
          }
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Capture, encrypt and verify both offsite copies
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: bash scripts/backup-offsite.sh
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## Backup result: %s\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Success requires encrypted code/history, database and Storage uploads verified by downloading from BOTH configured remotes. No old backup is deleted. A backup is not a proven full recovery until an isolated restore is tested. Billing can prevent this job from starting; inspect Actions when no fresh success exists.' >> "$GITHUB_STEP_SUMMARY"
