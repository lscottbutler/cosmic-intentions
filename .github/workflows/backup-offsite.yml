name: Encrypted off-site backup

on:
  push:
    branches: ['review/backup-credentials-20261019']
    paths: ['.github/workflows/backup-offsite.yml', 'scripts/backup-offsite.sh', 'scripts/backup-storage.py']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: ci-encrypted-backup
  cancel-in-progress: false

jobs:
  offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require backup credentials
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE || secrets.BACK_PASSPHRASE }}
          STORAGE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          missing=0
          if [ -z "$DB_PASSWORD$DB_URL" ]; then
            echo "::error::Missing SUPABASE_DB_PASSWORD or SUPABASE_DB_URL"
            missing=1
          fi
          if [ -z "$PASS" ]; then
            echo "::error::Missing BACKUP_PASSPHRASE (legacy BACK_PASSPHRASE also accepted)"
            missing=1
          fi
          if [ -z "$STORAGE_KEY" ]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi
          if [ -z "$RCLONE_CONF" ]; then
            echo "::error::Missing RCLONE_CONF (gdrive and onedrive connections)"
            missing=1
          fi
          exit "$missing"
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common rclone gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Capture, encrypt and verify both offsite copies
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE || secrets.BACK_PASSPHRASE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
        run: bash scripts/backup-offsite.sh
      - name: Keep encrypted copy on GitHub (90 days)
        if: always() && hashFiles('encrypted-artifact/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-backup-${{ github.run_id }}
          path: encrypted-artifact/
          retention-days: 90
          if-no-files-found: error
      - name: Record outcome
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## Backup result: %s\n\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Success requires encrypted code/history, database and Storage uploads verified by downloading from BOTH configured remotes. No old backup is deleted. A backup is not a proven full recovery until an isolated restore is tested. Billing can prevent this job from starting; inspect Actions when no fresh success exists.' >> "$GITHUB_STEP_SUMMARY"
