name: Meditation text card visual review
on:
  pull_request:
    branches: [main]
    paths: ['players/meditation.html', '.github/workflows/meditation-text-cards.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser tools
        run: |
          mkdir /tmp/ci-browser
          cd /tmp/ci-browser
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Render and check all cards
        run: |
          mkdir -p review-output
          python3 -m http.server 8765 >/tmp/ci-http.log 2>&1 &
          NODE_PATH=/tmp/ci-browser/node_modules node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1024,height:576}});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8765/players/meditation.html?t=10&mode=guided&external=1');
            await p.locator('.session-card img').evaluate(img=>img.decode());
            for(const [i,t] of [0,60,120,180,240,300,360,420,480,565].entries()){
              await p.evaluate(t=>window.postMessage({type:'ci-meditation-command',command:'seek',ratio:t/600},location.origin),t);
              await p.waitForTimeout(30);
              const text=await p.locator('.session-card p').textContent();
              assert.ok(text.length>100);
              assert.ok(!text.includes('GRATITUDE'));
              const fit=await p.locator('.session-card p').evaluate(e=>({height:e.clientHeight,scroll:e.scrollHeight}));
              assert.ok(fit.scroll<=fit.height+1,'Card '+(i+1)+' overflows');
              await p.screenshot({path:'review-output/card-'+(i+1)+'.png'});
            }
            await p.evaluate(()=>window.postMessage({type:'ci-meditation-command',command:'seek',ratio:1},location.origin));
            await p.waitForTimeout(30);assert.equal(await p.locator('.session-card p').textContent(),'Session complete');
            await p.setViewportSize({width:390,height:220});
            await p.evaluate(()=>window.postMessage({type:'ci-meditation-command',command:'seek',ratio:0},location.origin));
            await p.waitForTimeout(30);await p.screenshot({path:'review-output/mobile.png'});
            await p.goto('http://127.0.0.1:8765/players/meditation.html?t=15&mode=guided&external=1');
            assert.equal(await p.locator('.session-card').count(),0);
            assert.deepEqual(errors,[]);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meditation-text-cards
          path: review-output/
