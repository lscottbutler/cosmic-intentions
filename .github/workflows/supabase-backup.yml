name: Supabase backup

# Daily pg_dump of the Supabase Postgres DB (free-tier safety net — Supabase free
# has NO automatic backups). The dump is stored on a dedicated `db-backups` branch
# so it never touches `main` and never triggers a Netlify deploy.
#
# SETUP (one time): add a repo secret SUPABASE_DB_URL =
#   the Supabase "Session pooler" connection URI (Supabase dashboard →
#   Settings → Database → Connection string → Session pooler, includes password).
#   The Session pooler is IPv4 and works from GitHub's runners; the direct
#   connection is IPv6-only and will NOT connect here.

on:
  schedule:
    - cron: '17 7 * * *'      # daily, 07:17 UTC
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump database
        env:
          # Easiest: set ONLY SUPABASE_DB_PASSWORD (your raw DB password, symbols and all).
          # Advanced/optional: set SUPABASE_DB_URL to a full connection string to override.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          DUMP=/tmp/cosmic-intentions.sql
          export PGCONNECT_TIMEOUT=12
          if [ -n "$SUPABASE_DB_URL" ]; then
            pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists -f "$DUMP"
          elif [ -n "$PGPASSWORD" ]; then
            # Session pooler (IPv4, works from GitHub). Try both pooler prefixes for the region;
            # host/user are this project's identifiers, not secrets.
            OK=0
            for H in aws-0-ap-northeast-1.pooler.supabase.com aws-1-ap-northeast-1.pooler.supabase.com; do
              echo "Connecting via $H ..."
              if pg_dump -h "$H" -p 5432 -U postgres.wbqzwbubbeorcknevips -d postgres \
                         --no-owner --no-privileges --clean --if-exists -f "$DUMP" 2>/tmp/pgerr; then
                echo "✅ connected via $H"; OK=1; break
              else
                echo "  ✗ $(tail -n1 /tmp/pgerr)"
              fi
            done
            if [ "$OK" != 1 ]; then
              echo "::error::Could not connect to Supabase. Most likely a wrong password. Full error:"
              cat /tmp/pgerr
              exit 1
            fi
          else
            echo "::warning::Set SUPABASE_DB_PASSWORD (or SUPABASE_DB_URL) in repo Settings → Secrets → Actions — skipping."
            exit 0
          fi
          echo "Dumped $(wc -l < "$DUMP") lines, $(du -h "$DUMP" | cut -f1)"

      - name: Commit to db-backups branch (isolated from main / Netlify)
        run: |
          [ -f /tmp/cosmic-intentions.sql ] || { echo "no dump produced — nothing to do"; exit 0; }
          git config user.name  "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          if git fetch origin db-backups && git checkout db-backups; then
            echo "on existing db-backups branch"
          else
            git checkout --orphan db-backups
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p backups
          cp /tmp/cosmic-intentions.sql backups/cosmic-intentions.sql
          git add backups/cosmic-intentions.sql
          if git diff --cached --quiet; then
            echo "no changes since last backup"; exit 0
          fi
          git commit -m "chore(backup): supabase snapshot $(date -u +%F)"
          git push origin db-backups
