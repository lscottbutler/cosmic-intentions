name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve approved player template
        run: npm run check:template
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Run Master Player and smoke tests
        run: npm test
      - name: Preserve private review screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-review-evidence
          path: test-results/
          retention-days: 7
