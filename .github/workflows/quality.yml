name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve approved player template
        run: npm run check:template
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Lint
        run: npm run lint
      - name: Run Master Player and smoke tests
        run: npm test -- --grep-invert "Habits mindset links and personal follow-through round trip|Habits links still navigate with session storage unavailable|Entrepreneur notes|Entrepreneur trough|Cosmic concept"
      - name: Preserve private review screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-review-evidence
          path: test-results/
          retention-days: 7

  focused-player-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Habits round trips and Entrepreneur notes
        run: npm test -- tests/habit-mindset.spec.js tests/entrepreneur-notes.spec.js --workers=2
      - name: Preserve focused player review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-player-evidence
          path: test-results/
          retention-days: 7


  trough-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Entrepreneur trough on desktop and mobile
        run: npm test -- tests/entrepreneur-trough.spec.js --workers=2
      - name: Preserve private trough review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trough-review-evidence
          path: test-results/
          retention-days: 7

  cosmic-concepts-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Cosmic Library catalog on desktop and mobile
        run: npm test -- tests/cosmic-concepts.spec.js --workers=2
      - name: Preserve private catalog review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-concepts-evidence
          path: test-results/
          retention-days: 7
