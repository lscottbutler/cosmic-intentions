[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# Vite 8 needs Node >= 20.19 / 22.12 — pin it so the production build matches local.
[build.environment]
  NODE_VERSION = "22"

# NOTE: a bare `[functions] timeout = 60` is INVALID Netlify config — it makes
# config resolution fail and blocks every deploy. Function timeout is not set
# via netlify.toml here; the bbfw two-pass split keeps calls under the limit.

# Local `netlify dev` only — never auto-open a browser (no Edge popping up)
[dev]
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pretty URLs for the free I AM Statement Generator lead-magnet page
[[redirects]]
  from = "/iam"
  to = "/standalone/iam-generator.html"
  status = 200

[[redirects]]
  from = "/i-am-generator"
  to = "/standalone/iam-generator.html"
  status = 200

# Waitlist / early-access landing page
[[redirects]]
  from = "/early"
  to = "/standalone/early.html"
  status = 200

# Launch OS — private marketing execution tool (not linked in the app)
[[redirects]]
  from = "/launch"
  to = "/standalone/launch-os.html"
  status = 200

# Legal pages
[[redirects]]
  from = "/terms"
  to = "/standalone/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/standalone/privacy.html"
  status = 200

# About Us — company story / personal-development lineage
[[redirects]]
  from = "/about"
  to = "/standalone/about.html"
  status = 200

# Landing page draft — preview at /landing
[[redirects]]
  from = "/landing"
  to = "/standalone/landing-draft.html"
  status = 200

# How-it-works — animated vignette hub at /how-it-works
[[redirects]]
  from = "/how-it-works"
  to = "/standalone/how-it-works.html"
  status = 200

# Landing library — dark navy variant at /landing-dark (white variant is /landing)
[[redirects]]
  from = "/landing-dark"
  to = "/standalone/landing-dark.html"
  status = 200

# Landing versions — three DIFFERENT designs (V1 = /landing white 6-pillar)
[[redirects]]
  from = "/landing-v2"
  to = "/standalone/landing-v2.html"
  status = 200
[[redirects]]
  from = "/landing-v3"
  to = "/standalone/landing-v3.html"
  status = 200

# App shell must always revalidate so menu/UI changes appear WITHOUT a hard
# refresh. Vite's hashed /assets/* stay immutable & cached; only the HTML is no-cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
