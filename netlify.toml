[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

# Vite 8 needs Node >= 20.19 / 22.12 — pin it so the production build matches local.
[build.environment]
  NODE_VERSION = "22"

# NOTE: a bare `[functions] timeout = 60` is INVALID Netlify config — it makes
# config resolution fail and blocks every deploy. Function timeout is not set
# via netlify.toml here; the bbfw two-pass split keeps calls under the limit.

# Local `netlify dev` only — never auto-open a browser (no Edge popping up)
[dev]
  autoLaunch = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Pretty URLs for the free I AM Statement Generator lead-magnet page
[[redirects]]
  from = "/iam"
  to = "/standalone/iam-generator.html"
  status = 200

[[redirects]]
  from = "/i-am-generator"
  to = "/standalone/iam-generator.html"
  status = 200

# Waitlist / early-access landing page
[[redirects]]
  from = "/early"
  to = "/standalone/early.html"
  status = 200

# Launch OS — private marketing execution tool (not linked in the app)
[[redirects]]
  from = "/launch"
  to = "/standalone/launch-os.html"
  status = 200

# Legal pages
[[redirects]]
  from = "/terms"
  to = "/standalone/terms.html"
