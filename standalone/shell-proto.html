<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Column B Shell — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --line:#e6e9ed; --blue:#1E90FF; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:'Roboto Condensed',system-ui,sans-serif; background:#eef1f4; color:#1b2027; }
  .shell { display:flex; gap:14px; height:100vh; padding:14px; }
  /* COLUMN A — content pane (left) */
  .shell-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .shell-bar { display:flex; align-items:center; gap:10px; margin:0 0 10px; }
  .shell-bar .now { font-weight:700; font-size:14px; color:#26364b; }
  #shellPane { flex:1; width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; box-shadow:0 6px 24px rgba(20,40,80,.08); }
  /* COLUMN B — the master link list (right) */
  .shell-links { width:270px; flex-shrink:0; overflow-y:auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; }
  .shell-links .title { font-weight:700; font-size:16px; color:var(--blue); letter-spacing:.5px; margin:0 0 4px; }
  .shell-links .hint { font-size:11px; color:#8a97a8; margin:0 0 12px; }
  .shell-links h4 { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:#8a97a8; margin:16px 0 6px; border-top:1px solid var(--line); padding-top:12px; }
  .shell-links h4:first-of-type { border-top:none; padding-top:0; margin-top:6px; }
  .lnk { display:block; width:100%; text-align:left; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:9px 12px; margin-bottom:6px; cursor:pointer; font:700 13px 'Roboto Condensed',sans-serif; letter-spacing:.3px; }
  .lnk:hover { background:#000; transform:translateX(2px); }
  .lnk.active { outline:2px solid var(--blue); }
  .lnk--play { background:#0F9AA0; }
  .lnk--ext  { background:#6A4FB0; }
  @media (max-width:760px){ .shell { flex-direction:column; height:auto; } .shell-links { width:100%; } #shellPane{ min-height:70vh; } }
</style>
</head>
<body>
<div class="shell">
  <!-- ══ COLUMN A: content pane ══ -->
  <div class="shell-main">
    <div class="shell-bar"><span class="now">Now showing: <span id="shellNow">Inner Citadel</span></span></div>
    <iframe id="shellPane" src="/?preview=1&page=dashboard&embed=1" title="content"></iframe>
  </div>

  <!-- ══ COLUMN B: every link (curate this list) ══ -->
  <aside class="shell-links">
    <div class="title">COLUMN B — ALL LINKS</div>
    <div class="hint">Click a link → it opens in the left pane. This is every nav link on the site; tweak/reorder freely.</div>

    <h4>Member Pages</h4>
    <button class="lnk" onclick="go(this,'Inner Citadel','/?preview=1&page=dashboard&embed=1')">Inner Citadel</button>
    <button class="lnk" onclick="go(this,'My Thoughts (My Words)','/?preview=1&page=notes&embed=1')">My Thoughts · My Words</button>
    <button class="lnk" onclick="go(this,'My Notes','/?preview=1&page=mynotes&embed=1')">My Notes</button>
    <button class="lnk" onclick="go(this,'My Goals','/?preview=1&page=setup&embed=1')">My Goals</button>
    <button class="lnk" onclick="go(this,'My Habits','/?preview=1&page=habits&embed=1')">My Habits</button>
    <button class="lnk" onclick="go(this,'Roadmap','/?preview=1&page=myroadmap&embed=1')">Roadmap</button>
    <button class="lnk" onclick="go(this,'My Favorites Reel','/?preview=1&page=dailyfocus&embed=1')">My Favorites Reel</button>
    <button class="lnk" onclick="go(this,'Visualization Library','/?preview=1&page=vizlibrary&embed=1')">Visualization Library</button>
    <button class="lnk" onclick="go(this,'Daily Habits','/?preview=1&page=runthroughs&embed=1')">Daily Habits</button>
    <button class="lnk" onclick="go(this,'Meditation','/?preview=1&page=meditation&embed=1')">Meditation</button>
    <button class="lnk" onclick="go(this,'Gratitude','/?preview=1&page=gratitude&embed=1')">Gratitude</button>
    <button class="lnk" onclick="go(this,'My Wins','/?preview=1&page=wins&embed=1')">My Wins</button>
    <button class="lnk" onclick="go(this,'Cosmic Library','/?preview=1&page=cosmiclibrary&embed=1')">Cosmic Library</button>
    <button class="lnk" onclick="go(this,'Entrepreneur Library','/?preview=1&page=entcard&embed=1')">Entrepreneur Library</button>
    <button class="lnk" onclick="go(this,'Admin','/?preview=1&page=admin&embed=1')">Admin</button>

    <h4>Players</h4>
    <button class="lnk lnk--play" onclick="go(this,'3-Min Visualization','players/3min-viz.html')">3-Min Visualization</button>
    <button class="lnk lnk--play" onclick="go(this,'Meditation Player','players/meditation.html')">Meditation Player</button>
    <button class="lnk lnk--play" onclick="go(this,'Gratitude Player','players/gratitude.html')">Gratitude Player</button>
    <button class="lnk lnk--play" onclick="go(this,'Gratitude Guided','players/gratitude-guided.html')">Gratitude Guided</button>
    <button class="lnk lnk--play" onclick="go(this,'Recitations','players/recite.html')">Recitations</button>

    <h4>Marketing / Public</h4>
    <button class="lnk lnk--ext" onclick="go(this,'Landing Page 1','/landing')">Landing Page 1</button>
    <button class="lnk lnk--ext" onclick="go(this,'Landing Page 2','/landing-v2')">Landing Page 2</button>
    <button class="lnk lnk--ext" onclick="go(this,'Landing Page 3','/landing-v3')">Landing Page 3</button>
    <button class="lnk lnk--ext" onclick="go(this,'About Us','/about')">About Us</button>
  </aside>
</div>
<script>
  function go(btn, name, url){
    document.getElementById('shellPane').src = url;
    document.getElementById('shellNow').textContent = name;
    document.querySelectorAll('.lnk').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  }
  // mark the default
  document.querySelector('.lnk').classList.add('active');
</script>
</body>
</html>
