<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#232323;font-family:Arial,sans-serif;padding:20px;}
.pg-screen{background:#fff;border-radius:6px;padding:20px 18px;}
.viz-layout{display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start;}
.viz-side{border:1px dashed #cfcfcf;border-radius:10px;min-height:240px;padding:14px;}
#vizLibList{display:grid;grid-template-columns:1fr;gap:12px;}
.card{border-radius:12px;padding:16px;color:#fff;font-weight:800;display:flex;align-items:center;gap:12px;}
.num{width:34px;height:34px;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center;}
.intro{text-align:center;color:#26364b;margin:0 0 16px;}
.ph{border:1px solid #e5e5e5;border-radius:12px;padding:16px;color:#888;margin-bottom:12px;}
</style></head>
<body>
<div class="pg-screen">
  <div class="viz-layout">
    <div class="viz-main">
      <p class="intro">Pick a goal to visualize, review, meditate or give thanks.</p>
      <div class="ph">Lorem ipsum placeholder card…</div>
      <div id="vizLibList">
        <div class="card" style="background:#e2564f;"><span class="num">A</span>I AM THE PROUD OWNER OF A XIAOMI SU 7</div>
        <div class="card" style="background:#e8783a;"><span class="num">B</span>I HAVE sold 200 Founder Subscriptions</div>
        <div class="card" style="background:#e8963a;"><span class="num">C</span>I AM PREMIERING COSMIC INTENTIONS</div>
        <div class="card" style="background:#88b83a;"><span class="num">F</span>I AM LAUNCHING COSMIC INTENTIONS</div>
      </div>
    </div>
    <aside class="viz-side"></aside>
  </div>
</div>
</body></html>
