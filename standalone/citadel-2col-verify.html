<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#8FA977;font-family:Arial,sans-serif;padding:16px;}
#citadelNav{display:grid;grid-template-columns:1fr 1fr;gap:10px;grid-auto-flow:row dense;align-items:start;}
#citadelNav > button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;cursor:pointer;color:#fff;border-radius:6px;padding:9px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
#citadelNav > button:nth-of-type(4),#citadelNav > button:nth-of-type(5),#citadelNav > button:nth-of-type(6),#citadelNav > button:nth-of-type(7),#citadelNav > button:nth-of-type(8){background:#1c1c1c;}
#citadelNav > button{background:#6e6e6e;}
#citadelNav > button:nth-of-type(1){order:2}#citadelNav > button:nth-of-type(2){order:10}#citadelNav > button:nth-of-type(3){order:8}#citadelNav > button:nth-of-type(4){order:5}#citadelNav > button:nth-of-type(5){order:1}#citadelNav > button:nth-of-type(6){order:7}#citadelNav > button:nth-of-type(7){order:3}#citadelNav > button:nth-of-type(8){order:9}#citadelNav > button:nth-of-type(9){order:4}#citadelNav > button:nth-of-type(10){order:6}
.lbl{flex:1;min-width:0;font-weight:400;font-size:16px;}
.chev{flex-shrink:0;font-size:15px;opacity:.8;}
</style></head>
