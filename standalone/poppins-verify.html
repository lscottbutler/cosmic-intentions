<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{font-family:'Poppins',system-ui,sans-serif !important;}
  body{margin:0;background:#fff;padding:40px 48px;}
  h1{color:#14233f;font-weight:800;font-size:34px;letter-spacing:.2px;margin:0 0 24px;}
  .note{background:#fff;border:1px solid #e9edf2;border-left:4px solid #e0102b;border-radius:12px;box-shadow:0 8px 26px rgba(20,40,80,.07);padding:24px 28px;max-width:520px;}
  .note p{font-size:15.5px;line-height:1.7;color:#3a4a63;margin:0;}
  .labels{margin-top:22px;color:#8FA977;font-weight:800;letter-spacing:1px;font-size:13px;}
  .num{display:inline-flex;width:34px;height:34px;border-radius:50%;background:#000;color:#fff;align-items:center;justify-content:center;font-weight:700;font-size:17px;margin-top:14px;}
</style></head>
<body>
  <h1>WELCOME BACK, SCOTTY</h1>
  <div class="note"><p>Your effort today is a testament to your dedication, your discipline and your drive. Your actions today move you one step closer to successfully accomplishing your goals so you can live the life you desire.</p></div>
  <div class="labels">GO DEEPER · YOUTUBE · PODCASTS · ARTICLES</div>
  <div class="num">A</div>
</body></html>
