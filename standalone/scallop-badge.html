<!doctype html>
<html><head><meta charset="utf-8"><title>Scallop badge test</title>
<style>
  body{margin:0;background:#f4f5f7;font-family:system-ui,sans-serif;color:#1a1a1a;padding:30px;}
  h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#667;margin:24px 0 12px;}
  .row{display:flex;align-items:center;gap:34px;flex-wrap:wrap;}
  .lab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#667;}
  .card{background:#eef0f3;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:1px solid #dde2e8;}
  .ttl{font-size:20px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;}
  .circle{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#E84040;color:#fff;font-weight:800;font-size:17px;}
</style></head>
<body>
  <script>
    // 8-lobe scalloped circle path (outward bumps), viewBox 0 0 100 100.
    function scallop(baseR, bumpR, lobes){
      const cx=50, cy=50, pts=[];
      for(let i=0;i<lobes;i++){ const a=(i/lobes)*2*Math.PI - Math.PI/2; pts.push([cx+baseR*Math.cos(a), cy+baseR*Math.sin(a)]); }
      let d='M '+pts[0][0].toFixed(2)+' '+pts[0][1].toFixed(2)+' ';
      for(let i=1;i<=lobes;i++){ const p=pts[i%lobes]; d+='A '+bumpR+' '+bumpR+' 0 0 1 '+p[0].toFixed(2)+' '+p[1].toFixed(2)+' '; }
      return d+'Z';
    }
    function badge(px, fill, letter, baseR, bumpR){
      return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 100 100">'+
        '<path d="'+scallop(baseR, bumpR, 8)+'" fill="'+fill+'"/>'+
        '<text x="50" y="50" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="system-ui,sans-serif" font-weight="800" font-size="46">'+letter+'</text></svg>';
    }
    const shapes = [
      ['Gentle scallop (baseR36 / bumpR16)', 36, 16],
      ['Medium scallop (baseR34 / bumpR15)', 34, 15],
      ['Deep scallop (baseR32 / bumpR14)',   32, 14],
    ];
    let html = '';
    shapes.forEach(([name,bR,pR])=>{
      html += '<h2>'+name+'</h2><div class="row">'+
        '<div class="lab">'+badge(34,'#E84040','A',bR,pR)+'34px (goal size)</div>'+
        '<div class="lab">'+badge(60,'#E86030','B',bR,pR)+'60px</div>'+
        '<div class="lab">'+badge(90,'#1a1a1a','C',bR,pR)+'90px dark</div>'+
        '<div class="card">'+badge(34,'#E84040','A',bR,pR)+'<span class="ttl">Goal A</span></div>'+
        '</div>';
    });
    html += '<h2>Current circle (for comparison)</h2><div class="row">'+
      '<div class="lab"><span class="circle">A</span>34px</div>'+
      '<div class="card"><span class="circle">A</span><span class="ttl">Goal A</span></div></div>';
    document.body.insertAdjacentHTML('beforeend', html);
  </script>
</body></html>
