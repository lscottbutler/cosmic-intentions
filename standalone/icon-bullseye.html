<!doctype html>
<html><head><meta charset="utf-8"><title>Bullseye icon — style lock</title>
<style>
  body{margin:0;background:#f4f5f7;font-family:system-ui,sans-serif;color:#1a1a1a;padding:30px;}
  h2{font-size:14px;letter-spacing:.5px;text-transform:uppercase;color:#667;margin:26px 0 12px;}
  .row{display:flex;align-items:center;gap:26px;flex-wrap:wrap;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#667;}
  .dark{background:#1a1a1a;padding:14px 18px;border-radius:12px;color:#fff;display:inline-flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.4px;}
  .badge{width:34px;height:34px;border-radius:50%;background:#E84040;color:#fff;display:inline-flex;align-items:center;justify-content:center;}
  .navybtn{background:#1D3557;color:#fff;border-radius:8px;padding:12px 16px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.3px;}
  .orange{color:#F2911E;}
</style></head>
<body>
  <!-- ICON A: target + dart (matches the sample: bullseye with an arrow in it) -->
  <svg style="display:none"><symbol id="bullseye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="13.5" r="7.5"/>
    <circle cx="10.5" cy="13.5" r="3.6"/>
    <circle cx="10.5" cy="13.5" r="0.6" fill="currentColor" stroke="none"/>
    <path d="M10.5 13.5 L20.5 3.5"/>
    <path d="M15.8 3.5 H20.5 V8.2"/>
  </symbol></svg>

  <!-- ICON B: clean concentric target only (no dart), simpler -->
  <svg style="display:none"><symbol id="target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
  </symbol></svg>

  <h2>Option A — bullseye + dart (matches your sample)</h2>
  <div class="row">
    <div class="swatch"><svg width="20" height="20"><use href="#bullseye"/></svg>20px</div>
    <div class="swatch"><svg width="26" height="26"><use href="#bullseye"/></svg>26px</div>
    <div class="swatch"><svg width="40" height="40"><use href="#bullseye"/></svg>40px</div>
    <span class="dark"><svg width="22" height="22"><use href="#bullseye"/></svg>Goals / Intentions</span>
    <span class="navybtn"><svg width="18" height="18" class="orange"><use href="#bullseye"/></svg>MY ACTION PLAN</span>
    <span class="badge"><svg width="20" height="20"><use href="#bullseye"/></svg></span>
  </div>

  <h2>Option B — clean target, no dart (simpler)</h2>
  <div class="row">
    <div class="swatch"><svg width="20" height="20"><use href="#target"/></svg>20px</div>
    <div class="swatch"><svg width="26" height="26"><use href="#target"/></svg>26px</div>
    <div class="swatch"><svg width="40" height="40"><use href="#target"/></svg>40px</div>
    <span class="dark"><svg width="22" height="22"><use href="#target"/></svg>Goals / Intentions</span>
    <span class="navybtn"><svg width="18" height="18" class="orange"><use href="#target"/></svg>MY ACTION PLAN</span>
    <span class="badge"><svg width="20" height="20"><use href="#target"/></svg></span>
  </div>
</body></html>
