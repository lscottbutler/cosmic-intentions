<!doctype html>
<html><head><meta charset="utf-8"><title>Bullseye v2</title>
<style>
  body{margin:0;background:#1f1f1f;font-family:system-ui,sans-serif;color:#ddd;padding:30px;}
  h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#9aa;margin:22px 0 12px;}
  .row{display:flex;align-items:center;gap:34px;flex-wrap:wrap;}
  .lab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#9aa;}
  .bar{display:inline-flex;align-items:center;gap:14px;background:#6e6e6e;color:#fff;border-radius:6px;padding:9px 16px;font-size:16px;}
</style></head>
<body>
  <!-- Target (3 rings + dot) with a dart: arrowhead into the center, fletching at the top-right tail -->
  <svg style="display:none"><symbol id="bull" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11.5" cy="14.5" r="9.4"/>
    <circle cx="11.5" cy="14.5" r="6.1"/>
    <circle cx="11.5" cy="14.5" r="2.8"/>
    <circle cx="11.5" cy="14.5" r="0.5" fill="currentColor" stroke="none"/>
    <path d="M11.5 14.5 L22.5 3.5"/>
    <path d="M8.7 13.4 L11.5 14.5 L12.6 11.7"/>
    <path d="M18 3.5 L22.5 3.5 L22.5 8"/>
  </symbol></svg>

  <h2>Bullseye v2</h2>
  <div class="row">
    <div class="lab"><svg width="22" height="22" fill="none" stroke="#111"><use href="#bull"/></svg>22 dark</div>
    <div class="lab"><svg width="34" height="34" fill="none" stroke="#111"><use href="#bull"/></svg>34 dark</div>
    <div class="lab"><svg width="60" height="60" fill="none" stroke="#111"><use href="#bull"/></svg>60 dark</div>
    <span class="bar"><svg width="34" height="34" fill="none" stroke="#fff"><use href="#bull"/></svg>Goals / Intentions</span>
  </div>
</body></html>
