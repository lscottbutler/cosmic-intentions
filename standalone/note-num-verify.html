<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#8FA977;font-family:Arial,sans-serif;padding:24px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start;}</style></head>
<body>
<div class="grid">
  <div style="position:relative;background:#fff;padding:14px 40px 30px 15px;">
    <button style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#000;border:none;color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;">&times;</button>
    <span style="float:left;shape-outside:circle(52%);-webkit-shape-outside:circle(52%);width:34px;height:34px;border-radius:50%;background:#000;color:#fff;font-weight:800;font-size:15px;text-align:center;line-height:34px;margin:2px 12px 4px 0;">1</span>
    <div style="font-size:14px;line-height:1.6;color:#1c1c1c;min-height:34px;">this is me adding a note. what is this doing and here is a bit more text so it wraps nicely around the number circle on the left side of the card</div>
    <span style="position:absolute;bottom:7px;right:9px;color:#c2c2c2;font-size:15px;line-height:1;">&#9776;</span>
  </div>
  <div style="position:relative;background:#fff;padding:14px 40px 30px 15px;">
    <button style="position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#000;border:none;color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;">&times;</button>
    <span style="float:left;shape-outside:circle(52%);-webkit-shape-outside:circle(52%);width:34px;height:34px;border-radius:50%;background:#000;color:#fff;font-weight:800;font-size:15px;text-align:center;line-height:34px;margin:2px 12px 4px 0;">2</span>
    <div style="font-size:14px;line-height:1.6;color:#1c1c1c;min-height:34px;">note number two</div>
    <span style="position:absolute;bottom:7px;right:9px;color:#c2c2c2;font-size:15px;line-height:1;">&#9776;</span>
  </div>
</div>
</body></html>
