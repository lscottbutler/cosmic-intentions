<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#2b2b2b;padding:20px;}</style></head>
<body>
<div style="background:#8FA977;padding:16px 18px 20px;">
  <div style="background:#5c6158;color:#e9ebe6;font-weight:800;letter-spacing:6px;font-size:14px;text-align:center;padding:12px;margin-bottom:14px;">AFFIRMATIONS</div>
  <!-- row 1: favorited (filled heart) -->
  <div style="display:flex;align-items:stretch;margin-bottom:10px;">
    <div style="flex-shrink:0;width:56px;background:#20241f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;font-family:monospace;">1</div>
    <div style="flex:1;background:#fff;padding:13px 15px;color:#1c1c1c;font-size:14px;line-height:1.5;">I am self-confident. My certainty is earned, not borrowed.</div>
    <button style="flex-shrink:0;width:56px;background:#20241f;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;">&#9829;</button>
  </div>
  <!-- row 2: not favorited (outline heart) -->
  <div style="display:flex;align-items:stretch;margin-bottom:10px;">
    <div style="flex-shrink:0;width:56px;background:#20241f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;font-family:monospace;">2</div>
    <div style="flex:1;background:#fff;padding:13px 15px;color:#1c1c1c;font-size:14px;line-height:1.5;">I trust myself to figure it out as I go.</div>
    <button style="flex-shrink:0;width:56px;background:#20241f;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;line-height:1;">&#9825;</button>
  </div>
</div>
</body></html>
