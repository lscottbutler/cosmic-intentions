<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cosmic Intentions — Landing design review</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;font-family:system-ui,sans-serif;color:#213c5a}.review-nav{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;border-bottom:1px solid #dbe3ed}button{font:600 14px system-ui;border:1px solid #dbe3ed;border-radius:999px;padding:10px 18px;background:#fff;color:#213c5a;cursor:pointer}button[aria-pressed=true]{background:#5351c9;color:#fff;border-color:#5351c9}button:focus-visible{outline:3px solid #213c5a;outline-offset:2px}iframe{display:block;width:100%;height:calc(100dvh - 62px);border:0}@media(max-width:420px){button{padding:10px 12px;font-size:13px}}</style></head><body><nav class="review-nav" aria-label="Landing page versions"><button type="button" aria-pressed="true" data-page="landing-draft.html">Original</button><button type="button" aria-pressed="false" data-page="landing-v2.html">Version 2</button><button type="button" aria-pressed="false" data-page="landing-v3.html">Version 3</button></nav><iframe title="Original landing page" src="landing-draft.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));frame.src=button.dataset.page;frame.title=button.textContent+' landing page'}));</script></body></html>
