<!doctype html><html><head><meta charset="utf-8">
<style>body{background:#fff;font-family:system-ui,Arial,sans-serif;margin:0;padding:20px;}#w{max-width:480px;}</style>
</head><body><div id="w"></div>
<script>
  const G={bright:'#1D3557',done:'#2FA94B',lite:'#1D3557',mid:'#5b6b82',dim:'#9aa6b6',track:'#e3e6ea',faint:'#eef1f4',brand:'#F5A623',grat:'#ff8ab8'};
  const _mono='font-family:ui-monospace,monospace;';
  const PILLARS=[{key:'review',label:'Completed Tasks',icon:'✓'},{key:'visualize',label:'Visualize',icon:'✦'},{key:'habits',label:'Habits',icon:'☑'}];
  const BONUS=[{key:'gratitude',label:'Gratitude',icon:'♥'},{key:'meditate',label:'Meditate',icon:'☾'}];
  const rings={review:true,visualize:false,habits:true,gratitude:false,meditate:true};
  const ring=(on,col)=>`<svg width="44" height="44" style="transform:rotate(-90deg)"><circle cx="22" cy="22" r="18" fill="none" stroke="${G.track}" stroke-width="4"/>${on?`<circle cx="22" cy="22" r="18" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="0"/>`:''}</svg>`;
  const pillarHead=PILLARS.map(p=>{const done=!!rings[p.key];return `<div style="text-align:center;${_mono}font-size:10px;font-weight:800;color:${done?G.done:G.lite};"><span style="display:block;font-size:15px;margin-bottom:2px;color:${done?G.done:G.mid};">${p.icon}</span>${p.label.toUpperCase()}<span style="display:block;font-size:8.5px;font-weight:800;color:${done?G.done:G.dim};margin-top:2px;">${done?'✓ ':''}+5</span></div>`;}).join('');
  const HZ=[{k:'daily',l:'DAILY',c:'#ff5a5a'},{k:'weekly',l:'WEEKLY',c:'#f5b301'},{k:'monthly',l:'MONTHLY',c:'#28c7b7'},{k:'yearly',l:'YEARLY',c:'#8b7bf7'}];
  const fr={review:{daily:1,weekly:.6,monthly:.3,yearly:.1},visualize:{daily:0,weekly:.4,monthly:.2,yearly:.05},habits:{daily:1,weekly:.7,monthly:.35,yearly:.12}};
  const barRows=HZ.map(h=>`<div style="display:flex;align-items:center;gap:6px;${_mono}font-size:9px;font-weight:800;color:${G.mid};"><span style="width:9px;height:9px;border-radius:50%;background:${h.c};"></span>${h.l}</div>`+PILLARS.map(p=>{const f=fr[p.key][h.k];return `<div style="position:relative;height:11px;background:${G.track};border-radius:6px;overflow:hidden;"><div style="position:absolute;left:0;top:0;bottom:0;width:${(f*100)|0}%;background:${h.c};border-radius:6px;"></div></div>`;}).join('')).join('');
  const bcol={gratitude:G.grat,meditate:'#8b7bf7'};
  const bonus=BONUS.map(b=>{const on=!!rings[b.key];const col=bcol[b.key];return `<div style="margin-top:10px;padding-top:12px;border-top:1px dashed ${G.track};display:flex;align-items:center;gap:12px;"><button style="position:relative;width:44px;height:44px;background:none;border:none;padding:0;">${ring(on,col)}<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:${on?col:G.dim};">${b.icon}</span></button><span style="flex:1;"><div style="font-weight:800;font-size:13px;color:${G.bright};">${b.label}${on?' ✓':''}</div><div style="font-size:11px;color:${G.dim};margin-top:2px;">Bonus ring — not required for a Perfect Day</div></span><span style="${_mono}font-size:9px;font-weight:800;color:${col};border:1px solid ${col};border-radius:999px;padding:4px 9px;">+5 BONUS</span></div>`;}).join('');
  document.getElementById('w').innerHTML=`<div style="background:#fff;border:1px solid #e6e6e6;border-radius:16px;padding:16px;"><div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="${_mono}font-size:12px;font-weight:800;letter-spacing:1.5px;color:#1D3557;">◈ THE BIG 3</span><span style="${_mono}font-size:12px;font-weight:800;color:${G.mid};"><b style="font-size:16px;color:${G.brand};">64</b> pts today</span></div><div style="display:grid;grid-template-columns:64px 1fr 1fr 1fr;gap:9px 10px;align-items:center;"><div></div>${pillarHead}${barRows}</div>${bonus}</div>`;
</script></body></html>
