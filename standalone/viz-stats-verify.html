<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#232323;font-family:Arial,sans-serif;padding:20px;}
.pg-screen{background:#fff;border-radius:6px;padding:20px;}
.viz-layout{display:grid;grid-template-columns:3fr 1fr;gap:16px;align-items:start;}
.viz-side{border:1px dashed #cfcfcf;border-radius:10px;min-height:240px;padding:14px;}
.main{background:#eee;border-radius:8px;min-height:400px;}
</style></head>
<body>
<div class="pg-screen"><div class="viz-layout">
  <div class="main"></div>
  <aside class="viz-side">
    <img src="../images/home-clown.png" alt="" style="width:100%;height:auto;display:block;margin-bottom:14px;">
    <div id="vizSideStats">
      <div style="background:#fff;border:1px solid #e6e9ed;border-radius:10px;padding:14px;">
        <div style="font-weight:800;letter-spacing:1px;font-size:12px;color:#1C2230;margin-bottom:8px;">◈ THE BIG 3</div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Points today</span><span style="font-weight:800;">0 pts</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Streak</span><span style="font-weight:800;">0 days</span></div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#8a8a8a;margin:12px 0 2px;">PILLARS 0/3</div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;"><span style="width:16px;text-align:center;">✓</span><span style="flex:1;">Completed Tasks</span><span style="font-weight:800;color:#c4c6cb;">–</span></div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;"><span style="width:16px;text-align:center;">✦</span><span style="flex:1;">Visualize</span><span style="font-weight:800;color:#c4c6cb;">–</span></div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;"><span style="width:16px;text-align:center;">☑</span><span style="flex:1;">Habits</span><span style="font-weight:800;color:#2FA94B;">✓</span></div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#8a8a8a;margin:12px 0 2px;">PROGRESS</div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Momentum</span><span style="font-weight:800;">0/100</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Rank</span><span style="font-weight:800;">Initiate</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Perfect Days</span><span style="font-weight:800;">1</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>To Aspirant</span><span style="font-weight:800;">2 more</span></div>
        <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#8a8a8a;margin:12px 0 2px;">THIS WEEK</div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Perfect Days</span><span style="font-weight:800;">1</span></div>
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef0f2;font-size:13px;color:#1c1c1c;"><span>Pillars closed</span><span style="font-weight:800;">3</span></div>
      </div>
    </div>
  </aside>
</div></div>
</body></html>
