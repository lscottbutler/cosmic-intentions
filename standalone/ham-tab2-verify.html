<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;}
  .header-stack{position:relative;}
  .hdr{background:#232323;height:56px;display:flex;align-items:center;padding:0 20px;}
  .hdr .logo{color:#fff;letter-spacing:.22em;font-size:13px;font-weight:700;}
  .pg-hdr{background:#232323;height:52px;display:flex;align-items:center;justify-content:center;}
  .pg-hdr .title{color:#fff;letter-spacing:.22em;font-size:14px;font-weight:700;}

  /* tab: bottom-anchored to the header, rounds UP above the title line */
  .ham-tab{
    position:absolute;
    right:18px;
    bottom:0;                 /* sits on the header bottom, never hangs into content */
    width:104px;
    height:96px;              /* fills both rows; rounded top rises above the title line */
    background:#3f3f3f;
    border-radius:52px 52px 0 0;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .ham-btn{
    width:70px;height:70px;border-radius:50%;
    background:#000;border:9px solid #8f8f8f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    padding:0;margin-top:14px;box-shadow:0 3px 12px rgba(0,0,0,.28);
  }
  .ham-btn span{display:block;width:22px;height:3px;background:#fff;border-radius:3px;}

  .screen{background:#fff;height:200px;margin:0 18px;}
</style>
</head>
<body>
  <div class="header-stack">
    <div class="hdr"><span class="logo">COSMIC INTENTIONS</span></div>
    <div class="pg-hdr"><span class="title">VISUALIZATION LIBRARY</span></div>
    <div class="ham-tab">
      <button class="ham-btn"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="screen"></div>
</body>
</html>
