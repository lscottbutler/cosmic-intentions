<!doctype html>
<html><head><meta charset="utf-8"><title>Gratitude (kneeling prayer) icon</title>
<style>
  body{margin:0;background:#242424;font-family:system-ui,sans-serif;color:#ddd;padding:30px;}
  h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#9aa;margin:22px 0 12px;}
  .row{display:flex;align-items:center;gap:36px;flex-wrap:wrap;}
  .lab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#9aa;}
  .tab{background:#E8A828;color:#1C2230;border-radius:6px;padding:11px 16px;display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
  .navA{background:var(--ink,#111);background:#111;color:#fff;border-radius:14px;padding:16px;display:inline-flex;align-items:center;gap:14px;font-size:16px;}
</style></head>
<body>
  <!-- Kneeling figure in prayer — silhouette from head + leaning torso + praying arms + folded legs -->
  <svg style="display:none"><symbol id="grat" viewBox="0 0 48 48" fill="currentColor">
    <circle cx="29" cy="8.5" r="6"/>
    <!-- back / torso leaning forward -->
    <rect x="26" y="12.5" width="8.5" height="21" rx="4.25" transform="rotate(19 30 23)"/>
    <!-- forearm: hands pressed together, up in front (the praying diagonal) -->
    <rect x="18.5" y="14" width="6" height="18" rx="3" transform="rotate(-34 21.5 23)"/>
    <!-- thighs / lap (kneeling, sitting on heels) -->
    <rect x="14" y="28.5" width="25" height="9.5" rx="4.75"/>
    <!-- shins / knees on the ground -->
    <rect x="10" y="37" width="29" height="7.5" rx="3.75"/>
  </symbol></svg>

  <h2>Kneeling-prayer icon (dark bg)</h2>
  <div class="row">
    <div class="lab"><svg width="26" height="26"><use href="#grat"/></svg>26</div>
    <div class="lab"><svg width="40" height="40"><use href="#grat"/></svg>40</div>
    <div class="lab"><svg width="80" height="80"><use href="#grat"/></svg>80</div>
    <span class="tab"><svg width="18" height="18" style="color:#1C2230"><use href="#grat"/></svg>Gratitude</span>
    <span class="navA"><svg width="22" height="22"><use href="#grat"/></svg>Gratitude</span>
  </div>
</body></html>
