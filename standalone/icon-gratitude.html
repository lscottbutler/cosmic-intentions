<!doctype html>
<html><head><meta charset="utf-8"><title>Gratitude (bowing) icon</title>
<style>
  body{margin:0;background:#4d4d4d;font-family:system-ui,sans-serif;color:#eee;padding:30px;}
  h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#ccc;margin:22px 0 12px;}
  .row{display:flex;align-items:center;gap:38px;flex-wrap:wrap;}
  .lab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#ccc;}
  .tab{background:#E8A828;color:#1C2230;border-radius:6px;padding:11px 16px;display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
</style></head>
<body>
  <!-- Person bowing deeply in gratitude: filled head + thick rounded limbs (bent-over back, forward arm, leg) -->
  <svg style="display:none"><symbol id="grat" viewBox="0 0 48 48">
    <circle cx="15.5" cy="12" r="6.2" fill="currentColor"/>
    <g fill="none" stroke="currentColor" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- bent-over back: shoulders down to hip -->
      <path d="M20 19 C28 22 33 24 34 27"/>
      <!-- leg straight down from hip -->
      <path d="M34 27 L33 43"/>
      <!-- arm reaching forward/down -->
      <path d="M20.5 21 C15 24 11 25 8.5 29"/>
    </g>
  </symbol></svg>

  <h2>Bowing gratitude icon (white on grey)</h2>
  <div class="row" style="color:#fff">
    <div class="lab"><svg width="26" height="26"><use href="#grat"/></svg>26</div>
    <div class="lab"><svg width="40" height="40"><use href="#grat"/></svg>40</div>
    <div class="lab"><svg width="80" height="80"><use href="#grat"/></svg>80</div>
    <span class="tab"><svg width="18" height="18" style="color:#1C2230"><use href="#grat"/></svg>Gratitude</span>
  </div>
</body></html>
