<!doctype html>
<html><head><meta charset="utf-8"><title>Eye (visualization) icon — style lock</title>
<style>
  body{margin:0;background:#f4f5f7;font-family:system-ui,sans-serif;color:#1a1a1a;padding:30px;}
  h2{font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#667;margin:26px 0 12px;}
  .row{display:flex;align-items:center;gap:28px;flex-wrap:wrap;}
  .lab{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#667;}
  .navybtn{background:#1D3557;color:#fff;border-radius:8px;padding:12px 16px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.3px;}
  .tab{background:#3878A8;color:#fff;border-radius:6px;padding:11px 16px;display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:13px;letter-spacing:.5px;text-transform:uppercase;}
  .hd{display:inline-flex;align-items:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:.5px;}
</style></head>
<body>
  <!-- A: FILLED eye (matches the solid sample: black almond, iris ring cut out, filled pupil) -->
  <svg style="display:none"><symbol id="eyeFill" viewBox="0 0 24 24">
    <path fill-rule="evenodd" d="M2 12 Q12 3.2 22 12 Q12 20.8 2 12 Z M12 7.8 A4.2 4.2 0 1 0 12.01 16.2 A4.2 4.2 0 1 0 12 7.8 Z"/>
    <circle cx="12" cy="12" r="1.9"/>
  </symbol></svg>
  <!-- B: OUTLINE eye (stroked almond + iris) -->
  <svg style="display:none"><symbol id="eyeLine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12 Q12 4 22 12 Q12 20 2 12 Z"/>
    <circle cx="12" cy="12" r="3.2"/>
  </symbol></svg>

  <h2>Option A — filled eye (matches your solid sample)</h2>
  <div class="row">
    <div class="lab"><svg width="20" height="20" fill="currentColor"><use href="#eyeFill"/></svg>20px</div>
    <div class="lab"><svg width="26" height="26" fill="currentColor"><use href="#eyeFill"/></svg>26px</div>
    <div class="lab"><svg width="44" height="44" fill="currentColor"><use href="#eyeFill"/></svg>44px</div>
    <span class="navybtn"><svg width="20" height="20" fill="#F2911E"><use href="#eyeFill"/></svg>VISUALIZATION</span>
    <span class="tab"><svg width="18" height="18" fill="#fff"><use href="#eyeFill"/></svg>Visualize</span>
    <span class="hd"><svg width="26" height="26" fill="#1a1a1a"><use href="#eyeFill"/></svg>Visualization Library</span>
  </div>

  <h2>Option B — outline eye (lighter)</h2>
  <div class="row">
    <div class="lab"><svg width="20" height="20"><use href="#eyeLine"/></svg>20px</div>
    <div class="lab"><svg width="26" height="26"><use href="#eyeLine"/></svg>26px</div>
    <div class="lab"><svg width="44" height="44"><use href="#eyeLine"/></svg>44px</div>
    <span class="navybtn" style="color:#F2911E"><svg width="20" height="20"><use href="#eyeLine"/></svg><span style="color:#fff">VISUALIZATION</span></span>
    <span class="tab"><svg width="18" height="18"><use href="#eyeLine"/></svg>Visualize</span>
    <span class="hd"><svg width="26" height="26"><use href="#eyeLine"/></svg>Visualization Library</span>
  </div>
</body></html>
