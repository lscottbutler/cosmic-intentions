<!doctype html><html><head><meta charset="utf-8">
<style>
  :root{--ink:#1D3557;--brand:#F2911E;--teal-ui:#1AA5BA;}
  body{background:#0f1216;font-family:system-ui,Arial;margin:0;padding:20px;max-width:440px;}
  .med-dot{width:52px;height:52px;border-radius:50%;background:#fff;border:4px solid var(--brand);color:var(--ink);font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 2px 5px rgba(0,0,0,.25);}
</style></head><body>
  <button style="display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:var(--ink);color:#fff;border-radius:14px;padding:18px 16px;margin-bottom:10px;">
    <span style="font-size:22px;">☾</span><span style="flex:1;font-size:16px;">Meditate</span><span style="font-size:20px;opacity:.8;">⌄</span>
  </button>
  <div style="background:var(--brand);padding:9px;border-radius:12px;">
    <div style="background:var(--teal-ui);border-radius:9px;padding:18px 14px 16px;">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:13px 10px;">
        <button class="med-dot">1</button><button class="med-dot">3</button><button class="med-dot">5</button><button class="med-dot">10</button>
        <button class="med-dot">15</button><button class="med-dot">20</button><button class="med-dot">30</button><button class="med-dot">45</button>
      </div>
    </div>
  </div>
</body></html>
