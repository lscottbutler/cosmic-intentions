<!doctype html><html><head><meta charset="utf-8">
<style>:root{--muted:#8a8a8a;--widget-border:#e6e6e6;--widget-text:#1D3557;}body{background:#0f1216;font-family:system-ui,Arial;margin:0;padding:20px;max-width:420px;}</style>
</head><body>
<script>
  const DOMAINS=[{group:'Health & Body',items:['Fitness','Nutrition','Hydration','Sleep','Fasting','Supplements','Biometrics','Mobility','Recovery','Grooming']},{group:'Mind & Emotion',items:['Meditation','Gratitude','Journaling','Visualization','Affirmations','Breathwork','Mood','Stress','Digital Detox','Stoicism']},{group:'Growth & Learning',items:['Reading','Language','Skill','Study','Writing','Creativity','Music','Notes']},{group:'Work & Productivity',items:['Deep Work','Planning','Review','Goals','Email','Admin','Networking']},{group:'Wealth & Finance',items:['Budgeting','Investing','Expenses','Business','Bookkeeping']},{group:'Relationships',items:['Family','Partner','Friends','Kindness','Communication']},{group:'Spirit & Purpose',items:['Prayer','Spiritual Reading','Nature','Service','Purpose']}];
  const arrow='width:30px;height:34px;display:flex;align-items:center;justify-content:center;background:#454545;border:none;border-radius:6px;color:#fff;font-size:10px;';
  const domainOpts=cur=>'<option value="">— No category —</option>'+DOMAINS.map(g=>`<optgroup label="${g.group}">`+g.items.map(d=>`<option${cur===d?' selected':''}>${d}</option>`).join('')+'</optgroup>').join('');
  document.body.innerHTML=`
  <div style="background:#2E2E2E;padding:11px 12px;border-radius:10px;margin-bottom:14px;">
    <textarea style="width:100%;box-sizing:border-box;padding:13px 14px;border:none;border-radius:7px;background:#fff;color:#1a1a1a;font-size:10pt;min-height:62px;margin-bottom:8px;">UP BEFORE SUNRISE</textarea>
    <div style="display:flex;gap:8px;align-items:center;">
      <button style="${arrow}">▲</button><button style="${arrow}">▼</button>
      <select style="flex:1;min-width:0;padding:9px 8px;border:none;border-radius:7px;background:#fff;color:#1a1a1a;font-size:12px;"><option>MORNING</option></select>
      <button style="width:34px;height:34px;background:#3a1010;border:1px solid #5a1a1a;color:#ff8a8a;border-radius:8px;font-size:15px;">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
      <span style="font-size:9px;font-weight:800;letter-spacing:1px;color:#9a9a9a;">CATEGORY</span>
      <select style="flex:1;min-width:0;padding:9px 8px;border:none;border-radius:7px;background:#fff;color:#1a1a1a;font-size:12px;">${domainOpts('Fitness')}</select>
    </div>
  </div>
  <div style="background:#fff;border-radius:8px;padding:8px 10px;">
    <div style="display:flex;gap:8px;align-items:center;padding:4px 2px;">
      <button style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:#fff;">○</button>
      <span style="flex:1;min-width:0;font-size:12px;color:var(--widget-text);">UP BEFORE SUNRISE</span>
      <span style="flex-shrink:0;font-size:8px;font-weight:800;color:var(--muted);border:1px solid var(--widget-border);border-radius:5px;padding:1px 4px;">Fitness</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;padding:4px 2px;">
      <button style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:#fff;">○</button>
      <span style="flex:1;min-width:0;font-size:12px;color:var(--widget-text);">MEDITATE</span>
      <span style="flex-shrink:0;font-size:8px;font-weight:800;color:var(--muted);border:1px solid var(--widget-border);border-radius:5px;padding:1px 4px;">Meditation</span>
    </div>
  </div>`;
</script>
</body></html>
