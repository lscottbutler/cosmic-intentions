<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Color Palettes · Cosmic Intentions</title>
<style>
 :root{--ink:#292929;--muted:#666;--paper:#f2ede7;--card:#fff;--line:#d9d3cb}
 *{box-sizing:border-box}
 body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Arial,Helvetica,sans-serif}
 main{max-width:960px;margin:0 auto;padding:32px 20px 60px}
 header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
 h1{margin:0;font-size:28px;letter-spacing:.04em;text-transform:uppercase}
 header p{margin:4px 0 0;color:var(--muted);font-size:14px}
 a.back{color:var(--ink);font-weight:700;text-decoration:none;border:2px solid var(--ink);border-radius:8px;padding:8px 14px;white-space:nowrap}
 .palette{background:var(--card);border-radius:12px;padding:16px;margin-bottom:18px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
 .strip{display:flex;height:120px;border-radius:10px;overflow:hidden}
 .strip button{flex:1;border:0;padding:0;cursor:pointer;position:relative;min-width:0}
 .strip button span{position:absolute;left:0;right:0;bottom:6px;font:700 11px/1 Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;opacity:0;transition:opacity .15s}
 .strip button:hover span,.strip button:focus-visible span{opacity:1}
 .strip button:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
 .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
 .meta h2{margin:0;font-size:17px}
 .meta small{color:var(--muted)}
 .copy-all{border:1px solid var(--ink);background:#fff;border-radius:6px;padding:6px 10px;font:700 12px Arial,sans-serif;cursor:pointer}
 #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
 #toast.on{opacity:1}
 @media(max-width:650px){main{padding:20px 12px 40px}h1{font-size:22px}.strip{height:90px}.strip button span{opacity:1;font-size:8px}}
</style>
</head>
<body>
<main>
 <header>
  <div><h1>Color Palettes</h1><p>Saved palettes for Cosmic Intentions. Tap a color to copy its code.</p></div>
  <a class="back" href="/standalone/member-design-test.html?feature=home">Back to Citadel</a>
 </header>
 <div id="list" aria-live="polite">Loading…</div>
</main>
<div id="toast" role="status"></div>
<script>
(async()=>{
 const list=document.getElementById('list'),toast=document.getElementById('toast');
 const show=t=>{toast.textContent=t;toast.classList.add('on');clearTimeout(show.t);show.t=setTimeout(()=>toast.classList.remove('on'),1400);};
 const copy=async t=>{try{await navigator.clipboard.writeText(t);show('Copied '+t);}catch{show(t);}};
 const light=h=>{const n=parseInt(h.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150;};
 let data;try{data=await (await fetch('/standalone/ci-palettes.json',{cache:'no-store'})).json();}catch{list.textContent='Palettes could not load. Reload to try again.';return;}
 list.replaceChildren(...data.palettes.map(p=>{
  const card=document.createElement('section');card.className='palette';card.setAttribute('aria-label',p.name);
  const strip=document.createElement('div');strip.className='strip';
  for(const c of p.colors){const b=document.createElement('button');b.type='button';b.style.background=c;b.setAttribute('aria-label','Copy '+c);const s=document.createElement('span');s.textContent=c;s.style.color=light(c)?'#292929':'#fff';b.append(s);b.onclick=()=>copy(c);strip.append(b);}
  const meta=document.createElement('div');meta.className='meta';
  const h=document.createElement('div');h.innerHTML='<h2></h2><small></small>';h.querySelector('h2').textContent=p.name;h.querySelector('small').textContent=p.colors.length+' colors · saved '+p.saved;
  const all=document.createElement('button');all.type='button';all.className='copy-all';all.textContent='Copy all';all.onclick=()=>copy(p.colors.join(', '));
  meta.append(h,all);card.append(strip,meta);return card;
 }));
})();
</script>
</body>
</html>
