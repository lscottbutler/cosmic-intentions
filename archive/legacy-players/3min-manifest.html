<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Minute Manifest | Cosmic Intentions</title>
  <style>
    :root { --magenta:#c0246e; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:#0c0810; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; overflow:hidden;
      font-family:'Arial Narrow','Roboto Condensed',system-ui,sans-serif; }
    .stage { position:relative; width:min(96vw, 92vh * 16 / 9); aspect-ratio:16/9; background:#fff; border:14px solid var(--magenta); overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.5); }
    .scene { position:absolute; inset:0; opacity:0; transition:opacity .7s ease; }

    /* FRAME 1 — logo intro */
    #logo { z-index:3; background:#fff; display:flex; align-items:center; justify-content:center; }
    #logo img { width:46%; max-height:84%; object-fit:contain; }

    /* FRAME 2 — split title page */
    #title { z-index:2; display:flex; background:#fff; }
    #title .colA { flex:1 1 auto; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #title .colB { flex:0 0 42%; background-image:url('../images/visualization/manifest-skull.jpg'); background-size:cover; background-position:center;
      filter:blur(16px); transition:filter 1.1s ease; }
    #title .colB.sharp { filter:blur(0); }
    .badge { border:4px solid var(--magenta); border-radius:9px; background:#fff; padding:10px 20px; text-align:center; line-height:1.15;
      font-weight:800; letter-spacing:3px; color:#333; transform:translateX(-260%); opacity:0; }
    .badge .m { color:var(--magenta); }
    .badge.in { animation: flyin .85s cubic-bezier(.18,.85,.25,1) both; }
    @keyframes flyin { from { transform:translateX(-260%); opacity:0; } 60%{opacity:1;} to { transform:translateX(0); opacity:1; } }

    /* FRAMES 3+ — designed slides */
    #slides { z-index:1; }
    #slides .sl { position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; opacity:0; transition:opacity .6s ease; }

    .controls { display:flex; align-items:center; gap:26px; }
    .cbtn { background:none; border:none; color:#cfcfcf; font-size:1.3rem; cursor:pointer; line-height:1; padding:6px; }
    .play { background:var(--magenta); color:#fff; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:0 2px 8px rgba(0,0,0,.5); }
    .menu { position:absolute; left:50%; transform:translateX(-50%); bottom:62px; background:#111; border:1px solid #333; border-radius:10px; overflow:hidden; z-index:9; }
    .menu.hidden { display:none; }
    .menu button { display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:11px 20px; font-size:13px; cursor:pointer; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="scene" id="slides"><div class="sl" id="sa"></div><div class="sl" id="sb"></div></div>
    <div class="scene" id="title">
      <div class="colA"><div class="badge" id="badge"><span class="m">3 MINUTE</span><br>MANIFEST</div></div>
      <div class="colB" id="colB"></div>
    </div>
    <div class="scene" id="logo"><img src="../images/clip-art/blue-hair-logo.png" alt="Cosmic Intentions"></div>
  </div>
  <div class="menu hidden" id="menu"><button id="mHome">Home page</button><button id="mPeg">My Pegboard</button></div>
  <div class="controls">
    <button class="cbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
  </div>

  <script>
    const DIR='../images/visualization/3min/';
    const logo=document.getElementById('logo'), title=document.getElementById('title'),
          slides=document.getElementById('slides'), badge=document.getElementById('badge'),
          colB=document.getElementById('colB'), playBtn=document.getElementById('play');
    let sa=document.getElementById('sa'), sb=document.getElementById('sb');

    // 3-tone ascending chime (the "3 tone sound efx")
    function chime3(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)();
      [660,880,1175].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+i*0.16;
        o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.35,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+.55);
        o.connect(g).connect(c.destination); o.start(s); o.stop(s+.6); }); }catch(e){} }

    function showSlide(file){
      let front=(sa.style.opacity==='1')?sa:(sb.style.opacity==='1'?sb:null);
      const back=(front===sa)?sb:sa;
      back.style.backgroundImage=`url('${DIR}${file}')`;
      requestAnimationFrame(()=>{ back.style.opacity='1'; if(front) front.style.opacity='0'; });
    }

    function closePlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.closePlayerColumn){window.parent.closePlayerColumn();return;} }catch(e){} if(history.length>1)history.back(); else window.close(); }
    function nav(t){ try{ if(window.parent&&window.parent!==window){ if(window.parent.closePlayerColumn)window.parent.closePlayerColumn(); if(window.parent.navTo){window.parent.navTo(t);return;} } }catch(e){} location.href='/'; }
    function finishPlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.playerFinished){window.parent.playerFinished();return;} }catch(e){} closePlayer(); }
    const menu=document.getElementById('menu'), menuBtn=document.getElementById('menuBtn');
    menuBtn.onclick=(e)=>{e.stopPropagation();menu.classList.toggle('hidden');};
    document.addEventListener('click',(e)=>{ if(!menu.classList.contains('hidden')&&!menu.contains(e.target)&&e.target!==menuBtn)menu.classList.add('hidden'); });
    document.getElementById('mHome').onclick=()=>{menu.classList.add('hidden');nav('home');};
    document.getElementById('mPeg').onclick =()=>{menu.classList.add('hidden');nav('setup');};

    /* timeline (seconds). Frame1 0-2 logo+chime, fades out; Frame2 3-5 title:
       badge flies in then skull un-blurs; then the designed slides. */
    const SEQ = [
      { t:0.0,  fn:()=>{ logo.style.opacity='1'; chime3(); } },          // Frame 1 intro
      { t:2.0,  fn:()=>{ logo.style.opacity='0'; } },                    // logo fades out
      { t:3.0,  fn:()=>{ title.style.opacity='1'; badge.classList.add('in'); } }, // Frame 2: badge flies in
      { t:4.2,  fn:()=>{ colB.classList.add('sharp'); } },              // skull un-blurs (sharpens)
      { t:6.0,  fn:()=>{ slides.style.opacity='1'; showSlide('s3.png'); title.style.opacity='0'; } }, // I AM goal
      { t:13.0, fn:()=>showSlide('s4.png') },                           // RECALL A MEMORY
      { t:18.0, fn:()=>showSlide('s2.png') },                           // GET READY TO INTENSIFY
      { t:23.0, fn:()=>showSlide('s5.png') },                           // CLOSE YOUR EYES
      { t:28.0, fn:()=>showSlide('s6.png') },                           // GET READY
      { t:33.0, fn:()=>end() },
    ];
    let elapsed=0, timer=null, playing=false, ended=false, idx=0;
    function step(){ elapsed+=0.1; while(idx<SEQ.length && elapsed>=SEQ[idx].t){ try{SEQ[idx].fn();}catch(e){} idx++; } }
    function setPlaying(p){ playing=p; playBtn.innerHTML=p?'&#9208;':'&#9654;'; if(p&&!timer)timer=setInterval(step,100); if(!p&&timer){clearInterval(timer);timer=null;} }
    function end(){ if(ended)return; ended=true; setPlaying(false); setTimeout(finishPlayer,2500); }
    playBtn.onclick=()=>setPlaying(!playing);

    setTimeout(()=>setPlaying(true), 400);
  </script>
</body>
</html>
