<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualization Player | Cosmic Intentions</title>
  <style>
    :root { --border:#1c1c1c; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; background:#0f1417; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:14px; overflow:hidden;
      font-family:'Arial Narrow','Roboto Condensed',system-ui,sans-serif; }
    .stage { position:relative; width:min(96vw, 92vh * 16 / 9); aspect-ratio:16/9; background:#ffffff; border:12px solid var(--border); overflow:hidden; }
    .bg, .bgB { position:absolute; inset:0; background-size:cover; background-position:center; background-repeat:no-repeat; }
    .bgB { opacity:0; }
    .cover { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:3; }
    .txtwrap { position:absolute; inset:0; z-index:4; display:flex; align-items:center; justify-content:center; padding:6% 7%; }
    .txt { margin:0; max-width:84%; text-align:center; color:#6e1614; text-transform:uppercase; letter-spacing:.06em;
      font-weight:700; line-height:1.45; font-size:clamp(15px,2.8vw,34px); background:rgba(255,255,255,.0); padding:14px 20px; border-radius:14px;
      opacity:0; transition:opacity .4s ease; }
    .baseband { position:absolute; left:0; right:0; bottom:0; height:13%; background:#16313d; z-index:2; display:none; }
    .baseband.show { display:block; }
    .badge { position:absolute; left:50%; bottom:-2px; transform:translate(-50%,50%); z-index:6; width:8%; aspect-ratio:1; border-radius:50%;
      background:#fff; border:5px solid var(--border); display:none; align-items:center; justify-content:center; color:#16313d; font-weight:700; font-size:clamp(14px,2.2vw,30px); box-shadow:0 2px 10px rgba(0,0,0,.3); }
    .badge.show { display:flex; }
    .controls { display:flex; align-items:center; gap:26px; }
    .cbtn { background:none; border:none; color:#cfcfcf; font-size:1.3rem; cursor:pointer; line-height:1; padding:6px; }
    .play { background:#fff; color:#111; width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; box-shadow:0 2px 8px rgba(0,0,0,.5); }
    .menu { position:absolute; left:50%; transform:translateX(-50%); bottom:62px; background:#111; border:1px solid #333; border-radius:10px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.45); z-index:7; }
    .menu.hidden { display:none; }
    .menu button { display:block; width:100%; text-align:left; background:none; border:none; color:#fff; padding:11px 20px; font-size:13px; cursor:pointer; white-space:nowrap; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="bg" id="bg"></div>
    <div class="bg bgB" id="bgB"></div>
    <div class="cover" id="cover"></div>
    <div class="txtwrap"><p class="txt" id="txt"></p></div>
    <div class="baseband" id="band"></div>
    <div class="badge" id="badge">0</div>
  </div>
  <div class="menu hidden" id="menu"><button id="mHome">Home page</button><button id="mPeg">My Pegboard</button></div>
  <div class="controls">
    <button class="cbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
    <button class="cbtn play" id="play" aria-label="Play / Pause">&#9208;</button>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const goal = (params.get('g') || localStorage.getItem('ci_goal_title') || 'your vision').trim();
    const ASSET = (v) => /^(https?:|data:|\/|\.\.?\/)/.test(v) ? v : ('../images/visualization/' + v);

    const bg=document.getElementById('bg'), bgB=document.getElementById('bgB'), cover=document.getElementById('cover'),
          txt=document.getElementById('txt'), band=document.getElementById('band'), badge=document.getElementById('badge'), playBtn=document.getElementById('play');

    let VOICE='shimmer', CUES=[], total=0;

    /* cached TTS for vo cues */
    const TTS_CACHE='ci_vizplayer_vo';
    const rc=()=>{try{return JSON.parse(localStorage.getItem(TTS_CACHE)||'{}');}catch(e){return {};}};
    const wc=(c)=>{try{localStorage.setItem(TTS_CACHE,JSON.stringify(c));}catch(e){}};
    const hash=(s)=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h.toString(36);};
    async function tts(text, voice){ if(!text)return null; const key=hash((voice||VOICE)+'|'+text); const c=rc(); if(c[key])return new Audio('data:audio/mpeg;base64,'+c[key]);
      try{ const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.slice(0,150),voice:voice||VOICE})}); if(!r.ok)throw 0; const {audio}=await r.json(); c[key]=audio; wc(c); return new Audio('data:audio/mpeg;base64,'+audio);}catch(e){return null;} }

    function chime(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(),n=c.currentTime,o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.0001,n); g.gain.exponentialRampToValueAtTime(.25,n+.02); g.gain.exponentialRampToValueAtTime(.0001,n+1.4); o.connect(g).connect(c.destination); o.start(n); o.stop(n+1.5);}catch(e){} }

    /* nav */
    function closePlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.closePlayerColumn){window.parent.closePlayerColumn();return;} }catch(e){} if(history.length>1)history.back(); else window.close(); }
    function nav(t){ try{ if(window.parent&&window.parent!==window){ if(window.parent.closePlayerColumn)window.parent.closePlayerColumn(); if(window.parent.navTo){window.parent.navTo(t);return;} } }catch(e){} location.href='/'; }
    function finishPlayer(){ try{ if(window.parent&&window.parent!==window&&window.parent.playerFinished){window.parent.playerFinished();return;} }catch(e){} closePlayer(); }
    const menu=document.getElementById('menu'), menuBtn=document.getElementById('menuBtn');
    menuBtn.onclick=(e)=>{e.stopPropagation();menu.classList.toggle('hidden');};
    document.addEventListener('click',(e)=>{ if(!menu.classList.contains('hidden')&&!menu.contains(e.target)&&e.target!==menuBtn)menu.classList.add('hidden'); });
    document.getElementById('mHome').onclick=()=>{menu.classList.add('hidden');nav('home');};
    document.getElementById('mPeg').onclick =()=>{menu.classList.add('hidden');nav('setup');};

    function showText(t, fi){ txt.style.transition=`opacity ${fi||.4}s ease`; txt.textContent=t; requestAnimationFrame(()=>txt.style.opacity='1'); }
    function hideText(fo){ txt.style.transition=`opacity ${fo||.4}s ease`; txt.style.opacity='0'; }
    function crossfadeImage(url, fi){ bgB.style.backgroundImage=`url('${url}')`; bgB.style.transition=`opacity ${fi||.6}s ease`; requestAnimationFrame(()=>bgB.style.opacity='1');
      setTimeout(()=>{ bg.style.backgroundImage=`url('${url}')`; bgB.style.transition='none'; bgB.style.opacity='0'; }, (fi||.6)*1000+60); }

    async function buildCues(){
      let cfg=null;
      try{ const s=localStorage.getItem('ci_vizplayer_scene'); if(s) cfg=JSON.parse(s); }catch(e){}
      if(!cfg||!Array.isArray(cfg.cues)){ try{ const r=await fetch('/api/viz-player-config'); if(r.ok)cfg=await r.json(); }catch(e){} }
      if(!cfg||!Array.isArray(cfg.cues)) cfg={settings:{},cues:[]};
      VOICE=(cfg.settings&&cfg.settings.voice)||'shimmer';
      if(cfg.settings&&cfg.settings.border) document.documentElement.style.setProperty('--border', cfg.settings.border);
      CUES=cfg.cues.map((c,i)=>({ ...c, _i:i, start:Number(c.start)||0, end:Number(c.end)||0, text:String(c.text||'').replace(/\{GOAL\}/gi, goal) }));
      total=Math.max(0, ...CUES.map(c=>c.end||c.start))+2;
      // preload audio: vo (tts) + sfx/music (files)
      await Promise.all(CUES.map(async c=>{
        if(c.type==='vo') c.audio_el = await tts(c.text, c.voice);
        else if((c.type==='sfx'||c.type==='music') && c.audio){ const a=new Audio(ASSET(c.audio)); a.preload='auto'; if(c.type==='music'){a.loop=!!c.loop;} if(c.volume!=null)a.volume=Math.max(0,Math.min(1,c.volume)); c.audio_el=a; }
        else if(c.type==='image' && c.image){ const im=new Image(); im.src=ASSET(c.image); }
      }));
    }

    const started=new Set(), endedSet=new Set();
    let elapsed=0, timer=null, playing=false, ended=false;

    function activeHold(){ return CUES.find(c=>c.type==='hold'&&elapsed>=c.start&&elapsed<c.end); }
    function fireStart(c){
      if(c.type==='text') showText(c.text, c.fadeIn);
      else if(c.type==='image' && c.image) crossfadeImage(ASSET(c.image), c.fadeIn);
      else if(c.type==='vo'){ if(c.audio_el){try{c.audio_el.currentTime=0;c.audio_el.play().catch(()=>{});}catch(e){}} }
      else if(c.type==='sfx'||c.type==='music'){ if(c.audio_el){try{c.audio_el.currentTime=0;c.audio_el.play().catch(()=>{});}catch(e){}} }
      else if(c.type==='bell') chime();
      else if(c.type==='fade'){ const d=(c.end-c.start)||1; cover.style.transition=`opacity ${d}s ease`; requestAnimationFrame(()=>cover.style.opacity = c.text==='reveal'?'0':'1'); }
    }
    function fireEnd(c){
      if(c.type==='text') hideText(c.fadeOut);
      else if(c.type==='music' && c.audio_el){ const a=c.audio_el; const fo=(c.fadeOut||1)*1000; const v0=a.volume; const t0=Date.now();
        const fade=setInterval(()=>{ const k=Math.min(1,(Date.now()-t0)/fo); a.volume=v0*(1-k); if(k>=1){clearInterval(fade);a.pause();} },50); }
    }
    function tick(){
      elapsed++;
      if(elapsed>=total){ end(); return; }
      CUES.forEach(c=>{ if(!started.has(c._i)&&elapsed>=c.start){ started.add(c._i); fireStart(c); }
        if(!endedSet.has(c._i)&&c.end>c.start&&elapsed>=c.end){ endedSet.add(c._i); fireEnd(c); } });
      const h=activeHold();
      if(h){ band.classList.add('show'); badge.classList.add('show'); badge.textContent=(h.end-elapsed); }
      else { band.classList.remove('show'); badge.classList.remove('show'); }
    }
    function setPlaying(p){ playing=p; playBtn.innerHTML=p?'&#9208;':'&#9654;'; if(p&&!timer)timer=setInterval(tick,1000); if(!p&&timer){clearInterval(timer);timer=null;} }
    function end(){ if(ended)return; ended=true; setPlaying(false); hideText(.6); band.classList.remove('show'); badge.classList.remove('show'); CUES.forEach(c=>{if(c.type==='music'&&c.audio_el)c.audio_el.pause();}); chime(); setTimeout(finishPlayer,4000); }
    playBtn.onclick=()=>setPlaying(!playing);

    // unlock audio on first tap
    document.addEventListener('pointerdown',()=>{ CUES.forEach(c=>{ if(c.audio_el){c.audio_el.muted=true; const p=c.audio_el.play(); if(p)p.then(()=>{c.audio_el.pause();c.audio_el.currentTime=0;c.audio_el.muted=false;}).catch(()=>{c.audio_el.muted=false;});} }); },{once:true});

    buildCues().then(()=>{ setTimeout(()=>{ setPlaying(true); CUES.forEach(c=>{ if(c.start<=0&&!started.has(c._i)){ started.add(c._i); fireStart(c); } }); }, 700); });
  </script>
</body>
</html>
